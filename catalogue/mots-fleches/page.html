<style>

  @media(prefers-color-scheme:dark) { :root { --fond:#121721; --surface:#1d2532; --texte:#edf2fb; --doux:#a7b3c5; --accent:#a7c3ff; --accent-texte:#111a2b; --bord:#39475b; --succes:#6de0a0; --alerte:#ff9292; --selection:#304568; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fond); color:var(--texte); font:16px/1.5 system-ui,sans-serif; }
  header,main,footer { width:min(100% - 24px,900px); margin-inline:auto; }
  header { padding:16px 0 8px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { margin:0; font-size:1.35rem; } h2 { font-size:1.1rem; margin:0 0 8px; } h3 { font-size:1rem; margin:12px 0 4px; }
  p { margin:6px 0; } .sous-titre,.doux { color:var(--doux); } .sous-titre { margin:2px 0 0; font-size:.9rem; }
  #connexion[hidden] { display:none; }
  [role=tablist] { display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--bord); }
  [role=tab] { flex:0 0 auto; border:0; border-bottom:3px solid transparent; padding:10px 14px; background:none; color:var(--doux); font:inherit; cursor:pointer; }
  [role=tab][aria-selected=true] { border-bottom-color:var(--accent); color:var(--texte); font-weight:700; }
  [role=tab]:focus-visible,button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  main { padding:16px 0; } [role=tabpanel][hidden] { display:none; }
  .carte { padding:14px; margin-bottom:12px; border:1px solid var(--bord); border-radius:12px; background:var(--surface); }
  button { color:inherit; font:inherit; }
  button.action,button.secondaire,.niveau { min-height:42px; padding:8px 12px; border:2px solid var(--bord); border-radius:8px; background:var(--surface); cursor:pointer; touch-action:manipulation; }
  button.action { border-color:var(--accent); background:var(--accent); color:var(--accent-texte); font-weight:700; }
  button.secondaire[aria-pressed=true],.niveau[aria-pressed=true] { border-color:var(--accent); background:var(--selection); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .niveaux,.commandes { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin:8px 0 12px; }
  .niveau { text-align:left; } .niveau small { display:block; font-size:.75rem; }
  .grille-zone { width:100%; overflow:auto; padding:4px 2px 8px; overscroll-behavior:contain; }
  .grille { display:grid; width:max-content; max-width:100%; gap:3px; margin:10px auto; padding:5px; border-radius:8px; background:var(--bord); }
  .case,.bloque { width:clamp(38px,9vw,50px); height:clamp(38px,9vw,50px); }
  .case { position:relative; border:1px solid var(--bord); border-radius:4px; padding:0; background:var(--surface); color:var(--accent); font-size:1.35rem; font-weight:800; cursor:pointer; }
  .case[data-fleche]::before { content:attr(data-fleche); position:absolute; top:0; left:3px; color:var(--doux); font-size:.55rem; line-height:1; }
  .case.selection { background:var(--selection); outline:2px solid var(--accent); z-index:1; }
  .case.erreur { color:var(--alerte); text-decoration:underline wavy; }
  .case:disabled { opacity:1; cursor:default; }
  .clavier { display:flex; flex-wrap:wrap; justify-content:center; gap:5px; max-width:540px; margin:10px auto; }
  .clavier button { width:38px; min-height:40px; padding:3px; border:1px solid var(--bord); border-radius:7px; background:var(--surface); font-weight:700; cursor:pointer; }
  .indices { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:7px; }
  .indice { display:flex; gap:8px; align-items:flex-start; width:100%; padding:9px 10px; text-align:left; border:1px solid var(--bord); border-radius:8px; background:var(--surface); cursor:pointer; }
  .indice[aria-pressed=true] { border:2px solid var(--accent); background:var(--selection); }
  .indice .fleche { flex:0 0 auto; font-size:1.15rem; font-weight:800; color:var(--accent); }
  .indice small { display:block; color:var(--doux); }
  .message { min-height:1.6em; text-align:center; font-weight:650; } .message.ok { color:var(--succes); } .message.ko { color:var(--alerte); }
  .choix-defi { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  footer { padding:8px 0 20px; color:var(--doux); font-size:.85rem; }
  @media(max-width:480px) { header { align-items:flex-start; } .carte { padding:11px; } .case,.bloque { width:40px; height:40px; } }

    <p>Choisis un indice ou une case, puis tape une lettre. Tu peux aussi utiliser les boutons de lettres et les flèches du clavier. <strong>Indice</strong> révèle une lettre ; <strong>Vérifier</strong> repère les lettres à corriger.</p>

<script id="moteur-mots-fleches">
const MoteurMotsFleches = (() => {
  const NIVEAUX = Object.freeze([
    { id: "noob", nom: "Noob", description: "Deux mots à découvrir", couples: 1 },
    { id: "debutant", nom: "Débutant", description: "Deux croisements", couples: 2 },
    { id: "intermediaire", nom: "Intermédiaire", description: "Trois croisements", couples: 3 },
    { id: "expert", nom: "Expert", description: "Quatre croisements", couples: 4 },
    { id: "pro", nom: "Pro", description: "Une grille complète", couples: 6 }
  ]);
  const COUPLES = Object.freeze([
    { horizontal: { id: "mot", reponse: "MOT", indice: "Paroles prononcées ou écrites.", direction: "→" }, vertical: { id: "sol", reponse: "SOL", indice: "On marche dessus.", direction: "↓" }, croisement: [1, 1] },
    { horizontal: { id: "chat", reponse: "CHAT", indice: "Animal qui miaule.", direction: "→" }, vertical: { id: "chef", reponse: "CHEF", indice: "À la tête d’une brigade en cuisine.", direction: "↓" }, croisement: [1, 1] },
    { horizontal: { id: "lune", reponse: "LUNE", indice: "Satellite naturel de la Terre.", direction: "→" }, vertical: { id: "nuit", reponse: "NUIT", indice: "Période entre le coucher et le lever du soleil.", direction: "↓" }, croisement: [1, 1] },
    { horizontal: { id: "pont", reponse: "PONT", indice: "Ouvrage qui permet de franchir un cours d’eau.", direction: "→" }, vertical: { id: "sport", reponse: "SPORT", indice: "Activité physique avec des règles.", direction: "↓" }, croisement: [1, 2] },
    { horizontal: { id: "arbre", reponse: "ARBRE", indice: "Plante avec un tronc et des branches.", direction: "→" }, vertical: { id: "brume", reponse: "BRUME", indice: "Brouillard léger.", direction: "↓" }, croisement: [1, 1] },
    { horizontal: { id: "fleur", reponse: "FLEUR", indice: "Partie colorée de certaines plantes.", direction: "→" }, vertical: { id: "creme", reponse: "CREME", indice: "Préparation douce, souvent à base de lait.", direction: "↓" }, croisement: [2, 2] }
  ]);
  const normaliserLettre = (valeur) => typeof valeur === "string"
    ? valeur.normalize("NFD").replace(/\p{Diacritic}/gu, "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 1)
    : "";
  function creerPartie(id) {
    const niveau = NIVEAUX.find((n) => n.id === id);
    if (!niveau) throw new Error(`niveau inconnu : ${id}`);
    const cases = [], mots = [];
    const couples = COUPLES.slice(0, niveau.couples);
    const colonnes = Math.max(...couples.map((c) => Math.max(c.horizontal.reponse.length, c.croisement[0] + 1)));
    let ligne = 0;
    function ajouterMot(donnees, indices) {
      mots.push({ ...donnees, longueur: donnees.reponse.length, indices });
      indices.forEach((index, i) => {
        const caseGrille = cases[index] ??= { solution: "", lettre: "", mots: [], departs: [] };
        const lettre = donnees.reponse[i];
        if (caseGrille.solution && caseGrille.solution !== lettre) throw new Error(`croisement incohérent dans le mot ${donnees.id}`);
        caseGrille.solution = lettre;
        caseGrille.mots.push(donnees.id);
        if (i === 0) caseGrille.departs.push(donnees.direction);
      });
    }
    for (const couple of couples) {
      const [indexHorizontal, indexVertical] = couple.croisement;
      const haut = ligne, ligneHorizontale = haut + indexVertical, colonneVerticale = indexHorizontal;
      const hauteur = Math.max(couple.vertical.reponse.length, indexVertical + 1);
      ajouterMot(couple.horizontal, Array.from({ length: couple.horizontal.reponse.length }, (_, c) => ligneHorizontale * colonnes + c));
      ajouterMot(couple.vertical, Array.from({ length: couple.vertical.reponse.length }, (_, r) => (haut + r) * colonnes + colonneVerticale));
      ligne += hauteur + 1;
    }
    const hauteur = ligne ? ligne - 1 : 0;
    const grille = Array.from({ length: hauteur * colonnes }, (_, i) => cases[i] ?? null);
    return { niveau: id, lignes: hauteur, colonnes, cases: grille, mots, aides: 0 };
  }
  function placer(partie, index, valeur) {
    if (!Number.isInteger(index) || index < 0 || index >= partie.cases.length || !partie.cases[index]) return "invalide";
    partie.cases[index].lettre = normaliserLettre(valeur);
    return "ok";
  }
  function verifier(partie) {
    const vides = [], erreurs = [];
    for (const [i, c] of partie.cases.entries()) {
      if (!c) continue;
      if (!c.lettre) vides.push(i);
      else if (c.lettre !== c.solution) erreurs.push(i);
    }
    return { vides, erreurs, resolu: vides.length === 0 && erreurs.length === 0 };
  }
  function revelerIndice(partie, index = -1) {
    const i = index >= 0 && partie.cases[index] && partie.cases[index].lettre !== partie.cases[index].solution
      ? index : partie.cases.findIndex((c) => c && c.lettre !== c.solution);
    if (i < 0) return null;
    partie.cases[i].lettre = partie.cases[i].solution;
    partie.aides++;
    return i;
  }
  return Object.freeze({ NIVEAUX, COUPLES, normaliserLettre, creerPartie, placer, verifier, revelerIndice });
})();
</script>
<script id="progression-jeux" data-inclure="gabarit/jeux/progression.js">
/* Progression commune des jeux (ADR 0014, 0015) : XP, niveaux, grades, étoiles, badges, série, objectif du jour,
   révisions espacées, défi du jour, forces et conseil personnalisé. Pur, sans DOM : la date est passée en paramètre.
   Module partagé, recopié dans chaque page par `npm run build` : modifier ce fichier, jamais sa copie dans une page. */
const ProgressionJeux = (() => {
  "use strict";
  const XP = Object.freeze({ parfait: 20, reussi: 10, avecIndice: 5, revision: 5, revisionRatee: 1, lecon: 30, objectif: 20, defi: 15 });
  // Révision espacée (boîtes de Leitner) : une carte réussie passe dans la boîte suivante, revue de plus en plus tard.
  const INTERVALLES = Object.freeze([1, 2, 4, 8, 16]);
  const OBJECTIFS = Object.freeze([1, 3, 5]);
  const MAX_JOURS = 31;
  const JOUR = /^\d{4}-\d{2}-\d{2}$/;
  const RESULTATS = Object.freeze({ victoire: "victoires", nulle: "nulles", defaite: "defaites" });

  /* ---------- Dates (AAAA-MM-JJ, calendrier de l'utilisateur fourni par l'appelant) ---------- */
  function ajouterJours(jour, n) {
    const [a, m, j] = jour.split("-").map(Number);
    return new Date(Date.UTC(a, m - 1, j + n)).toISOString().slice(0, 10);
  }
  const estJour = (v) => typeof v === "string" && JOUR.test(v);
  const entier = (v, max = 1e9) => (Number.isInteger(v) && v >= 0 ? Math.min(v, max) : 0);
  const copie = (e) => JSON.parse(JSON.stringify(e));
  const exoId = (lecon, k) => `${lecon.id}/${k}`;
  const etoiles = ({ erreurs, indices }) => { const p = erreurs + 2 * indices; return p === 0 ? 3 : p <= 2 ? 2 : 1; };
  /** Petit hachage déterministe : le même défi pour tout le monde le même jour, sans hasard ni réseau. */
  const hacher = (texte) => [...texte].reduce((h, c) => (Math.imul(h, 31) + c.charCodeAt(0)) >>> 0, 7);

  /** Crée l'API de progression d'un jeu à partir de son parcours (grades, leçons, thèmes, badges, niveaux de partie). */
  function creer(parcours) {
    const lecons = new Map(), exercices = new Map();
    parcours.grades.forEach((grade, gi) => grade.lecons.forEach((lecon) => {
      lecons.set(lecon.id, { lecon, grade, gi });
      lecon.exercices.forEach((exo, k) => exercices.set(exoId(lecon, k), { exo, lecon, grade, gi }));
    }));
    const EMBLEMES = Object.freeze(parcours.grades.map((g) => g.embleme));
    const NIVEAUX_PARTIE = parcours.parties?.niveaux ?? {};
    // Compteurs d'événements propres au jeu (capots, belotes…), déclarés par les badges de type « compteur ».
    const COMPTEURS = [...new Set((parcours.badges ?? []).filter((b) => b.condition.type === "compteur").map((b) => b.condition.nom))];
    const toutesLecons = parcours.grades.flatMap((g) => g.lecons);

    function etatInitial() {
      return {
        version: 1, xp: 0, lecons: {}, cartes: {}, themes: {}, serie: 0, serieMax: 0, dernierJour: null, jours: {},
        badges: [], objectif: 3, embleme: EMBLEMES[0], libre: false, revisions: 0, objectifsAtteints: 0, objectifsJours: [], defis: [],
        parties: Object.fromEntries(Object.keys(NIVEAUX_PARTIE).map((n) => [n, { victoires: 0, nulles: 0, defaites: 0, meilleur: null }])),
        compteurs: Object.fromEntries(COMPTEURS.map((n) => [n, 0]))
      };
    }

    /* ---------- Grades et niveaux ---------- */
    const gradeTermine = (e, grade) => grade.lecons.every((l) => e.lecons[l.id]);
    function gradesObtenus(e) {
      let n = 0;
      while (n < parcours.grades.length && gradeTermine(e, parcours.grades[n])) n += 1;
      return n;
    }
    function titre(e) {
      const n = gradesObtenus(e);
      return n === 0 ? "Débutant" : n === parcours.grades.length ? `${parcours.grades[n - 1].nom} : tu es un pro !` : parcours.grades[n - 1].nom;
    }
    function leconDebloquee(e, id) {
      const info = lecons.get(id);
      return !!info && (e.libre || info.gi === 0 || gradeTermine(e, parcours.grades[info.gi - 1]));
    }
    const emblemesDisponibles = (e) => EMBLEMES.slice(0, Math.max(1, gradesObtenus(e) + 1));

    /* ---------- Badges : communs à tous les jeux, puis propres au jeu (décrits dans le parcours) ---------- */
    const victoiresTotal = (e) => Object.values(e.parties).reduce((s, p) => s + p.victoires, 0);
    const lecDuTheme = (themes) => toutesLecons.filter((l) => themes.includes(l.theme));
    const COMMUNS = [
      { id: "premiers-pas", icone: "👣", nom: "Premiers pas", description: "Termine ta première leçon.", avance: (e) => [Object.keys(e.lecons).length, 1] },
      { id: "sans-faute", icone: "⭐", nom: "Sans faute", description: "Termine une leçon avec 3 étoiles.", avance: (e) => [Object.values(e.lecons).some((l) => l.etoiles === 3) ? 1 : 0, 1] },
      { id: "perfectionniste", icone: "🌟", nom: "Perfectionniste", description: "Obtiens 3 étoiles sur toutes les leçons d'un grade.",
        avance: (e) => [Math.max(...parcours.grades.map((g) => g.lecons.filter((l) => e.lecons[l.id]?.etoiles === 3).length / g.lecons.length)) >= 1 ? 1 : 0, 1] },
      { id: "pro", icone: "🏆", nom: "Du débutant au pro", description: `Obtiens les ${parcours.grades.length} grades.`, avance: (e) => [gradesObtenus(e), parcours.grades.length] },
      { id: "serie-3", icone: "🔥", nom: "Ça chauffe", description: "Entraîne-toi 3 jours de suite.", avance: (e) => [e.serieMax, 3] },
      { id: "serie-7", icone: "📅", nom: "Une semaine sans pause", description: "Entraîne-toi 7 jours de suite.", avance: (e) => [e.serieMax, 7] },
      { id: "regulier", icone: "🎯", nom: "Régulier", description: "Atteins 5 fois ton objectif du jour.", avance: (e) => [e.objectifsAtteints, 5] },
      { id: "memoire", icone: "🧠", nom: "Mémoire d'éléphant", description: "Fais 10 révisions.", avance: (e) => [e.revisions, 10] },
      { id: "bibliotheque", icone: "📚", nom: "Bibliothèque", description: "Maîtrise 10 stratégies (révisées plusieurs fois avec succès).",
        avance: (e) => [Object.values(e.cartes).filter((c) => c.boite >= 4).length, 10] },
      { id: "defis", icone: "⚡", nom: "Défis relevés", description: "Réussis 3 défis du jour.", avance: (e) => [e.defis.length, 3] }
    ];
    function versBadge({ id, icone, nom, description, condition: c }) {
      let avance;
      if (c.type === "themes") {
        avance = (e) => { const l = lecDuTheme(c.themes), faites = l.filter((x) => e.lecons[x.id]).length; return c.toutes === false ? [Math.min(1, faites), 1] : [faites, l.length]; };
      } else if (c.type === "victoires") {
        avance = (e) => [c.niveau ? e.parties[c.niveau]?.victoires ?? 0 : victoiresTotal(e), c.min];
      } else if (c.type === "compteur") {
        avance = (e) => [e.compteurs[c.nom] ?? 0, c.min];
      } else if (c.type === "record") {
        avance = (e) => { const m = e.parties[c.niveau]?.meilleur; return [m !== null && m !== undefined && m <= c.max ? 1 : 0, 1]; };
      } else throw new Error(`badge ${id} : condition « ${c.type} » inconnue`);
      return { id, icone, nom, description, avance };
    }
    const BADGES = [...COMMUNS, ...(parcours.badges ?? []).map(versBadge)];
    const ids = BADGES.map((b) => b.id);
    if (new Set(ids).size !== ids.length) throw new Error("badges en double");

    function badges(e) {
      return BADGES.map(({ avance, ...b }) => { const [actuel, cible] = avance(e); return { ...b, actuel: Math.min(actuel, cible), cible, obtenu: actuel >= cible }; });
    }

    /* ---------- Relecture d'un état stocké ---------- */
    const objet = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
    function normaliser(brut) {
      const base = etatInitial();
      if (!brut || typeof brut !== "object") return base;
      const e = { ...base, xp: entier(brut.xp), serie: entier(brut.serie), serieMax: entier(brut.serieMax), revisions: entier(brut.revisions),
        objectifsAtteints: entier(brut.objectifsAtteints), libre: brut.libre === true,
        objectif: OBJECTIFS.includes(brut.objectif) ? brut.objectif : base.objectif,
        embleme: EMBLEMES.includes(brut.embleme) ? brut.embleme : base.embleme,
        dernierJour: estJour(brut.dernierJour) ? brut.dernierJour : null };
      for (const [id, v] of Object.entries(objet(brut.lecons))) {
        if (lecons.has(id) && [1, 2, 3].includes(v?.etoiles)) e.lecons[id] = { etoiles: v.etoiles, jour: estJour(v.jour) ? v.jour : null };
      }
      for (const [id, v] of Object.entries(objet(brut.cartes))) {
        if (exercices.has(id) && Number.isInteger(v?.boite) && v.boite >= 1 && v.boite <= INTERVALLES.length && estJour(v.prochaine)) e.cartes[id] = { boite: v.boite, prochaine: v.prochaine };
      }
      for (const [t, v] of Object.entries(objet(brut.themes))) {
        if (parcours.themes[t]) { const essais = entier(v?.essais); e.themes[t] = { essais, premiers: Math.min(essais, entier(v?.premiers)) }; }
      }
      for (const [j, n] of Object.entries(objet(brut.jours))) if (estJour(j)) e.jours[j] = entier(n, 1000);
      e.badges = Array.isArray(brut.badges) ? [...new Set(brut.badges.filter((b) => ids.includes(b)))] : [];
      e.defis = Array.isArray(brut.defis) ? [...new Set(brut.defis.filter(estJour))].slice(-MAX_JOURS) : [];
      e.objectifsJours = Array.isArray(brut.objectifsJours) ? [...new Set(brut.objectifsJours.filter(estJour))].slice(-MAX_JOURS) : [];
      for (const n of Object.keys(NIVEAUX_PARTIE)) {
        const p = objet(objet(brut.parties)[n]);
        e.parties[n] = { victoires: entier(p.victoires), nulles: entier(p.nulles), defaites: entier(p.defaites), meilleur: Number.isInteger(p.meilleur) && p.meilleur >= 0 ? p.meilleur : null };
      }
      for (const n of COMPTEURS) e.compteurs[n] = entier(objet(brut.compteurs)[n]);
      return e;
    }

    /* ---------- Enregistrements : chaque fonction renvoie un nouvel état et ce qui a été gagné ---------- */
    function cloturer(e, avant, gains) {
      const obtenus = badges(e).filter((b) => b.obtenu).map((b) => b.id);
      gains.badges = obtenus.filter((id) => !avant.badges.includes(id)).map((id) => { const { avance, ...b } = BADGES.find((x) => x.id === id); return b; });
      e.badges = [...new Set([...avant.badges.filter((id) => ids.includes(id)), ...obtenus])];
      gains.niveauAvant = niveau(avant.xp).niveau;
      gains.niveauApres = niveau(e.xp).niveau;
      gains.gradesAvant = gradesObtenus(avant);
      gains.gradesApres = gradesObtenus(e);
      return { etat: e, gains };
    }
    /** Activité du jour : série de jours consécutifs, compteur du jour, bonus quand l'objectif est atteint. */
    function compterActivite(e, jour, gains) {
      if (e.dernierJour !== jour) {
        e.serie = e.dernierJour && ajouterJours(e.dernierJour, 1) === jour ? e.serie + 1 : 1;
        e.serieMax = Math.max(e.serieMax, e.serie);
        e.dernierJour = jour;
      }
      e.jours[jour] = (e.jours[jour] ?? 0) + 1;
      for (const j of Object.keys(e.jours).sort().slice(0, -MAX_JOURS)) delete e.jours[j];
      // Une seule récompense par date, même si le joueur change son objectif dans la journée.
      if (e.jours[jour] >= e.objectif && !e.objectifsJours.includes(jour)) {
        e.objectifsJours = [...e.objectifsJours, jour].slice(-MAX_JOURS);
        e.xp += XP.objectif; gains.xp += XP.objectif; gains.objectif = true; e.objectifsAtteints += 1;
      }
    }

    function enregistrerExercice(etat, { id, erreurs = 0, indice = false, jour, revision = false }) {
      const info = exercices.get(id);
      if (!info) throw new Error(`exercice inconnu : ${id}`);
      const e = copie(etat), gains = { xp: 0, objectif: false };
      const parfait = erreurs === 0 && !indice;
      const gain = revision ? (parfait ? XP.revision : XP.revisionRatee) : parfait ? XP.parfait : indice ? XP.avecIndice : XP.reussi;
      e.xp += gain; gains.xp += gain;
      const t = e.themes[info.lecon.theme] ?? { essais: 0, premiers: 0 };
      e.themes[info.lecon.theme] = { essais: t.essais + 1, premiers: t.premiers + (parfait ? 1 : 0) };
      const carte = e.cartes[id];
      const boite = !carte ? 1 : parfait ? Math.min(INTERVALLES.length, carte.boite + 1) : 1;
      e.cartes[id] = { boite, prochaine: ajouterJours(jour, INTERVALLES[boite - 1]) };
      if (revision) e.revisions += 1;
      compterActivite(e, jour, gains);
      return cloturer(e, etat, gains);
    }

    function terminerLecon(etat, { id, etoiles: n, jour }) {
      if (!lecons.has(id)) throw new Error(`leçon inconnue : ${id}`);
      const e = copie(etat), gains = { xp: 0, objectif: false, premiereFois: !etat.lecons[id] };
      if (gains.premiereFois) { e.xp += XP.lecon; gains.xp += XP.lecon; }
      e.lecons[id] = { etoiles: Math.max(n, e.lecons[id]?.etoiles ?? 0), jour };
      return cloturer(e, etat, gains);
    }

    /** Partie terminée (contre l'ordinateur, ou partie de démineur). `temps` en secondes, pour les records. */
    function enregistrerPartie(etat, { resultat, niveau: n, jour, temps = null }) {
      const regle = NIVEAUX_PARTIE[n];
      if (!RESULTATS[resultat] || !regle || regle.xp[resultat] === undefined) throw new Error("partie invalide");
      const e = copie(etat), gains = { xp: 0, objectif: false, record: false };
      const gain = regle.xp[resultat];
      e.xp += gain; gains.xp += gain;
      const p = e.parties[n];
      p[RESULTATS[resultat]] += 1;
      if (resultat === "victoire" && Number.isInteger(temps) && temps >= 0 && (p.meilleur === null || temps < p.meilleur)) { p.meilleur = temps; gains.record = true; }
      compterActivite(e, jour, gains);
      return cloturer(e, etat, gains);
    }

    /** Événements de jeu (ex. un capot) : seulement les compteurs déclarés par les badges, sans XP ni activité. */
    function compter(etat, { compteurs = {} }) {
      const e = copie(etat), gains = { xp: 0, objectif: false };
      for (const [n, k] of Object.entries(compteurs)) if (COMPTEURS.includes(n) && Number.isInteger(k) && k > 0) e.compteurs[n] += k;
      return cloturer(e, etat, gains);
    }

    function enregistrerDefi(etat, { jour }) {
      const e = copie(etat), gains = { xp: 0, objectif: false };
      if (!e.defis.includes(jour)) { e.defis = [...e.defis, jour].slice(-MAX_JOURS); e.xp += XP.defi; gains.xp += XP.defi; }
      return cloturer(e, etat, gains);
    }

    function regler(etat, { objectif, embleme, libre }) {
      const e = copie(etat);
      if (OBJECTIFS.includes(objectif)) e.objectif = objectif;
      if (emblemesDisponibles(etat).includes(embleme)) e.embleme = embleme;
      if (typeof libre === "boolean") e.libre = libre;
      return e;
    }

    /* ---------- Lectures ---------- */
    function revisionsDues(etat, jour) {
      return Object.entries(etat.cartes)
        .filter(([, c]) => c.prochaine <= jour)
        .sort(([, a], [, b]) => a.prochaine.localeCompare(b.prochaine) || a.boite - b.boite)
        .map(([id]) => id);
    }
    function forces(etat) {
      return Object.entries(parcours.themes).map(([id, nom]) => {
        const t = etat.themes[id] ?? { essais: 0, premiers: 0 };
        return { id, nom, essais: t.essais, taux: t.essais >= 3 ? t.premiers / t.essais : null };
      });
    }
    /** Série encore valable aujourd'hui (elle est cassée si le dernier jour actif est avant-hier ou plus ancien). */
    const serieActuelle = (e, jour) => (e.dernierJour === jour || e.dernierJour === ajouterJours(jour, -1) ? e.serie : 0);
    /** Activité des `n` derniers jours, du plus ancien au plus récent. */
    const activite = (e, jour, n = 7) => Array.from({ length: n }, (_, k) => { const j = ajouterJours(jour, k - n + 1); return { jour: j, exercices: e.jours[j] ?? 0 }; });

    function defiDuJour(etat, jour) {
      // Liste commune, indépendante de la progression : vraiment le même défi pour tout le monde le même jour.
      const candidats = [...exercices.entries()].filter(([, x]) => x.exo.type !== "qcm").map(([id]) => id);
      if (!candidats.length) return null;
      return { id: candidats[hacher(jour) % candidats.length], fait: etat.defis.includes(jour) };
    }

    /** Conseil personnalisé : réviser, retravailler un point faible, avancer, se perfectionner, ou jouer. */
    function recommandation(etat, jour) {
      const dues = revisionsDues(etat, jour);
      const ouvertes = toutesLecons.filter((l) => leconDebloquee(etat, l.id));
      if (dues.length >= 3) return { type: "revision", nombre: dues.length, texte: `${dues.length} stratégies t'attendent pour une révision : c'est le meilleur moyen de les retenir pour toujours.` };
      const faibles = forces(etat).filter((f) => f.taux !== null && f.taux < 0.6).sort((a, b) => a.taux - b.taux);
      for (const f of faibles) {
        const lecon = ouvertes.filter((l) => l.theme === f.id).sort((a, b) => (etat.lecons[a.id]?.etoiles ?? 0) - (etat.lecons[b.id]?.etoiles ?? 0))[0];
        if (lecon && (etat.lecons[lecon.id]?.etoiles ?? 0) < 3) return { type: "faiblesse", lecon: lecon.id, theme: f.id, texte: `Ton point à travailler : ${f.nom.toLowerCase()} (${Math.round(f.taux * 100)} % réussi du premier coup). Refais « ${lecon.titre} ».` };
      }
      const suivante = ouvertes.find((l) => !etat.lecons[l.id]);
      if (suivante) return { type: "suite", lecon: suivante.id, texte: Object.keys(etat.lecons).length ? `Prochaine étape : « ${suivante.titre} ».` : `Bienvenue ! Commence par « ${suivante.titre} ».` };
      if (dues.length) return { type: "revision", nombre: dues.length, texte: `${dues.length} révision${dues.length > 1 ? "s" : ""} pour garder tes stratégies en tête.` };
      const aPerfectionner = ouvertes.find((l) => etat.lecons[l.id].etoiles < 3);
      if (aPerfectionner) return { type: "perfection", lecon: aPerfectionner.id, texte: `Vise les 3 étoiles sur « ${aPerfectionner.titre} ».` };
      if (gradesObtenus(etat) < parcours.grades.length) {
        const g = parcours.grades[gradesObtenus(etat)];
        return { type: "suite", lecon: g.lecons.find((l) => !etat.lecons[l.id])?.id ?? g.lecons[0].id, texte: `Termine le grade ${g.nom} pour progresser.` };
      }
      return { type: "jouer", texte: parcours.conseilFinal ?? "Tu as tout appris ! Mets tes stratégies en pratique en jouant." };
    }

    /** Règles de gain d'XP, pour les expliquer au joueur (transparence de la gamification). */
    function reglesXP() {
      const regles = [
        ["Exercice réussi du premier coup", XP.parfait], ["Exercice réussi après une erreur", XP.reussi], ["Exercice réussi avec un indice", XP.avecIndice],
        ["Leçon terminée (la première fois)", XP.lecon], ["Révision réussie du premier coup", XP.revision], ["Objectif du jour atteint", XP.objectif], ["Défi du jour réussi", XP.defi]
      ];
      for (const [, n] of Object.entries(NIVEAUX_PARTIE)) {
        for (const [r, xp] of Object.entries(n.xp)) regles.push([`Partie ${n.nom} : ${{ victoire: "victoire", nulle: "nulle", defaite: "défaite" }[r]}`, xp]);
      }
      return regles.map(([texte, xp]) => ({ texte, xp }));
    }

    return Object.freeze({
      parcours, EMBLEMES, BADGES: BADGES.map(({ avance, ...b }) => b), NIVEAUX_PARTIE, lecons, exercices,
      etatInitial, normaliser, niveau, gradesObtenus, titre, leconDebloquee, emblemesDisponibles, badges,
      enregistrerExercice, terminerLecon, enregistrerPartie, enregistrerDefi, compter, regler,
      revisionsDues, forces, serieActuelle, activite, defiDuJour, recommandation, reglesXP
    });
  }

  /** Niveau n atteint à 50 × n × (n − 1) XP : 0, 100, 300, 600, 1000… (chaque niveau demande un peu plus). */
  function niveau(xp) {
    let n = 1;
    while (50 * (n + 1) * n <= xp) n += 1;
    const debut = 50 * n * (n - 1), fin = 50 * (n + 1) * n;
    return { niveau: n, xpDansNiveau: xp - debut, xpPourNiveau: fin - debut };
  }

  return Object.freeze({ XP, INTERVALLES, OBJECTIFS, ajouterJours, exoId, etoiles, niveau, creer });
})();
</script>
<script id="academie-jeux" data-inclure="gabarit/jeux/academie.js">
/* Interface commune de l'Académie des jeux (ADR 0014, 0015) : synthèse, parcours, séances d'exercices et page
   « Ma progression ». Les exercices propres à un jeu (échiquier, grille…) sont fournis par des adaptateurs.
   Module partagé, recopié dans chaque page par `npm run build` : modifier ce fichier, jamais sa copie dans une page.
   Contenu affiché uniquement par textContent et createElement (jamais innerHTML). */
const VueAcademie = (() => {
  "use strict";

  function el(balise, attributs = {}, ...enfants) {
    const n = document.createElement(balise);
    for (const [k, v] of Object.entries(attributs)) {
      if (v === false || v === null || v === undefined) continue;
      if (k === "texte") n.textContent = v; else if (k === "classe") n.className = v; else n.setAttribute(k, v === true ? "" : v);
    }
    n.append(...enfants.filter((x) => x !== null && x !== undefined && x !== false));
    return n;
  }
  const etoilesTexte = (n) => `${"★".repeat(n)}${"☆".repeat(3 - n)}`;
  const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;
  const jourLocal = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const dateCourte = (jour) => `${jour.slice(8, 10)}/${jour.slice(5, 7)}`;

  const nomJour = (jour) => { const [a, m, j] = jour.split("-").map(Number); return JOURS[new Date(a, m - 1, j).getDay()]; };

  /**
   * Monte l'Académie dans un panneau d'onglet.
   * - progression : API créée par ProgressionJeux.creer(parcours)

    vues.accueil.append(synthese, el("h2", { texte: "🗺️ Ton parcours, du débutant au pro" }), z.parcours, z.stockage);

    // Page détaillée
    const retourDetail = el("button", { type: "button", classe: "secondaire", "data-action": "retour", texte: "← Retour à l'Académie" });
    z.detailTitre = el("h2", { tabindex: "-1", texte: "📊 Ma progression", "data-sortie": "detail-titre" });
    const section = (titre, ...contenu) => el("section", { classe: "carte detail-section" }, el("h3", { texte: titre }), ...contenu);
    z.dNiveau = el("div", { "data-sortie": "detail-niveau" }); z.dRegles = el("table", { classe: "regles-xp" });

    z.dCarnet = el("ul", { classe: "carnet", "data-sortie": "carnet" });

    z.dReglages = el("div");
    vues.detail.append(retourDetail, z.detailTitre,

      section("🎖️ Grades", el("p", { classe: "doux", texte: "Chaque grade obtenu ouvre le suivant et un nouvel emblème." }), z.dGrades),
      section("🏅 Badges", z.dBadges),
      section("🔥 Régularité", z.dRegularite, z.dActivite),
      section("📒 Carnet de stratégies", el("p", { classe: "doux", texte: "Chaque stratégie apprise revient en révision, de plus en plus espacée quand tu la réussis." }), z.dCarnet),
      section("📈 Points forts et points faibles", z.dForces, z.dParties),
      section("⚙️ Réglages", z.dReglages));

    // Séance
    z.fil = el("p", { classe: "doux fil", "data-sortie": "fil" });
    z.sTitre = el("h2", { tabindex: "-1", "data-sortie": "session-titre" });

    z.zoneRetenir = el("div", { classe: "a-retenir" }, el("strong", { texte: "📌 À retenir" }), z.retenir);
    z.progression = el("p", { classe: "progression", "data-sortie": "progression" });
    z.consigne = el("p", { classe: "consigne", "data-sortie": "consigne" });
    z.qcm = el("ul", { classe: "qcm", hidden: true });
    z.zoneJeu = el("div", { classe: "zone-exercice" });
    z.retour = el("p", { classe: "message", role: "status", "aria-live": "polite", "data-sortie": "retour" });
    z.indice = el("button", { type: "button", classe: "secondaire", "data-action": "indice", texte: "💡 Indice" });
    z.suivant = el("button", { type: "button", classe: "action", "data-action": "suivant", hidden: true });
    z.exercice = el("div", { classe: "carte" }, z.progression, z.consigne, z.zoneJeu, z.qcm, z.retour, el("div", { classe: "boutons" }, z.indice, z.suivant));
    z.bTitre = el("h2", { tabindex: "-1", "data-sortie": "bilan-titre" }); z.bTexte = el("p", { "data-sortie": "bilan-texte" });
    z.bSuite = el("button", { type: "button", classe: "action", "data-action": "bilan-suite", hidden: true });
    const bRetour = el("button", { type: "button", classe: "secondaire", "data-action": "bilan-retour", texte: "Retour à l'Académie" });
    z.bilan = el("div", { classe: "carte bilan", hidden: true }, z.bTitre, z.bTexte, el("div", { classe: "boutons" }, z.bSuite, bRetour));
    const retourSession = el("button", { type: "button", classe: "secondaire", "data-action": "retour", texte: "← Retour à l'Académie" });
    vues.session.append(retourSession, z.fil, z.sTitre, z.sTexte, z.zoneRetenir, z.exercice, z.bilan);

    /* ---------- Gains ---------- */
    function appliquer({ etat: nouvel, gains }) {
      etat = nouvel; sauver();
      const morceaux = [];
      if (gains.xp) morceaux.push(`+${gains.xp} XP`);
      if (gains.record) morceaux.push("⏱️ Nouveau record");
      if (gains.objectif) morceaux.push("🎯 Objectif du jour atteint");
      if (gains.niveauApres > gains.niveauAvant) morceaux.push(`⬆️ Niveau ${gains.niveauApres} !`);
      if (gains.gradesApres > gains.gradesAvant) morceaux.push(`🎖️ Grade ${parcours.grades[gains.gradesApres - 1].nom} obtenu : nouvel emblème disponible`);
      for (const b of gains.badges) morceaux.push(`${b.icone} Badge « ${b.nom} »`);
      if (morceaux.length) toast.textContent = morceaux.join(" · ");
      return gains;
    }

    function montrer(nom) {
      for (const [k, v] of Object.entries(vues)) v.hidden = k !== nom;
      if (nom !== "session") { session?.adaptateur?.arreter?.(); session = null; ex = null; }
      if (nom === "accueil") afficherAccueil();
      if (nom === "detail") afficherDetail();
      ({ accueil: z.titre, detail: z.detailTitre, session: z.sTitre })[nom].focus();

    /* ---------- Synthèse et parcours ---------- */
    function afficherAccueil() {
      const j = jour(), niv = P.niveau(etat.xp), grades = P.gradesObtenus(etat), tous = P.badges(etat);
      z.embleme.replaceChildren(embleme(etat.embleme));
      z.titre.textContent = P.titre(etat);
      z.niveau.textContent = `Niveau ${niv.niveau} · ${etat.xp} XP · encore ${niv.xpPourNiveau - niv.xpDansNiveau} XP pour le niveau ${niv.niveau + 1}`;
      z.barre.replaceChildren(barre(niv.xpDansNiveau, niv.xpPourNiveau, "Progression vers le niveau suivant"));

      z.chips.replaceChildren(...[

        `🎯 Aujourd'hui : ${Math.min(aujourdhui, etat.objectif)} / ${etat.objectif}${aujourdhui >= etat.objectif ? " ✓" : ""}`,

        `🏅 Badges : ${tous.filter((b) => b.obtenu).length} / ${tous.length}`

      const conseil = P.recommandation(etat, j);
      z.conseil.textContent = conseil.texte;
      z.actionConseil.textContent = { revision: "Réviser maintenant", jouer: "Jouer une partie" }[conseil.type] ?? "C'est parti !";
      z.actionConseil.onclick = () => (conseil.type === "revision" ? reviser() : conseil.type === "jouer" ? ouvrirOnglet?.("application") : ouvrirLecon(conseil.lecon));
      const dues = P.revisionsDues(etat, j);
      z.reviser.textContent = `🧠 Révisions (${dues.length})`; z.reviser.disabled = dues.length === 0;
      const defi = P.defiDuJour(etat, j);
      z.defi.textContent = defi?.fait ? "⚡ Défi du jour relevé ✓" : `⚡ Défi du jour (+${ProgressionJeux.XP.defi} XP)`;
      z.defi.disabled = !defi || defi.fait;
      // Prochain badge : celui qui est le plus près d'être gagné.
      const prochain = tous.filter((b) => !b.obtenu).sort((a, b) => b.actuel / b.cible - a.actuel / a.cible)[0];
      z.prochainBadge.replaceChildren(...(prochain ? [el("span", { classe: "doux", texte: "Prochain badge : " }),
        el("strong", { texte: `${prochain.icone} ${prochain.nom}` }), el("span", { texte: ` — ${prochain.description} (${prochain.actuel} / ${prochain.cible})` })]
        : [el("strong", { texte: "🏆 Tous les badges sont gagnés. Bravo !" })]));
      // Parcours
      z.parcours.replaceChildren(...parcours.grades.map((g, gi) => {
        const faites = g.lecons.filter((l) => etat.lecons[l.id]).length, ouvert = P.leconDebloquee(etat, g.lecons[0].id);
        const etatGrade = faites === g.lecons.length ? "✓ obtenu" : ouvert ? `${faites} / ${g.lecons.length}` : `🔒 termine le grade ${parcours.grades[gi - 1].nom}`;
        return el("li", { classe: `grade${ouvert ? "" : " verrouille"}`, "data-grade": g.id },
          el("div", { classe: "grade-entete" }, el("span", { classe: "grade-embleme", "aria-hidden": "true" }, embleme(g.embleme)),
            el("div", {}, el("h3", { texte: `${gi + 1}. ${g.nom}` }), el("p", { classe: "doux", texte: g.sousTitre })),
            el("span", { classe: "grade-etat", texte: etatGrade })),
          el("ul", { classe: "lecons" }, ...g.lecons.map((l) => {
            const fait = etat.lecons[l.id], libre = P.leconDebloquee(etat, l.id);
            const b = el("button", { type: "button", classe: `lecon${fait ? " faite" : ""}`, "data-lecon": l.id, disabled: !libre,
              "aria-label": `${l.titre}, ${parcours.themes[l.theme]}, ${fait ? `${pluriel(fait.etoiles, "étoile")} sur 3` : libre ? "à faire" : "verrouillée"}` },
              el("span", { classe: "lecon-titre", texte: l.titre }), el("span", { classe: "lecon-theme", texte: parcours.themes[l.theme] }),
              el("span", { classe: "lecon-etoiles", "aria-hidden": "true", texte: fait ? etoilesTexte(fait.etoiles) : libre ? "Nouveau" : "🔒" }));
            b.addEventListener("click", () => ouvrirLecon(l.id));
            return el("li", {}, b);
          })));
      }));
    }

    /* ---------- Page détaillée « Ma progression » ---------- */
    function afficherDetail() {
      const j = jour(), niv = P.niveau(etat.xp), obtenus = P.gradesObtenus(etat);
      z.dNiveau.replaceChildren(
        el("p", {}, el("strong", { texte: `Niveau ${niv.niveau}` }), el("span", { texte: ` · ${etat.xp} XP au total · ${P.titre(etat)}` })),
        barre(niv.xpDansNiveau, niv.xpPourNiveau, "Progression vers le niveau suivant"),
        el("p", { classe: "doux", texte: `${niv.xpDansNiveau} / ${niv.xpPourNiveau} XP : encore ${niv.xpPourNiveau - niv.xpDansNiveau} XP pour le niveau ${niv.niveau + 1}.` }));
      z.dRegles.replaceChildren(el("tbody", {}, ...P.reglesXP().map((r) => el("tr", {}, el("td", { texte: r.texte }), el("td", { texte: `+${r.xp} XP` })))));
      z.dGrades.replaceChildren(...parcours.grades.map((g, gi) => {
        const faites = g.lecons.filter((l) => etat.lecons[l.id]).length;
        const statut = gi < obtenus ? "✓ obtenu" : gi === obtenus ? `en cours : ${faites} / ${g.lecons.length} leçons` : "🔒 à venir";
        return el("li", { classe: gi < obtenus ? "obtenu" : gi === obtenus ? "en-cours" : "verrouille" },
          el("span", { classe: "grade-embleme", "aria-hidden": "true" }, embleme(g.embleme)),
          el("strong", { texte: g.nom }), el("span", { classe: "doux", texte: ` — ${g.sousTitre} · ${statut}` }));
      }));
      const tous = P.badges(etat);
      z.dBadges.replaceChildren(...[...tous.filter((b) => b.obtenu), ...tous.filter((b) => !b.obtenu)].map((b) => el("li", { classe: b.obtenu ? "obtenu" : "verrouille" },
        el("span", { classe: "badge-icone", "aria-hidden": "true", texte: b.obtenu ? b.icone : "🔒" }),
        el("strong", { texte: b.nom }),
        el("span", { classe: "doux", texte: `${b.obtenu ? "✓ Gagné : " : "À gagner : "}${b.description}` }),
        b.obtenu || b.cible <= 1 ? null : barre(b.actuel, b.cible, `${b.nom} : ${b.actuel} sur ${b.cible}`))));
      const serie = P.serieActuelle(etat, j);
      z.dRegularite.replaceChildren(el("p", { texte: `Série actuelle : ${pluriel(serie, "jour")} · record : ${pluriel(etat.serieMax, "jour")} · objectif du jour : ${pluriel(etat.objectif, "exercice")} (atteint ${etat.objectifsAtteints} fois).` }));
      z.dActivite.replaceChildren(...P.activite(etat, j).map((a) => {
        const atteint = a.exercices >= etat.objectif;
        return el("li", { classe: atteint ? "atteint" : a.exercices ? "actif" : "", "aria-label": `${nomJour(a.jour)} ${dateCourte(a.jour)} : ${pluriel(a.exercices, "activité")}${atteint ? ", objectif atteint" : ""}` },
          el("span", { classe: "jour", texte: nomJour(a.jour) }), el("span", { classe: "compte", texte: atteint ? "✓" : String(a.exercices) }));
      }));
      const apprises = parcours.grades.flatMap((g) => g.lecons).filter((l) => etat.lecons[l.id]);
      z.dCarnet.replaceChildren(...(apprises.length ? apprises.map((l) => {
        const cartes = l.exercices.map((_, k) => etat.cartes[ProgressionJeux.exoId(l, k)]).filter(Boolean);
        const maitrise = cartes.length && cartes.every((c) => c.boite >= 4);
        const prochaine = cartes.map((c) => c.prochaine).sort()[0];
        const quand = maitrise ? "✓ maîtrisée" : !prochaine ? "à revoir demain" : prochaine <= j ? "à réviser aujourd'hui" : `à revoir le ${dateCourte(prochaine)}`;
        return el("li", {}, el("strong", { texte: `${etoilesTexte(etat.lecons[l.id].etoiles)} ${l.titre}` }), el("span", { classe: "doux", texte: quand ? ` · ${quand}` : "" }), el("p", { texte: l.retenir }));
      }) : [el("li", { classe: "doux", texte: "Termine une leçon : sa stratégie s'ajoute ici, pour la relire et la réviser." })]));
      z.dForces.replaceChildren(...P.forces(etat).map((f) => el("li", {}, el("span", { texte: f.nom }),
        f.taux === null
          ? el("span", { classe: "doux", texte: f.essais ? `${pluriel(f.essais, "essai")} : encore un peu de pratique` : "pas encore travaillé" })
          : el("span", { classe: "jauge", role: "img", "aria-label": `${Math.round(f.taux * 100)} % réussi du premier coup sur ${f.essais} essais` },
            Object.assign(el("span"), { style: `width:${Math.round(f.taux * 100)}%` }), el("b", { texte: `${Math.round(f.taux * 100)} %` })))));
      z.dParties.replaceChildren(...Object.entries(P.NIVEAUX_PARTIE).map(([id, n]) => {
        const p = etat.parties[id], nulles = n.xp.nulle !== undefined ? ` · ${pluriel(p.nulles, "nulle")}` : "";
        return el("li", { texte: `${n.nom} : ${pluriel(p.victoires, "victoire")}${nulles} · ${pluriel(p.defaites, "défaite")}${p.meilleur !== null ? ` · record ${formaterTemps(p.meilleur)}` : ""}` });
      }));
      afficherReglages();
    }

    function afficherReglages() {
      const objectif = el("fieldset", { classe: "choix" }, el("legend", { texte: "Mon objectif du jour" }), ...ProgressionJeux.OBJECTIFS.map((n) => {
        const r = el("input", { type: "radio", name: "objectif", value: n, checked: etat.objectif === n });
        r.addEventListener("change", () => { etat = P.regler(etat, { objectif: n }); sauver(); afficherDetail(); });
        return el("label", {}, r, pluriel(n, "exercice"));
      }));
      const dispo = P.emblemesDisponibles(etat);
      const emblemes = el("fieldset", { classe: "choix emblemes" }, el("legend", { texte: "Mon emblème (un nouveau à chaque grade)" }), ...P.EMBLEMES.map((id, i) => {
        const ouvert = dispo.includes(id), g = parcours.grades[i];
        const r = el("input", { type: "radio", name: "embleme", value: id, disabled: !ouvert, checked: etat.embleme === id, "aria-label": ouvert ? `Emblème ${g.nom}` : `Emblème ${g.nom}, verrouillé` });
        r.addEventListener("change", () => { etat = P.regler(etat, { embleme: id }); sauver(); afficherDetail(); });
        return el("label", { classe: ouvert ? "" : "verrouille", title: ouvert ? g.nom : `Grade ${parcours.grades[i - 1]?.nom} à obtenir` }, r, embleme(id));
      }));
      const libre = el("input", { type: "checkbox", name: "libre", checked: etat.libre });
      libre.addEventListener("change", () => { etat = P.regler(etat, { libre: libre.checked }); sauver(); afficherDetail(); });
      const effacer = el("button", { type: "button", classe: "secondaire danger", "data-action": "effacer", texte: confirmationEffacement ? "Confirmer : tout effacer" : "🗑️ Effacer ma progression" });
      effacer.addEventListener("click", () => {
        if (!confirmationEffacement) { confirmationEffacement = true; afficherReglages(); z.dReglages.querySelector('[data-action="effacer"]').focus(); return; }
        confirmationEffacement = false; etat = P.etatInitial(); sauver(); toast.textContent = "Progression effacée : nouveau départ !"; afficherDetail();
      });
      z.dReglages.replaceChildren(objectif, emblemes,
        el("label", { classe: "case-a-cocher" }, libre, "Je connais déjà les bases : ouvrir toutes les leçons"),
        el("p", { classe: "doux", texte: "Ta progression reste sur cet appareil. Elle ne contient aucune donnée personnelle." }), effacer);
    }

    /* ---------- Séances : leçon, révisions, défi du jour ---------- */
    const instances = {};
    const outils = {
      reussir: () => terminerExercice(),
      erreur: (message) => {
        ex.erreurs += 1;
        retour(message ?? (ex.erreurs >= 2 ? `Pas tout à fait. Indice : ${ex.exo.indice ?? "relis bien la question."}` : "Pas tout à fait : essaie encore !"), "ko");
      },
      retour: (texte, classe = "") => retour(texte, classe)
    };
    function adaptateur(type) {
      if (!adaptateurs[type]) throw new Error(`type d'exercice inconnu : ${type}`);
      if (!instances[type]) { instances[type] = adaptateurs[type](outils); z.zoneJeu.appendChild(instances[type].element); }
      return instances[type];
    }
    function retour(texte, classe) { z.retour.textContent = texte; z.retour.className = `message ${classe}`; }

    function ouvrirLecon(id) {
      const info = P.lecons.get(id);
      if (!info || !P.leconDebloquee(etat, id)) return;
      demarrerSession("lecon", info.lecon.exercices.map((_, k) => ProgressionJeux.exoId(info.lecon, k)), info.lecon);
    }
    function reviser() {
      const dues = P.revisionsDues(etat, jour()).slice(0, 8);
      if (dues.length) demarrerSession("revision", dues);
    }
    function demarrerSession(mode, file, lecon = null) {
      session = { mode, file, lecon, rang: 0, erreurs: 0, indices: 0 };
      const grade = lecon && P.lecons.get(lecon.id).grade;
      z.fil.textContent = mode === "lecon" ? `Grade ${grade.nom} · ${parcours.themes[lecon.theme]}` : mode === "defi" ? "Défi du jour" : "Révisions espacées";
      z.sTitre.textContent = mode === "lecon" ? lecon.titre : mode === "defi" ? "⚡ Le défi du jour" : "🧠 Tes révisions";
      z.sTexte.textContent = mode === "lecon" ? lecon.texte
        : mode === "defi" ? `Un exercice tiré du parcours, le même pour tout le monde aujourd'hui. Réussis-le pour gagner ${ProgressionJeux.XP.defi} XP de plus !`
        : "Retrouve la bonne réponse sans aide. Chaque réussite repousse la prochaine révision : c'est comme ça qu'on retient pour toujours.";
      z.zoneRetenir.hidden = mode !== "lecon";
      z.retenir.textContent = lecon?.retenir ?? "";
      z.exercice.hidden = false; z.bilan.hidden = true;
      toast.textContent = "";
      montrer("session");
      demarrerExercice();
    }

    function demarrerExercice() {
      const id = session.file[session.rang], { exo, lecon } = P.exercices.get(id);
      session.adaptateur?.arreter?.();
      ex = { id, exo, lecon, erreurs: 0, indice: false, fini: false };
      z.progression.textContent = `${session.mode === "lecon" ? "Exercice" : `${lecon.titre} ·`} ${session.rang + 1} / ${session.file.length}`;
      retour("", "");
      z.suivant.hidden = true; z.indice.hidden = false; z.indice.disabled = false;
      const qcm = exo.type === "qcm";
      for (const [type, inst] of Object.entries(instances)) inst.element.hidden = qcm || type !== exo.type;
      z.qcm.hidden = !qcm;
      if (qcm) {
        session.adaptateur = null;
        z.consigne.textContent = exo.question;
        z.indice.textContent = "💡 Retirer une mauvaise réponse";
        z.qcm.replaceChildren(...exo.choix.map((texte, i) => {
          const b = el("button", { type: "button", classe: "choix-qcm", "data-choix": i, texte });
          b.addEventListener("click", () => repondreQcm(i));
          return el("li", {}, b);
        }));
      } else {
        const a = adaptateur(exo.type);
        a.element.hidden = false;
        session.adaptateur = a;
        z.consigne.textContent = a.consigne ? a.consigne(exo) : exo.consigne;
        z.indice.textContent = "💡 Indice";
        a.demarrer(exo);
      }
    }

    function repondreQcm(i) {
      if (ex.fini) return;
      const b = z.qcm.querySelector(`[data-choix="${i}"]`);
      if (i !== ex.exo.bonne) { b.disabled = true; b.dataset.etat = "faux"; b.textContent = `✗ ${ex.exo.choix[i]}`; outils.erreur(); return; }
      b.dataset.etat = "juste"; b.textContent = `✓ ${ex.exo.choix[i]}`;
      for (const autre of z.qcm.querySelectorAll("button")) autre.disabled = true;
      terminerExercice();
    }

    z.indice.addEventListener("click", () => {
      if (!ex || ex.fini) return;
      ex.indice = true; z.indice.disabled = true;
      if (ex.exo.type === "qcm") {
        const faux = [...z.qcm.querySelectorAll("button:not(:disabled)")].find((b) => Number(b.dataset.choix) !== ex.exo.bonne);
        if (faux) { faux.disabled = true; faux.dataset.etat = "retire"; faux.textContent = `— ${faux.textContent}`; }
        retour("Une mauvaise réponse a été retirée.", "");
        return;
      }
      retour(`Indice : ${ex.exo.indice}`, "");
      session.adaptateur.indice(ex.exo);
    });

    function terminerExercice() {
      if (ex.fini) return;
      ex.fini = true;
      const j = jour();
      session.erreurs += ex.erreurs; session.indices += ex.indice ? 1 : 0;
      appliquer(P.enregistrerExercice(etat, { id: ex.id, erreurs: ex.erreurs, indice: ex.indice, jour: j, revision: session.mode === "revision" }));
      if (session.mode === "defi") appliquer(P.enregistrerDefi(etat, { jour: j }));
      const rappel = session.mode !== "lecon" ? ` À retenir : ${ex.lecon.retenir}` : "";
      retour(`${ex.erreurs === 0 && !ex.indice ? "Parfait ! " : "Réussi ! "}${ex.exo.explication}${rappel}`, "ok");
      z.indice.hidden = true;
      const fin = session.rang === session.file.length - 1;
      z.suivant.textContent = fin ? "Voir le bilan" : "Exercice suivant";
      z.suivant.hidden = false;
      z.suivant.focus();
    }
    z.suivant.addEventListener("click", () => {
      if (session.rang < session.file.length - 1) { session.rang += 1; demarrerExercice(); return; }
      afficherBilan();
    });

    function afficherBilan() {
      session.adaptateur?.arreter?.();
      z.exercice.hidden = true; z.bilan.hidden = false;
      const j = jour();
      if (session.mode === "lecon") {
        const n = ProgressionJeux.etoiles(session);
        appliquer(P.terminerLecon(etat, { id: session.lecon.id, etoiles: n, jour: j }));
        z.bTitre.textContent = `${etoilesTexte(n)} Leçon terminée !`;
        z.bTexte.textContent = `${n === 3 ? "Sans faute : bravo !" : n === 2 ? "Très bien ! Refais-la plus tard pour viser les 3 étoiles." : "Leçon réussie. Refais-la pour gagner des étoiles."} La stratégie « ${session.lecon.titre} » rejoint ton carnet : elle reviendra en révision demain.`;
      } else if (session.mode === "defi") {
        z.bTitre.textContent = "⚡ Défi relevé !"; z.bTexte.textContent = "Reviens demain pour un nouveau défi.";
      } else {
        z.bTitre.textContent = "🧠 Révisions terminées";
        z.bTexte.textContent = `${pluriel(session.file.length, "stratégie")} révisée${session.file.length > 1 ? "s" : ""}. Les bonnes réponses reviendront plus tard, les autres dès demain.`;
      }
      const ordre = parcours.grades.flatMap((g) => g.lecons);
      const prochaine = session.mode === "lecon" ? ordre.slice(ordre.findIndex((l) => l.id === session.lecon.id) + 1).find((l) => P.leconDebloquee(etat, l.id) && !etat.lecons[l.id]) : null;
      z.bSuite.hidden = !prochaine;
      if (prochaine) { z.bSuite.textContent = `Leçon suivante : ${prochaine.titre}`; z.bSuite.onclick = () => ouvrirLecon(prochaine.id); }
      z.bTitre.focus();
    }

    /* ---------- Commandes ---------- */
    z.reviser.addEventListener("click", reviser);
    z.defi.addEventListener("click", () => { const d = P.defiDuJour(etat, jour()); if (d && !d.fait) demarrerSession("defi", [d.id]); });
    boutonDetail.addEventListener("click", () => { confirmationEffacement = false; montrer("detail"); });
    for (const b of [retourDetail, retourSession, bRetour]) b.addEventListener("click", () => montrer("accueil"));

    afficherAccueil();
    return {
      etat: () => etat,
      /** Partie terminée dans l'onglet « Jouer » : enregistrée ici, et les gains sont renvoyés pour être affichés. */
      enregistrerPartie(partie) {
        const g = appliquer(P.enregistrerPartie(etat, { ...partie, jour: jour() }));
        if (!session) { if (vues.detail.hidden) afficherAccueil(); else afficherDetail(); }
        return g;
      },
      /** Événements de jeu (capot, belote…) comptés pour les badges. */
      compter(compteurs) {
        const g = appliquer(P.compter(etat, { compteurs }));
        if (!session) { if (vues.detail.hidden) afficherAccueil(); else afficherDetail(); }
        return g;
      }
    };
  }

  return Object.freeze({ monter, jourLocal });
})();
</script>
<script>
(() => {
  "use strict";
  const M = MoteurMotsFleches, registre = [], panneaux = document.getElementById("panneaux"), onglets = document.getElementById("onglets");
  function enregistrerOnglet(definition) { registre.push(definition); }
  const stockage = (() => {
    try {
      localStorage.setItem("kermiclab:test", "1"); localStorage.removeItem("kermiclab:test");
      return {
        disponible: true,
        lire(cle) { try { return JSON.parse(localStorage.getItem(`kermiclab:mots-fleches:${cle}`) || "null"); } catch { return null; } },
        ecrire(cle, valeur) { localStorage.setItem(`kermiclab:mots-fleches:${cle}`, JSON.stringify(valeur)); }
      };
    } catch { return { disponible: false, lire: () => null, ecrire() {} }; }
  })();
  const lireProgression = stockage.lire("partie");
  const progression = { ouvert: Number.isInteger(lireProgression?.ouvert) ? Math.max(0, Math.min(M.NIVEAUX.length - 1, lireProgression.ouvert)) : 0 };
  let ouvrirOnglet = () => {};
  const sortie = (el, texte) => { el.textContent = texte; };

  enregistrerOnglet({ id: "explication", titre: "Règles", rendu(p) { p.append(document.getElementById("tpl-regles").content.cloneNode(true)); } });
  const jeu = {};
  enregistrerOnglet({ id: "application", titre: "Jouer", rendu(p) {
    p.append(document.getElementById("tpl-jeu").content.cloneNode(true));
    const niveaux = p.querySelector('[data-zone="niveaux"]'), listeIndices = p.querySelector('[data-zone="indices"]');
    const grille = p.querySelector('[data-zone="grille"]'), clavier = p.querySelector('[data-zone="clavier"]');
    const objectif = p.querySelector('[data-sortie="objectif"]'), message = p.querySelector('[data-sortie="message"]');
    let rang = progression.ouvert, partie, selection = -1, motActif = null, erreurs = [], terminee = false;
    const boutonsNiveau = M.NIVEAUX.map((niveau, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "niveau"; b.dataset.rang = String(i);
      b.append(document.createTextNode(`${niveau.nom} `));
      const detail = document.createElement("small"); detail.textContent = niveau.description; b.append(detail);
      b.addEventListener("click", () => { if (i <= progression.ouvert) demarrer(i); });
      niveaux.append(b); return b;
    });
    for (const lettre of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") {
      const b = document.createElement("button"); b.type = "button"; b.textContent = lettre;
      b.setAttribute("aria-label", `Choisir ${lettre}`); b.addEventListener("click", () => saisir(lettre));
      clavier.append(b);
    }
    const flecheDe = (mot) => mot.direction === "→" ? "droite" : "bas";
    function annoncer(texte, classe = "") { sortie(message, texte); message.className = `message ${classe}`; }
    function actualiserIndices() {
      listeIndices.replaceChildren(...partie.mots.map((mot) => {
        const b = document.createElement("button"); b.type = "button"; b.className = "indice";
        b.setAttribute("aria-pressed", String(mot.id === motActif));
        const fleche = document.createElement("span"); fleche.className = "fleche"; fleche.setAttribute("aria-hidden", "true"); fleche.textContent = mot.direction;
        const texte = document.createElement("span"); texte.textContent = mot.indice;
        const longueur = document.createElement("small"); longueur.textContent = `${mot.longueur} lettres`;
        texte.append(longueur); b.append(fleche, texte);
        b.addEventListener("click", () => choisirMot(mot.id, true));
        return b;
      }));
    }
    function afficher(focaliser = false) {
      grille.replaceChildren(); grille.style.gridTemplateColumns = `repeat(${partie.colonnes}, clamp(38px, 9vw, 50px))`;
      for (let i = 0; i < partie.cases.length; i++) {
        const c = partie.cases[i], cellule = c ? document.createElement("button") : document.createElement("span");
        if (!c) { cellule.className = "bloque"; cellule.setAttribute("aria-hidden", "true"); }
        else {
          const r = Math.floor(i / partie.colonnes), col = i % partie.colonnes;
          cellule.type = "button"; cellule.className = "case"; cellule.dataset.index = String(i); cellule.setAttribute("role", "gridcell");
          cellule.setAttribute("aria-label", `Ligne ${r + 1}, colonne ${col + 1}, ${c.lettre || "vide"}${c.departs.length ? `, départ ${c.departs.map(flecheDe).join(" et ")}` : ""}`);
          if (c.departs.length) cellule.dataset.fleche = c.departs[0];
          if (i === selection) cellule.classList.add("selection");
          if (erreurs.includes(i)) cellule.classList.add("erreur");
          cellule.textContent = c.lettre; cellule.disabled = terminee; cellule.tabIndex = i === selection || (selection < 0 && i === partie.cases.findIndex(Boolean)) ? 0 : -1;
          cellule.addEventListener("click", () => choisirCase(i, true));
          cellule.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); saisir(""); return; }
            if (/^[a-zA-ZÀ-ÿ]$/.test(e.key)) { e.preventDefault(); saisir(e.key); return; }
            if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
            e.preventDefault();
            const pos = motActif?.indices.indexOf(i) ?? -1;
            const sens = motActif?.direction === "→" && ["ArrowLeft", "ArrowRight"].includes(e.key)
              || motActif?.direction === "↓" && ["ArrowUp", "ArrowDown"].includes(e.key);
            if (sens && pos >= 0) {
              const suivante = pos + (["ArrowRight", "ArrowDown"].includes(e.key) ? 1 : -1);
              if (motActif.indices[suivante] !== undefined) { selection = motActif.indices[suivante]; afficher(true); }
            } else {
              const delta = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : e.key === "ArrowUp" ? -partie.colonnes : partie.colonnes;
              const suivante = i + delta;
              if (partie.cases[suivante]) choisirCase(suivante, true);
            }
          });
        }
        cellule.style.gridRow = String(Math.floor(i / partie.colonnes) + 1);
        cellule.style.gridColumn = String(i % partie.colonnes + 1);
        grille.append(cellule);
      }
      boutonsNiveau.forEach((b, i) => { b.disabled = i > progression.ouvert; b.setAttribute("aria-pressed", String(i === rang)); });
      actualiserIndices();
      if (focaliser && selection >= 0) grille.querySelector(`[data-index="${selection}"]`)?.focus();
    }
    function choisirCase(i, focaliser) {
      selection = i;
      const mots = partie.mots.filter((mot) => mot.indices.includes(i));
      if (!motActif || !motActif.indices.includes(i)) motActif = mots[0] ?? null;
      afficher(focaliser);
    }
    function choisirMot(id, focaliser) {
      motActif = partie.mots.find((m) => m.id === id) ?? null;
      selection = motActif?.indices.find((i) => partie.cases[i].lettre !== partie.cases[i].solution) ?? motActif?.indices[0] ?? -1;
      afficher(focaliser);
    }
    function terminer() {
      if (terminee) return;
      terminee = true;
      if (rang === progression.ouvert && progression.ouvert < M.NIVEAUX.length - 1) progression.ouvert++;
      try { stockage.ecrire("partie", progression); }
      catch { annoncer("Grille terminée, mais la progression ne peut pas être enregistrée sur cet appareil.", "ko"); }
      academie?.enregistrerPartie?.({ resultat: "victoire", niveau: M.NIVEAUX[rang].id });
      afficher();
      if (rang < M.NIVEAUX.length - 1) {
        const prochain = M.NIVEAUX[rang + 1].nom;
        annoncer(`Grille résolue ! 🎉 Le grade ${prochain} est débloqué.`, "ok");
        p.querySelector('[data-action="suivant"]').hidden = false;
      } else annoncer("Grille résolue ! 🎉 Tu es au niveau Pro, bravo !", "ok");
    }
    function saisir(valeur) {
      if (terminee || selection < 0) { annoncer("Choisis d’abord une case de la grille."); return; }
      M.placer(partie, selection, valeur); erreurs = [];
      const bilan = M.verifier(partie);
      if (bilan.resolu) { terminer(); return; }
      if (valeur && motActif) {
        const pos = motActif.indices.indexOf(selection);
        const cible = motActif.indices.slice(pos + 1).find((i) => partie.cases[i].lettre !== partie.cases[i].solution);
        if (cible !== undefined) selection = cible;
      }
      afficher(true);
      if (valeur) annoncer("Lettre placée. Continue à suivre les indices !", "ok");
    }
    function demarrer(i) {
      rang = i; partie = M.creerPartie(M.NIVEAUX[i].id); selection = partie.mots[0].indices[0];
      motActif = partie.mots[0]; erreurs = []; terminee = false;
      sortie(objectif, `${M.NIVEAUX[i].nom} — ${M.NIVEAUX[i].description}. Résous les ${partie.mots.length} mots de la grille.`);
      p.querySelector('[data-action="suivant"]').hidden = true;
      afficher(); annoncer("Choisis un indice ou une case, puis entre la première lettre.");
    }
    p.querySelector('[data-action="verifier"]').addEventListener("click", () => {
      const bilan = M.verifier(partie); erreurs = bilan.erreurs; afficher();
      if (bilan.resolu) terminer();
      else annoncer(bilan.erreurs.length ? `${bilan.erreurs.length} lettre${bilan.erreurs.length > 1 ? "s" : ""} à corriger.` : `${bilan.vides.length} case${bilan.vides.length > 1 ? "s" : ""} encore vide${bilan.vides.length > 1 ? "s" : ""}.`, bilan.erreurs.length ? "ko" : "");
    });
    p.querySelector('[data-action="indice"]').addEventListener("click", () => {
      if (terminee) return;
      const i = M.revelerIndice(partie, selection); if (i === null) { annoncer("Il n’y a plus de lettre à révéler."); return; }
      selection = i; erreurs = []; afficher();
      annoncer(`Indice : cette case contient ${partie.cases[i].solution}.`, "ok");
      if (M.verifier(partie).resolu) terminer();
    });
    p.querySelector('[data-action="effacer"]').addEventListener("click", () => saisir(""));
    p.querySelector('[data-action="recommencer"]').addEventListener("click", () => demarrer(rang));
    p.querySelector('[data-action="suivant"]').addEventListener("click", () => demarrer(Math.min(rang + 1, progression.ouvert)));
    demarrer(rang);
    jeu.demarrer = demarrer;
  } });
  let academie = null;
  enregistrerOnglet({ id: "academie", type: "parcours", titre: "Académie", rendu(p) {
    const parcours = JSON.parse(document.getElementById("parcours-mots-fleches").textContent);
    const progressionJeu = ProgressionJeux.creer(parcours);
    academie = VueAcademie.monter({
      panneau: p, progression: progressionJeu, stockage, stockageDisponible: stockage.disponible, ouvrirOnglet,
      embleme: (symbole) => Object.assign(document.createElement("span"), { textContent: symbole })
    });
  } });
  enregistrerOnglet({ id: "mise-en-situation", titre: "Défi", rendu(p) {
    p.append(document.getElementById("tpl-defis").content.cloneNode(true));
    p.querySelectorAll("[data-reponse]").forEach((b) => b.addEventListener("click", () => {
      const ok = b.dataset.reponse === "soleil";
      sortie(p.querySelector('[data-sortie="defi"]'), ok ? "✓ Exact ! Le soleil éclaire la Terre pendant le jour." : "Pas tout à fait : cherche l’astre visible pendant la journée.");
      p.querySelector('[data-sortie="defi"]').className = `message ${ok ? "ok" : "ko"}`;
    }));
  } });
  enregistrerOnglet({ id: "self-test", titre: "Auto-évaluation", actif: false, rendu() {} });
  const actifs = registre.filter((o) => o.actif !== false);
  for (const [i, o] of actifs.entries()) {
    const b = document.createElement("button"), section = document.createElement("section");
    b.type = "button"; b.id = `onglet-${o.id}`; b.setAttribute("role", "tab"); b.setAttribute("aria-controls", `panneau-${o.id}`);
    const actif = o.id === "application";
    b.setAttribute("aria-selected", String(actif)); b.tabIndex = actif ? 0 : -1; b.textContent = o.titre; b.dataset.id = o.id;
    section.id = `panneau-${o.id}`; section.setAttribute("role", "tabpanel"); section.setAttribute("aria-labelledby", b.id); section.tabIndex = 0; section.hidden = !actif;
    o.rendu(section); onglets.append(b); panneaux.append(section);
    b.addEventListener("click", () => ouvrirOnglet(o.id));
    b.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault(); const prochain = (i + (e.key === "ArrowRight" ? 1 : -1) + actifs.length) % actifs.length;
      ouvrirOnglet(actifs[prochain].id); onglets.children[prochain].focus();
    });
  }
  ouvrirOnglet = (id) => actifs.forEach((o) => {
    const actif = o.id === id, b = onglets.querySelector(`[data-id="${o.id}"]`), p = document.getElementById(`panneau-${o.id}`);
    b.setAttribute("aria-selected", String(actif)); b.tabIndex = actif ? 0 : -1; p.hidden = !actif;
  });
})();
</script>
