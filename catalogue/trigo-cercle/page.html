<script id="trophees" data-inclure="gabarit/jeux/trophees.js">
// Pont local des pages autonomes : aucun réseau, et aucun accès au stockage du parent.
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && window.parent !== window) {
    window.parent.postMessage({ type: "kermiclab:chat:fermer" }, "*");
  }
});

const Trophees = (() => {
  function monter({ restaurer, resumer }) {
    if (window.parent === window) return () => {};
    const meta = JSON.parse(document.getElementById("kermiclab-meta").textContent);
    const module = meta.id;
    const originesAutorisees = Array.isArray(meta.allowedParentOrigins) ? meta.allowedParentOrigins : null;
    let origineParent = null;
    let pret = false;
    const publier = () => {
      if (pret) window.parent.postMessage({ type: "kermiclab:trophees:progres", module, ...resumer() }, origineParent);
    };
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent || e.data?.type !== "kermiclab:trophees:charger" || e.data.module !== module || pret) return;
      let origine;
      try { origine = new URL(e.origin); } catch { return; }
      if (!["https:", "http:"].includes(origine.protocol) || origine.origin !== e.origin ||
          (meta.parentOrigin && meta.parentOrigin !== e.origin) ||
          (originesAutorisees && !originesAutorisees.includes(e.origin))) return;
      // L'identité du parent et son origine viennent du message, même sans Referer.
      origineParent = e.origin;
      if (e.data.etat !== null) restaurer(e.data.etat);
      pret = true;
      publier();
    });
    // Seul l'identifiant du module est annoncé avant de connaître l'origine du parent.
    window.parent.postMessage({ type: "kermiclab:trophees:pret", module }, meta.parentOrigin || "*");
    return publier;
  }
  return Object.freeze({ monter });
})();
</script>
<script id="evenements" data-inclure="gabarit/jeux/evenements.js">
// Contrat d'événements pédagogiques v1 (ADR 0025) : une page autonome n'a pas de réseau (connect-src 'none').
// Elle signale ce qui se passe à la page qui l'affiche (tableau de bord), par postMessage, après une poignée de main,
// et seulement à une origine déclarée dans ses métadonnées (`allowedParentOrigins`, écrite par le Worker à partir de
// ORIGINES_AUTORISEES, ou `parentOrigin`). Sans origine déclarée, la page n'émet rien.
//   page → parent  { type: "kermiclab:evenements:pret", v: 1, notion }            (envoyé à chaque origine autorisée)
//   parent → page  { type: "kermiclab:evenements:ecouter", v: 1, notion }        (fixe l'origine du parent)
//   page → parent  { type: "kermiclab:evenement", v: 1, notion, version, evenement, … }   vers cette origine seulement
// Événements : demarre | indice (exercice, rang) | reponse (exercice, correct, essai) | termine.
// Jamais de texte saisi par l'élève, ni d'horodatage précis : le parent date à la journée.
const Evenements = (() => {
  const VERSION_CONTRAT = 1;
  const TYPES = ["demarre", "indice", "reponse", "termine"];
  const ID = /^[a-z0-9][a-z0-9-]{0,39}$/;
  const MAX_FILE = 50;
  const isole = window.parent === window;
  const meta = JSON.parse(document.getElementById("kermiclab-meta").textContent);
  const notion = meta.id;
  const file = [];
  let origineParent = null;
  let demarre = false;
  let termine = false;

  const entier = (v, max) => Number.isInteger(v) && v >= 1 && v <= max;
  /** Construit un événement conforme au schéma v1, ou null : un événement invalide n'est jamais envoyé. */
  function construire(evenement, donnees = {}) {
    if (!TYPES.includes(evenement)) return null;
    const ev = { type: "kermiclab:evenement", v: VERSION_CONTRAT, notion, version: meta.version, evenement };
    if (evenement === "indice" || evenement === "reponse") {
      if (!ID.test(String(donnees.exercice ?? ""))) return null;
      ev.exercice = donnees.exercice;
    }
    if (evenement === "indice") {
      if (!entier(donnees.rang, 10)) return null;
      ev.rang = donnees.rang;
    }
    if (evenement === "reponse") {
      if (typeof donnees.correct !== "boolean" || !entier(donnees.essai, 99)) return null;
      ev.correct = donnees.correct;
      ev.essai = donnees.essai;
    }
    return ev;
  }

  function envoyer(ev) {
    if (origineParent) window.parent.postMessage(ev, origineParent);
    else if (file.length < MAX_FILE) file.push(ev);
  }

  /** Émet un événement ; « demarre » et « termine » ne sont émis qu'une fois par ouverture de la page. */
  function emettre(evenement, donnees) {
    if (isole) return;
    if (evenement === "demarre") { if (demarre) return; demarre = true; }
    if (evenement === "termine") { if (termine) return; termine = true; }
    const ev = construire(evenement, donnees);
    if (ev) envoyer(ev);
  }

  if (!isole) {
    const estOrigineValide = (o) => {
      try {
        const u = new URL(o);
        return ["https:", "http:"].includes(u.protocol) && u.origin === o;
      } catch {
        return false;
      }
    };

    const originesAutorisees = new Set();
    if (estOrigineValide(meta.parentOrigin)) originesAutorisees.add(meta.parentOrigin);
    if (Array.isArray(meta.allowedParentOrigins)) {
      for (const o of meta.allowedParentOrigins) {
        if (estOrigineValide(o)) originesAutorisees.add(o);
      }
    }

    if (originesAutorisees.size > 0) {
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent || e.data?.type !== "kermiclab:evenements:ecouter" || e.data.v !== VERSION_CONTRAT ||
            e.data.notion !== notion || origineParent) return;
        let origine;
        try { origine = new URL(e.origin); } catch { return; }
        if (!["https:", "http:"].includes(origine.protocol) || origine.origin !== e.origin ||
            !originesAutorisees.has(e.origin)) return;
        origineParent = e.origin;
        for (const ev of file.splice(0)) window.parent.postMessage(ev, origineParent);
      });
      // Annonce à chaque origine autorisée : seule celle du parent réel la reçoit (les autres sont ignorées par le
      // navigateur). Ainsi le tableau de bord fonctionne sur chacun de ses domaines, pas seulement le premier.
      for (const origine of originesAutorisees) {
        window.parent.postMessage({ type: "kermiclab:evenements:pret", v: VERSION_CONTRAT, notion }, origine);
      }
    }
  }

  return Object.freeze({ emettre, construire, VERSION_CONTRAT });
})();
</script>

<body>
<header>
  <div>
    <h1>Le cercle trigonométrique</h1>
    <div class="meta">trigo-cercle · v1.0.0</div>
  </div>
  <button id="connexion" class="action" type="button" hidden>Se connecter</button>
</header>
<nav role="tablist" aria-label="Onglets de la page" id="onglets"></nav>
<main id="panneaux"></main>
<footer>Kermiclab · page autonome, lisible hors ligne. Ne partage jamais ton nom, ton adresse, ton école ou ta photo.</footer>

<template id="tpl-explication">
  <p>Une seule page pour toute la notion : ouvre les niveaux dans l'ordre que tu veux, selon ta curiosité.</p>
  <details open>
    <summary>Intuition <span class="niveau">– pour démarrer</span></summary>
    <p>Imagine une grande roue de rayon 1. Une nacelle part tout à droite et tourne dans le sens inverse des aiguilles d'une montre. À chaque instant, on se demande : <em>de combien la nacelle est-elle à droite du centre ?</em> C'est le <strong style="color:var(--cos)">cosinus</strong>. <em>De combien est-elle au-dessus du centre ?</em> C'est le <strong style="color:var(--sin)">sinus</strong>.</p>
  </details>
  <details>
    <summary>Dans le triangle rectangle <span class="niveau">– collège</span></summary>
    <p>Dans un triangle rectangle, pour un angle aigu θ : cos θ = côté adjacent ÷ hypoténuse, sin θ = côté opposé ÷ hypoténuse, tan θ = opposé ÷ adjacent. Moyen mnémotechnique : <strong>SOH CAH TOA</strong>.</p>
  </details>
  <details>
    <summary>Sur le cercle unité <span class="niveau">– seconde</span></summary>
    <p>Sur un cercle de centre O et de rayon 1, le point M associé à l'angle θ a pour coordonnées <strong>(cos θ ; sin θ)</strong>. Comme M est sur le cercle, on a toujours <strong>cos² θ + sin² θ = 1</strong>, et les deux valeurs restent entre −1 et 1.</p>
    <p>Angles remarquables : sin 30° = 1/2, cos 60° = 1/2, sin 45° = cos 45° = √2/2, cos 30° = sin 60° = √3/2.</p>
  </details>
  <details>
    <summary>Radians et longueur d'arc <span class="niveau">– première / terminale</span></summary>
    <p>Sur un cercle de rayon r, un angle θ (en radians) intercepte un arc de longueur <strong>s = r θ</strong>. Sur le cercle unité, l'angle en radians <em>est</em> la longueur de l'arc parcouru. Un tour complet vaut 2π rad = 360°, donc 180° = π rad.</p>
    <p>Pour tout réel x : cos(x + 2π) = cos x, sin(−x) = −sin x, cos(π − x) = −cos x.</p>
  </details>
</template>

<template id="tpl-application">
  <p>Fais glisser le point sur le cercle (ou utilise le curseur) et observe le cosinus et le sinus.</p>
  <svg viewBox="-1.35 -1.35 2.7 2.7" role="img" aria-label="Cercle trigonométrique interactif" data-cercle="application"></svg>
  <label>Angle : <span data-sortie="deg"></span>
    <input type="range" min="0" max="360" step="1" value="30" data-entree="angle">
  </label>
  <div class="valeurs">
    <div>θ en radians<b data-sortie="rad"></b></div>
    <div style="color:var(--cos)">cos θ<b data-sortie="cos"></b></div>
    <div style="color:var(--sin)">sin θ<b data-sortie="sin"></b></div>
    <div>tan θ<b data-sortie="tan"></b></div>
  </div>
</template>

<template id="tpl-mise-en-situation">
  <p><strong>Défi de la grande roue.</strong> Place la nacelle à l'angle demandé en touchant le cercle. Plus tu es précis, plus tu gagnes de points !</p>
  <p class="score"><span>Défi : <span data-sortie="cible"></span></span><span>Points : <span data-sortie="points">0</span></span><span>Série : <span data-sortie="serie">0</span></span><span>Record : <span data-sortie="record">0</span></span></p>
  <svg viewBox="-1.35 -1.35 2.7 2.7" role="img" aria-label="Cercle du défi : touche le cercle pour placer la nacelle" data-cercle="defi"></svg>
  <p class="retour" data-sortie="retour" aria-live="polite"></p>
  <button class="action" type="button" data-action="nouveau-defi">Nouveau défi</button>
</template>

<script>
(() => {
  "use strict";
  const META = JSON.parse(document.getElementById("kermiclab-meta").textContent);
  const CONFIG = { connexionActive: false, stockage: "local" };

  /* ---------- Stockage abstrait : local (actif) / distant (stub) ---------- */
  const Stockage = {
    local: {
      lire(cle) { try { return JSON.parse(localStorage.getItem(`kermiclab:${META.id}:${cle}`)); } catch { return null; } },
      ecrire(cle, valeur) { try { localStorage.setItem(`kermiclab:${META.id}:${cle}`, JSON.stringify(valeur)); } catch { /* stockage indisponible */ } }
    },
    distant: {
      // Phase 4 : appellera le service web avec META.id et l'identifiant utilisateur.
      lire() { return null; },
      ecrire() { /* non activé dans le MVP */ }
    }
  };
  const stockage = Stockage[CONFIG.stockage];
  // Contrat d'événements pédagogiques v1 (ADR 0025, gabarit/jeux/evenements.js) : sans effet hors du tableau de bord.
  const signaler = typeof Evenements === "undefined" ? () => {} : Evenements.emettre;
  signaler("demarre");

  /* ---------- Registre des onglets ---------- */
  const registre = [];
  function enregistrerOnglet(def) { registre.push({ actif: true, ...def }); }

  /* ---------- Outils du cercle ---------- */
  const NS = "http://www.w3.org/2000/svg";
  const el = (nom, attrs, parent) => { const n = document.createElementNS(NS, nom); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const arrondi = (x) => (Math.abs(x) < 5e-4 ? 0 : x).toFixed(3).replace(".", ",");
  function dessinerCercle(svg) {
    el("line", { x1: -1.3, y1: 0, x2: 1.3, y2: 0, stroke: "currentColor", "stroke-width": 0.01, opacity: 0.4 }, svg);
    el("line", { x1: 0, y1: -1.3, x2: 0, y2: 1.3, stroke: "currentColor", "stroke-width": 0.01, opacity: 0.4 }, svg);
    el("circle", { cx: 0, cy: 0, r: 1, fill: "none", stroke: "currentColor", "stroke-width": 0.015 }, svg);
    const cos = el("line", { stroke: "var(--cos)", "stroke-width": 0.03 }, svg);
    const sin = el("line", { stroke: "var(--sin)", "stroke-width": 0.03 }, svg);
    const rayon = el("line", { x1: 0, y1: 0, stroke: "currentColor", "stroke-width": 0.015 }, svg);
    const point = el("circle", { r: 0.06, fill: "var(--accent)" }, svg);
    return (theta) => {
      const x = Math.cos(theta), y = -Math.sin(theta);
      cos.setAttribute("x1", 0); cos.setAttribute("y1", 0); cos.setAttribute("x2", x); cos.setAttribute("y2", 0);
      sin.setAttribute("x1", x); sin.setAttribute("y1", 0); sin.setAttribute("x2", x); sin.setAttribute("y2", y);
      rayon.setAttribute("x2", x); rayon.setAttribute("y2", y);
      point.setAttribute("cx", x); point.setAttribute("cy", y);
    };
  }
  function angleDepuisEvenement(svg, ev) {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    let a = Math.atan2(-p.y, p.x); if (a < 0) a += 2 * Math.PI; return a;
  }

  /* ---------- Onglet explication ---------- */
  enregistrerOnglet({ id: "explication", type: "explication", titre: "Explication",
    rendu(panneau) { panneau.appendChild(document.getElementById("tpl-explication").content.cloneNode(true)); } });

  /* ---------- Onglet application ---------- */
  enregistrerOnglet({ id: "application", type: "application", titre: "Application",
    rendu(panneau) {
      panneau.appendChild(document.getElementById("tpl-application").content.cloneNode(true));
      const svg = panneau.querySelector("svg"), curseur = panneau.querySelector("[data-entree=angle]");
      const sortie = (n) => panneau.querySelector(`[data-sortie=${n}]`);
      const maj = dessinerCercle(svg);
      const afficher = (deg) => {
        const t = deg * Math.PI / 180; maj(t); curseur.value = deg;
        sortie("deg").textContent = `${deg}°`; sortie("rad").textContent = arrondi(t);
        sortie("cos").textContent = arrondi(Math.cos(t)); sortie("sin").textContent = arrondi(Math.sin(t));
        sortie("tan").textContent = Math.abs(Math.cos(t)) < 1e-9 ? "non définie" : arrondi(Math.tan(t));
      };
      curseur.addEventListener("input", () => afficher(Number(curseur.value)));
      let glisse = false;
      svg.addEventListener("pointerdown", (e) => { glisse = true; svg.setPointerCapture(e.pointerId); afficher(Math.round(angleDepuisEvenement(svg, e) * 180 / Math.PI) % 360); });
      svg.addEventListener("pointermove", (e) => { if (glisse) afficher(Math.round(angleDepuisEvenement(svg, e) * 180 / Math.PI) % 360); });
      svg.addEventListener("pointerup", () => { glisse = false; });
      afficher(30);
    } });

  /* ---------- Onglet mise en situation (gamification instantanée) ---------- */
  const DEFIS = [
    { libelle: "30°", rad: Math.PI / 6 }, { libelle: "45°", rad: Math.PI / 4 }, { libelle: "60°", rad: Math.PI / 3 },
    { libelle: "90°", rad: Math.PI / 2 }, { libelle: "120°", rad: 2 * Math.PI / 3 }, { libelle: "π rad", rad: Math.PI },
    { libelle: "3π/2 rad", rad: 3 * Math.PI / 2 }, { libelle: "5π/6 rad", rad: 5 * Math.PI / 6 },
    { libelle: "cos θ = 0,5 et sin θ > 0", rad: Math.PI / 3 }, { libelle: "sin θ = −1", rad: 3 * Math.PI / 2 }
  ];
  enregistrerOnglet({ id: "mise-en-situation", type: "mise-en-situation", titre: "Défi",
    rendu(panneau) {
      panneau.appendChild(document.getElementById("tpl-mise-en-situation").content.cloneNode(true));
      const svg = panneau.querySelector("svg"), sortie = (n) => panneau.querySelector(`[data-sortie=${n}]`);
      const maj = dessinerCercle(svg);
      let points = 0, serie = 0, indice = 0, joue = false;
      // Chaque cible du défi est un exercice « defi-N » du contrat d'événements ; toutes réussies → « termine ».
      const essais = new Map(), reussis = new Set();
      let record = Number(stockage.lire("record")) || 0;
      const publier = Trophees.monter({
        restaurer(brut) {
          record = Number.isSafeInteger(brut?.record) && brut.record >= 0 ? brut.record : 0;
          sortie("record").textContent = record;
        },
        resumer: () => ({ genre: "labs", etat: { record }, record, badges: [] })
      });
      sortie("record").textContent = record;
      const nouveau = () => { indice = (indice + 1 + Math.floor(Math.random() * (DEFIS.length - 1))) % DEFIS.length; joue = false; sortie("cible").textContent = DEFIS[indice].libelle; sortie("retour").textContent = ""; sortie("retour").className = "retour"; maj(0); };
      svg.addEventListener("pointerdown", (e) => {
        if (joue) return;
        const a = angleDepuisEvenement(svg, e); maj(a); joue = true;
        let ecart = Math.abs(a - DEFIS[indice].rad); ecart = Math.min(ecart, 2 * Math.PI - ecart);
        const ecartDeg = Math.round(ecart * 180 / Math.PI);
        const gain = ecartDeg <= 5 ? 10 : ecartDeg <= 15 ? 5 : 0;
        serie = gain ? serie + 1 : 0; points += gain + (gain && serie >= 3 ? 5 : 0);
        sortie("points").textContent = points; sortie("serie").textContent = serie;
        const exercice = `defi-${indice + 1}`, essai = Math.min((essais.get(exercice) ?? 0) + 1, 99);
        essais.set(exercice, essai);
        signaler("reponse", { exercice, correct: gain > 0, essai });
        if (!gain) signaler("indice", { exercice, rang: 1 });
        else { reussis.add(exercice); if (reussis.size === DEFIS.length) signaler("termine"); }
        sortie("retour").textContent = gain ? `Bravo ! Écart de ${ecartDeg}° : +${gain} points${serie >= 3 ? " (+5 bonus de série)" : ""}.` : `Écart de ${ecartDeg}°. Indice : 0° est à droite, on tourne dans le sens inverse des aiguilles d'une montre.`;
        sortie("retour").className = gain ? "retour ok" : "retour ko";
        if (points > record) { record = points; stockage.ecrire("record", record); sortie("record").textContent = record; publier(); }
      });
      panneau.querySelector("[data-action=nouveau-defi]").addEventListener("click", nouveau);
      indice = -1; nouveau();
    } });

  /* ---------- Onglet self-test (prévu phase 2, désactivé) ---------- */
  enregistrerOnglet({ id: "self-test", type: "self-test", titre: "Auto-évaluation", actif: false,
    questions: [], rendu() {} });

  /* ---------- Socle : construction des onglets ---------- */
  const liste = document.getElementById("onglets"), panneaux = document.getElementById("panneaux");
  const actifs = registre.filter((o) => o.actif);
  const boutons = actifs.map((o, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.id = `onglet-${o.id}`; b.textContent = o.titre;
    b.setAttribute("aria-controls", `panneau-${o.id}`); b.dataset.onglet = o.id;
    const p = document.createElement("section");
    p.setAttribute("role", "tabpanel"); p.id = `panneau-${o.id}`; p.setAttribute("aria-labelledby", b.id); p.tabIndex = 0;
    o.rendu(p); panneaux.appendChild(p); liste.appendChild(b);
    b.addEventListener("click", () => choisir(i));
    return b;
  });
  function choisir(i) {
    boutons.forEach((b, j) => {
      const sel = i === j; b.setAttribute("aria-selected", String(sel)); b.tabIndex = sel ? 0 : -1;
      document.getElementById(b.getAttribute("aria-controls")).hidden = !sel;
    });
    stockage.ecrire("onglet", actifs[i].id);
  }
  liste.addEventListener("keydown", (e) => {
    const i = boutons.indexOf(document.activeElement); if (i < 0) return;
    const n = e.key === "ArrowRight" ? (i + 1) % boutons.length : e.key === "ArrowLeft" ? (i - 1 + boutons.length) % boutons.length : -1;
    if (n >= 0) { choisir(n); boutons[n].focus(); e.preventDefault(); }
  });
  const memo = actifs.findIndex((o) => o.id === stockage.lire("onglet"));
  choisir(memo >= 0 ? memo : 0);

  document.getElementById("connexion").hidden = !CONFIG.connexionActive;
  window.kermiclab = { META, registre, CONFIG };
})();
</script>
