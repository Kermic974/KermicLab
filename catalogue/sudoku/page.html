<style>

* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.5 system-ui, sans-serif; }

.case:nth-child(3n) { border-right: 2px solid var(--texte); }

<script id="trophees" data-inclure="gabarit/jeux/trophees.js">
// Pont local des pages autonomes : aucun réseau, et aucun accès au stockage du parent.
const Trophees = (() => {
  function monter({ restaurer, resumer }) {
    if (window.parent === window) return () => {};
    const module = JSON.parse(document.getElementById("kermiclab-meta").textContent).id;
    let pret = false;
    const publier = () => {
      if (pret) window.parent.postMessage({ type: "kermiclab:trophees:progres", module, ...resumer() }, "*");
    };
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent || e.data?.type !== "kermiclab:trophees:charger" || e.data.module !== module || pret) return;
      if (e.data.etat !== null) restaurer(e.data.etat);
      pret = true;
      publier();
    });
    window.parent.postMessage({ type: "kermiclab:trophees:pret", module }, "*");
    return publier;
  }
  return Object.freeze({ monter });
})();
</script>

<template id="tpl-regles">
  <section class="carte">
    <h2>Le but du jeu</h2>
    <p>Remplis les cases vides avec les chiffres de 1 à 9. Chaque chiffre doit apparaître une seule fois dans chaque ligne, chaque colonne et chaque carré de 3 × 3.</p>
    <h3>Comment commencer ?</h3>
    <p>Choisis une case vide, puis un chiffre. Cherche d'abord une ligne, une colonne ou un carré où il ne manque qu'un seul chiffre. Tu peux aussi cliquer une case puis taper un chiffre au clavier.</p>
    <p>Les chiffres déjà imprimés ne peuvent pas être changés. Le bouton <strong>Indice</strong> révèle une case, et <strong>Vérifier</strong> souligne les erreurs sans effacer ta grille.</p>

      <button class="action" data-action="nouvelle">Nouvelle grille</button>
      <button class="secondaire" data-action="indice">💡 Indice</button>

    <p class="doux" data-sortie="progression"></p>
    <div class="grille-aide" data-zone="grades"></div>
  </section>

<template id="tpl-defis">
  <section class="carte">
    <h2>Les réflexes du champion</h2>
    <div class="grille-aide">
      <article class="grade"><h3>1. Le chiffre manquant</h3><p>Dans une ligne, note les chiffres absents. Si une seule case peut contenir le 7, le 7 est trouvé.</p></article>
      <article class="grade"><h3>2. Regarde les trois directions</h3><p>Pour chaque case vide, vérifie sa ligne, sa colonne et son carré de 3 × 3. Un chiffre déjà présent est éliminé.</p></article>
      <article class="grade"><h3>3. Un seul endroit possible</h3><p>Un chiffre peut avoir plusieurs cases possibles dans une région. Mais s'il n'a qu'un seul emplacement, pose-le là.</p></article>
      <article class="grade"><h3>4. Les paires</h3><p>Si deux cases d'une région ne peuvent contenir que les mêmes deux chiffres, ces chiffres sont réservés à ces cases.</p></article>
      <article class="grade"><h3>5. Le niveau pro</h3><p>Répète ces observations après chaque chiffre posé. Une déduction peut en débloquer une autre : pas besoin de deviner.</p></article>
    </div>
    <p><button class="action" data-action="defi">Lancer un défi débutant</button></p>
  </section>
</template>

<script id="moteur-sudoku">
const MoteurSudoku = (() => {
  const ETAPES = [
    { id: "novice", nom: "Novice", icone: "🌱", description: "Repère les chiffres déjà placés et complète une case facile.", vides: 30, conseil: "Commence par une ligne ou un carré qui contient déjà beaucoup de chiffres." },
    { id: "debutant", nom: "Débutant", icone: "🔎", description: "Cherche un chiffre qui n'a qu'une place possible.", vides: 40, conseil: "Pour chaque chiffre manquant, élimine les cases interdites par la ligne, la colonne et le carré." },
    { id: "intermediaire", nom: "Intermédiaire", icone: "🧩", description: "Enchaîne plusieurs déductions sans faire de pari.", vides: 48, conseil: "Après chaque chiffre placé, recommence les vérifications dans les trois directions." },
    { id: "avance", nom: "Avancé", icone: "🧠", description: "Utilise les candidats et les paires pour débloquer la grille.", vides: 54, conseil: "Deux cases d'une région qui partagent les mêmes deux candidats forment une paire." },
    { id: "pro", nom: "Pro", icone: "🏆", description: "Résous une grille dense avec patience et méthode.", vides: 56, conseil: "Ne devine pas : chaque chiffre doit être justifié par une ligne, une colonne ou un carré." }
  ];
  const BIT = (n) => 1 << n;
  const melanger = (valeurs, hasard) => {
    const resultat = [...valeurs];
    for (let i = resultat.length - 1; i > 0; i--) {
      const j = Math.min(i, Math.max(0, Math.floor(hasard() * (i + 1))));
      [resultat[i], resultat[j]] = [resultat[j], resultat[i]];
    }
    return resultat;
  };
  const permutation = (hasard) => melanger([0, 1, 2], hasard).flatMap((g) => melanger([0, 1, 2], hasard).map((r) => g * 3 + r));
  function compterSolutions(grille, limite = 2) {
    const cases = [...grille], lignes = Array(9).fill(0), colonnes = Array(9).fill(0), carres = Array(9).fill(0);
    for (let i = 0; i < 81; i++) {
      const n = cases[i];
      if (!n) continue;
      if (!Number.isInteger(n) || n < 1 || n > 9) return 0;
      const r = Math.floor(i / 9), c = i % 9, b = Math.floor(r / 3) * 3 + Math.floor(c / 3), bit = BIT(n);
      if ((lignes[r] | colonnes[c] | carres[b]) & bit) return 0;
      lignes[r] |= bit; colonnes[c] |= bit; carres[b] |= bit;
    }
    let total = 0;
    function chercher() {
      if (total >= limite) return;
      let meilleur = -1, choix = 0, minimum = 10;
      for (let i = 0; i < 81; i++) {
        if (cases[i]) continue;
        const r = Math.floor(i / 9), c = i % 9, b = Math.floor(r / 3) * 3 + Math.floor(c / 3);
        const candidats = 0x3fe & ~(lignes[r] | colonnes[c] | carres[b]);
        const nombre = candidats.toString(2).replace(/0/g, "").length;
        if (nombre < minimum) { meilleur = i; choix = candidats; minimum = nombre; if (nombre < 2) break; }
      }
      if (meilleur < 0) { total++; return; }
      if (!choix) return;
      const r = Math.floor(meilleur / 9), c = meilleur % 9, b = Math.floor(r / 3) * 3 + Math.floor(c / 3);
      for (let n = 1; n <= 9 && total < limite; n++) {
        const bit = BIT(n);
        if (!(choix & bit)) continue;
        cases[meilleur] = n; lignes[r] |= bit; colonnes[c] |= bit; carres[b] |= bit;
        chercher();
        cases[meilleur] = 0; lignes[r] &= ~bit; colonnes[c] &= ~bit; carres[b] &= ~bit;
      }
    }
    chercher();
    return total;
  }
  function creerPartie(id, hasard = Math.random) {
    const niveau = ETAPES.find((e) => e.id === id);
    if (!niveau) throw new Error(`niveau inconnu : ${id}`);
    for (let tentative = 0; tentative < 40; tentative++) {
      const rangs = permutation(hasard), colonnes = permutation(hasard), chiffres = melanger([1, 2, 3, 4, 5, 6, 7, 8, 9], hasard);
      const solution = Array.from({ length: 81 }, (_, i) => {
        const r = rangs[Math.floor(i / 9)], c = colonnes[i % 9];
        return chiffres[(r * 3 + Math.floor(r / 3) + c) % 9];
      });
      const depart = [...solution];
      for (const i of melanger(Array.from({ length: 81 }, (_, n) => n), hasard)) {
        if (depart.filter(Boolean).length <= 81 - niveau.vides) break;
        const valeur = depart[i];
        depart[i] = 0;
        if (compterSolutions(depart) !== 1) depart[i] = valeur;
      }
      if (depart.filter(Boolean).length !== 81 - niveau.vides) continue;
      return { niveau: id, solution, depart, grille: [...depart], indicesFixes: depart.map((n, i) => n ? i : -1).filter((i) => i >= 0), aides: 0 };
    }
    throw new Error(`impossible de générer une grille ${niveau.nom} avec ${niveau.vides} cases vides`);
  }
  function peutPlacer(partie, index, valeur) {
    if (!Number.isInteger(index) || index < 0 || index >= 81 || !Number.isInteger(valeur) || valeur < 1 || valeur > 9) return false;
    const r = Math.floor(index / 9), c = index % 9, b = Math.floor(r / 3) * 3 + Math.floor(c / 3);
    for (let i = 0; i < 81; i++) {
      if (i === index || partie.grille[i] !== valeur) continue;
      const ri = Math.floor(i / 9), ci = i % 9, bi = Math.floor(ri / 3) * 3 + Math.floor(ci / 3);
      if (ri === r || ci === c || bi === b) return false;
    }
    return true;
  }
  function placer(partie, index, valeur) {
    if (!Number.isInteger(index) || index < 0 || index >= 81 || !Number.isInteger(valeur) || valeur < 0 || valeur > 9) return "invalide";
    if (partie.indicesFixes.includes(index)) return "fixe";
    if (valeur && !peutPlacer(partie, index, valeur)) return "conflit";
    partie.grille[index] = valeur;
    return "ok";
  }
  function verifier(partie) {
    const vides = [], erreurs = [];
    for (let i = 0; i < 81; i++) {
      if (!partie.grille[i]) vides.push(i);
      else if (partie.grille[i] !== partie.solution[i]) erreurs.push(i);
    }
    return { vides, erreurs, resolu: vides.length === 0 && erreurs.length === 0 };
  }
  function revelerIndice(partie, hasard = Math.random) {
    const candidats = partie.grille.map((n, i) => !n && !partie.indicesFixes.includes(i) ? i : -1).filter((i) => i >= 0);
    if (!candidats.length) return null;
    const index = candidats[Math.min(candidats.length - 1, Math.floor(hasard() * candidats.length))];
    partie.grille[index] = partie.solution[index]; partie.aides++;
    return index;
  }
  return Object.freeze({ ETAPES, compterSolutions, creerPartie, peutPlacer, placer, verifier, revelerIndice });
})();
</script>
<script>
(() => {
  const M = MoteurSudoku, registre = [];
  function enregistrerOnglet(def) { registre.push(def); }
  const panneaux = document.getElementById("panneaux"), onglets = document.getElementById("onglets");
  const stockage = (() => {
    try { return {
      lire() { try { return JSON.parse(localStorage.getItem("kermiclab:sudoku") || '{"ouvert":0}'); } catch { return { ouvert: 0 }; } },
      ecrire(x) { try { localStorage.setItem("kermiclab:sudoku", JSON.stringify(x)); } catch { /* iframe isolée : le parent conserve la progression */ } publier(); }
    }; }
    catch { return { lire: () => ({ ouvert: 0 }), ecrire() {} }; }
  })();
  let progression = stockage.lire();
  if (!Number.isInteger(progression.ouvert)) progression = { ouvert: 0 };
  progression.ouvert = Math.max(0, Math.min(M.ETAPES.length - 1, progression.ouvert));
  const publier = Trophees.monter({
    restaurer(brut) {
      progression.ouvert = Number.isInteger(brut?.ouvert) ? Math.max(0, Math.min(M.ETAPES.length - 1, brut.ouvert)) : 0;
      progression.termine = brut?.termine === true;
      actualiserAcademie();
      jeu.demarrer(progression.ouvert);
    },
    resumer: () => ({ genre: "jeux", etat: progression, grades: progression.termine ? M.ETAPES.length : progression.ouvert,
      gradesTotal: M.ETAPES.length, badges: M.ETAPES.map((e, i) => ({
        id: String(i), nom: e.nom, description: e.nom, icone: e.icone, actuel: i < progression.ouvert || progression.termine ? 1 : 0,
        cible: 1, obtenu: i < progression.ouvert || progression.termine === true
      })) })
  });
  let ouvrirOnglet = () => {};
  const sortie = (el, texte) => { el.textContent = texte; };

  enregistrerOnglet({ id: "explication", titre: "Règles", rendu(p) { p.append(document.getElementById("tpl-regles").content.cloneNode(true)); } });
  enregistrerOnglet({ id: "application", titre: "Jouer", rendu(p) {
    p.append(document.getElementById("tpl-jeu").content.cloneNode(true));
    const zoneNiveaux = p.querySelector('[data-zone="niveaux"]'), grille = p.querySelector('[data-zone="grille"]'), clavier = p.querySelector('[data-zone="clavier"]');
    const message = p.querySelector('[data-sortie="message"]'), objectif = p.querySelector('[data-sortie="objectif"]');
    let rang = progression.ouvert, partie, selection = -1, erreurs = [], terminee = false;
    const boutonsNiveau = M.ETAPES.map((niveau, i) => {
      const b = document.createElement("button"); b.className = "secondaire"; b.type = "button";
      b.append(document.createTextNode(`${niveau.icone} ${niveau.nom} `));
      const detail = document.createElement("small"); detail.textContent = `${niveau.vides} cases à remplir`; b.append(detail);
      b.addEventListener("click", () => { if (i <= progression.ouvert) demarrer(i); });
      zoneNiveaux.append(b); return b;
    });
    const boutonsChiffre = [];
    for (let n = 1; n <= 9; n++) {
      const b = document.createElement("button"); b.className = "chiffre"; b.type = "button"; b.textContent = String(n); b.setAttribute("aria-label", `Choisir ${n}`);
      b.addEventListener("click", () => saisir(n)); clavier.append(b); boutonsChiffre.push(b);
    }
    const vider = document.createElement("button"); vider.className = "secondaire"; vider.type = "button"; vider.textContent = "⌫ Effacer"; vider.addEventListener("click", () => saisir(0)); clavier.append(vider);

    function afficher(focaliser = false) {
      const meme = selection >= 0 ? partie.grille[selection] : 0;
      grille.replaceChildren();
      for (let i = 0; i < 81; i++) {
        const b = document.createElement("button"), r = Math.floor(i / 9), c = i % 9, n = partie.grille[i];
        b.type = "button"; b.className = "case"; b.setAttribute("role", "gridcell"); b.dataset.index = String(i);
        b.setAttribute("aria-label", `Ligne ${r + 1}, colonne ${c + 1}${n ? `, ${n}${partie.indicesFixes.includes(i) ? ", chiffre donné" : ""}` : ", vide"}`);
        if (partie.indicesFixes.includes(i)) b.classList.add("donnee");
        if (i === selection) b.classList.add("selection");
        else if (selection >= 0 && (r === Math.floor(selection / 9) || c === selection % 9 || (Math.floor(r / 3) === Math.floor(selection / 27) && Math.floor(c / 3) === Math.floor((selection % 9) / 3)))) b.classList.add("meme-chiffre");
        if (meme && n === meme && i !== selection) b.classList.add("meme-chiffre");
        if (erreurs.includes(i)) b.classList.add("erreur");
        b.textContent = n ? String(n) : "";
        b.disabled = terminee;
        b.addEventListener("click", () => { selection = i; afficher(true); });
        b.addEventListener("keydown", (e) => {
          let cible = -1;
          if (e.key === "ArrowUp") cible = i - 9;
          if (e.key === "ArrowDown") cible = i + 9;
          if (e.key === "ArrowLeft") cible = i - 1;
          if (e.key === "ArrowRight") cible = i + 1;
          if (cible >= 0 && cible < 81 && !(e.key === "ArrowLeft" && c === 0) && !(e.key === "ArrowRight" && c === 8)) { e.preventDefault(); selection = cible; afficher(true); }
          else if (/^[1-9]$/.test(e.key)) { e.preventDefault(); saisir(Number(e.key)); }
          else if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); saisir(0); }
        });
        grille.append(b);
      }
      boutonsNiveau.forEach((b, i) => { b.setAttribute("aria-pressed", String(rang === i)); b.disabled = i > progression.ouvert; });
      if (focaliser && selection >= 0) grille.children[selection].focus();
    }
    function annoncer(texte, classe = "") { sortie(message, texte); message.className = `message ${classe}`; }
    function terminer() {
      terminee = true;
      if (rang === M.ETAPES.length - 1) progression.termine = true;
      if (rang === progression.ouvert && progression.ouvert < M.ETAPES.length - 1) progression.ouvert++;
      stockage.ecrire(progression); afficher();
      const prochain = progression.ouvert > rang ? ` Le grade ${M.ETAPES[progression.ouvert].nom} est débloqué !` : " Tu as terminé tous les grades : bravo, pro du Sudoku !";
      annoncer(`Grille résolue ! 🎉${prochain}`, "ok");
      actualiserAcademie();
    }
    function saisir(n) {
      if (terminee || selection < 0) { annoncer("Choisis d'abord une case vide."); return; }
      const resultat = M.placer(partie, selection, n);
      if (resultat === "fixe") { annoncer("Ce chiffre était déjà donné : choisis une case vide."); return; }
      if (resultat === "conflit") { annoncer("Ce chiffre est déjà présent dans la ligne, la colonne ou le carré."); return; }
      if (resultat !== "ok") return;
      erreurs = [];
      const bilan = M.verifier(partie);
      afficher();
      if (bilan.resolu) terminer();
      else if (n) annoncer("Chiffre placé. Continue !", "ok");
      else annoncer("Case effacée.");
    }
    function demarrer(i) {
      rang = i; partie = M.creerPartie(M.ETAPES[rang].id); selection = partie.depart.findIndex((n) => !n);
      erreurs = []; terminee = false;
      sortie(objectif, `${M.ETAPES[rang].icone} ${M.ETAPES[rang].nom} — ${M.ETAPES[rang].conseil}`);
      afficher(); annoncer("Sélectionne une case vide, puis choisis un chiffre.");
    }
    p.querySelector('[data-action="nouvelle"]').addEventListener("click", () => demarrer(rang));
    p.querySelector('[data-action="indice"]').addEventListener("click", () => {
      if (terminee) return;
      const i = M.revelerIndice(partie);
      if (i === null) { annoncer("Il n'y a plus de case vide à révéler."); return; }
      selection = i; afficher(); annoncer(`Indice : la ligne ${Math.floor(i / 9) + 1}, colonne ${i % 9 + 1} contient ${partie.grille[i]}.`, "ok");
      if (M.verifier(partie).resolu) terminer();
    });
    p.querySelector('[data-action="verifier"]').addEventListener("click", () => {
      const bilan = M.verifier(partie); erreurs = bilan.erreurs; afficher();
      if (bilan.resolu) terminer();
      else annoncer(bilan.erreurs.length ? `${bilan.erreurs.length} chiffre${bilan.erreurs.length > 1 ? "s" : ""} à corriger.` : `${bilan.vides.length} case${bilan.vides.length > 1 ? "s" : ""} encore vide${bilan.vides.length > 1 ? "s" : ""}.`, bilan.erreurs.length ? "ko" : "");
    });
    p.querySelector('[data-action="effacer"]').addEventListener("click", () => saisir(0));
    demarrer(rang);
    jeu.demarrer = demarrer;
  } });
  const jeu = {};

  function actualiserAcademie() {
    if (!academie.zone) return;
    academie.progres.textContent = `${progression.ouvert + 1} / ${M.ETAPES.length} grades débloqués`;
    academie.zone.replaceChildren();
    M.ETAPES.forEach((e, i) => {
      const carte = document.createElement("article"), h = document.createElement("h3"), desc = document.createElement("p"), conseil = document.createElement("p"), bouton = document.createElement("button");
      carte.className = `grade${i > progression.ouvert ? " verrouille" : ""}`;
      h.textContent = `${e.icone} ${i < progression.ouvert ? "✓ " : ""}${e.nom}`;
      desc.textContent = e.description;
      conseil.textContent = `À retenir : ${e.conseil}`;
      bouton.type = "button"; bouton.className = i > progression.ouvert ? "secondaire" : "action"; bouton.disabled = i > progression.ouvert;
      bouton.textContent = i > progression.ouvert ? "🔒 Résous le grade précédent" : "Jouer cette étape";
      bouton.addEventListener("click", () => { jeu.demarrer(i); ouvrirOnglet("application"); });
      carte.append(h, desc, conseil, bouton); academie.zone.append(carte);
    });
  }
  const academie = {};
  enregistrerOnglet({ id: "academie", titre: "Académie", rendu(p) {
    p.append(document.getElementById("tpl-academie").content.cloneNode(true));
    academie.zone = p.querySelector('[data-zone="grades"]'); academie.progres = p.querySelector('[data-sortie="progression"]');
    actualiserAcademie();
  } });
  enregistrerOnglet({ id: "mise-en-situation", titre: "Défis", rendu(p) {
    p.append(document.getElementById("tpl-defis").content.cloneNode(true));
    p.querySelector('[data-action="defi"]').addEventListener("click", () => { jeu.demarrer(0); ouvrirOnglet("application"); });
  } });
  enregistrerOnglet({ id: "self-test", titre: "Auto-évaluation", actif: false, rendu() {} });

  const actifs = registre.filter((o) => o.actif !== false);
  for (const [i, o] of actifs.entries()) {
    const b = document.createElement("button"), section = document.createElement("section");
    b.type = "button"; b.id = `onglet-${o.id}`; b.setAttribute("role", "tab"); b.setAttribute("aria-controls", `panneau-${o.id}`);
    const actif = o.id === "application";
    b.setAttribute("aria-selected", String(actif)); b.tabIndex = actif ? 0 : -1; b.textContent = o.titre; b.dataset.id = o.id;
    section.id = `panneau-${o.id}`; section.setAttribute("role", "tabpanel"); section.setAttribute("aria-labelledby", b.id); section.tabIndex = 0; section.hidden = !actif;
    o.rendu(section); onglets.append(b); panneaux.append(section);
    b.addEventListener("click", () => ouvrirOnglet(o.id));
    b.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault(); const prochain = (i + (e.key === "ArrowRight" ? 1 : -1) + actifs.length) % actifs.length;
      ouvrirOnglet(actifs[prochain].id); onglets.children[prochain].focus();
    });
  }
  ouvrirOnglet = (id) => {
    actifs.forEach((o) => {
      const actif = o.id === id, b = onglets.querySelector(`[data-id="${o.id}"]`), p = document.getElementById(`panneau-${o.id}`);
      b.setAttribute("aria-selected", String(actif)); b.tabIndex = actif ? 0 : -1; p.hidden = !actif;
    });
  };
})();
</script>
</body>
</html>
