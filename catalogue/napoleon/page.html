  function monter({ restaurer, resumer }) {
    if (window.parent === window) return () => {};
    const module = JSON.parse(document.getElementById("kermiclab-meta").textContent).id;

      pret = true;
      publier();
    });
    window.parent.postMessage({ type: "kermiclab:trophees:pret", module }, "*");

  }
  return Object.freeze({ monter });

  const nombreFr = (x, decimales = 2) => {
    const arr = Math.round(x * 10 ** decimales) / 10 ** decimales;
    return (Object.is(arr, -0) ? 0 : arr).toLocaleString("fr-FR", { maximumFractionDigits: decimales });
  };
  /** Vrai si x s'écrit exactement avec au plus `decimales` chiffres après la virgule. */
  const exact = (x, decimales) => Math.abs(Math.round(x * 10 ** decimales) - x * 10 ** decimales) < 1e-9;
  const pgcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const SVG = "http://www.w3.org/2000/svg";
  function s(nom, attributs, parent) {
    const n = document.createElementNS(SVG, nom);
    for (const [k, v] of Object.entries(attributs ?? {})) n.setAttribute(k, v);
    if (parent) parent.appendChild(n);
    return n;
  }

  /** Lit « 12 », « 3,5 », « -2.25 » ou « 3/4 ». Renvoie { valeur, fraction: [n, d] | null } ou null. */
  function lireNombre(saisie) {
    const t = String(saisie).trim().replace(/\s+/g, "").replace(",", ".");
    const f = t.match(/^(-?\d+)\/(-?\d+)$/);
    if (f) { const n = Number(f[1]), d = Number(f[2]); return d === 0 ? null : { valeur: n / d, fraction: [n, d] }; }
    if (!/^-?\d+(\.\d+)?$/.test(t)) return null;
    return { valeur: Number(t), fraction: null };
  }

  /* ---------- Étoiles : une par exercice réussi, gardées dans le navigateur ---------- */
  const etoiles = new Set(Array.isArray(stockage.lire("etoiles")) ? stockage.lire("etoiles") : []);
  const totalExercices = [...(C.application?.exercices ?? []), ...(C.situation?.etapes ?? [])].length;
  const compteur = document.getElementById("etoiles");
  const publier = typeof Trophees === "undefined" ? () => {} : Trophees.monter({
    restaurer(brut) {
      if (!Array.isArray(brut)) return;
      etoiles.clear();
      for (const id of brut) if (idsExercices.has(id)) etoiles.add(id);
      majEtoiles();
    },
    resumer: () => ({ genre: "notions", etat: [...etoiles], etoiles: etoiles.size, etoilesTotal: totalExercices, badges: [] })
  });
  const idsExercices = new Set([
    ...(C.application?.exercices ?? []).map((_, i) => `app-${i + 1}`),
    ...(C.situation?.etapes ?? []).map((_, i) => `defi-${i + 1}`)
  ]);
  function majEtoiles() {
    compteur.textContent = `★ ${etoiles.size} / ${totalExercices}`;
    compteur.setAttribute("aria-label", `${etoiles.size} étoiles sur ${totalExercices}`);
  }
  function gagner(id) {
    if (etoiles.has(id)) return false;
    etoiles.add(id);
    stockage.ecrire("etoiles", [...etoiles]);
    majEtoiles();
    publier();
    compteur.classList.remove("brille"); void compteur.offsetWidth; compteur.classList.add("brille");
    return true;
  }

  /* ---------- Composants d'exercice ---------- */
  function retourZone() { return h("p", { classe: "retour", "aria-live": "polite" }); }
  function afficherRetour(zone, ok, texte) {
    zone.className = `retour ${ok ? "ok" : "ko"}`;
    zone.replaceChildren(riche(texte));
  }

  function exerciceQcm(ex, id, surReussite) {
    const zone = retourZone();
    const choix = h("div", { classe: "choix", role: "group", "aria-label": "Réponses possibles" });
    ex.choix.forEach((libelle, i) => {
      const b = h("button", { type: "button", classe: "choix-bouton" }, riche(libelle));
      b.addEventListener("click", () => {
        if (choix.dataset.fini) return;
        if (i === ex.bonne) {
          choix.dataset.fini = "1";
          b.classList.add("juste");
          choix.querySelectorAll("button").forEach((x) => { x.disabled = true; });
          afficherRetour(zone, true, `${gagner(id) ? "Bravo, +1 étoile ! " : "Bravo ! "}${ex.explication ?? ""}`);
          surReussite?.();
        } else {
          b.classList.add("faux"); b.disabled = true;
          afficherRetour(zone, false, ex.indice ?? "Pas tout à fait. Relis bien l'énoncé et réessaie !");
        }
      });
      choix.append(b);
    });
    return [choix, zone];
  }

  function exerciceNombre(ex, id, surReussite) {
    const zone = retourZone();
    const champ = h("input", { type: "text", inputmode: "decimal", autocomplete: "off", "aria-label": "Ta réponse", placeholder: ex.fractionIrreductible ? "ex. 3/4" : "ta réponse" });
    const valider = h("button", { type: "submit", classe: "action" }, "Valider");
    const solution = h("button", { type: "button", classe: "lien", hidden: true }, "Voir la solution");
    const form = h("form", { classe: "reponse" }, champ, ex.unite ? h("span", { classe: "unite" }, ex.unite) : null, valider);
    let essais = 0, fini = false;
    const terminer = (ok) => {
      fini = true; champ.disabled = true; valider.disabled = true; solution.hidden = true;
      const texte = ok ? `${gagner(id) ? "Exact, +1 étoile ! " : "Exact ! "}${ex.solution ?? ""}` : `Solution : ${ex.solution ?? nombreFr(ex.reponse)}`;
      afficherRetour(zone, ok, texte);
      if (ok) surReussite?.();
    };
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (fini) return;
      const lu = lireNombre(champ.value);
      if (!lu) { afficherRetour(zone, false, ex.fractionIrreductible ? "Écris une fraction, par exemple 3/4." : "Écris un nombre, par exemple 12 ou 3,5."); return; }
      const juste = Math.abs(lu.valeur - ex.reponse) <= (ex.tolerance ?? 1e-9);
      if (juste && ex.fractionIrreductible && (!lu.fraction || pgcd(lu.fraction[0], lu.fraction[1]) !== 1)) {
        afficherRetour(zone, false, "C'est la bonne valeur, mais la fraction n'est pas encore simplifiée au maximum !");
        return;
      }
      if (juste) { terminer(true); return; }
      essais += 1;
      const indices = ex.indices ?? [];
      afficherRetour(zone, false, essais <= indices.length ? `Indice : ${indices[essais - 1]}` : "Pas encore. Tu peux réessayer ou voir la solution.");
      if (essais >= Math.max(indices.length, 1)) solution.hidden = false;
    });
    solution.addEventListener("click", () => terminer(false));
    return [form, solution, zone];
  }

  const TYPES_EXERCICE = { qcm: exerciceQcm, nombre: exerciceNombre };

  function carteExercice(ex, id, numero, surReussite) {
    const carte = h("article", { classe: "exercice", "data-exercice": id });
    const titre = h("h3", null, h("span", { classe: "numero" }, String(numero)), riche(ex.titre ?? "Exercice"));
    if (etoiles.has(id)) carte.classList.add("deja");
    carte.append(titre, paragraphe(ex.question), ...TYPES_EXERCICE[ex.type](ex, id, () => { carte.classList.add("deja"); surReussite?.(); }));
    return carte;
  }

  /* ---------- Figures interactives ---------- */
  function curseur(libelle, min, max, pas, valeur, surChangement) {
    const sortie = h("output", null);
    const entree = h("input", { type: "range", min, max, step: pas, value: valeur });
    const maj = () => { sortie.textContent = nombreFr(Number(entree.value)); surChangement(Number(entree.value)); };
    entree.addEventListener("input", maj);
    return { element: h("label", { classe: "curseur" }, h("span", null, `${libelle} : `, sortie), entree), maj, entree };
  }
  const tuile = (libelle, valeur, classe) => h("div", { classe: `tuile ${classe ?? ""}` }, h("span", null, libelle), h("b", null, valeur));

  const FIGURES = {
    /** Triangle rectangle et carrés construits sur ses côtés. */
    pythagore(conf) {
      const svg = s("svg", { viewBox: "0 0 300 300", role: "img", "aria-label": "Triangle rectangle et carrés construits sur ses côtés" });
      const valeurs = h("div", { classe: "tuiles", "aria-live": "polite" });
      const message = h("p", { classe: "bulle-info", "aria-live": "polite" });
      let a = conf.a ?? 3, b = conf.b ?? 4;
      const dessiner = () => {
        svg.replaceChildren();
        const c = Math.hypot(a, b);
        // Angle droit en O, côté a horizontal (vers A), côté b vertical (vers B) ; chaque carré est construit vers l'extérieur.
        // Encombrement : largeur (a + 2b)·k, hauteur (2a + b)·k ; l'échelle k fait tout tenir dans 300 × 300.
        const k = 280 / Math.max(a + 2 * b, 2 * a + b);
        const O = { x: 10 + b * k, y: 10 + a * k };
        const A = { x: O.x + a * k, y: O.y }, B = { x: O.x, y: O.y + b * k };
        const decale = (p, dx, dy) => ({ x: p.x + dx, y: p.y + dy });
        const poly = (pts, classe) => s("polygon", { points: pts.map((p) => `${p.x},${p.y}`).join(" "), class: classe }, svg);
        poly([O, A, decale(A, 0, -a * k), decale(O, 0, -a * k)], "carre carre-a");
        poly([O, B, decale(B, -b * k, 0), decale(O, -b * k, 0)], "carre carre-b");
        poly([A, B, decale(B, b * k, a * k), decale(A, b * k, a * k)], "carre carre-c");
        poly([O, A, B], "triangle");
        const aire = (pts, texte, classe) => {
          const t = s("text", { x: pts.reduce((m, p) => m + p.x, 0) / 4, y: pts.reduce((m, p) => m + p.y, 0) / 4, class: `etiquette ${classe}` }, svg);
          t.textContent = texte;
        };
        aire([O, A, decale(A, 0, -a * k), decale(O, 0, -a * k)], nombreFr(a * a), "a");
        aire([O, B, decale(B, -b * k, 0), decale(O, -b * k, 0)], nombreFr(b * b), "b");
        aire([A, B, decale(B, b * k, a * k), decale(A, b * k, a * k)], nombreFr(a * a + b * b), "c");
        s("polyline", { points: `${O.x + 10},${O.y} ${O.x + 10},${O.y + 10} ${O.x},${O.y + 10}`, class: "angle-droit" }, svg);
        valeurs.replaceChildren(
          tuile("a²", `${nombreFr(a)}² = ${nombreFr(a * a)}`, "a"),
          tuile("b²", `${nombreFr(b)}² = ${nombreFr(b * b)}`, "b"),
          tuile("c² = a² + b²", nombreFr(a * a + b * b), "c"),
          tuile("hypoténuse c", Number.isInteger(c) ? nombreFr(c) : `≈ ${nombreFr(c)}`, "c")
        );
        message.textContent = Number.isInteger(c)
          ? `Triplet magique ! ${a}, ${b} et ${c} sont tous entiers : on dit que c'est un triplet pythagoricien.`
          : "Astuce : cherche des valeurs de a et b qui donnent une hypoténuse entière (il en existe plusieurs !).";
      };
      const ca = curseur("Côté a", 1, 12, 1, a, (v) => { a = v; dessiner(); });
      const cb = curseur("Côté b", 1, 12, 1, b, (v) => { b = v; dessiner(); });
      ca.maj(); cb.maj();
      return h("div", { classe: "figure" }, svg, h("div", { classe: "curseurs" }, ca.element, cb.element), valeurs, message);
    },

    /** Barres partagées en parts égales : numérateur / dénominateur, décimal, pourcentage, forme simplifiée. */
    fraction(conf) {
      const svg = s("svg", { viewBox: "0 0 300 52", role: "img", "aria-label": "Fraction représentée par des barres partagées en parts égales" });
      const valeurs = h("div", { classe: "tuiles", "aria-live": "polite" });
      let n = conf.numerateur ?? 3, d = conf.denominateur ?? 4;
      const dessiner = () => {
        svg.replaceChildren();
        const barres = Math.max(1, Math.ceil(n / d));
        const hauteur = 36;
        svg.setAttribute("viewBox", `0 0 300 ${8 + barres * (hauteur + 8)}`);
        for (let j = 0; j < barres; j++) {
          const y = 8 + j * (hauteur + 8);
          for (let i = 0; i < d; i++) {
            const pleine = j * d + i < n;
            s("rect", { x: 10 + (i * 280) / d, y, width: 280 / d, height: hauteur, class: pleine ? "part pleine" : "part" }, svg);
          }
        }
        const g = pgcd(n, d);
        valeurs.replaceChildren(
          tuile("fraction", `${n}/${d}`),
          tuile("forme simplifiée", g > 1 ? `${n / g}/${d / g}` : "déjà simplifiée"),
          tuile("décimal", `${exact(n / d, 3) ? "" : "≈ "}${nombreFr(n / d, 3)}`),
          tuile("pourcentage", `${exact((n / d) * 100, 1) ? "" : "≈ "}${nombreFr((n / d) * 100, 1)} %`)
        );
      };
      const cn = curseur("Numérateur (parts prises)", 0, 12, 1, n, (v) => { n = v; dessiner(); });
      const cd = curseur("Dénominateur (parts égales)", 1, 12, 1, d, (v) => { d = v; dessiner(); });
      cn.maj(); cd.maj();
      return h("div", { classe: "figure" }, svg, h("div", { classe: "curseurs" }, cn.element, cd.element), valeurs);
    },

    /** Situation de proportionnalité : tableau, droite passant par l'origine, coefficient. */
    proportion(conf) {
      const svg = s("svg", { viewBox: "0 0 300 200", role: "img", "aria-label": `Graphique : ${conf.libelleY} en fonction de ${conf.libelleX}` });
      const table = h("table", { classe: "tableau" });
      const valeurs = h("div", { classe: "tuiles", "aria-live": "polite" });
      const xMax = conf.xMax ?? 10;
      let k = conf.coefficient ?? 1.2, x = conf.x ?? 3;
      const dessiner = () => {
        svg.replaceChildren();
        const yMax = (conf.coefficientMax ?? 3) * xMax * 1.05;
        const px = (v) => 30 + (v / xMax) * 260, py = (v) => 180 - (v / yMax) * 170;
        s("line", { x1: 30, y1: 180, x2: 295, y2: 180, class: "axe" }, svg);
        s("line", { x1: 30, y1: 180, x2: 30, y2: 5, class: "axe" }, svg);
        for (let i = 0; i <= xMax; i++) s("line", { x1: px(i), y1: 180, x2: px(i), y2: 184, class: "axe" }, svg);
        const texte = (x0, y0, contenu, ancre) => { s("text", { x: x0, y: y0, class: "legende", "text-anchor": ancre }, svg).textContent = contenu; };
        texte(26, 184, "0", "end");
        texte(px(xMax), 197, `${conf.libelleX} : de 0 à ${nombreFr(xMax)}`, "end");
        texte(36, 14, conf.libelleY, "start");
        s("line", { x1: px(0), y1: py(0), x2: px(xMax), y2: py(k * xMax), class: "droite" }, svg);
        s("line", { x1: px(x), y1: 180, x2: px(x), y2: py(k * x), class: "repere" }, svg);
        s("line", { x1: 30, y1: py(k * x), x2: px(x), y2: py(k * x), class: "repere" }, svg);
        s("circle", { cx: px(x), cy: py(k * x), r: 6, class: "point" }, svg);
        const lignes = [1, 2, 5, 10].filter((v) => v <= xMax);
        table.replaceChildren(
          h("tr", null, h("th", { scope: "row" }, conf.libelleX), ...lignes.map((v) => h("td", null, nombreFr(v))), h("td", { classe: "actif" }, nombreFr(x))),
          h("tr", null, h("th", { scope: "row" }, conf.libelleY), ...lignes.map((v) => h("td", null, nombreFr(k * v))), h("td", { classe: "actif" }, nombreFr(k * x)))
        );
        valeurs.replaceChildren(
          tuile("coefficient", `× ${nombreFr(k)}`),
          tuile(conf.libelleY, `${nombreFr(x)} × ${nombreFr(k)} = ${nombreFr(k * x)}${conf.unite ? ` ${conf.unite}` : ""}`)
        );
      };
      const ck = curseur(conf.libelleCoefficient ?? "Coefficient", conf.coefficientMin ?? 0.5, conf.coefficientMax ?? 3, conf.pas ?? 0.1, k, (v) => { k = v; dessiner(); });
      const cx = curseur(conf.libelleX, 0, xMax, 1, x, (v) => { x = v; dessiner(); });
      ck.maj(); cx.maj();
      return h("div", { classe: "figure" }, svg, h("div", { classe: "curseurs" }, ck.element, cx.element), h("div", { classe: "defile" }, table), valeurs);
    },

    /** Droite d'équation y = ax + b : coefficient directeur, ordonnée à l'origine, nature de la fonction. */
    affine(conf) {
      const svg = s("svg", { viewBox: "0 0 260 260", role: "img", "aria-label": "Représentation graphique de la fonction f(x) = ax + b" });
      const valeurs = h("div", { classe: "tuiles", "aria-live": "polite" });
      let a = conf.a ?? 2, b = conf.b ?? 1;
      const px = (x) => 130 + x * 20, py = (y) => 130 - y * 20;
      const signe = (v) => (v < 0 ? `− ${nombreFr(-v)}` : `+ ${nombreFr(v)}`);
      const dessiner = () => {
        svg.replaceChildren();
        for (let i = -6; i <= 6; i++) {
          s("line", { x1: px(i), y1: 0, x2: px(i), y2: 260, class: "grille" }, svg);
          s("line", { x1: 0, y1: py(i), x2: 260, y2: py(i), class: "grille" }, svg);
        }
        s("line", { x1: 0, y1: 130, x2: 260, y2: 130, class: "axe" }, svg);
        s("line", { x1: 130, y1: 0, x2: 130, y2: 260, class: "axe" }, svg);
        s("text", { x: px(1), y: py(0) + 14, class: "legende", "text-anchor": "middle" }, svg).textContent = "1";
        s("text", { x: px(0) - 6, y: py(1) + 4, class: "legende", "text-anchor": "end" }, svg).textContent = "1";
        s("line", { x1: px(-7), y1: py(a * -7 + b), x2: px(7), y2: py(a * 7 + b), class: "droite" }, svg);
        // Escalier « +1 en x → +a en y », depuis le point d'ordonnée à l'origine.
        s("polyline", { points: `${px(0)},${py(b)} ${px(1)},${py(b)} ${px(1)},${py(a + b)}`, class: "escalier" }, svg);
        s("circle", { cx: px(0), cy: py(b), r: 5, class: "point" }, svg);
        const nature = a === 0 ? "constante" : b === 0 ? "linéaire (proportionnalité)" : "affine";
        const formule = a === 0 ? `f(x) = ${nombreFr(b)}` : `f(x) = ${a === 1 ? "" : a === -1 ? "−" : nombreFr(a)}x${b === 0 ? "" : ` ${signe(b)}`}`;
        valeurs.replaceChildren(
          tuile("fonction", formule),
          tuile("coefficient directeur a", `${nombreFr(a)} (${a > 0 ? "croissante" : a < 0 ? "décroissante" : "constante"})`, "a"),
          tuile("ordonnée à l'origine b", nombreFr(b), "b"),
          tuile("nature", nature)
        );
      };
      const ca = curseur("Coefficient directeur a", -4, 4, 0.5, a, (v) => { a = v; dessiner(); });
      const cb = curseur("Ordonnée à l'origine b", -5, 5, 0.5, b, (v) => { b = v; dessiner(); });
      ca.maj(); cb.maj();
      return h("div", { classe: "figure" }, svg, h("div", { classe: "curseurs" }, ca.element, cb.element), valeurs);
    },

    /** Parabole y = ax² + bx + c : sommet, discriminant et racines. */
    parabole(conf) {
      const svg = s("svg", { viewBox: "0 0 260 260", role: "img", "aria-label": "Représentation graphique de f(x) = ax² + bx + c" });
      const valeurs = h("div", { classe: "tuiles", "aria-live": "polite" });
      let a = conf.a ?? 1, b = conf.b ?? -2, c = conf.c ?? -3;
      const px = (x) => 130 + x * 20, py = (y) => 130 - y * 20;
      const terme = (v, lettre, premier) => {
        if (v === 0) return "";
        const abs = Math.abs(v), coef = lettre && abs === 1 ? "" : nombreFr(abs);
        return premier ? `${v < 0 ? "−" : ""}${coef}${lettre}` : ` ${v < 0 ? "−" : "+"} ${coef}${lettre}`;
      };
      const dessiner = () => {
        svg.replaceChildren();
        for (let i = -6; i <= 6; i++) {
          s("line", { x1: px(i), y1: 0, x2: px(i), y2: 260, class: "grille" }, svg);
          s("line", { x1: 0, y1: py(i), x2: 260, y2: py(i), class: "grille" }, svg);
        }
        s("line", { x1: 0, y1: 130, x2: 260, y2: 130, class: "axe" }, svg);
        s("line", { x1: 130, y1: 0, x2: 130, y2: 260, class: "axe" }, svg);
        const f = (x) => a * x * x + b * x + c;
        const points = [];
        for (let x = -6.5; x <= 6.5; x += 0.05) points.push(`${px(x).toFixed(1)},${Math.max(-2000, Math.min(2000, py(f(x)))).toFixed(1)}`);
        s("polyline", { points: points.join(" "), class: "droite courbe" }, svg);
        const delta = b * b - 4 * a * c;
        const alpha = -b / (2 * a), beta = f(alpha);
        s("circle", { cx: px(alpha), cy: py(beta), r: 5, class: "point" }, svg);
        const racines = delta > 0 ? [(-b - Math.sqrt(delta)) / (2 * a), (-b + Math.sqrt(delta)) / (2 * a)].sort((u, v) => u - v) : delta === 0 ? [alpha] : [];
        for (const r of racines) s("circle", { cx: px(r), cy: py(0), r: 4, class: "racine" }, svg);
        valeurs.replaceChildren(
          tuile("fonction", `f(x) = ${terme(a, "x²", true)}${terme(b, "x", false)}${terme(c, "", false)}`),
          tuile("discriminant Δ = b² − 4ac", nombreFr(delta), "a"),
          tuile("racines", racines.length ? racines.map((r) => nombreFr(r)).join(" et ") : "aucune (Δ < 0)", "c"),
          tuile("sommet (α ; β)", `(${nombreFr(alpha)} ; ${nombreFr(beta)}) — ${a > 0 ? "minimum" : "maximum"}`, "b")
        );
      };
      // a ne peut pas valoir 0 (sinon ce n'est plus une parabole) : on saute directement de −0,5 à 0,5.
      const ca = curseur("a", -3, 3, 0.5, a, (v) => {
        if (v === 0) { ca.entree.value = a > 0 ? -0.5 : 0.5; ca.maj(); return; }
        a = v; dessiner();
      });
      const cb = curseur("b", -6, 6, 1, b, (v) => { b = v; dessiner(); });
      const cc = curseur("c", -6, 6, 1, c, (v) => { c = v; dessiner(); });
      ca.maj(); cb.maj(); cc.maj();
      return h("div", { classe: "figure" }, svg, h("div", { classe: "curseurs" }, ca.element, cb.element, cc.element), valeurs);
    },

    /** Lancers d'un dé équilibré : les fréquences se rapprochent de 1/6 quand le nombre de lancers augmente. */
    des() {
      const svg = s("svg", { viewBox: "0 0 300 170", role: "img", "aria-label": "Diagramme des fréquences de chaque face du dé" });
      const valeurs = h("div", { classe: "tuiles", "aria-live": "polite" });
      const effectifs = [0, 0, 0, 0, 0, 0];
      let total = 0, dernier = null;
      const dessiner = () => {
        svg.replaceChildren();
        const hauteur = (f) => (Math.min(f, 0.35) / 0.35) * 130;
        effectifs.forEach((n, i) => {
          const f = total ? n / total : 0;
          s("rect", { x: 20 + i * 46, y: 145 - hauteur(f), width: 34, height: hauteur(f), class: `barre${dernier === i + 1 ? " derniere" : ""}` }, svg);
          s("text", { x: 37 + i * 46, y: 162, class: "legende", "text-anchor": "middle" }, svg).textContent = String(i + 1);
        });
        s("line", { x1: 10, y1: 145 - hauteur(1 / 6), x2: 295, y2: 145 - hauteur(1 / 6), class: "repere" }, svg);
        s("text", { x: 295, y: 141 - hauteur(1 / 6), class: "legende", "text-anchor": "end" }, svg).textContent = "1/6 ≈ 0,167";
        s("line", { x1: 10, y1: 145, x2: 295, y2: 145, class: "axe" }, svg);
        valeurs.replaceChildren(
          tuile("lancers", nombreFr(total)),
          tuile("dernier lancer", dernier ? String(dernier) : "—"),
          tuile("fréquence du 6", total ? nombreFr(effectifs[5] / total, 3) : "—"),
          tuile("probabilité du 6", "1/6 ≈ 0,167")
        );
      };
      const lancer = (n) => {
        for (let i = 0; i < n; i++) { dernier = 1 + Math.floor(Math.random() * 6); effectifs[dernier - 1] += 1; total += 1; }
        dessiner();
      };
      const boutons = h("div", { classe: "boutons" },
        ...[1, 10, 100, 1000].map((n) => { const b = h("button", { type: "button", classe: "action" }, `Lancer ${n === 1 ? "1 fois" : `${n} fois`}`); b.addEventListener("click", () => lancer(n)); return b; }),
        (() => { const b = h("button", { type: "button", classe: "lien" }, "Recommencer"); b.addEventListener("click", () => { effectifs.fill(0); total = 0; dernier = null; dessiner(); }); return b; })());
      dessiner();
      return h("div", { classe: "figure" }, svg, boutons, valeurs);
    }
  };

  /* ---------- Onglet explication : niveaux dépliables, du plus intuitif au plus formel ---------- */
  enregistrerOnglet({ id: "explication", type: "explication", titre: C.titresOnglets?.explication ?? "Explication",
    rendu(panneau) {
      if (C.intro) panneau.append(paragraphe(C.intro, "intro"));
      C.niveaux.forEach((n, i) => {
        const bloc = h("details", { open: i === 0 }, h("summary", null, riche(n.titre), " ", h("span", { classe: "niveau" }, `– ${n.niveau}`)));
        for (const p of n.paragraphes ?? []) bloc.append(paragraphe(p));
        if (n.exemple) {
          bloc.append(h("div", { classe: "exemple" }, h("strong", null, riche(n.exemple.titre ?? "Exemple")),
            h("ol", null, ...n.exemple.etapes.map((e) => h("li", null, riche(e))))));
        }
        if (n.aRetenir) bloc.append(h("div", { classe: "retenir" }, h("strong", null, "À retenir"), paragraphe(n.aRetenir)));
        panneau.append(bloc);
      });
    } });

  /* ---------- Onglet mémo (optionnel) : formules et points clés ---------- */
  enregistrerOnglet({ id: "memo", type: "memo", titre: C.titresOnglets?.memo ?? "Mémo", actif: Boolean(C.memo),
    rendu(panneau) {
      const m = C.memo;
      if (!m) return;
      if (m.intro) panneau.append(paragraphe(m.intro, "intro"));
      if (m.formules?.length) {
        panneau.append(h("h2", null, "Formules"));
        for (const f of m.formules) {
          panneau.append(h("div", { classe: "exemple" }, h("strong", null, riche(f.titre)), paragraphe(f.formule), ...(f.explication ? [paragraphe(f.explication)] : [])));
        }
      }
      if (m.pointsCles?.length) {
        panneau.append(h("h2", null, "Points clés"));
        panneau.append(h("ul", null, ...m.pointsCles.map((p) => h("li", null, riche(p)))));
      }
    } });

  /* ---------- Onglet application : manipuler, puis s'entraîner ---------- */
  enregistrerOnglet({ id: "application", type: "application", titre: C.titresOnglets?.application ?? "S'entraîner",
    rendu(panneau) {
      const a = C.application;
      if (a.intro) panneau.append(paragraphe(a.intro, "intro"));
      if (a.figure) panneau.append(FIGURES[a.figure.type](a.figure));
      panneau.append(h("h2", null, "Entraîne-toi"));
      a.exercices.forEach((ex, i) => panneau.append(carteExercice(ex, `app-${i + 1}`, i + 1)));
    } });

  /* ---------- Onglet mise en situation : une histoire, des étapes qui se débloquent ---------- */
  enregistrerOnglet({ id: "mise-en-situation", type: "mise-en-situation", titre: C.titresOnglets?.["mise-en-situation"] ?? "Défi",
    rendu(panneau) {
      const sit = C.situation;
      panneau.append(h("h2", null, riche(sit.titre)));
      for (const p of sit.histoire) panneau.append(paragraphe(p));
      const progression = h("progress", { max: sit.etapes.length, value: 0, "aria-label": "Étapes réussies" });
      const fin = h("div", { classe: "bravo", hidden: true, role: "status" }, h("strong", null, "Mission accomplie !"), paragraphe(sit.conclusion));
      panneau.append(progression);
      const cartes = sit.etapes.map((ex, i) => carteExercice(ex, `defi-${i + 1}`, i + 1, () => debloquer(i + 1)));
      function debloquer(suivante) {
        const reussies = cartes.filter((c) => c.classList.contains("deja")).length;
        progression.value = reussies;
        if (cartes[suivante]) { cartes[suivante].hidden = false; }
        if (reussies === cartes.length) fin.hidden = false;
      }
      cartes.forEach((c, i) => { c.hidden = i > 0 && !cartes[i - 1].classList.contains("deja"); panneau.append(c); });
      panneau.append(fin);
      debloquer(-1);
    } });

  /* ---------- Onglet self-test (prévu, désactivé) ---------- */
  enregistrerOnglet({ id: "self-test", type: "self-test", titre: "Auto-évaluation", actif: false, questions: [], rendu() {} });

  /* ---------- Socle : construction des onglets ---------- */
  const liste = document.getElementById("onglets"), panneaux = document.getElementById("panneaux");
  const actifs = registre.filter((o) => o.actif);
  const boutons = actifs.map((o, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.id = `onglet-${o.id}`; b.textContent = o.titre;
    b.setAttribute("aria-controls", `panneau-${o.id}`); b.dataset.onglet = o.id;
    const p = document.createElement("section");
    p.setAttribute("role", "tabpanel"); p.id = `panneau-${o.id}`; p.setAttribute("aria-labelledby", b.id); p.tabIndex = 0;
    o.rendu(p); panneaux.appendChild(p); liste.appendChild(b);
    b.addEventListener("click", () => choisir(i));
    return b;
  });
  function choisir(i) {
    boutons.forEach((b, j) => {
      const sel = i === j; b.setAttribute("aria-selected", String(sel)); b.tabIndex = sel ? 0 : -1;
      document.getElementById(b.getAttribute("aria-controls")).hidden = !sel;
    });
    stockage.ecrire("onglet", actifs[i].id);
  }
  liste.addEventListener("keydown", (e) => {
    const i = boutons.indexOf(document.activeElement); if (i < 0) return;
    const n = e.key === "ArrowRight" ? (i + 1) % boutons.length : e.key === "ArrowLeft" ? (i - 1 + boutons.length) % boutons.length : -1;
    if (n >= 0) { choisir(n); boutons[n].focus(); e.preventDefault(); }
  });
  const memo = actifs.findIndex((o) => o.id === stockage.lire("onglet"));
  choisir(memo >= 0 ? memo : 0);
  majEtoiles();

  document.getElementById("connexion").hidden = !CONFIG.connexionActive;
  window.kermiclab = { META, registre, CONFIG, lireNombre };
})();
</script>
</body>
</html>
