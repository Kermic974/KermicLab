<style data-inclure="gabarit/jeux/academie.css">
/* Styles communs de l'Académie des jeux (ADR 0015). Utilise les variables de couleur de chaque page :
   --fond, --surface, --texte, --doux, --accent, --accent-texte, --bord, --succes, --alerte. */
.doux { color: var(--doux); }
/* « hidden » l'emporte toujours sur les règles d'affichage (grilles, listes) de l'Académie. */
.toast[hidden], [data-vue][hidden], [data-vue] [hidden] { display: none !important; }
.toast { margin: 0 0 10px; font-weight: 700; color: var(--succes); }

button.danger { border-color: var(--alerte); color: var(--alerte); }
.barre { height: 12px; border-radius: 6px; background: var(--bord); overflow: hidden; margin: 4px 0; }
.barre span { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s; }

.synthese-tete { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 14px; align-items: center; }
.synthese-embleme { font-size: 2.6rem; line-height: 1; width: 60px; height: 60px; display: grid; place-items: center; border-radius: 50%; background: var(--fond); border: 2px solid var(--bord); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 10px 0 0; }

.conseil-titre { margin: 0; font-weight: 700; }

.detail-section .choix label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.message { min-height: 1.6em; font-weight: 600; margin: 8px 0; }
.message.ok { color: var(--succes); } .message.ko { color: var(--alerte); }

<script id="trophees" data-inclure="gabarit/jeux/trophees.js">
// Pont local des pages autonomes : aucun réseau, et aucun accès au stockage du parent.
const Trophees = (() => {
  function monter({ restaurer, resumer }) {
    if (window.parent === window) return () => {};
    const meta = JSON.parse(document.getElementById("kermiclab-meta").textContent);
    const module = meta.id;
    const origineParent = meta.parentOrigin || (document.referrer ? new URL(document.referrer).origin : null);
    if (!origineParent) return () => {};
    let pret = false;
    const publier = () => {
      if (pret) window.parent.postMessage({ type: "kermiclab:trophees:progres", module, ...resumer() }, origineParent);
    };
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent || e.origin !== origineParent || e.data?.type !== "kermiclab:trophees:charger" || e.data.module !== module || pret) return;
      if (e.data.etat !== null) restaurer(e.data.etat);
      pret = true;
      publier();
    });
    window.parent.postMessage({ type: "kermiclab:trophees:pret", module }, origineParent);
    return publier;
  }
  return Object.freeze({ monter });
})();
</script>

<template id="tpl-explication">
  <p>Une grille cache des <strong>mines</strong>. Ton but : ouvrir toutes les cases <strong>sans mine</strong>… sans jamais en toucher une !</p>
  <div class="carte">
    <h2>Les chiffres</h2>
    <p>Quand tu ouvres une case, un <strong>chiffre</strong> peut apparaître. Il dit combien de mines touchent cette case, <strong>y compris en diagonale</strong> (jusqu'à 8 cases autour).</p>
    <div class="exemple" role="img" aria-label="Exemple : une case 2 au centre, avec une mine en haut à gauche et une mine en bas à droite ; les quatre cases du milieu des bords affichent 1, les deux autres coins sont vides.">

      <div class="rangee"><span class="case" data-etat="n1">1</span><span class="case" data-etat="n2">2</span><span class="case" data-etat="n1">1</span></div>
      <div class="rangee"><span class="case" data-etat="vide"></span><span class="case" data-etat="n1">1</span><span class="case" data-etat="mine">💣</span></div>
    </div>
    <p>Ici, le <strong>2</strong> touche deux mines : une en haut à gauche, une en bas à droite. Chaque <strong>1</strong> n'en touche qu'une, et les deux coins vides n'en touchent aucune.</p>
  </div>
  <div class="carte">
    <h2>La case vide</h2>
    <p>Une case ouverte <strong>sans chiffre</strong> n'a aucune mine autour. Le jeu ouvre alors tout seul ses voisines : c'est souvent un grand morceau de grille qui se dévoile d'un coup.</p>
  </div>
  <div class="carte">
    <h2>Les drapeaux 🚩</h2>
    <p>Quand tu es <strong>sûr</strong> qu'une case cache une mine, plante un drapeau dessus. Une case avec un drapeau ne s'ouvre pas par erreur. Le compteur « drapeaux restants » t'aide à savoir combien de mines il reste à trouver.</p>
    <p>Astuce : si un chiffre a déjà tous ses drapeaux autour de lui, touche ce chiffre pour ouvrir d'un coup les autres cases voisines.</p>
  </div>
  <div class="carte">

    <p>Tu gagnes quand <strong>toutes les cases sans mine sont ouvertes</strong>. Les drapeaux ne sont pas obligatoires. Pas d'inquiétude pour commencer : <strong>ton premier coup n'est jamais une mine</strong>.</p>
  </div>

    <li>Niveau : <b data-sortie="niveau"></b></li>
    <li>💣 Mines : <b data-sortie="mines"></b></li>
    <li>🚩 Drapeaux restants : <b data-sortie="restantes"></b></li>
    <li>⏱ Temps : <b data-sortie="temps">0:00</b></li>
    <li class="statut" data-sortie="statut-zone">État : <b data-sortie="statut"></b></li>
    <li>🏆 Record : <b data-sortie="record">—</b></li>
  </ul>
  <div data-zone="plateau"></div>
  <p class="aide-defilement" data-sortie="aide-defilement" hidden>La grille est plus grande que l'écran : fais-la glisser pour voir le reste, ou utilise « − ».</p>
  <p class="message" data-sortie="message" role="status" aria-live="polite"></p>
</template>

<template id="tpl-mise-en-situation">
  <p>Le Démineur, c'est surtout de la <strong>déduction</strong> : en lisant bien les chiffres, on sait où sont les mines sans jamais deviner. Résous ces petites énigmes !</p>
  <div class="carte">
    <div class="enigme-entete">
      <h2 data-sortie="titre"></h2>
      <span class="progression" data-sortie="progression"></span>
    </div>
    <p data-sortie="consigne"></p>
    <div data-zone="enigme"></div>
    <p class="message" data-sortie="retour" role="status" aria-live="polite"></p>
    <button class="action" type="button" data-action="suivante" hidden>Énigme suivante</button>
  </div>
</template>

<script id="progression-jeux" data-inclure="gabarit/jeux/progression.js">
/* Progression commune des jeux (ADR 0014, 0015) : XP, niveaux, grades, étoiles, badges, série, objectif du jour,
   révisions espacées, défi du jour, forces et conseil personnalisé. Pur, sans DOM : la date est passée en paramètre.
   Module partagé, recopié dans chaque page par `npm run build` : modifier ce fichier, jamais sa copie dans une page. */
const ProgressionJeux = (() => {
  "use strict";
  const XP = Object.freeze({ parfait: 20, reussi: 10, avecIndice: 5, revision: 5, revisionRatee: 1, lecon: 30, objectif: 20, defi: 15 });
  // Révision espacée (boîtes de Leitner) : une carte réussie passe dans la boîte suivante, revue de plus en plus tard.
  const INTERVALLES = Object.freeze([1, 2, 4, 8, 16]);
  const OBJECTIFS = Object.freeze([1, 3, 5]);
  const MAX_JOURS = 31;
  const JOUR = /^\d{4}-\d{2}-\d{2}$/;
  const RESULTATS = Object.freeze({ victoire: "victoires", nulle: "nulles", defaite: "defaites" });

  /* ---------- Dates (AAAA-MM-JJ, calendrier de l'utilisateur fourni par l'appelant) ---------- */
  function ajouterJours(jour, n) {
    const [a, m, j] = jour.split("-").map(Number);
    return new Date(Date.UTC(a, m - 1, j + n)).toISOString().slice(0, 10);
  }
  const estJour = (v) => typeof v === "string" && JOUR.test(v);
  const entier = (v, max = 1e9) => (Number.isInteger(v) && v >= 0 ? Math.min(v, max) : 0);
  const copie = (e) => JSON.parse(JSON.stringify(e));
  const exoId = (lecon, k) => `${lecon.id}/${k}`;
  const etoiles = ({ erreurs, indices }) => { const p = erreurs + 2 * indices; return p === 0 ? 3 : p <= 2 ? 2 : 1; };
  /** Petit hachage déterministe : le même défi pour tout le monde le même jour, sans hasard ni réseau. */
  const hacher = (texte) => [...texte].reduce((h, c) => (Math.imul(h, 31) + c.charCodeAt(0)) >>> 0, 7);

  /** Crée l'API de progression d'un jeu à partir de son parcours (grades, leçons, thèmes, badges, niveaux de partie). */
  function creer(parcours) {
    const lecons = new Map(), exercices = new Map();
    parcours.grades.forEach((grade, gi) => grade.lecons.forEach((lecon) => {
      lecons.set(lecon.id, { lecon, grade, gi });
      lecon.exercices.forEach((exo, k) => exercices.set(exoId(lecon, k), { exo, lecon, grade, gi }));
    }));
    const EMBLEMES = Object.freeze(parcours.grades.map((g) => g.embleme));
    const NIVEAUX_PARTIE = parcours.parties?.niveaux ?? {};
    // Compteurs d'événements propres au jeu (capots, belotes…), déclarés par les badges de type « compteur ».
    const COMPTEURS = [...new Set((parcours.badges ?? []).filter((b) => b.condition.type === "compteur").map((b) => b.condition.nom))];
    const toutesLecons = parcours.grades.flatMap((g) => g.lecons);

    function etatInitial() {
      return {
        version: 1, xp: 0, lecons: {}, cartes: {}, themes: {}, serie: 0, serieMax: 0, dernierJour: null, jours: {},
        badges: [], objectif: 3, embleme: EMBLEMES[0], libre: false, revisions: 0, objectifsAtteints: 0, objectifsJours: [], defis: [],
        parties: Object.fromEntries(Object.keys(NIVEAUX_PARTIE).map((n) => [n, { victoires: 0, nulles: 0, defaites: 0, meilleur: null }])),
        compteurs: Object.fromEntries(COMPTEURS.map((n) => [n, 0]))
      };
    }

    /* ---------- Grades et niveaux ---------- */
    const gradeTermine = (e, grade) => grade.lecons.every((l) => e.lecons[l.id]);
    function gradesObtenus(e) {
      let n = 0;
      while (n < parcours.grades.length && gradeTermine(e, parcours.grades[n])) n += 1;
      return n;
    }
    function titre(e) {
      const n = gradesObtenus(e);
      return n === 0 ? "Débutant" : n === parcours.grades.length ? `${parcours.grades[n - 1].nom} : tu es un pro !` : parcours.grades[n - 1].nom;
    }
    function leconDebloquee(e, id) {
      const info = lecons.get(id);
      return !!info && (e.libre || info.gi === 0 || gradeTermine(e, parcours.grades[info.gi - 1]));
    }
    const emblemesDisponibles = (e) => EMBLEMES.slice(0, Math.max(1, gradesObtenus(e) + 1));

    /* ---------- Badges : communs à tous les jeux, puis propres au jeu (décrits dans le parcours) ---------- */
    const victoiresTotal = (e) => Object.values(e.parties).reduce((s, p) => s + p.victoires, 0);
    const lecDuTheme = (themes) => toutesLecons.filter((l) => themes.includes(l.theme));
    const COMMUNS = [
      { id: "premiers-pas", icone: "👣", nom: "Premiers pas", description: "Termine ta première leçon.", avance: (e) => [Object.keys(e.lecons).length, 1] },
      { id: "sans-faute", icone: "⭐", nom: "Sans faute", description: "Termine une leçon avec 3 étoiles.", avance: (e) => [Object.values(e.lecons).some((l) => l.etoiles === 3) ? 1 : 0, 1] },
      { id: "perfectionniste", icone: "🌟", nom: "Perfectionniste", description: "Obtiens 3 étoiles sur toutes les leçons d'un grade.",
        avance: (e) => [Math.max(...parcours.grades.map((g) => g.lecons.filter((l) => e.lecons[l.id]?.etoiles === 3).length / g.lecons.length)) >= 1 ? 1 : 0, 1] },
      { id: "pro", icone: "🏆", nom: "Du débutant au pro", description: `Obtiens les ${parcours.grades.length} grades.`, avance: (e) => [gradesObtenus(e), parcours.grades.length] },
      { id: "serie-3", icone: "🔥", nom: "Ça chauffe", description: "Entraîne-toi 3 jours de suite.", avance: (e) => [e.serieMax, 3] },
      { id: "serie-7", icone: "📅", nom: "Une semaine sans pause", description: "Entraîne-toi 7 jours de suite.", avance: (e) => [e.serieMax, 7] },
      { id: "regulier", icone: "🎯", nom: "Régulier", description: "Atteins 5 fois ton objectif du jour.", avance: (e) => [e.objectifsAtteints, 5] },
      { id: "memoire", icone: "🧠", nom: "Mémoire d'éléphant", description: "Fais 10 révisions.", avance: (e) => [e.revisions, 10] },
      { id: "bibliotheque", icone: "📚", nom: "Bibliothèque", description: "Maîtrise 10 stratégies (révisées plusieurs fois avec succès).",
        avance: (e) => [Object.values(e.cartes).filter((c) => c.boite >= 4).length, 10] },
      { id: "defis", icone: "⚡", nom: "Défis relevés", description: "Réussis 3 défis du jour.", avance: (e) => [e.defis.length, 3] }
    ];
    function versBadge({ id, icone, nom, description, condition: c }) {
      let avance;
      if (c.type === "themes") {
        avance = (e) => { const l = lecDuTheme(c.themes), faites = l.filter((x) => e.lecons[x.id]).length; return c.toutes === false ? [Math.min(1, faites), 1] : [faites, l.length]; };
      } else if (c.type === "victoires") {
        avance = (e) => [c.niveau ? e.parties[c.niveau]?.victoires ?? 0 : victoiresTotal(e), c.min];
      } else if (c.type === "compteur") {
        avance = (e) => [e.compteurs[c.nom] ?? 0, c.min];
      } else if (c.type === "record") {
        avance = (e) => { const m = e.parties[c.niveau]?.meilleur; return [m !== null && m !== undefined && m <= c.max ? 1 : 0, 1]; };
      } else throw new Error(`badge ${id} : condition « ${c.type} » inconnue`);
      return { id, icone, nom, description, avance };
    }
    const BADGES = [...COMMUNS, ...(parcours.badges ?? []).map(versBadge)];
    const ids = BADGES.map((b) => b.id);
    if (new Set(ids).size !== ids.length) throw new Error("badges en double");

    function badges(e) {
      return BADGES.map(({ avance, ...b }) => { const [actuel, cible] = avance(e); return { ...b, actuel: Math.min(actuel, cible), cible, obtenu: actuel >= cible }; });
    }

    /* ---------- Relecture d'un état stocké ---------- */
    const objet = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
    function normaliser(brut) {
      const base = etatInitial();
      if (!brut || typeof brut !== "object") return base;
      const e = { ...base, xp: entier(brut.xp), serie: entier(brut.serie), serieMax: entier(brut.serieMax), revisions: entier(brut.revisions),
        objectifsAtteints: entier(brut.objectifsAtteints), libre: brut.libre === true,
        objectif: OBJECTIFS.includes(brut.objectif) ? brut.objectif : base.objectif,
        embleme: EMBLEMES.includes(brut.embleme) ? brut.embleme : base.embleme,
        dernierJour: estJour(brut.dernierJour) ? brut.dernierJour : null };
      for (const [id, v] of Object.entries(objet(brut.lecons))) {
        if (lecons.has(id) && [1, 2, 3].includes(v?.etoiles)) e.lecons[id] = { etoiles: v.etoiles, jour: estJour(v.jour) ? v.jour : null };
      }
      for (const [id, v] of Object.entries(objet(brut.cartes))) {
        if (exercices.has(id) && Number.isInteger(v?.boite) && v.boite >= 1 && v.boite <= INTERVALLES.length && estJour(v.prochaine)) e.cartes[id] = { boite: v.boite, prochaine: v.prochaine };
      }
      for (const [t, v] of Object.entries(objet(brut.themes))) {
        if (parcours.themes[t]) { const essais = entier(v?.essais); e.themes[t] = { essais, premiers: Math.min(essais, entier(v?.premiers)) }; }
      }
      for (const [j, n] of Object.entries(objet(brut.jours))) if (estJour(j)) e.jours[j] = entier(n, 1000);
      e.badges = Array.isArray(brut.badges) ? [...new Set(brut.badges.filter((b) => ids.includes(b)))] : [];
      e.defis = Array.isArray(brut.defis) ? [...new Set(brut.defis.filter(estJour))].slice(-MAX_JOURS) : [];
      e.objectifsJours = Array.isArray(brut.objectifsJours) ? [...new Set(brut.objectifsJours.filter(estJour))].slice(-MAX_JOURS) : [];
      for (const n of Object.keys(NIVEAUX_PARTIE)) {
        const p = objet(objet(brut.parties)[n]);
        e.parties[n] = { victoires: entier(p.victoires), nulles: entier(p.nulles), defaites: entier(p.defaites), meilleur: Number.isInteger(p.meilleur) && p.meilleur >= 0 ? p.meilleur : null };
      }
      for (const n of COMPTEURS) e.compteurs[n] = entier(objet(brut.compteurs)[n]);
      return e;
    }

    /* ---------- Enregistrements : chaque fonction renvoie un nouvel état et ce qui a été gagné ---------- */
    function cloturer(e, avant, gains) {
      const obtenus = badges(e).filter((b) => b.obtenu).map((b) => b.id);
      gains.badges = obtenus.filter((id) => !avant.badges.includes(id)).map((id) => { const { avance, ...b } = BADGES.find((x) => x.id === id); return b; });
      e.badges = [...new Set([...avant.badges.filter((id) => ids.includes(id)), ...obtenus])];
      gains.niveauAvant = niveau(avant.xp).niveau;
      gains.niveauApres = niveau(e.xp).niveau;
      gains.gradesAvant = gradesObtenus(avant);
      gains.gradesApres = gradesObtenus(e);
      return { etat: e, gains };
    }
    /** Activité du jour : série de jours consécutifs, compteur du jour, bonus quand l'objectif est atteint. */
    function compterActivite(e, jour, gains) {
      if (e.dernierJour !== jour) {
        e.serie = e.dernierJour && ajouterJours(e.dernierJour, 1) === jour ? e.serie + 1 : 1;
        e.serieMax = Math.max(e.serieMax, e.serie);
        e.dernierJour = jour;
      }
      e.jours[jour] = (e.jours[jour] ?? 0) + 1;
      for (const j of Object.keys(e.jours).sort().slice(0, -MAX_JOURS)) delete e.jours[j];
      // Une seule récompense par date, même si le joueur change son objectif dans la journée.
      if (e.jours[jour] >= e.objectif && !e.objectifsJours.includes(jour)) {
        e.objectifsJours = [...e.objectifsJours, jour].slice(-MAX_JOURS);
        e.xp += XP.objectif; gains.xp += XP.objectif; gains.objectif = true; e.objectifsAtteints += 1;
      }
    }

    function enregistrerExercice(etat, { id, erreurs = 0, indice = false, jour, revision = false }) {
      const info = exercices.get(id);
      if (!info) throw new Error(`exercice inconnu : ${id}`);
      const e = copie(etat), gains = { xp: 0, objectif: false };
      const parfait = erreurs === 0 && !indice;
      const gain = revision ? (parfait ? XP.revision : XP.revisionRatee) : parfait ? XP.parfait : indice ? XP.avecIndice : XP.reussi;
      e.xp += gain; gains.xp += gain;
      const t = e.themes[info.lecon.theme] ?? { essais: 0, premiers: 0 };
      e.themes[info.lecon.theme] = { essais: t.essais + 1, premiers: t.premiers + (parfait ? 1 : 0) };
      const carte = e.cartes[id];
      const boite = !carte ? 1 : parfait ? Math.min(INTERVALLES.length, carte.boite + 1) : 1;
      e.cartes[id] = { boite, prochaine: ajouterJours(jour, INTERVALLES[boite - 1]) };
      if (revision) e.revisions += 1;
      compterActivite(e, jour, gains);
      return cloturer(e, etat, gains);
    }

    function terminerLecon(etat, { id, etoiles: n, jour }) {
      if (!lecons.has(id)) throw new Error(`leçon inconnue : ${id}`);
      const e = copie(etat), gains = { xp: 0, objectif: false, premiereFois: !etat.lecons[id] };
      if (gains.premiereFois) { e.xp += XP.lecon; gains.xp += XP.lecon; }
      e.lecons[id] = { etoiles: Math.max(n, e.lecons[id]?.etoiles ?? 0), jour };
      return cloturer(e, etat, gains);
    }

    /** Partie terminée (contre l'ordinateur, ou partie de démineur). `temps` en secondes, pour les records. */
    function enregistrerPartie(etat, { resultat, niveau: n, jour, temps = null }) {
      const regle = NIVEAUX_PARTIE[n];
      if (!RESULTATS[resultat] || !regle || regle.xp[resultat] === undefined) throw new Error("partie invalide");
      const e = copie(etat), gains = { xp: 0, objectif: false, record: false };
      const gain = regle.xp[resultat];
      e.xp += gain; gains.xp += gain;
      const p = e.parties[n];
      p[RESULTATS[resultat]] += 1;
      if (resultat === "victoire" && Number.isInteger(temps) && temps >= 0 && (p.meilleur === null || temps < p.meilleur)) { p.meilleur = temps; gains.record = true; }
      compterActivite(e, jour, gains);
      return cloturer(e, etat, gains);
    }

    /** Événements de jeu (ex. un capot) : seulement les compteurs déclarés par les badges, sans XP ni activité. */
    function compter(etat, { compteurs = {} }) {
      const e = copie(etat), gains = { xp: 0, objectif: false };
      for (const [n, k] of Object.entries(compteurs)) if (COMPTEURS.includes(n) && Number.isInteger(k) && k > 0) e.compteurs[n] += k;
      return cloturer(e, etat, gains);
    }

    function enregistrerDefi(etat, { jour }) {
      const e = copie(etat), gains = { xp: 0, objectif: false };
      if (!e.defis.includes(jour)) { e.defis = [...e.defis, jour].slice(-MAX_JOURS); e.xp += XP.defi; gains.xp += XP.defi; }
      return cloturer(e, etat, gains);
    }

    function regler(etat, { objectif, embleme, libre }) {
      const e = copie(etat);
      if (OBJECTIFS.includes(objectif)) e.objectif = objectif;
      if (emblemesDisponibles(etat).includes(embleme)) e.embleme = embleme;
      if (typeof libre === "boolean") e.libre = libre;
      return e;
    }

    /* ---------- Lectures ---------- */
    function revisionsDues(etat, jour) {
      return Object.entries(etat.cartes)
        .filter(([, c]) => c.prochaine <= jour)
        .sort(([, a], [, b]) => a.prochaine.localeCompare(b.prochaine) || a.boite - b.boite)
        .map(([id]) => id);
    }
    function forces(etat) {
      return Object.entries(parcours.themes).map(([id, nom]) => {
        const t = etat.themes[id] ?? { essais: 0, premiers: 0 };
        return { id, nom, essais: t.essais, taux: t.essais >= 3 ? t.premiers / t.essais : null };
      });
    }
    /** Série encore valable aujourd'hui (elle est cassée si le dernier jour actif est avant-hier ou plus ancien). */
    const serieActuelle = (e, jour) => (e.dernierJour === jour || e.dernierJour === ajouterJours(jour, -1) ? e.serie : 0);
    /** Activité des `n` derniers jours, du plus ancien au plus récent. */
    const activite = (e, jour, n = 7) => Array.from({ length: n }, (_, k) => { const j = ajouterJours(jour, k - n + 1); return { jour: j, exercices: e.jours[j] ?? 0 }; });

    function defiDuJour(etat, jour) {
      // Liste commune, indépendante de la progression : vraiment le même défi pour tout le monde le même jour.
      const candidats = [...exercices.entries()].filter(([, x]) => x.exo.type !== "qcm").map(([id]) => id);
      if (!candidats.length) return null;
      return { id: candidats[hacher(jour) % candidats.length], fait: etat.defis.includes(jour) };
    }

    /** Conseil personnalisé : réviser, retravailler un point faible, avancer, se perfectionner, ou jouer. */
    function recommandation(etat, jour) {
      const dues = revisionsDues(etat, jour);
      const ouvertes = toutesLecons.filter((l) => leconDebloquee(etat, l.id));
      if (dues.length >= 3) return { type: "revision", nombre: dues.length, texte: `${dues.length} stratégies t'attendent pour une révision : c'est le meilleur moyen de les retenir pour toujours.` };
      const faibles = forces(etat).filter((f) => f.taux !== null && f.taux < 0.6).sort((a, b) => a.taux - b.taux);
      for (const f of faibles) {
        const lecon = ouvertes.filter((l) => l.theme === f.id).sort((a, b) => (etat.lecons[a.id]?.etoiles ?? 0) - (etat.lecons[b.id]?.etoiles ?? 0))[0];
        if (lecon && (etat.lecons[lecon.id]?.etoiles ?? 0) < 3) return { type: "faiblesse", lecon: lecon.id, theme: f.id, texte: `Ton point à travailler : ${f.nom.toLowerCase()} (${Math.round(f.taux * 100)} % réussi du premier coup). Refais « ${lecon.titre} ».` };
      }
      const suivante = ouvertes.find((l) => !etat.lecons[l.id]);
      if (suivante) return { type: "suite", lecon: suivante.id, texte: Object.keys(etat.lecons).length ? `Prochaine étape : « ${suivante.titre} ».` : `Bienvenue ! Commence par « ${suivante.titre} ».` };
      if (dues.length) return { type: "revision", nombre: dues.length, texte: `${dues.length} révision${dues.length > 1 ? "s" : ""} pour garder tes stratégies en tête.` };
      const aPerfectionner = ouvertes.find((l) => etat.lecons[l.id].etoiles < 3);
      if (aPerfectionner) return { type: "perfection", lecon: aPerfectionner.id, texte: `Vise les 3 étoiles sur « ${aPerfectionner.titre} ».` };
      if (gradesObtenus(etat) < parcours.grades.length) {
        const g = parcours.grades[gradesObtenus(etat)];
        return { type: "suite", lecon: g.lecons.find((l) => !etat.lecons[l.id])?.id ?? g.lecons[0].id, texte: `Termine le grade ${g.nom} pour progresser.` };
      }
      return { type: "jouer", texte: parcours.conseilFinal ?? "Tu as tout appris ! Mets tes stratégies en pratique en jouant." };
    }

    /** Règles de gain d'XP, pour les expliquer au joueur (transparence de la gamification). */
    function reglesXP() {
      const regles = [
        ["Exercice réussi du premier coup", XP.parfait], ["Exercice réussi après une erreur", XP.reussi], ["Exercice réussi avec un indice", XP.avecIndice],
        ["Leçon terminée (la première fois)", XP.lecon], ["Révision réussie du premier coup", XP.revision], ["Objectif du jour atteint", XP.objectif], ["Défi du jour réussi", XP.defi]
      ];
      for (const [, n] of Object.entries(NIVEAUX_PARTIE)) {
        for (const [r, xp] of Object.entries(n.xp)) regles.push([`Partie ${n.nom} : ${{ victoire: "victoire", nulle: "nulle", defaite: "défaite" }[r]}`, xp]);
      }
      return regles.map(([texte, xp]) => ({ texte, xp }));
    }

    return Object.freeze({
      parcours, EMBLEMES, BADGES: BADGES.map(({ avance, ...b }) => b), NIVEAUX_PARTIE, lecons, exercices,
      etatInitial, normaliser, niveau, gradesObtenus, titre, leconDebloquee, emblemesDisponibles, badges,
      enregistrerExercice, terminerLecon, enregistrerPartie, enregistrerDefi, compter, regler,
      revisionsDues, forces, serieActuelle, activite, defiDuJour, recommandation, reglesXP
    });
  }

  /** Niveau n atteint à 50 × n × (n − 1) XP : 0, 100, 300, 600, 1000… (chaque niveau demande un peu plus). */
  function niveau(xp) {
    let n = 1;

<script id="academie-jeux" data-inclure="gabarit/jeux/academie.js">

      }));
      const dispo = P.emblemesDisponibles(etat);
      const emblemes = el("fieldset", { classe: "choix emblemes" }, el("legend", { texte: "Mon emblème (un nouveau à chaque grade)" }), ...P.EMBLEMES.map((id, i) => {
        const ouvert = dispo.includes(id), g = parcours.grades[i];
        const r = el("input", { type: "radio", name: "embleme", value: id, disabled: !ouvert, checked: etat.embleme === id, "aria-label": ouvert ? `Emblème ${g.nom}` : `Emblème ${g.nom}, verrouillé` });
        r.addEventListener("change", () => { etat = P.regler(etat, { embleme: id }); sauver(); afficherDetail(); });
        return el("label", { classe: ouvert ? "" : "verrouille", title: ouvert ? g.nom : `Grade ${parcours.grades[i - 1]?.nom} à obtenir` }, r, embleme(id));
      }));
      const libre = el("input", { type: "checkbox", name: "libre", checked: etat.libre });
      libre.addEventListener("change", () => { etat = P.regler(etat, { libre: libre.checked }); sauver(); afficherDetail(); });
      const effacer = el("button", { type: "button", classe: "secondaire danger", "data-action": "effacer", texte: confirmationEffacement ? "Confirmer : tout effacer" : "🗑️ Effacer ma progression" });
      effacer.addEventListener("click", () => {
        if (!confirmationEffacement) { confirmationEffacement = true; afficherReglages(); z.dReglages.querySelector('[data-action="effacer"]').focus(); return; }
        confirmationEffacement = false; etat = P.etatInitial(); sauver(); toast.textContent = "Progression effacée : nouveau départ !"; afficherDetail();
      });
      z.dReglages.replaceChildren(objectif, emblemes,
        el("label", { classe: "case-a-cocher" }, libre, "Je connais déjà les bases : ouvrir toutes les leçons"),
        el("p", { classe: "doux", texte: "Ta progression reste sur cet appareil. Elle ne contient aucune donnée personnelle." }), effacer);
    }

    /* ---------- Séances : leçon, révisions, défi du jour ---------- */
    const instances = {};
    const outils = {
      reussir: () => terminerExercice(),
      erreur: (message) => {
        ex.erreurs += 1;
        retour(message ?? (ex.erreurs >= 2 ? `Pas tout à fait. Indice : ${ex.exo.indice ?? "relis bien la question."}` : "Pas tout à fait : essaie encore !"), "ko");
      },
      retour: (texte, classe = "") => retour(texte, classe)
    };
    function adaptateur(type) {
      if (!adaptateurs[type]) throw new Error(`type d'exercice inconnu : ${type}`);
      if (!instances[type]) { instances[type] = adaptateurs[type](outils); z.zoneJeu.appendChild(instances[type].element); }
      return instances[type];
    }
    function retour(texte, classe) { z.retour.textContent = texte; z.retour.className = `message ${classe}`; }

    function ouvrirLecon(id) {
      const info = P.lecons.get(id);
      if (!info || !P.leconDebloquee(etat, id)) return;
      demarrerSession("lecon", info.lecon.exercices.map((_, k) => ProgressionJeux.exoId(info.lecon, k)), info.lecon);
    }
    function reviser() {
      const dues = P.revisionsDues(etat, jour()).slice(0, 8);
      if (dues.length) demarrerSession("revision", dues);
    }
    function demarrerSession(mode, file, lecon = null) {
      session = { mode, file, lecon, rang: 0, erreurs: 0, indices: 0 };
      const grade = lecon && P.lecons.get(lecon.id).grade;
      z.fil.textContent = mode === "lecon" ? `Grade ${grade.nom} · ${parcours.themes[lecon.theme]}` : mode === "defi" ? "Défi du jour" : "Révisions espacées";
      z.sTitre.textContent = mode === "lecon" ? lecon.titre : mode === "defi" ? "⚡ Le défi du jour" : "🧠 Tes révisions";
      z.sTexte.textContent = mode === "lecon" ? lecon.texte
        : mode === "defi" ? `Un exercice tiré du parcours, le même pour tout le monde aujourd'hui. Réussis-le pour gagner ${ProgressionJeux.XP.defi} XP de plus !`
        : "Retrouve la bonne réponse sans aide. Chaque réussite repousse la prochaine révision : c'est comme ça qu'on retient pour toujours.";
      z.zoneRetenir.hidden = mode !== "lecon";
      z.retenir.textContent = lecon?.retenir ?? "";
      z.exercice.hidden = false; z.bilan.hidden = true;
      toast.textContent = "";
      montrer("session");
      demarrerExercice();
    }

    function demarrerExercice() {
      const id = session.file[session.rang], { exo, lecon } = P.exercices.get(id);
      session.adaptateur?.arreter?.();
      ex = { id, exo, lecon, erreurs: 0, indice: false, fini: false };
      z.progression.textContent = `${session.mode === "lecon" ? "Exercice" : `${lecon.titre} ·`} ${session.rang + 1} / ${session.file.length}`;
      retour("", "");
      z.suivant.hidden = true; z.indice.hidden = false; z.indice.disabled = false;
      const qcm = exo.type === "qcm";
      for (const [type, inst] of Object.entries(instances)) inst.element.hidden = qcm || type !== exo.type;
      z.qcm.hidden = !qcm;
      if (qcm) {
        session.adaptateur = null;
        z.consigne.textContent = exo.question;
        z.indice.textContent = "💡 Retirer une mauvaise réponse";
        z.qcm.replaceChildren(...exo.choix.map((texte, i) => {
          const b = el("button", { type: "button", classe: "choix-qcm", "data-choix": i, texte });
          b.addEventListener("click", () => repondreQcm(i));
          return el("li", {}, b);
        }));
      } else {
        const a = adaptateur(exo.type);
        a.element.hidden = false;
        session.adaptateur = a;
        z.consigne.textContent = a.consigne ? a.consigne(exo) : exo.consigne;
        z.indice.textContent = "💡 Indice";
        a.demarrer(exo);
      }
    }

    function repondreQcm(i) {
      if (ex.fini) return;
      const b = z.qcm.querySelector(`[data-choix="${i}"]`);
      if (i !== ex.exo.bonne) { b.disabled = true; b.dataset.etat = "faux"; b.textContent = `✗ ${ex.exo.choix[i]}`; outils.erreur(); return; }
      b.dataset.etat = "juste"; b.textContent = `✓ ${ex.exo.choix[i]}`;
      for (const autre of z.qcm.querySelectorAll("button")) autre.disabled = true;
      terminerExercice();
    }

    z.indice.addEventListener("click", () => {
      if (!ex || ex.fini) return;
      ex.indice = true; z.indice.disabled = true;
      if (ex.exo.type === "qcm") {
        const faux = [...z.qcm.querySelectorAll("button:not(:disabled)")].find((b) => Number(b.dataset.choix) !== ex.exo.bonne);
        if (faux) { faux.disabled = true; faux.dataset.etat = "retire"; faux.textContent = `— ${faux.textContent}`; }
        retour("Une mauvaise réponse a été retirée.", "");
        return;
      }
      retour(`Indice : ${ex.exo.indice}`, "");
      session.adaptateur.indice(ex.exo);
    });

    function terminerExercice() {
      if (ex.fini) return;
      ex.fini = true;
      const j = jour();
      session.erreurs += ex.erreurs; session.indices += ex.indice ? 1 : 0;
      appliquer(P.enregistrerExercice(etat, { id: ex.id, erreurs: ex.erreurs, indice: ex.indice, jour: j, revision: session.mode === "revision" }));
      if (session.mode === "defi") appliquer(P.enregistrerDefi(etat, { jour: j }));
      const rappel = session.mode !== "lecon" ? ` À retenir : ${ex.lecon.retenir}` : "";
      retour(`${ex.erreurs === 0 && !ex.indice ? "Parfait ! " : "Réussi ! "}${ex.exo.explication}${rappel}`, "ok");
      z.indice.hidden = true;
      const fin = session.rang === session.file.length - 1;
      z.suivant.textContent = fin ? "Voir le bilan" : "Exercice suivant";
      z.suivant.hidden = false;
      z.suivant.focus();
    }
    z.suivant.addEventListener("click", () => {
      if (session.rang < session.file.length - 1) { session.rang += 1; demarrerExercice(); return; }
      afficherBilan();
    });

    function afficherBilan() {
      session.adaptateur?.arreter?.();
      z.exercice.hidden = true; z.bilan.hidden = false;
      const j = jour();
      if (session.mode === "lecon") {
        const n = ProgressionJeux.etoiles(session);
        appliquer(P.terminerLecon(etat, { id: session.lecon.id, etoiles: n, jour: j }));
        z.bTitre.textContent = `${etoilesTexte(n)} Leçon terminée !`;
        z.bTexte.textContent = `${n === 3 ? "Sans faute : bravo !" : n === 2 ? "Très bien ! Refais-la plus tard pour viser les 3 étoiles." : "Leçon réussie. Refais-la pour gagner des étoiles."} La stratégie « ${session.lecon.titre} » rejoint ton carnet : elle reviendra en révision demain.`;
      } else if (session.mode === "defi") {
        z.bTitre.textContent = "⚡ Défi relevé !"; z.bTexte.textContent = "Reviens demain pour un nouveau défi.";
      } else {
        z.bTitre.textContent = "🧠 Révisions terminées";
        z.bTexte.textContent = `${pluriel(session.file.length, "stratégie")} révisée${session.file.length > 1 ? "s" : ""}. Les bonnes réponses reviendront plus tard, les autres dès demain.`;
      }
      const ordre = parcours.grades.flatMap((g) => g.lecons);
      const prochaine = session.mode === "lecon" ? ordre.slice(ordre.findIndex((l) => l.id === session.lecon.id) + 1).find((l) => P.leconDebloquee(etat, l.id) && !etat.lecons[l.id]) : null;
      z.bSuite.hidden = !prochaine;
      if (prochaine) { z.bSuite.textContent = `Leçon suivante : ${prochaine.titre}`; z.bSuite.onclick = () => ouvrirLecon(prochaine.id); }
      z.bTitre.focus();
    }

    /* ---------- Commandes ---------- */
    z.reviser.addEventListener("click", reviser);
    z.defi.addEventListener("click", () => { const d = P.defiDuJour(etat, jour()); if (d && !d.fait) demarrerSession("defi", [d.id]); });
    boutonDetail.addEventListener("click", () => { confirmationEffacement = false; montrer("detail"); });
    for (const b of [retourDetail, retourSession, bRetour]) b.addEventListener("click", () => montrer("accueil"));

    afficherAccueil();
    return {
      etat: () => etat,
      /** Partie terminée dans l'onglet « Jouer » : enregistrée ici, et les gains sont renvoyés pour être affichés. */
      enregistrerPartie(partie) {
        const g = appliquer(P.enregistrerPartie(etat, { ...partie, jour: jour() }));
        if (!session) { if (vues.detail.hidden) afficherAccueil(); else afficherDetail(); }
        return g;
      },
      /** Événements de jeu (capot, belote…) comptés pour les badges. */
      compter(compteurs) {
        const g = appliquer(P.compter(etat, { compteurs }));
        if (!session) { if (vues.detail.hidden) afficherAccueil(); else afficherDetail(); }
        return g;
      }
    };
  }

  return Object.freeze({ monter, jourLocal });
})();
</script>
<script id="moteur-demineur">
/* Moteur du Démineur : règles et état d'une partie, sans DOM (testé dans Node, tests/unit/demineur.test.mjs). */
const MoteurDemineur = (() => {
  "use strict";
  const NIVEAUX = Object.freeze({
    debutant: Object.freeze({ id: "debutant", nom: "Débutant", colonnes: 9, lignes: 9, mines: 10 }),
    intermediaire: Object.freeze({ id: "intermediaire", nom: "Intermédiaire", colonnes: 16, lignes: 16, mines: 40 }),
    expert: Object.freeze({ id: "expert", nom: "Expert", colonnes: 30, lignes: 16, mines: 99 })
  });

  const nouvelleCase = () => ({ mine: false, voisines: 0, revelee: false, drapeau: false });

  /** Nouvelle partie « prête » : les mines seront placées au premier coup, pour qu'il soit toujours sûr. */
  function creerPartie(niveau) {
    const config = typeof niveau === "string" ? NIVEAUX[niveau] : niveau;
    if (!config) throw new Error(`niveau inconnu : ${niveau}`);
    const { colonnes, lignes, mines } = config;
    if (![colonnes, lignes].every((n) => Number.isInteger(n) && n > 0)) throw new Error("dimensions invalides");
    if (!Number.isInteger(mines) || mines < 0 || mines >= colonnes * lignes) throw new Error("nombre de mines invalide");
    return {
      niveau: config.id ?? "personnalise", colonnes, lignes, mines,
      cases: Array.from({ length: colonnes * lignes }, nouvelleCase),
      statut: "pret", minesPlacees: false, revelees: 0, drapeaux: 0, explosion: null
    };
  }

  const position = (partie, index) => ({ ligne: Math.floor(index / partie.colonnes), colonne: index % partie.colonnes });

  /** Indices des cases qui touchent la case (diagonales comprises). */
  function voisins(partie, index) {
    const { ligne, colonne } = position(partie, index);
    const sortie = [];
    for (let dl = -1; dl <= 1; dl++) {
      for (let dc = -1; dc <= 1; dc++) {
        const l = ligne + dl, c = colonne + dc;
        if ((dl || dc) && l >= 0 && l < partie.lignes && c >= 0 && c < partie.colonnes) sortie.push(l * partie.colonnes + c);
      }
    }
    return sortie;
  }

  function calculerVoisines(partie) {
    partie.cases.forEach((c, i) => { c.voisines = voisins(partie, i).filter((v) => partie.cases[v].mine).length; });
  }

  /** Place exactement `partie.mines` mines, hors de la case jouée et, si la place le permet, hors de ses voisines. */
  function placerMines(partie, indexSur, hasard = Math.random) {
    let interdites = new Set([indexSur, ...voisins(partie, indexSur)]);
    if (partie.cases.length - interdites.size < partie.mines) interdites = new Set([indexSur]);
    const candidates = partie.cases.map((_, i) => i).filter((i) => !interdites.has(i));
    for (let k = 0; k < partie.mines; k++) {
      const j = Math.min(candidates.length - 1, k + Math.floor(hasard() * (candidates.length - k)));
      [candidates[k], candidates[j]] = [candidates[j], candidates[k]];
      partie.cases[candidates[k]].mine = true;
    }
    partie.minesPlacees = true;
    calculerVoisines(partie);
  }

  const estTerminee = (partie) => partie.statut === "victoire" || partie.statut === "perdu";
  const minesRestantes = (partie) => partie.mines - partie.drapeaux;

  /** Ouvre la case et, si elle est vide, toutes ses voisines de proche en proche. */
  function propager(partie, depart) {
    const ouvertes = [], pile = [depart];
    while (pile.length) {
      const i = pile.pop(), c = partie.cases[i];
      if (c.revelee || c.drapeau || c.mine) continue;
      c.revelee = true; partie.revelees += 1; ouvertes.push(i);
      if (c.voisines === 0) pile.push(...voisins(partie, i));
    }
    return ouvertes;
  }

  function verifierVictoire(partie) {
    if (partie.statut !== "en-cours" || partie.revelees !== partie.cases.length - partie.mines) return;
    partie.statut = "victoire";
    for (const c of partie.cases) if (c.mine && !c.drapeau) { c.drapeau = true; partie.drapeaux += 1; }
  }

  /** Ouvre une case. Renvoie les indices des cases ouvertes (vide si le coup est sans effet). */
  function reveler(partie, index, hasard = Math.random) {
    const c = partie.cases[index];
    if (estTerminee(partie) || !c || c.revelee || c.drapeau) return [];
    if (!partie.minesPlacees) placerMines(partie, index, hasard);
    partie.statut = "en-cours";
    if (c.mine) {
      c.revelee = true; partie.explosion = index; partie.statut = "perdu";
      return [index];
    }
    const ouvertes = propager(partie, index);
    verifierVictoire(partie);
    return ouvertes;
  }

  /** Pose ou enlève un drapeau sur une case fermée. Renvoie true si quelque chose a changé. */
  function basculerDrapeau(partie, index) {
    const c = partie.cases[index];
    if (estTerminee(partie) || !c || c.revelee) return false;
    c.drapeau = !c.drapeau;
    partie.drapeaux += c.drapeau ? 1 : -1;
    return true;
  }

  /** Sur un chiffre entouré d'autant de drapeaux : ouvre ses autres voisines. */
  function revelerAutour(partie, index, hasard = Math.random) {
    const c = partie.cases[index];
    if (estTerminee(partie) || !c || !c.revelee || c.voisines === 0) return [];
    const autour = voisins(partie, index);
    if (autour.filter((v) => partie.cases[v].drapeau).length !== c.voisines) return [];
    return autour.flatMap((v) => reveler(partie, v, hasard));
  }

  /**
   * Partie construite depuis un modèle (énigmes, tests) : une chaîne par ligne,
   * « * » mine cachée, « F » mine avec drapeau, « . » case cachée sans mine, « o » case ouverte.
   */
  function depuisModele(lignes) {
    const largeur = lignes[0]?.length ?? 0;
    if (!largeur || lignes.some((l) => l.length !== largeur || /[^*F.o]/.test(l))) throw new Error("modèle invalide");
    const partie = creerPartie({ id: "modele", colonnes: largeur, lignes: lignes.length, mines: 0 });
    [...lignes.join("")].forEach((signe, i) => {
      const c = partie.cases[i];
      c.mine = signe === "*" || signe === "F";
      c.drapeau = signe === "F";
      c.revelee = signe === "o";
    });
    partie.mines = partie.cases.filter((c) => c.mine).length;
    partie.drapeaux = partie.cases.filter((c) => c.drapeau).length;
    partie.revelees = partie.cases.filter((c) => c.revelee).length;
    partie.minesPlacees = true; partie.statut = "en-cours";
    calculerVoisines(partie);
    return partie;
  }

  /**
   * Déductions certaines d'après les chiffres visibles : cases forcément sans mine et forcément minées.
   * Les drapeaux du joueur ne sont pas pris pour vrais (ils peuvent être faux). Les cases fermées touchant un chiffre
   * sont réparties en groupes indépendants, dont on énumère toutes les dispositions de mines compatibles ; un groupe
   * trop grand est ignoré (pas de déduction plutôt qu'une page figée). Avec `compterMines`, le nombre total de mines
   * sert aussi (petites positions seulement, typiquement les fins de partie et les exercices).
   */
  function deduire(partie, { compterMines = false, maxCases = 22 } = {}) {
    const { cases } = partie;
    const contraintes = [];
    cases.forEach((c, i) => {
      if (!c.revelee || c.mine) return;
      const fermees = voisins(partie, i).filter((v) => !cases[v].revelee);
      if (fermees.length) contraintes.push({ cases: fermees, mines: c.voisines - voisins(partie, i).filter((v) => cases[v].revelee && cases[v].mine).length });
    });
    const frontiere = [...new Set(contraintes.flatMap((k) => k.cases))];
    const interieur = cases.map((c, i) => i).filter((i) => !cases[i].revelee && !frontiere.includes(i));
    const sures = new Set(), mines = new Set();
    /** Énumère les dispositions d'un ensemble de cases ; renvoie, par nombre de mines, les cases toujours/jamais minées. */
    function enumerer(vars, ks) {
      const pos = new Map(vars.map((v, k) => [v, k])), valeur = new Array(vars.length).fill(-1);
      const liees = vars.map(() => []);
      ks.forEach((k, n) => k.cases.forEach((v) => liees[pos.get(v)].push(n)));
      const parNombre = new Map(); // nombre de mines → { min[], max[] } par case
      function possible(n) {
        let poses = 0, libres = 0;
        for (const v of ks[n].cases) { const x = valeur[pos.get(v)]; if (x === 1) poses += 1; else if (x === -1) libres += 1; }
        return poses <= ks[n].mines && poses + libres >= ks[n].mines;
      }
      (function explorer(k, total) {
        if (k === vars.length) {
          const r = parNombre.get(total) ?? { jamais: vars.map(() => true), toujours: vars.map(() => true) };
          valeur.forEach((x, j) => { if (x) r.jamais[j] = false; else r.toujours[j] = false; });
          parNombre.set(total, r);
          return;
        }
        for (const x of [0, 1]) {
          valeur[k] = x;
          if (liees[k].every(possible)) explorer(k + 1, total + x);
        }
        valeur[k] = -1;
      })(0, 0);
      return parNombre;
    }
    const conclure = (vars, jamais, toujours) => vars.forEach((v, j) => { if (jamais[j]) sures.add(v); if (toujours[j]) mines.add(v); });
    const restantes = partie.mines - cases.filter((c) => c.revelee && c.mine).length;
    if (compterMines && frontiere.length <= maxCases) {
      // Énumération globale, filtrée par le nombre total de mines (le reste va dans les cases intérieures).
      const parNombre = enumerer(frontiere, contraintes);
      const valides = [...parNombre.entries()].filter(([n]) => restantes - n >= 0 && restantes - n <= interieur.length);
      if (valides.length) {
        conclure(frontiere, frontiere.map((_, j) => valides.every(([, r]) => r.jamais[j])), frontiere.map((_, j) => valides.every(([, r]) => r.toujours[j])));
        if (valides.every(([n]) => restantes - n === 0)) interieur.forEach((i) => sures.add(i));
        if (valides.every(([n]) => restantes - n === interieur.length)) interieur.forEach((i) => mines.add(i));
      }
    } else {
      // Groupes indépendants : deux cases sont liées si un même chiffre les touche.
      const restant = new Set(frontiere);
      while (restant.size) {
        const groupe = [], file = [restant.values().next().value];
        restant.delete(file[0]);
        while (file.length) {
          const v = file.pop(); groupe.push(v);
          for (const k of contraintes) if (k.cases.includes(v)) for (const w of k.cases) if (restant.has(w)) { restant.delete(w); file.push(w); }
        }
        if (groupe.length > maxCases) continue;
        const ks = contraintes.filter((k) => k.cases.some((v) => groupe.includes(v)));
        const tous = [...enumerer(groupe, ks).values()];
        if (tous.length) conclure(groupe, groupe.map((_, j) => tous.every((r) => r.jamais[j])), groupe.map((_, j) => tous.every((r) => r.toujours[j])));
      }
    }
    const tri = (s) => [...s].sort((a, b) => a - b);
    return { sures: tri(sures), mines: tri(mines) };
  }

  return Object.freeze({
    NIVEAUX, creerPartie, voisins, placerMines, reveler, basculerDrapeau, revelerAutour,
    estTerminee, minesRestantes, depuisModele, position, deduire
  });
})();
</script>
<script>
(() => {
  "use strict";
  const META = JSON.parse(document.getElementById("kermiclab-meta").textContent);
  const CONFIG = { connexionActive: false, stockage: "local" };
  const Moteur = MoteurDemineur;

  /* ---------- Stockage abstrait : local (actif) / distant (stub) ---------- */
  const Stockage = {
    local: {
      lire(cle) { try { return JSON.parse(localStorage.getItem(`kermiclab:${META.id}:${cle}`)); } catch { return null; } },
      ecrire(cle, valeur) { try { localStorage.setItem(`kermiclab:${META.id}:${cle}`, JSON.stringify(valeur)); } catch { /* stockage indisponible */ } }
    },
    distant: {
      // Phase 4 : appellera le service web avec META.id et l'identifiant utilisateur.
      lire() { return null; },
      ecrire() { /* non activé dans le MVP */ }
    }
  };
  const stockage = Stockage[CONFIG.stockage];

  /* ---------- Registre des onglets ---------- */
  const registre = [];
  function enregistrerOnglet(def) { registre.push({ actif: true, ...def }); }

  const formaterTemps = (secondes) => `${Math.floor(secondes / 60)}:${String(secondes % 60).padStart(2, "0")}`;
  const borner = (x, min, max) => Math.max(min, Math.min(max, x));

  /* ---------- Vue d'une grille : rendu et entrées (souris, tactile, clavier), sans règle du jeu ---------- */
  const DELAI_APPUI_LONG = 450, TOLERANCE_APPUI = 10;

  /** Contenu, état et description d'une case pour l'affichage. Le symbole ou le chiffre suffit sans les couleurs. */
  function apparence(partie, c) {
    const perdu = partie.statut === "perdu";
    if (c.revelee && c.mine) return { texte: "💥", etat: "explosion", description: "mine touchée" };
    if (c.revelee && c.voisines) return { texte: String(c.voisines), etat: `n${c.voisines}`, description: `${c.voisines} mine${c.voisines > 1 ? "s" : ""} autour` };
    if (c.revelee) return { texte: "", etat: "vide", description: "vide, aucune mine autour" };
    if (c.drapeau && perdu && !c.mine) return { texte: "❌", etat: "erreur", description: "drapeau mal placé" };
    if (c.drapeau) return { texte: "🚩", etat: "drapeau", description: "drapeau" };
    if (perdu && c.mine) return { texte: "💣", etat: "mine", description: "mine" };
    return { texte: "", etat: "cachee", description: "cachée" };
  }

  function creerVueGrille({ libelle, surOuvrir, surDrapeau }) {
    const plateau = document.createElement("div");
    plateau.className = "plateau";
    const grille = document.createElement("div");
    grille.className = "grille";
    grille.setAttribute("role", "grid");
    grille.setAttribute("aria-label", libelle);
    plateau.appendChild(grille);
    let partie = null, transpose = false, boutons = [], courant = 0;

    // Coordonnées affichées : une grille plus large que haute peut être tournée d'un quart de tour (téléphone).
    const dimensions = () => (transpose ? { lignes: partie.colonnes, colonnes: partie.lignes } : { lignes: partie.lignes, colonnes: partie.colonnes });
    const indexDe = (l, c) => (transpose ? c * partie.colonnes + l : l * partie.colonnes + c);

    function construire(p, { transposer = false } = {}) {
      partie = p; transpose = transposer && p.colonnes !== p.lignes;
      boutons = new Array(p.cases.length);
      grille.replaceChildren();
      const { lignes, colonnes } = dimensions();
      for (let l = 0; l < lignes; l++) {
        const rangee = document.createElement("div");
        rangee.className = "rangee"; rangee.setAttribute("role", "row");
        for (let c = 0; c < colonnes; c++) {
          const i = indexDe(l, c), b = document.createElement("button");
          b.type = "button"; b.className = "case"; b.setAttribute("role", "gridcell"); b.tabIndex = -1;
          b.dataset.index = i; b.dataset.ligne = l; b.dataset.colonne = c;
          boutons[i] = b; rangee.appendChild(b);
        }
        grille.appendChild(rangee);
      }
      courant = borner(courant, 0, p.cases.length - 1);
      boutons[courant].tabIndex = 0;
      rafraichir();
    }

    function rafraichir() {
      if (Moteur.estTerminee(partie)) grille.dataset.fin = partie.statut; else delete grille.dataset.fin;
      boutons.forEach((b, i) => {
        const { texte, etat, description } = apparence(partie, partie.cases[i]);
        if (b.textContent !== texte) b.textContent = texte;
        b.dataset.etat = etat;
        b.setAttribute("aria-label", `Ligne ${Number(b.dataset.ligne) + 1}, colonne ${Number(b.dataset.colonne) + 1} : ${description}`);
      });
    }

    function marquer(i) { boutons[courant].tabIndex = -1; courant = i; boutons[i].tabIndex = 0; }
    function focaliser(i) { marquer(i); boutons[i].focus(); }
    const caseDe = (e) => e.target.closest?.("button.case");

    grille.addEventListener("keydown", (e) => {
      const b = caseDe(e);
      if (!b || e.ctrlKey && !["Home", "End"].includes(e.key) || e.metaKey || e.altKey) return;
      if (/^[dDfF]$/.test(e.key)) { e.preventDefault(); surDrapeau(Number(b.dataset.index)); return; }
      const l = Number(b.dataset.ligne), c = Number(b.dataset.colonne), { lignes, colonnes } = dimensions();
      const cibles = {
        ArrowUp: [l - 1, c], ArrowDown: [l + 1, c], ArrowLeft: [l, c - 1], ArrowRight: [l, c + 1],
        Home: [e.ctrlKey ? 0 : l, 0], End: [e.ctrlKey ? lignes - 1 : l, colonnes - 1]
      };
      const cible = cibles[e.key];
      if (!cible) return;
      e.preventDefault();
      focaliser(indexDe(borner(cible[0], 0, lignes - 1), borner(cible[1], 0, colonnes - 1)));
    });

    // Appui long (tactile, stylet) = drapeau ; le clic qui suit est ignoré. Un glissement annule l'appui (défilement).
    let appui = null, dernierPointeur = "mouse", ignorerClic = -1;
    const annulerAppui = () => { if (appui) clearTimeout(appui.minuteur); appui = null; };
    grille.addEventListener("pointerdown", (e) => {
      const b = caseDe(e);
      dernierPointeur = e.pointerType || "mouse";
      if (!b || dernierPointeur === "mouse") return;
      annulerAppui();
      const index = Number(b.dataset.index);
      appui = { x: e.clientX, y: e.clientY, minuteur: setTimeout(() => { appui = null; ignorerClic = index; surDrapeau(index); }, DELAI_APPUI_LONG) };
    });
    grille.addEventListener("pointermove", (e) => {
      if (appui && Math.hypot(e.clientX - appui.x, e.clientY - appui.y) > TOLERANCE_APPUI) annulerAppui();
    });
    for (const type of ["pointerup", "pointercancel", "pointerleave"]) grille.addEventListener(type, annulerAppui);
    grille.addEventListener("click", (e) => {
      const b = caseDe(e);
      if (!b) return;
      const index = Number(b.dataset.index);
      marquer(index);
      if (ignorerClic === index) { ignorerClic = -1; return; }
      ignorerClic = -1;
      surOuvrir(index);
    });
    grille.addEventListener("contextmenu", (e) => {
      const b = caseDe(e);
      if (!b) return;
      e.preventDefault();
      // Sur écran tactile, l'appui long déclenche aussi « contextmenu » : le minuteur s'en charge déjà.
      if (dernierPointeur !== "mouse") return;
      const index = Number(b.dataset.index);
      marquer(index);
      surDrapeau(index);
    });

    return {
      element: plateau, grille, construire, rafraichir, focaliser,
      get transpose() { return transpose; },
      /** Indice : met une case en évidence (contour pointillé) et lui donne le focus. */
      surligner(i) { for (const b of boutons) if (b) delete b.dataset.indice; boutons[i].dataset.indice = ""; focaliser(i); },
      fixerTaille(px) { grille.style.setProperty("--taille", `${px}px`); }
    };
  }

  /* ---------- Onglet explication ---------- */
  enregistrerOnglet({ id: "explication", type: "explication", titre: "Règles",
    rendu(panneau) { panneau.appendChild(document.getElementById("tpl-explication").content.cloneNode(true)); } });

  /* ---------- Onglet application : le jeu ---------- */
  const STATUTS = { pret: "Prêt", "en-cours": "En cours", victoire: "Victoire 🎉", perdu: "Perdu 💥" };
  const jeu = {};
  // Services offerts par d'autres onglets (l'Académie enregistre les parties terminées).
  const services = {};
  enregistrerOnglet({ id: "application", type: "application", titre: "Jouer",
    rendu(panneau) {
      panneau.appendChild(document.getElementById("tpl-application").content.cloneNode(true));
      const sortie = (n) => panneau.querySelector(`[data-sortie="${n}"]`);
      const bouton = (n) => panneau.querySelector(`[data-action="${n}"]`);
      const lu = stockage.lire("niveau");
      let niveau = Moteur.NIVEAUX[lu] ? lu : "debutant";
      let partie = null, modeDrapeau = false, debut = null, fin = null, minuteur = null, zoom = 0;

      const vue = creerVueGrille({ libelle: "Grille du démineur", surOuvrir: ouvrir, surDrapeau: drapeau });
      panneau.querySelector('[data-zone="plateau"]').replaceWith(vue.element);

      // La durée est figée à la fin de la partie : ni l'affichage ni un clic sur la grille terminée ne la font avancer.
      const ecoule = () => (debut === null ? 0 : Math.floor(((fin ?? Date.now()) - debut) / 1000));
      const record = () => stockage.lire(`record-${niveau}`);
      function arreterMinuteur() { clearInterval(minuteur); minuteur = null; }
      function message(texte, classe = "") { sortie("message").textContent = texte; sortie("message").className = `message ${classe}`; }

      function nouvellePartie() {
        arreterMinuteur(); debut = null; fin = null;
        partie = Moteur.creerPartie(niveau);
        for (const r of panneau.querySelectorAll('input[name="niveau"]')) r.checked = r.value === niveau;
        mettreEnPage(true);
        message("Touche une case pour commencer : le premier coup n'est jamais une mine.");
        afficher();
      }

      function ouvrir(index) {
        if (Moteur.estTerminee(partie)) return;
        const c = partie.cases[index];
        if (modeDrapeau && !c.revelee) { drapeau(index); return; }
        if (c.revelee) Moteur.revelerAutour(partie, index); else Moteur.reveler(partie, index);
        apresCoup();
      }
      function drapeau(index) { if (Moteur.basculerDrapeau(partie, index)) afficher(); }

      function apresCoup() {
        if (partie.statut === "en-cours" && debut === null) {
          debut = Date.now();
          message("");
          minuteur = setInterval(() => { sortie("temps").textContent = formaterTemps(ecoule()); }, 250);
        }
        if (Moteur.estTerminee(partie) && fin === null) terminer();
        afficher();
      }

      function terminer() {
        fin = Date.now();
        arreterMinuteur();
        const temps = ecoule();
        // Chaque partie terminée compte une fois pour l'Académie (la fin de partie n'est traitée qu'une fois).
        const gains = services.enregistrerPartie?.({ resultat: partie.statut === "perdu" ? "defaite" : "victoire", niveau, temps });
        const xp = gains?.xp ? ` (+${gains.xp} XP à l'Académie)` : "";
        if (partie.statut === "perdu") { message(`Boum ! Tu as touché une mine. Retente ta chance avec « Nouvelle partie ».${xp}`, "ko"); return; }
        const ancien = record();
        const nouveauRecord = typeof ancien !== "number" || temps < ancien;
        if (nouveauRecord) stockage.ecrire(`record-${niveau}`, temps);
        message(`Bravo, grille déminée en ${formaterTemps(temps)} !${nouveauRecord ? " Nouveau record 🏆" : ""}${xp}`, "ok");
      }

      function afficher() {
        vue.rafraichir();
        sortie("niveau").textContent = Moteur.NIVEAUX[niveau].nom;
        sortie("mines").textContent = partie.mines;
        sortie("restantes").textContent = Moteur.minesRestantes(partie);
        sortie("temps").textContent = formaterTemps(ecoule());
        sortie("statut").textContent = STATUTS[partie.statut];
        sortie("statut-zone").dataset.statut = partie.statut;
        panneau.dataset.statut = partie.statut;
        const r = record();
        sortie("record").textContent = typeof r === "number" ? formaterTemps(r) : "—";
        bouton("mode-drapeau").setAttribute("aria-pressed", String(modeDrapeau));
      }

      // Taille des cases : la grille tient dans la largeur si possible ; sinon elle défile dans son cadre, jamais la page.
      function mettreEnPage(reconstruire = false) {
        const dispo = vue.element.clientWidth - 16;
        const tactile = matchMedia("(pointer: coarse)").matches;
        const min = tactile ? 24 : 20, max = 44, ecart = 2;
        const tient = (n) => Math.floor((dispo - ecart) / n) - ecart;
        const tourner = dispo > 0 && partie.colonnes > partie.lignes && tient(partie.colonnes) < min;
        if (reconstruire || tourner !== vue.transpose) vue.construire(partie, { transposer: tourner });
        const colonnes = vue.transpose ? partie.lignes : partie.colonnes;
        const base = dispo > 0 ? borner(tient(colonnes), min, max) : 32;
        vue.fixerTaille(borner(base + zoom * 4, 16, 64));
        sortie("aide-defilement").hidden = vue.grille.offsetWidth <= vue.element.clientWidth;
      }

      for (const r of panneau.querySelectorAll('input[name="niveau"]')) {
        r.addEventListener("change", () => { niveau = r.value; stockage.ecrire("niveau", niveau); nouvellePartie(); });
      }
      bouton("nouvelle-partie").addEventListener("click", nouvellePartie);
      bouton("mode-drapeau").addEventListener("click", () => { modeDrapeau = !modeDrapeau; afficher(); });
      // Indice : le solveur montre une case sûre (ou une mine certaine), sans jamais jouer à ta place.
      bouton("indice-jeu").addEventListener("click", () => {
        if (partie.statut !== "en-cours") { message(partie.statut === "pret" ? "Commence par ouvrir une case : le premier coup est toujours sûr." : "La partie est terminée : lance une nouvelle partie.", ""); return; }
        const d = Moteur.deduire(partie, { compterMines: true });
        const sure = d.sures.find((i) => !partie.cases[i].revelee), mine = d.mines.find((i) => !partie.cases[i].drapeau);
        if (sure !== undefined) { vue.surligner(sure); message("💡 La case entourée est sûre : tu peux l'ouvrir. Sais-tu pourquoi ?", ""); }
        else if (mine !== undefined) { vue.surligner(mine); message("💡 La case entourée cache forcément une mine : pose un drapeau.", ""); }
        else message("💡 Aucune case n'est certaine : il faut prendre un risque. Choisis la case la moins dangereuse.", "");
      });
      bouton("zoom-moins").addEventListener("click", () => { zoom = Math.max(-4, zoom - 1); mettreEnPage(); });
      bouton("zoom-plus").addEventListener("click", () => { zoom = Math.min(6, zoom + 1); mettreEnPage(); });
      // Le panneau est caché au premier rendu : la mise en page se refait quand il devient visible ou change de taille.
      let largeur = -1;
      new ResizeObserver(() => {
        if (vue.element.clientWidth === largeur) return;
        largeur = vue.element.clientWidth; mettreEnPage();
      }).observe(vue.element);

      nouvellePartie();
      Object.assign(jeu, { partie: () => partie, nouvellePartie });
    } });

  /* ---------- Onglet Académie : du débutant au pro (interface commune, gabarit/jeux/academie.js) ---------- */
  const PROGRESSION = ProgressionJeux.creer(JSON.parse(document.getElementById("parcours-demineur").textContent));
  const stockageDisponible = (() => { try { localStorage.setItem("kermiclab:test", "1"); localStorage.removeItem("kermiclab:test"); return true; } catch { return false; } })();
  const academie = {};
  /** Grille d'exercice : une disposition de mines, puis les cases ouvertes au départ, comme dans une vraie partie. */
  function construireGrille({ mines, ouvrir, drapeaux = [] }) {
    const p = Moteur.depuisModele(mines);
    for (const [l, c] of ouvrir) Moteur.reveler(p, l * p.colonnes + c);
    for (const [l, c] of drapeaux) Moteur.basculerDrapeau(p, l * p.colonnes + c);
    return p;
  }

  /**
   * Exercice « grille » : chaque geste est jugé par le solveur du moteur. On n'accepte que des certitudes :
   * ouvrir une case forcément sûre, poser un drapeau sur une mine forcément présente, ouvrir d'un coup un chiffre complet.
   * Buts : « sure » (une case sûre), « mine » (une mine), « drapeaux » (toutes les mines certaines),
   * « deblayer » (toutes les cases sûres, en chaîne), « accord » (ouverture rapide d'un chiffre complet).
   */
  function adaptateurGrille(outils) {
    let ex = null, modeDrapeau = false;
    const element = document.createElement("div");
    const bascule = Object.assign(document.createElement("button"), { type: "button", className: "secondaire", textContent: "🚩 Mode drapeau" });
    bascule.dataset.action = "mode-drapeau-exercice";
    bascule.setAttribute("aria-pressed", "false");
    bascule.addEventListener("click", () => { modeDrapeau = !modeDrapeau; bascule.setAttribute("aria-pressed", String(modeDrapeau)); });
    const compteur = document.createElement("p");
    compteur.className = "doux";
    const vue = creerVueGrille({ libelle: "Grille de l'exercice", surOuvrir: (i) => (modeDrapeau && !ex?.partie.cases[i].revelee ? drapeau(i) : ouvrir(i)), surDrapeau: drapeau });
    vue.fixerTaille(40);
    element.append(compteur, vue.element, bascule);
    const deductions = () => Moteur.deduire(ex.partie, { compterMines: !!ex.exo.compterMines });
    const fermeesSures = () => deductions().sures.filter((i) => !ex.partie.cases[i].revelee);
    const minesNonMarquees = () => deductions().mines.filter((i) => !ex.partie.cases[i].drapeau);
    function afficher() {
      vue.rafraichir();
      compteur.textContent = ex.exo.compterMines ? `💣 Mines dans la grille : ${ex.partie.mines} · 🚩 drapeaux posés : ${ex.partie.drapeaux}` : "";
      compteur.hidden = !ex.exo.compterMines;
    }
    function verifierBut() {
      const b = ex.exo.but;
      const atteint = b === "drapeaux" ? minesNonMarquees().length === 0 : b === "deblayer" ? fermeesSures().length === 0 : ex.progres;
      if (atteint) { ex.fini = true; outils.reussir(); }
      else if (b === "deblayer") outils.retour(`Bien ! Encore ${fermeesSures().length > 1 ? "des cases sûres" : "une case sûre"} à trouver.`, "ok");
      else if (b === "drapeaux") outils.retour(`Juste ! Encore ${minesNonMarquees().length} mine${minesNonMarquees().length > 1 ? "s" : ""} certaine${minesNonMarquees().length > 1 ? "s" : ""}.`, "ok");
    }
    function ouvrir(i) {
      if (!ex || ex.fini) return;
      const c = ex.partie.cases[i];
      if (c.revelee) {
        // Ouverture rapide : seulement sur un chiffre complet dont les drapeaux sont tous de vraies mines.
        const autour = Moteur.voisins(ex.partie, i), drapeaux = autour.filter((v) => ex.partie.cases[v].drapeau);
        if (!c.voisines || drapeaux.length !== c.voisines || !autour.some((v) => !ex.partie.cases[v].revelee && !ex.partie.cases[v].drapeau)) {
          if (ex.exo.but === "accord") outils.erreur("Ce chiffre n'est pas complet : il lui faut autant de drapeaux autour que sa valeur, et des cases encore fermées.");
          return;
        }
        if (drapeaux.some((v) => !ex.partie.cases[v].mine)) { outils.erreur("Attention : un de tes drapeaux est faux. L'ouverture rapide aurait fait exploser une mine !"); return; }
        Moteur.revelerAutour(ex.partie, i);
        ex.progres = true; afficher(); verifierBut(); return;
      }
      if (c.drapeau) return;
      if (ex.exo.but === "mine" || ex.exo.but === "drapeaux") { outils.erreur("Ici, on cherche les mines : pose un drapeau (clic droit, appui long, touche D ou mode drapeau)."); return; }
      if (ex.exo.but === "accord") { outils.erreur("Ici, touche un chiffre complet pour ouvrir ses voisines d'un coup."); return; }
      if (!fermeesSures().includes(i)) {
        outils.erreur(c.mine ? "Boum ! Cette case cachait une mine. Cherche une case dont tu es certain." : "Cette case n'avait pas de mine… mais on ne pouvait pas en être sûr : c'était un pari. Cherche une certitude !");
        return;
      }
      Moteur.reveler(ex.partie, i);
      ex.progres = true; afficher(); verifierBut();
    }
    function drapeau(i) {
      if (!ex || ex.fini) return;
      const c = ex.partie.cases[i];
      if (c.revelee) return;
      if (c.drapeau) { Moteur.basculerDrapeau(ex.partie, i); afficher(); return; }
      if (!deductions().mines.includes(i)) {
        outils.erreur(c.mine ? "Il y a bien une mine ici, mais les chiffres ne permettaient pas encore d'en être sûr." : "Il n'y a pas de mine ici ! Un drapeau doit être une certitude.");
        return;
      }
      Moteur.basculerDrapeau(ex.partie, i); afficher();
      if (ex.exo.but === "mine") { ex.progres = true; verifierBut(); } else if (ex.exo.but === "drapeaux") verifierBut();
    }
    return {
      element,
      demarrer(exo) {
        ex = { exo, partie: construireGrille(exo.grille), progres: false, fini: false };
        modeDrapeau = false; bascule.setAttribute("aria-pressed", "false");
        vue.construire(ex.partie);
        afficher();
      },
      indice() {
        if (!ex) return;
        const d = deductions();
        const cible = ex.exo.but === "accord"
          ? ex.partie.cases.findIndex((c, i) => c.revelee && c.voisines > 0 && Moteur.voisins(ex.partie, i).filter((v) => ex.partie.cases[v].drapeau).length === c.voisines && Moteur.voisins(ex.partie, i).some((v) => !ex.partie.cases[v].revelee && !ex.partie.cases[v].drapeau))
          : ["mine", "drapeaux"].includes(ex.exo.but) ? d.mines.find((i) => !ex.partie.cases[i].drapeau) : d.sures.find((i) => !ex.partie.cases[i].revelee);
        if (cible >= 0) vue.surligner(cible);
      },
      arreter() { ex = null; }
    };
  }

  enregistrerOnglet({ id: "academie", type: "parcours", titre: "Académie",
    rendu(panneau) {
      const vue = VueAcademie.monter({
        panneau, progression: PROGRESSION, stockage, stockageDisponible, ouvrirOnglet,
        embleme: (symbole) => Object.assign(document.createElement("span"), { textContent: symbole }),
        adaptateurs: { grille: adaptateurGrille }
      });
      services.enregistrerPartie = vue.enregistrerPartie;
      Object.assign(academie, { etat: vue.etat });
    } });

  /* ---------- Onglet mise en situation : énigmes de déduction ---------- */
  const ENIGMES = [
    { titre: "Le 1 tout seul", attendu: "mine", modele: ["o*", "oo"],
      consigne: "Chaque 1 touche une seule mine, et il ne reste qu'une case fermée. Touche la case qui cache la mine.",
      indice: "Regarde les cases autour d'un 1 : laquelle est encore fermée ?",
      explication: "Bien vu ! Un 1 touche exactement une mine. Une seule case est fermée autour de lui : c'est forcément elle." },
    { titre: "La case vide qui aide", attendu: "mine", modele: ["*..", "ooo"],
      consigne: "En bas : 1, 1, puis une case vide. Touche la case qui cache la mine.",
      indice: "La case vide en bas à droite n'a aucune mine autour d'elle. Quelles cases du haut touche-t-elle ?",
      explication: "Exact ! La case vide dit « aucune mine autour de moi » : les deux cases au-dessus d'elle sont sûres. Il ne reste qu'une place pour la mine du 1 de gauche." },
    { titre: "Le motif 1-1-1", attendu: "mine", modele: [".*.", "ooo"],
      consigne: "Trois 1 côte à côte, et une seule mine en haut. Touche la case qui cache la mine.",
      indice: "Le 1 de gauche ne voit que les deux cases de gauche, le 1 de droite que les deux de droite. Quelle case voient-ils tous les deux ?",
      explication: "Parfait ! Le 1 du milieu voit les trois cases : il n'y a donc qu'une mine en tout. Les 1 de gauche et de droite la voient chacun : c'est la case du milieu." },
    { titre: "Le motif 1-2-1", attendu: "sure", modele: ["*.*", "ooo"],
      consigne: "Cette fois, trouve la case sûre (sans mine) et touche-la.",
      indice: "Si la mine était au milieu, le 1 de gauche et le 1 de droite seraient déjà contents… combien de mines verrait alors le 2 ?",
      explication: "Super déduction ! Une mine au milieu suffirait aux deux 1, et le 2 n'en verrait qu'une : impossible. Les mines sont donc dans les coins, et le milieu est sûr." }
  ];
  enregistrerOnglet({ id: "mise-en-situation", type: "mise-en-situation", titre: "Énigmes",
    rendu(panneau) {
      panneau.appendChild(document.getElementById("tpl-mise-en-situation").content.cloneNode(true));
      const sortie = (n) => panneau.querySelector(`[data-sortie="${n}"]`);
      const suivante = panneau.querySelector('[data-action="suivante"]');
      let rang = 0, partie = null, resolue = false;
      const vue = creerVueGrille({ libelle: "Grille de l'énigme", surOuvrir: choisir, surDrapeau: choisir });
      vue.fixerTaille(48);
      panneau.querySelector('[data-zone="enigme"]').replaceWith(vue.element);

      function charger(i) {
        rang = i; resolue = false;
        const e = ENIGMES[rang];
        partie = Moteur.depuisModele(e.modele);
        vue.construire(partie);
        sortie("titre").textContent = e.titre;
        sortie("progression").textContent = `Énigme ${rang + 1} / ${ENIGMES.length}`;
        sortie("consigne").textContent = e.consigne;
        sortie("retour").textContent = ""; sortie("retour").className = "message";
        suivante.hidden = true;
      }

      function choisir(index) {
        const c = partie.cases[index], e = ENIGMES[rang];
        if (resolue || c.revelee) return;
        const juste = e.attendu === "mine" ? c.mine : !c.mine;
        if (!juste) { sortie("retour").textContent = `Pas tout à fait. ${e.indice}`; sortie("retour").className = "message ko"; return; }
        resolue = true;
        if (e.attendu === "mine") { if (!c.drapeau) Moteur.basculerDrapeau(partie, index); } else Moteur.reveler(partie, index);
        vue.rafraichir();
        const derniere = rang === ENIGMES.length - 1;
        sortie("retour").textContent = `${e.explication}${derniere ? " Tu as résolu toutes les énigmes : à toi de jouer dans l'onglet « Jouer » !" : ""}`;
        sortie("retour").className = "message ok";
        suivante.textContent = derniere ? "Recommencer les énigmes" : "Énigme suivante";
        suivante.hidden = false;
      }

      suivante.addEventListener("click", () => { charger((rang + 1) % ENIGMES.length); vue.focaliser(0); });
      charger(0);
    } });

  /* ---------- Onglet self-test (prévu phase 2, désactivé) ---------- */
  enregistrerOnglet({ id: "self-test", type: "self-test", titre: "Auto-évaluation", actif: false,
    questions: [], rendu() {} });

  /* ---------- Socle : construction des onglets ---------- */
  const liste = document.getElementById("onglets"), panneaux = document.getElementById("panneaux");
  const actifs = registre.filter((o) => o.actif);
  const boutons = actifs.map((o, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.id = `onglet-${o.id}`; b.textContent = o.titre;
    b.setAttribute("aria-controls", `panneau-${o.id}`); b.dataset.onglet = o.id;
    const p = document.createElement("section");
    p.setAttribute("role", "tabpanel"); p.id = `panneau-${o.id}`; p.setAttribute("aria-labelledby", b.id); p.tabIndex = 0;
    o.rendu(p); panneaux.appendChild(p); liste.appendChild(b);
    b.addEventListener("click", () => choisir(i));
    return b;
  });
  function choisir(i) {
    boutons.forEach((b, j) => {
      const sel = i === j; b.setAttribute("aria-selected", String(sel)); b.tabIndex = sel ? 0 : -1;
      document.getElementById(b.getAttribute("aria-controls")).hidden = !sel;
    });
    stockage.ecrire("onglet", actifs[i].id);
  }
  function ouvrirOnglet(id) { const i = actifs.findIndex((o) => o.id === id); if (i >= 0) { choisir(i); boutons[i].focus(); } }
  liste.addEventListener("keydown", (e) => {
    const i = boutons.indexOf(document.activeElement); if (i < 0) return;
    const n = e.key === "ArrowRight" ? (i + 1) % boutons.length : e.key === "ArrowLeft" ? (i - 1 + boutons.length) % boutons.length : -1;
    if (n >= 0) { choisir(n); boutons[n].focus(); e.preventDefault(); }
  });
  // Un jeu s'ouvre directement sur l'onglet « Jouer » (sauf si un autre onglet a été mémorisé).
  const memo = actifs.findIndex((o) => o.id === stockage.lire("onglet"));
  choisir(memo >= 0 ? memo : Math.max(0, actifs.findIndex((o) => o.id === "application")));

  document.getElementById("connexion").hidden = !CONFIG.connexionActive;
  window.kermiclab = { META, registre, CONFIG, demineur: jeu, academie };
})();
</script>
