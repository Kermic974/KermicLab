<script id="trophees" data-inclure="gabarit/jeux/trophees.js">
// Pont local des pages autonomes : aucun réseau, et aucun accès au stockage du parent.
const Trophees = (() => {
  function monter({ restaurer, resumer }) {
    if (window.parent === window) return () => {};
    const meta = JSON.parse(document.getElementById("kermiclab-meta").textContent);
    const module = meta.id;
    const origineParent = meta.parentOrigin || (document.referrer ? new URL(document.referrer).origin : null);
    if (!origineParent) return () => {};
    let pret = false;
    const publier = () => {
      if (pret) window.parent.postMessage({ type: "kermiclab:trophees:progres", module, ...resumer() }, origineParent);
    };
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent || e.origin !== origineParent || e.data?.type !== "kermiclab:trophees:charger" || e.data.module !== module || pret) return;
      if (e.data.etat !== null) restaurer(e.data.etat);
      pret = true;
      publier();
    });
    window.parent.postMessage({ type: "kermiclab:trophees:pret", module }, origineParent);
    return publier;
  }
  return Object.freeze({ monter });
})();
</script>

<script id="moteur-mots-croises">
const MoteurMotsCroises = (() => {
  const normaliser = (mot) => mot.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z]/g, "");
  function creerGrille(etape) {
    if (!etape?.verticale?.mot || !Array.isArray(etape.horizontales) || etape.horizontales.length !== etape.verticale.mot.length) {
      throw new Error("grille invalide : une définition horizontale est requise par lettre verticale");
    }
    const vertical = normaliser(etape.verticale.mot);
    if (vertical.length !== etape.verticale.mot.length || !vertical) throw new Error("mot vertical invalide");
    const colVerticale = 6;
    const mots = [{ ...etape.verticale, mot: vertical, direction: "vertical", id: "v" }];
    etape.horizontales.forEach((entree, ligne) => {
      const mot = normaliser(entree.mot);
      const croisement = entree.croisement ?? 0;
      if (!mot || !Number.isInteger(croisement) || croisement < 0 || croisement >= mot.length
        || mot[croisement] !== vertical[ligne] || !entree.indice?.trim()) throw new Error(`croisement invalide à la ligne ${ligne + 1}`);
      mots.push({ ...entree, mot, direction: "horizontal", id: `h${ligne}` });
    });
    const colonnes = Math.max(15, colVerticale + Math.max(...mots.map((m) => m.direction === "horizontal" ? m.mot.length - (m.croisement || 0) : 1)));
    const cases = Array.from({ length: vertical.length }, () => Array(colonnes).fill(null));
    for (const mot of mots) {
      mot.cases = Array.from({ length: mot.mot.length }, (_, i) => ({
        ligne: mot.direction === "vertical" ? i : Number(mot.id.slice(1)),
        colonne: mot.direction === "vertical" ? colVerticale : colVerticale + i - (mot.croisement || 0)
      }));
      mot.cases.forEach(({ ligne, colonne }, i) => {
        if (cases[ligne][colonne] && cases[ligne][colonne] !== mot.mot[i]) throw new Error(`lettres incompatibles : ${mot.id}`);
        cases[ligne][colonne] = mot.mot[i];
      });
    }
    return { lignes: vertical.length, colonnes, cases, mots };
  }
  function verifier(grille, saisie) {
    const incompletes = [], erreurs = [];
    for (let l = 0; l < grille.lignes; l++) for (let c = 0; c < grille.colonnes; c++) {
      const attendu = grille.cases[l][c];
      if (!attendu) continue;
      if (!saisie[l]?.[c]) incompletes.push({ ligne: l, colonne: c });
      else if (saisie[l][c] !== attendu) erreurs.push({ ligne: l, colonne: c });
    }
    return { incompletes, erreurs, resolu: incompletes.length === 0 && erreurs.length === 0 };
  }
  function prochainIndice(grille, saisie, mot) {
    const cases = mot?.cases ?? grille.cases.flatMap((rangee, ligne) => rangee.map((lettre, colonne) => lettre ? { ligne, colonne } : null).filter(Boolean));
    const cible = cases.find(({ ligne, colonne }) => !saisie[ligne][colonne]);
    return cible ? { ...cible, lettre: grille.cases[cible.ligne][cible.colonne] } : null;
  }
  return Object.freeze({ normaliser, creerGrille, verifier, prochainIndice });
})();
</script>
<script>
(() => {

      grilleEl.style.gridTemplateColumns = `repeat(${definition.colonnes}, minmax(0, 1fr))`;
      grilleEl.setAttribute("aria-rowcount", String(definition.lignes));
      grilleEl.setAttribute("aria-colcount", String(definition.colonnes));
      const elements = [];
      for (let l = 0; l < definition.lignes; l++) for (let c = 0; c < definition.colonnes; c++) {
        const attendu = definition.cases[l][c];
        if (!attendu) { const noire = document.createElement("span"); noire.className = "noire"; noire.setAttribute("aria-hidden", "true"); grilleEl.append(noire); continue; }
        const b = document.createElement("button"); b.type = "button"; b.className = "case"; b.setAttribute("role", "gridcell");
        b.setAttribute("aria-label", `Ligne ${l + 1}, colonne ${c + 1}${saisie[l][c] ? `, ${saisie[l][c]}` : ", vide"}`);
        if (motCases.has(`${l}:${c}`)) b.classList.add("dans-mot");
        if (caseActive.ligne === l && caseActive.colonne === c) b.classList.add("selection");
        if (erreurs.some((x) => x.ligne === l && x.colonne === c)) b.classList.add("erreur");
        const numero = (definition.mots.find((m) => m.cases[0].ligne === l && m.cases[0].colonne === c));
        if (numero) { const n = document.createElement("span"); n.className = "numero"; n.textContent = String(definition.mots.indexOf(numero) + 1); b.append(n); }
        b.append(document.createTextNode(saisie[l][c] || ""));
        b.addEventListener("click", () => {
          const options = motsDeCase({ ligne: l, colonne: c });
          motActif = options.find((m) => m.direction === motActif.direction) || options[0];
          caseActive = { ligne: l, colonne: c }; afficher(true);
        });
        b.addEventListener("keydown", (e) => {
          if (/^[a-z]$/i.test(e.key)) { e.preventDefault(); saisir(M.normaliser(e.key)); }
          else if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); saisir(""); }
          else if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "ArrowLeft" || e.key === "ArrowUp") {
            e.preventDefault(); const pas = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : -1;
            const i = motActif.cases.findIndex((x) => x.ligne === l && x.colonne === c);
            caseActive = motActif.cases[Math.max(0, Math.min(motActif.cases.length - 1, i + pas))]; afficher(true);
          }
        });
        elements.push({ ligne: l, colonne: c, element: b }); grilleEl.append(b);
      }
      definitions.replaceChildren();
      for (const sens of ["horizontal", "vertical"]) {
        const bloc = document.createElement("section"), titre = document.createElement("h3");
        titre.textContent = sens === "horizontal" ? "Horizontales" : "Verticales"; bloc.append(titre);
        const liste = document.createElement("div");
        definition.mots.filter((m) => m.direction === sens).forEach((m, i) => {
          const b = document.createElement("button"); b.type = "button"; b.className = "clue";
          b.setAttribute("aria-pressed", String(m.id === motActif.id));
          b.textContent = `${definition.mots.indexOf(m) + 1}. ${m.indice}`;
          b.addEventListener("click", () => { motActif = m; caseActive = m.cases[0]; afficher(true); });
          liste.append(b);
        });
        bloc.append(liste); definitions.append(bloc);
      }
      boutonsNiveau.forEach((b, i) => { b.setAttribute("aria-pressed", String(rang === i)); b.disabled = i > progression.ouvert; });
      if (focaliser) elements.find((x) => x.ligne === caseActive.ligne && x.colonne === caseActive.colonne)?.element.focus();
    }
    function verifier() {
      const bilan = M.verifier(etapes[rang].grille, saisie); erreurs = bilan.erreurs;
      if (bilan.resolu) terminer();
      else {
        afficher();
        annoncer(bilan.erreurs.length ? `${bilan.erreurs.length} lettre${bilan.erreurs.length > 1 ? "s" : ""} à corriger.` : `${bilan.incompletes.length} case${bilan.incompletes.length > 1 ? "s" : ""} encore vide${bilan.incompletes.length > 1 ? "s" : ""}.`, bilan.erreurs.length ? "ko" : "");
      }
    }
    function terminer() {
      terminee = true;
      if (!progression.terminees.includes(etapes[rang].id)) progression.terminees.push(etapes[rang].id);
      if (rang === progression.ouvert && progression.ouvert < etapes.length - 1) progression.ouvert++;
      stockage.ecrire(progression); afficher();
      const prochain = progression.ouvert > rang ? ` Le grade ${etapes[progression.ouvert].nom} est débloqué !` : " Tu as terminé tous les grades : tu es un pro des mots croisés !";
      annoncer(`Grille résolue ! 🎉${prochain}`, "ok"); actualiserAcademie();
    }
    function saisir(lettre) {
      if (terminee) return;
      const { ligne, colonne } = caseActive;
      saisie[ligne][colonne] = lettre || "";
      erreurs = [];
      const i = motActif.cases.findIndex((x) => x.ligne === ligne && x.colonne === colonne);
      if (lettre && i < motActif.cases.length - 1) caseActive = motActif.cases[i + 1];
      afficher(true);
      if (M.verifier(etapes[rang].grille, saisie).resolu) verifier();
    }
    function demarrer(i) {
      rang = i; const definition = etapes[rang].grille;
      saisie = Array.from({ length: definition.lignes }, () => Array(definition.colonnes).fill(""));
      motActif = definition.mots[1]; caseActive = motActif.cases[0]; erreurs = []; terminee = false;
      texte(objectif, `${etapes[rang].icone} ${etapes[rang].nom} — ${etapes[rang].conseil}`);
      afficher(); annoncer("Choisis une définition, puis saisis les lettres.");
    }
    p.querySelector('[data-action="nouveau"]').addEventListener("click", () => demarrer(rang));
    p.querySelector('[data-action="indice"]').addEventListener("click", () => {
      if (terminee) return;
      const indice = M.prochainIndice(etapes[rang].grille, saisie, motActif);
      if (!indice) { annoncer("Ce mot est déjà rempli."); return; }
      saisie[indice.ligne][indice.colonne] = indice.lettre;
      caseActive = indice;
      afficher(true); annoncer(`Indice : la lettre ${indice.lettre}.`, "ok");
      if (M.verifier(etapes[rang].grille, saisie).resolu) verifier();
    });
    p.querySelector('[data-action="verifier"]').addEventListener("click", verifier);
    jeu.demarrer = demarrer;
    demarrer(rang);
  } });

  function actualiserAcademie() {
    if (!academie.zone) return;
    academie.progres.textContent = `${progression.terminees.length} / ${etapes.length} grilles résolues — ${progression.ouvert + 1} / ${etapes.length} grades débloqués`;
    academie.zone.replaceChildren();
    etapes.forEach((e, i) => {
      const carte = document.createElement("article"), h = document.createElement("h3"), desc = document.createElement("p"), conseil = document.createElement("p"), bouton = document.createElement("button");
      carte.className = `grade${i > progression.ouvert ? " verrouille" : ""}`;
      h.textContent = `${e.icone} ${progression.terminees.includes(e.id) ? "✓ " : ""}${e.nom}`;
      desc.textContent = e.description; conseil.textContent = `À retenir : ${e.conseil}`;
      bouton.type = "button"; bouton.className = i > progression.ouvert ? "secondaire" : "action"; bouton.disabled = i > progression.ouvert;
      bouton.textContent = i > progression.ouvert ? "🔒 Résous le grade précédent" : "Jouer cette étape";
      bouton.addEventListener("click", () => { jeu.demarrer(i); ouvrirOnglet("application"); });
      carte.append(h, desc, conseil, bouton); academie.zone.append(carte);
    });
  }
  const academie = {};
  enregistrerOnglet({ id: "academie", titre: "Académie", rendu(p) {
    p.append(document.getElementById("tpl-academie").content.cloneNode(true));
    academie.zone = p.querySelector('[data-zone="grades"]'); academie.progres = p.querySelector('[data-sortie="progression"]');
    actualiserAcademie();
  } });
  enregistrerOnglet({ id: "mise-en-situation", titre: "Défis", rendu(p) {
    p.append(document.getElementById("tpl-defis").content.cloneNode(true));
    p.querySelector('[data-action="defi"]').addEventListener("click", () => { jeu.demarrer(0); ouvrirOnglet("application"); });
  } });
  enregistrerOnglet({ id: "self-test", titre: "Auto-évaluation", actif: false, rendu() {} });
  const actifs = registre.filter((o) => o.actif !== false);
  for (const [i, o] of actifs.entries()) {
    const b = document.createElement("button"), section = document.createElement("section");
    b.type = "button"; b.id = `onglet-${o.id}`; b.setAttribute("role", "tab"); b.setAttribute("aria-controls", `panneau-${o.id}`);
    const actif = o.id === "application";
    b.setAttribute("aria-selected", String(actif)); b.tabIndex = actif ? 0 : -1; b.textContent = o.titre; b.dataset.id = o.id;
    section.id = `panneau-${o.id}`; section.setAttribute("role", "tabpanel"); section.setAttribute("aria-labelledby", b.id); section.tabIndex = 0; section.hidden = !actif;
    o.rendu(section); onglets.append(b); panneaux.append(section);
    b.addEventListener("click", () => ouvrirOnglet(o.id));
    b.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault(); const prochain = (i + (e.key === "ArrowRight" ? 1 : -1) + actifs.length) % actifs.length;
      ouvrirOnglet(actifs[prochain].id); onglets.children[prochain].focus();
    });
  }
  ouvrirOnglet = (id) => actifs.forEach((o) => {
    const actif = o.id === id, b = onglets.querySelector(`[data-id="${o.id}"]`), section = document.getElementById(`panneau-${o.id}`);
    b.setAttribute("aria-selected", String(actif)); b.tabIndex = actif ? 0 : -1; section.hidden = !actif;
  });
})();
</script>
</body>
</html>
