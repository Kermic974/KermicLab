<script id="trophees" data-inclure="gabarit/jeux/trophees.js">
// Pont local des pages autonomes : aucun réseau, et aucun accès au stockage du parent.
const Trophees = (() => {
  function monter({ restaurer, resumer }) {
    if (window.parent === window) return () => {};
    const module = JSON.parse(document.getElementById("kermiclab-meta").textContent).id;
    let pret = false;
    const publier = () => {
      if (pret) window.parent.postMessage({ type: "kermiclab:trophees:progres", module, ...resumer() }, "*");
    };
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent || e.data?.type !== "kermiclab:trophees:charger" || e.data.module !== module || pret) return;
      if (e.data.etat !== null) restaurer(e.data.etat);
      pret = true;
      publier();
    });
    window.parent.postMessage({ type: "kermiclab:trophees:pret", module }, "*");
    return publier;
  }
  return Object.freeze({ monter });
})();
</script>

<script id="moteur-2048">
const Moteur2048 = (() => {
  const TAILLE = 4;
  const NIVEAUX = [
    { id: "noob", nom: "Noob", cible: 16, description: "Découvre les déplacements et les premières fusions.", conseil: "Garde tes petites tuiles côte à côte." },
    { id: "debutant", nom: "Débutant", cible: 32, description: "Commence à ranger les tuiles dans un coin.", conseil: "Choisis un coin pour ta plus grande tuile." },
    { id: "intermediaire", nom: "Intermédiaire", cible: 64, description: "Enchaîne plusieurs fusions en protégeant ton espace.", conseil: "Évite de déplacer ta grande tuile hors de son coin." },
    { id: "avance", nom: "Avancé", cible: 128, description: "Organise les valeurs pour préparer des chaînes.", conseil: "Garde une ligne ordonnée du plus grand au plus petit." },
    { id: "pro", nom: "Pro", cible: 2048, description: "Maîtrise le plateau et atteins la tuile 2048.", conseil: "Anticipe la prochaine fusion avant chaque déplacement." }
  ];
  function creerPartie(hasard = Math.random) {
    const partie = { grille: Array(TAILLE * TAILLE).fill(0), score: 0, terminee: false };
    ajouterTuile(partie, hasard);
    ajouterTuile(partie, hasard);
    return partie;
  }
  function ajouterTuile(partie, hasard = Math.random) {
    const vides = partie.grille.map((n, i) => n === 0 ? i : -1).filter((i) => i >= 0);
    if (!vides.length) return null;
    const index = vides[Math.min(vides.length - 1, Math.max(0, Math.floor(hasard() * vides.length)))];
    partie.grille[index] = hasard() < 0.9 ? 2 : 4;
    return index;
  }
  function peutBouger(grille) {
    for (let i = 0; i < grille.length; i++) {
      if (!grille[i]) return true;
      if (i % TAILLE < TAILLE - 1 && grille[i] === grille[i + 1]) return true;
      if (i < grille.length - TAILLE && grille[i] === grille[i + TAILLE]) return true;
    }
    return false;
  }
  function deplacer(partie, direction, hasard = Math.random) {
    if (!["up", "down", "left", "right"].includes(direction)) throw new Error(`direction inconnue : ${direction}`);
    const avant = [...partie.grille];
    let gagne = 0;
    for (let ligne = 0; ligne < TAILLE; ligne++) {
      const indices = Array.from({ length: TAILLE }, (_, i) => {
        if (direction === "left") return ligne * TAILLE + i;
        if (direction === "right") return ligne * TAILLE + (TAILLE - 1 - i);
        if (direction === "up") return i * TAILLE + ligne;
        return (TAILLE - 1 - i) * TAILLE + ligne;
      });
      const valeurs = indices.map((i) => avant[i]).filter(Boolean), resultat = [];
      for (let i = 0; i < valeurs.length; i++) {
        if (valeurs[i] === valeurs[i + 1]) {
          const fusion = valeurs[i] * 2;
          resultat.push(fusion); gagne += fusion; i++;
        } else resultat.push(valeurs[i]);
      }
      while (resultat.length < TAILLE) resultat.push(0);
      indices.forEach((index, i) => { partie.grille[index] = resultat[i]; });
    }
    const deplace = partie.grille.some((n, i) => n !== avant[i]);
    if (deplace) {
      partie.score += gagne;
      ajouterTuile(partie, hasard);
    }
    partie.terminee = !peutBouger(partie.grille);
    return { deplace, fusionne: gagne, score: partie.score, terminee: partie.terminee };
  }
  return Object.freeze({ TAILLE, NIVEAUX, creerPartie, ajouterTuile, peutBouger, deplacer });
})();
</script>
<script>
(() => {
  const M = Moteur2048, registre = [];
  function enregistrerOnglet(def) { registre.push(def); }
  const panneaux = document.getElementById("panneaux"), onglets = document.getElementById("onglets");
  const stockage = (() => {
    try {
      return {
        lire() {
          try { return JSON.parse(localStorage.getItem("kermiclab:2048") || '{"debloque":0,"record":0,"meilleureTuile":0}'); }
          catch { return { debloque: 0, record: 0, meilleureTuile: 0 }; }
        },
        ecrire(valeur) { try { localStorage.setItem("kermiclab:2048", JSON.stringify(valeur)); } catch { /* iframe isolée : le parent conserve la progression */ } publier(); }
      };
    } catch { return { lire: () => ({ debloque: 0, record: 0, meilleureTuile: 0 }), ecrire() {} }; }
  })();
  const progression = stockage.lire();
  progression.debloque = Number.isInteger(progression.debloque) ? Math.max(0, Math.min(M.NIVEAUX.length - 1, progression.debloque)) : 0;
  progression.record = Number.isFinite(progression.record) ? Math.max(0, progression.record) : 0;
  progression.meilleureTuile = Number.isFinite(progression.meilleureTuile) ? Math.max(0, progression.meilleureTuile) : 0;
  let ouvrirOnglet = () => {};
  const academie = {};
  let jeu = {};
  const publier = Trophees.monter({
    restaurer(brut) {
      progression.debloque = Number.isInteger(brut?.debloque) ? Math.max(0, Math.min(M.NIVEAUX.length - 1, brut.debloque)) : 0;
      progression.record = Number.isSafeInteger(brut?.record) && brut.record >= 0 ? brut.record : 0;
      progression.meilleureTuile = Number.isSafeInteger(brut?.meilleureTuile) && brut.meilleureTuile >= 0 ? brut.meilleureTuile : 0;
      afficherAcademie();
      jeu.demarrer(progression.debloque);
    },
    resumer: () => ({ genre: "jeux", etat: progression, record: progression.record, badges: M.NIVEAUX.map((n) => ({
      id: String(n.cible), nom: n.nom, description: `${n.cible}`, icone: "🏆",
      actuel: Math.min(progression.meilleureTuile, n.cible), cible: n.cible, obtenu: progression.meilleureTuile >= n.cible
    })) })
  });

  enregistrerOnglet({ id: "explication", titre: "Règles", rendu(p) { p.append(document.getElementById("tpl-regles").content.cloneNode(true)); } });
  enregistrerOnglet({ id: "application", titre: "Jouer", rendu(p) {
    p.append(document.getElementById("tpl-jeu").content.cloneNode(true));
    const plateau = p.querySelector('[data-zone="plateau"]'), sortieScore = p.querySelector('[data-sortie="score"]');
    const sortieRecord = p.querySelector('[data-sortie="record"]'), objectif = p.querySelector('[data-sortie="objectif"]');
    const message = p.querySelector('[data-sortie="message"]'), boutonsNiveau = [];
    let partie, rang = progression.debloque, gagne = false, debutGlisse = null;
    function annoncer(texte, classe = "") { message.textContent = texte; message.className = `message ${classe}`; }
    function afficher() {
      plateau.replaceChildren();
      for (const valeur of partie.grille) {
        const tuile = document.createElement("div");
        tuile.className = "tuile"; tuile.setAttribute("role", "gridcell");
        tuile.setAttribute("aria-label", valeur ? String(valeur) : "vide");
        tuile.dataset.valeur = valeur ? String(valeur) : ""; tuile.textContent = valeur ? String(valeur) : "";
        plateau.append(tuile);
      }
      sortieScore.textContent = String(partie.score);
      sortieRecord.textContent = String(progression.record);
      boutonsNiveau.forEach((b, i) => { b.setAttribute("aria-pressed", String(rang === i)); b.disabled = i > progression.debloque; });
      objectif.textContent = `${M.NIVEAUX[rang].nom} : atteins la tuile ${M.NIVEAUX[rang].cible}.`;
    }
    function demarrer(i = rang) {
      rang = i; partie = M.creerPartie(); gagne = false;
      afficher(); annoncer("À toi de jouer : utilise les flèches ou glisse sur le plateau.");
    }
    function majProgression() {
      const max = Math.max(...partie.grille);
      progression.record = Math.max(progression.record, partie.score);
      progression.meilleureTuile = Math.max(progression.meilleureTuile, max);
      M.NIVEAUX.forEach((niveau, i) => { if (progression.meilleureTuile >= niveau.cible) progression.debloque = Math.max(progression.debloque, i); });
      stockage.ecrire(progression);
      if (academie.zone) afficherAcademie();
    }
    function agir(direction) {
      if (!partie || partie.terminee) return;
      const resultat = M.deplacer(partie, direction);
      if (!resultat.deplace && !resultat.terminee) return;
      majProgression(); afficher();
      const max = Math.max(...partie.grille);
      if (!gagne && max >= M.NIVEAUX[rang].cible) {
        gagne = true;
        const prochain = progression.debloque > rang ? ` Grade ${M.NIVEAUX[progression.debloque].nom} débloqué !` : "";
        annoncer(`Bravo ! Objectif ${M.NIVEAUX[rang].cible} atteint !${prochain}`, "ok");
      } else if (resultat.terminee) annoncer("Plus de déplacement possible. Lance une nouvelle partie !");
      else if (resultat.fusionne) annoncer(`Fusion ! +${resultat.fusionne} points.`, "ok");
      else if (resultat.deplace) annoncer("Bien joué, une nouvelle tuile est apparue.");
    }
    M.NIVEAUX.forEach((niveau, i) => {
      const b = document.createElement("button"); b.className = "secondaire"; b.type = "button";
      b.append(document.createTextNode(`${niveau.nom} `));
      const detail = document.createElement("small"); detail.textContent = `Objectif ${niveau.cible}`; b.append(detail);
      b.addEventListener("click", () => { if (i <= progression.debloque) demarrer(i); });
      plateau.parentElement.querySelector('[data-zone="niveaux"]').append(b); boutonsNiveau.push(b);
    });
    p.querySelectorAll("[data-direction]").forEach((b) => b.addEventListener("click", () => agir(b.dataset.direction)));
    p.querySelector('[data-action="nouvelle"]').addEventListener("click", () => demarrer());
    plateau.addEventListener("pointerdown", (e) => { debutGlisse = { x: e.clientX, y: e.clientY }; });
    plateau.addEventListener("pointerup", (e) => {
      if (!debutGlisse) return;
      const dx = e.clientX - debutGlisse.x, dy = e.clientY - debutGlisse.y; debutGlisse = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      agir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    });
    jeu = { demarrer, agir };
    demarrer(rang);
  } });

  function afficherAcademie() {
    if (!academie.zone) return;
    academie.progres.textContent = `Grades débloqués : ${progression.debloque + 1} / ${M.NIVEAUX.length} · meilleur record : ${progression.record}`;
    academie.zone.replaceChildren();
    M.NIVEAUX.forEach((niveau, i) => {
      const carte = document.createElement("article"), h = document.createElement("h3");
      const desc = document.createElement("p"), conseil = document.createElement("p"), bouton = document.createElement("button");
      carte.className = `grade${i > progression.debloque ? " verrouille" : ""}`;
      h.textContent = `${i < progression.debloque ? "✓ " : ""}${niveau.nom}`;
      desc.textContent = `${niveau.description} Objectif : ${niveau.cible}.`;
      conseil.textContent = `À retenir : ${niveau.conseil}`;
      bouton.type = "button"; bouton.className = i > progression.debloque ? "secondaire" : "action"; bouton.disabled = i > progression.debloque;
      bouton.textContent = i > progression.debloque ? "🔒 Atteins le grade précédent" : "Jouer ce grade";
      bouton.addEventListener("click", () => { jeu.demarrer(i); ouvrirOnglet("application"); });
      carte.append(h, desc, conseil, bouton); academie.zone.append(carte);
    });
  }
  enregistrerOnglet({ id: "academie", titre: "Académie", rendu(p) {
    p.append(document.getElementById("tpl-academie").content.cloneNode(true));
    academie.zone = p.querySelector('[data-zone="grades"]'); academie.progres = p.querySelector('[data-sortie="progression"]');
    afficherAcademie();
  } });
  enregistrerOnglet({ id: "mise-en-situation", titre: "Défis", rendu(p) {
    p.append(document.getElementById("tpl-defis").content.cloneNode(true));
    p.querySelector('[data-action="defi"]').addEventListener("click", () => { jeu.demarrer(0); ouvrirOnglet("application"); });
  } });
  enregistrerOnglet({ id: "self-test", titre: "Auto-évaluation", actif: false, rendu() {} });
  document.addEventListener("keydown", (e) => {
    const direction = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
    if (!direction || !document.getElementById("panneau-application") || document.getElementById("panneau-application").hidden) return;
    if (e.target.closest("button, input, textarea, select")) return;
    e.preventDefault(); jeu.agir(direction);
  });

  const actifs = registre.filter((o) => o.actif !== false);
  for (const [i, o] of actifs.entries()) {
    const b = document.createElement("button"), section = document.createElement("section");
    b.type = "button"; b.id = `onglet-${o.id}`; b.setAttribute("role", "tab"); b.setAttribute("aria-controls", `panneau-${o.id}`);
    const actif = o.id === "application";
    b.setAttribute("aria-selected", String(actif)); b.tabIndex = actif ? 0 : -1; b.textContent = o.titre; b.dataset.id = o.id;
    section.id = `panneau-${o.id}`; section.setAttribute("role", "tabpanel"); section.setAttribute("aria-labelledby", b.id); section.tabIndex = 0; section.hidden = !actif;
    o.rendu(section); onglets.append(b); panneaux.append(section);
    b.addEventListener("click", () => ouvrirOnglet(o.id));
    b.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault(); const prochain = (i + (e.key === "ArrowRight" ? 1 : -1) + actifs.length) % actifs.length;
      ouvrirOnglet(actifs[prochain].id); onglets.children[prochain].focus();
    });
  }
  ouvrirOnglet = (id) => {
    actifs.forEach((o) => {
      const actif = o.id === id, b = onglets.querySelector(`[data-id="${o.id}"]`), p = document.getElementById(`panneau-${o.id}`);
      b.setAttribute("aria-selected", String(actif)); b.tabIndex = actif ? 0 : -1; p.hidden = !actif;
    });
  };
})();
</script>
</body>
