      z.actionConseil.onclick = () => (conseil.type === "revision" ? reviser() : conseil.type === "jouer" ? ouvrirOnglet?.("application") : ouvrirLecon(conseil.lecon));
      const dues = P.revisionsDues(etat, j);
      z.reviser.textContent = `🧠 Révisions (${dues.length})`; z.reviser.disabled = dues.length === 0;
      const defi = P.defiDuJour(etat, j);
      z.defi.textContent = defi?.fait ? "⚡ Défi du jour relevé ✓" : `⚡ Défi du jour (+${ProgressionJeux.XP.defi} XP)`;
      z.defi.disabled = !defi || defi.fait;
      // Prochain badge : celui qui est le plus près d'être gagné.
      const prochain = tous.filter((b) => !b.obtenu).sort((a, b) => b.actuel / b.cible - a.actuel / a.cible)[0];
      z.prochainBadge.replaceChildren(...(prochain ? [el("span", { classe: "doux", texte: "Prochain badge : " }),
        el("strong", { texte: `${prochain.icone} ${prochain.nom}` }), el("span", { texte: ` — ${prochain.description} (${prochain.actuel} / ${prochain.cible})` })]
        : [el("strong", { texte: "🏆 Tous les badges sont gagnés. Bravo !" })]));
      // Parcours
      z.parcours.replaceChildren(...parcours.grades.map((g, gi) => {
        const faites = g.lecons.filter((l) => etat.lecons[l.id]).length, ouvert = P.leconDebloquee(etat, g.lecons[0].id);
        const etatGrade = faites === g.lecons.length ? "✓ obtenu" : ouvert ? `${faites} / ${g.lecons.length}` : `🔒 termine le grade ${parcours.grades[gi - 1].nom}`;
        return el("li", { classe: `grade${ouvert ? "" : " verrouille"}`, "data-grade": g.id },
          el("div", { classe: "grade-entete" }, el("span", { classe: "grade-embleme", "aria-hidden": "true" }, embleme(g.embleme)),
            el("div", {}, el("h3", { texte: `${gi + 1}. ${g.nom}` }), el("p", { classe: "doux", texte: g.sousTitre })),
            el("span", { classe: "grade-etat", texte: etatGrade })),
          el("ul", { classe: "lecons" }, ...g.lecons.map((l) => {
            const fait = etat.lecons[l.id], libre = P.leconDebloquee(etat, l.id);
            const b = el("button", { type: "button", classe: `lecon${fait ? " faite" : ""}`, "data-lecon": l.id, disabled: !libre,
              "aria-label": `${l.titre}, ${parcours.themes[l.theme]}, ${fait ? `${pluriel(fait.etoiles, "étoile")} sur 3` : libre ? "à faire" : "verrouillée"}` },
              el("span", { classe: "lecon-titre", texte: l.titre }), el("span", { classe: "lecon-theme", texte: parcours.themes[l.theme] }),
              el("span", { classe: "lecon-etoiles", "aria-hidden": "true", texte: fait ? etoilesTexte(fait.etoiles) : libre ? "Nouveau" : "🔒" }));
            b.addEventListener("click", () => ouvrirLecon(l.id));
            return el("li", {}, b);
          })));
      }));
    }

    /* ---------- Page détaillée « Ma progression » ---------- */
    function afficherDetail() {
      const j = jour(), niv = P.niveau(etat.xp), obtenus = P.gradesObtenus(etat);
      z.dNiveau.replaceChildren(
        el("p", {}, el("strong", { texte: `Niveau ${niv.niveau}` }), el("span", { texte: ` · ${etat.xp} XP au total · ${P.titre(etat)}` })),
        barre(niv.xpDansNiveau, niv.xpPourNiveau, "Progression vers le niveau suivant"),
        el("p", { classe: "doux", texte: `${niv.xpDansNiveau} / ${niv.xpPourNiveau} XP : encore ${niv.xpPourNiveau - niv.xpDansNiveau} XP pour le niveau ${niv.niveau + 1}.` }));
      z.dRegles.replaceChildren(el("tbody", {}, ...P.reglesXP().map((r) => el("tr", {}, el("td", { texte: r.texte }), el("td", { texte: `+${r.xp} XP` })))));
      z.dGrades.replaceChildren(...parcours.grades.map((g, gi) => {
        const faites = g.lecons.filter((l) => etat.lecons[l.id]).length;
        const statut = gi < obtenus ? "✓ obtenu" : gi === obtenus ? `en cours : ${faites} / ${g.lecons.length} leçons` : "🔒 à venir";
        return el("li", { classe: gi < obtenus ? "obtenu" : gi === obtenus ? "en-cours" : "verrouille" },
          el("span", { classe: "grade-embleme", "aria-hidden": "true" }, embleme(g.embleme)),
          el("strong", { texte: g.nom }), el("span", { classe: "doux", texte: ` — ${g.sousTitre} · ${statut}` }));
      }));
      const tous = P.badges(etat);
      z.dBadges.replaceChildren(...[...tous.filter((b) => b.obtenu), ...tous.filter((b) => !b.obtenu)].map((b) => el("li", { classe: b.obtenu ? "obtenu" : "verrouille" },
        el("span", { classe: "badge-icone", "aria-hidden": "true", texte: b.obtenu ? b.icone : "🔒" }),
        el("strong", { texte: b.nom }),
        el("span", { classe: "doux", texte: `${b.obtenu ? "✓ Gagné : " : "À gagner : "}${b.description}` }),
        b.obtenu || b.cible <= 1 ? null : barre(b.actuel, b.cible, `${b.nom} : ${b.actuel} sur ${b.cible}`))));
      const serie = P.serieActuelle(etat, j);
      z.dRegularite.replaceChildren(el("p", { texte: `Série actuelle : ${pluriel(serie, "jour")} · record : ${pluriel(etat.serieMax, "jour")} · objectif du jour : ${pluriel(etat.objectif, "exercice")} (atteint ${etat.objectifsAtteints} fois).` }));
      z.dActivite.replaceChildren(...P.activite(etat, j).map((a) => {
        const atteint = a.exercices >= etat.objectif;
        return el("li", { classe: atteint ? "atteint" : a.exercices ? "actif" : "", "aria-label": `${nomJour(a.jour)} ${dateCourte(a.jour)} : ${pluriel(a.exercices, "activité")}${atteint ? ", objectif atteint" : ""}` },
          el("span", { classe: "jour", texte: nomJour(a.jour) }), el("span", { classe: "compte", texte: atteint ? "✓" : String(a.exercices) }));
      }));
      const apprises = parcours.grades.flatMap((g) => g.lecons).filter((l) => etat.lecons[l.id]);
      z.dCarnet.replaceChildren(...(apprises.length ? apprises.map((l) => {
        const cartes = l.exercices.map((_, k) => etat.cartes[ProgressionJeux.exoId(l, k)]).filter(Boolean);
        const maitrise = cartes.length && cartes.every((c) => c.boite >= 4);
        const prochaine = cartes.map((c) => c.prochaine).sort()[0];
        const quand = maitrise ? "✓ maîtrisée" : !prochaine ? "à revoir demain" : prochaine <= j ? "à réviser aujourd'hui" : `à revoir le ${dateCourte(prochaine)}`;
        return el("li", {}, el("strong", { texte: `${etoilesTexte(etat.lecons[l.id].etoiles)} ${l.titre}` }), el("span", { classe: "doux", texte: quand ? ` · ${quand}` : "" }), el("p", { texte: l.retenir }));
      }) : [el("li", { classe: "doux", texte: "Termine une leçon : sa stratégie s'ajoute ici, pour la relire et la réviser." })]));
      z.dForces.replaceChildren(...P.forces(etat).map((f) => el("li", {}, el("span", { texte: f.nom }),
        f.taux === null
          ? el("span", { classe: "doux", texte: f.essais ? `${pluriel(f.essais, "essai")} : encore un peu de pratique` : "pas encore travaillé" })
          : el("span", { classe: "jauge", role: "img", "aria-label": `${Math.round(f.taux * 100)} % réussi du premier coup sur ${f.essais} essais` },
            Object.assign(el("span"), { style: `width:${Math.round(f.taux * 100)}%` }), el("b", { texte: `${Math.round(f.taux * 100)} %` })))));
      z.dParties.replaceChildren(...Object.entries(P.NIVEAUX_PARTIE).map(([id, n]) => {
        const p = etat.parties[id], nulles = n.xp.nulle !== undefined ? ` · ${pluriel(p.nulles, "nulle")}` : "";
        return el("li", { texte: `${n.nom} : ${pluriel(p.victoires, "victoire")}${nulles} · ${pluriel(p.defaites, "défaite")}${p.meilleur !== null ? ` · record ${formaterTemps(p.meilleur)}` : ""}` });
      }));
      afficherReglages();
    }

    function afficherReglages() {
      const objectif = el("fieldset", { classe: "choix" }, el("legend", { texte: "Mon objectif du jour" }), ...ProgressionJeux.OBJECTIFS.map((n) => {
        const r = el("input", { type: "radio", name: "objectif", value: n, checked: etat.objectif === n });
        r.addEventListener("change", () => { etat = P.regler(etat, { objectif: n }); sauver(); afficherDetail(); });
        return el("label", {}, r, pluriel(n, "exercice"));
      }));
      const dispo = P.emblemesDisponibles(etat);
      const emblemes = el("fieldset", { classe: "choix emblemes" }, el("legend", { texte: "Mon emblème (un nouveau à chaque grade)" }), ...P.EMBLEMES.map((id, i) => {
        const ouvert = dispo.includes(id), g = parcours.grades[i];
        const r = el("input", { type: "radio", name: "embleme", value: id, disabled: !ouvert, checked: etat.embleme === id, "aria-label": ouvert ? `Emblème ${g.nom}` : `Emblème ${g.nom}, verrouillé` });
        r.addEventListener("change", () => { etat = P.regler(etat, { embleme: id }); sauver(); afficherDetail(); });
        return el("label", { classe: ouvert ? "" : "verrouille", title: ouvert ? g.nom : `Grade ${parcours.grades[i - 1]?.nom} à obtenir` }, r, embleme(id));
      }));
      const libre = el("input", { type: "checkbox", name: "libre", checked: etat.libre });
      libre.addEventListener("change", () => { etat = P.regler(etat, { libre: libre.checked }); sauver(); afficherDetail(); });
      const effacer = el("button", { type: "button", classe: "secondaire danger", "data-action": "effacer", texte: confirmationEffacement ? "Confirmer : tout effacer" : "🗑️ Effacer ma progression" });
      effacer.addEventListener("click", () => {
        if (!confirmationEffacement) { confirmationEffacement = true; afficherReglages(); z.dReglages.querySelector('[data-action="effacer"]').focus(); return; }
        confirmationEffacement = false; etat = P.etatInitial(); sauver(); toast.textContent = "Progression effacée : nouveau départ !"; afficherDetail();
      });
      z.dReglages.replaceChildren(objectif, emblemes,
        el("label", { classe: "case-a-cocher" }, libre, "Je connais déjà les bases : ouvrir toutes les leçons"),
        el("p", { classe: "doux", texte: "Ta progression reste sur cet appareil. Elle ne contient aucune donnée personnelle." }), effacer);
    }

    /* ---------- Séances : leçon, révisions, défi du jour ---------- */
    const instances = {};
    const outils = {
      reussir: () => terminerExercice(),
      erreur: (message) => {
        ex.erreurs += 1;
        retour(message ?? (ex.erreurs >= 2 ? `Pas tout à fait. Indice : ${ex.exo.indice ?? "relis bien la question."}` : "Pas tout à fait : essaie encore !"), "ko");
      },
      retour: (texte, classe = "") => retour(texte, classe)
    };
    function adaptateur(type) {
      if (!adaptateurs[type]) throw new Error(`type d'exercice inconnu : ${type}`);
      if (!instances[type]) { instances[type] = adaptateurs[type](outils); z.zoneJeu.appendChild(instances[type].element); }
      return instances[type];
    }
    function retour(texte, classe) { z.retour.textContent = texte; z.retour.className = `message ${classe}`; }

    function ouvrirLecon(id) {
      const info = P.lecons.get(id);
      if (!info || !P.leconDebloquee(etat, id)) return;
      demarrerSession("lecon", info.lecon.exercices.map((_, k) => ProgressionJeux.exoId(info.lecon, k)), info.lecon);
    }
    function reviser() {
      const dues = P.revisionsDues(etat, jour()).slice(0, 8);
      if (dues.length) demarrerSession("revision", dues);
    }
    function demarrerSession(mode, file, lecon = null) {
      session = { mode, file, lecon, rang: 0, erreurs: 0, indices: 0 };
      const grade = lecon && P.lecons.get(lecon.id).grade;
      z.fil.textContent = mode === "lecon" ? `Grade ${grade.nom} · ${parcours.themes[lecon.theme]}` : mode === "defi" ? "Défi du jour" : "Révisions espacées";
      z.sTitre.textContent = mode === "lecon" ? lecon.titre : mode === "defi" ? "⚡ Le défi du jour" : "🧠 Tes révisions";
      z.sTexte.textContent = mode === "lecon" ? lecon.texte
        : mode === "defi" ? `Un exercice tiré du parcours, le même pour tout le monde aujourd'hui. Réussis-le pour gagner ${ProgressionJeux.XP.defi} XP de plus !`
        : "Retrouve la bonne réponse sans aide. Chaque réussite repousse la prochaine révision : c'est comme ça qu'on retient pour toujours.";
      z.zoneRetenir.hidden = mode !== "lecon";
      z.retenir.textContent = lecon?.retenir ?? "";
      z.exercice.hidden = false; z.bilan.hidden = true;
      toast.textContent = "";
      montrer("session");
      demarrerExercice();
    }

    function demarrerExercice() {
      const id = session.file[session.rang], { exo, lecon } = P.exercices.get(id);
      session.adaptateur?.arreter?.();
      ex = { id, exo, lecon, erreurs: 0, indice: false, fini: false };
      z.progression.textContent = `${session.mode === "lecon" ? "Exercice" : `${lecon.titre} ·`} ${session.rang + 1} / ${session.file.length}`;
      retour("", "");
      z.suivant.hidden = true; z.indice.hidden = false; z.indice.disabled = false;
      const qcm = exo.type === "qcm";
      for (const [type, inst] of Object.entries(instances)) inst.element.hidden = qcm || type !== exo.type;
      z.qcm.hidden = !qcm;
      if (qcm) {
        session.adaptateur = null;
        z.consigne.textContent = exo.question;
        z.indice.textContent = "💡 Retirer une mauvaise réponse";
        z.qcm.replaceChildren(...exo.choix.map((texte, i) => {
          const b = el("button", { type: "button", classe: "choix-qcm", "data-choix": i, texte });
          b.addEventListener("click", () => repondreQcm(i));
          return el("li", {}, b);
        }));
      } else {
        const a = adaptateur(exo.type);
        a.element.hidden = false;
        session.adaptateur = a;
        z.consigne.textContent = a.consigne ? a.consigne(exo) : exo.consigne;
        z.indice.textContent = "💡 Indice";
        a.demarrer(exo);
      }
    }

    function repondreQcm(i) {
      if (ex.fini) return;
      const b = z.qcm.querySelector(`[data-choix="${i}"]`);
      if (i !== ex.exo.bonne) { b.disabled = true; b.dataset.etat = "faux"; b.textContent = `✗ ${ex.exo.choix[i]}`; outils.erreur(); return; }
      b.dataset.etat = "juste"; b.textContent = `✓ ${ex.exo.choix[i]}`;
      for (const autre of z.qcm.querySelectorAll("button")) autre.disabled = true;
      terminerExercice();
    }

    z.indice.addEventListener("click", () => {
      if (!ex || ex.fini) return;
      ex.indice = true; z.indice.disabled = true;
      if (ex.exo.type === "qcm") {
        const faux = [...z.qcm.querySelectorAll("button:not(:disabled)")].find((b) => Number(b.dataset.choix) !== ex.exo.bonne);
        if (faux) { faux.disabled = true; faux.dataset.etat = "retire"; faux.textContent = `— ${faux.textContent}`; }
        retour("Une mauvaise réponse a été retirée.", "");
        return;
      }
      retour(`Indice : ${ex.exo.indice}`, "");
      session.adaptateur.indice(ex.exo);
    });

    function terminerExercice() {
      if (ex.fini) return;
      ex.fini = true;
      const j = jour();
      session.erreurs += ex.erreurs; session.indices += ex.indice ? 1 : 0;
      appliquer(P.enregistrerExercice(etat, { id: ex.id, erreurs: ex.erreurs, indice: ex.indice, jour: j, revision: session.mode === "revision" }));
      if (session.mode === "defi") appliquer(P.enregistrerDefi(etat, { jour: j }));
      const rappel = session.mode !== "lecon" ? ` À retenir : ${ex.lecon.retenir}` : "";
      retour(`${ex.erreurs === 0 && !ex.indice ? "Parfait ! " : "Réussi ! "}${ex.exo.explication}${rappel}`, "ok");
      z.indice.hidden = true;
      const fin = session.rang === session.file.length - 1;
      z.suivant.textContent = fin ? "Voir le bilan" : "Exercice suivant";
      z.suivant.hidden = false;
      z.suivant.focus();
    }
    z.suivant.addEventListener("click", () => {
      if (session.rang < session.file.length - 1) { session.rang += 1; demarrerExercice(); return; }
      afficherBilan();
    });

    function afficherBilan() {
      session.adaptateur?.arreter?.();
      z.exercice.hidden = true; z.bilan.hidden = false;
      const j = jour();
      if (session.mode === "lecon") {
        const n = ProgressionJeux.etoiles(session);
        appliquer(P.terminerLecon(etat, { id: session.lecon.id, etoiles: n, jour: j }));
        z.bTitre.textContent = `${etoilesTexte(n)} Leçon terminée !`;
        z.bTexte.textContent = `${n === 3 ? "Sans faute : bravo !" : n === 2 ? "Très bien ! Refais-la plus tard pour viser les 3 étoiles." : "Leçon réussie. Refais-la pour gagner des étoiles."} La stratégie « ${session.lecon.titre} » rejoint ton carnet : elle reviendra en révision demain.`;
      } else if (session.mode === "defi") {
        z.bTitre.textContent = "⚡ Défi relevé !"; z.bTexte.textContent = "Reviens demain pour un nouveau défi.";
      } else {
        z.bTitre.textContent = "🧠 Révisions terminées";
        z.bTexte.textContent = `${pluriel(session.file.length, "stratégie")} révisée${session.file.length > 1 ? "s" : ""}. Les bonnes réponses reviendront plus tard, les autres dès demain.`;
      }
      const ordre = parcours.grades.flatMap((g) => g.lecons);
      const prochaine = session.mode === "lecon" ? ordre.slice(ordre.findIndex((l) => l.id === session.lecon.id) + 1).find((l) => P.leconDebloquee(etat, l.id) && !etat.lecons[l.id]) : null;
      z.bSuite.hidden = !prochaine;
      if (prochaine) { z.bSuite.textContent = `Leçon suivante : ${prochaine.titre}`; z.bSuite.onclick = () => ouvrirLecon(prochaine.id); }
      z.bTitre.focus();
    }

    /* ---------- Commandes ---------- */
    z.reviser.addEventListener("click", reviser);
    z.defi.addEventListener("click", () => { const d = P.defiDuJour(etat, jour()); if (d && !d.fait) demarrerSession("defi", [d.id]); });
    boutonDetail.addEventListener("click", () => { confirmationEffacement = false; montrer("detail"); });
    for (const b of [retourDetail, retourSession, bRetour]) b.addEventListener("click", () => montrer("accueil"));

    afficherAccueil();
    return {
      etat: () => etat,
      /** Partie terminée dans l'onglet « Jouer » : enregistrée ici, et les gains sont renvoyés pour être affichés. */
      enregistrerPartie(partie) {
        const g = appliquer(P.enregistrerPartie(etat, { ...partie, jour: jour() }));
        if (!session) { if (vues.detail.hidden) afficherAccueil(); else afficherDetail(); }
        return g;
      },
      /** Événements de jeu (capot, belote…) comptés pour les badges. */
      compter(compteurs) {
        const g = appliquer(P.compter(etat, { compteurs }));
        if (!session) { if (vues.detail.hidden) afficherAccueil(); else afficherDetail(); }
        return g;
      }
    };
  }

  return Object.freeze({ monter, jourLocal });
})();
</script>
<script>
(() => {
  "use strict";
  const META = JSON.parse(document.getElementById("kermiclab-meta").textContent);
  const CONFIG = { connexionActive: false, stockage: "local" };
  const B = MoteurBelote;

  /* ---------- Stockage abstrait : local (actif) / distant (stub) ---------- */
  const Stockage = {
    local: {
      lire(cle) { try { return JSON.parse(localStorage.getItem(`kermiclab:${META.id}:${cle}`)); } catch { return null; } },
      ecrire(cle, valeur) { try { localStorage.setItem(`kermiclab:${META.id}:${cle}`, JSON.stringify(valeur)); } catch { /* stockage indisponible */ } }
    },
    distant: {
      // Phase 4 : appellera le service web avec META.id et l'identifiant utilisateur.
      lire() { return null; },
      ecrire() { /* non activé dans le MVP */ }
    }
  };
  const stockage = Stockage[CONFIG.stockage];

  /* ---------- Registre des onglets ---------- */
  const registre = [];
  function enregistrerOnglet(def) { registre.push({ actif: true, ...def }); }
  const services = {};

  /* ---------- Cartes ---------- */
  /** Une carte visible : rang et symbole (jamais la couleur seule), nom complet pour les lecteurs d'écran. */
  function elementCarte(carte, { bouton = false, atout = null } = {}) {
    const n = document.createElement(bouton ? "button" : "span");
    if (bouton) n.type = "button";
    n.className = `carte-jeu${"CK".includes(B.couleur(carte)) ? " rouge" : ""}${atout && B.couleur(carte) === atout ? " atout" : ""}`;
    n.dataset.carte = carte;
    const haut = document.createElement("span"); haut.textContent = B.rang(carte);
    const milieu = document.createElement("span"); milieu.className = "symbole"; milieu.textContent = B.SYMBOLES[B.couleur(carte)];
    const bas = document.createElement("span"); bas.className = "petit"; bas.textContent = B.rang(carte);
    for (const x of [haut, milieu, bas]) x.setAttribute("aria-hidden", "true");
    n.append(haut, milieu, bas);
    n.setAttribute(bouton ? "aria-label" : "title", `${B.nomCarte(carte)}${atout && B.couleur(carte) === atout ? " (atout)" : ""}`);
    if (!bouton) { n.setAttribute("role", "img"); n.setAttribute("aria-label", n.getAttribute("title")); }
    return n;
  }
  const nomAtout = (a) => `${B.SYMBOLES[a]} ${B.NOMS_COULEURS[a]}`;
  const nomJoueur = (j) => ({ sud: "Toi", est: "Est", nord: "Nord", ouest: "Ouest" })[j];
  /** Sujet et verbe accordés : « Tu prends » pour Sud, « Est prend » pour les autres. */
  const phrase = (j, toi, autre) => (j === "sud" ? `Tu ${toi}` : `${nomJoueur(j)} ${autre}`);
  const texteEnchere = (j, c) => (c === "passer" ? phrase(j, "passes", "passe") : c === "prendre" ? phrase(j, "prends", "prend") : phrase(j, "choisis", "choisit") + ` ${nomAtout(c)}`);

  /* ---------- Onglet explication ---------- */
  enregistrerOnglet({ id: "explication", type: "explication", titre: "Règles",
    rendu(panneau) { panneau.appendChild(document.getElementById("tpl-explication").content.cloneNode(true)); } });

  /* ---------- Onglet application : la partie ---------- */
  const jeu = {};
  enregistrerOnglet({ id: "application", type: "application", titre: "Jouer",
    rendu(panneau) {
      panneau.appendChild(document.getElementById("tpl-application").content.cloneNode(true));
      const q = (s) => panneau.querySelector(s);
      const sortie = (n) => q(`[data-sortie="${n}"]`);
      const lire = (cle, valeurs, defaut) => { const v = stockage.lire(cle); return valeurs.includes(v) ? v : defaut; };
      let niveau = lire("niveau", ["facile", "normal"], "facile");
      let objectif = lire("objectif", [501, 1001], 501);
      let vitesse = lire("vitesse", ["normale", "rapide"], "normale");
      let partie = null, donne = null, minuteur = null, pliAffiche = null, bulles = {}, partieComptee = false, conseil = null;
      const delai = () => (vitesse === "rapide" ? 120 : 650);

      function message(texte, classe = "") { sortie("message").textContent = texte; sortie("message").className = `message ${classe}`; }
      function arreter() { clearTimeout(minuteur); minuteur = null; }

      function nouvellePartie() {
        arreter();
        partie = B.creerPartie({ objectif });
        partieComptee = false;
        nouvelleDonne();
      }
      function nouvelleDonne() {
        arreter();
        donne = B.creerDonne({ donneur: partie.donneur });
        pliAffiche = null; bulles = {}; conseil = null;
        q('[data-zone="bilan"]').hidden = true;
        message(`Nouvelle donne : ${phrase(partie.donneur, "distribues", "distribue")}.`);
        avancer();
      }

      /** Fait jouer l'ordinateur jusqu'à ce que ce soit à toi (ou la fin de la donne). */
      function avancer() {
        arreter();
        afficher();
        if (pliAffiche) { minuteur = setTimeout(() => { pliAffiche = null; bulles = {}; avancer(); }, delai() * 2.2); return; }
        if (donne.phase === "encheres" && donne.parole !== "sud") {
          minuteur = setTimeout(() => {
            const j = donne.parole, c = B.choisirEnchere(donne, j, { niveau });
            encherir(j, c);
          }, delai());
        } else if (donne.phase === "jeu" && donne.parole !== "sud") {
          minuteur = setTimeout(() => { const j = donne.parole; jouer(j, B.choisirCarte(donne, j, { niveau })); }, delai());
        } else if (donne.phase === "redonne") {
          message("Tout le monde a passé : on redistribue.");
          partie = B.ajouterDonne(partie, donne);
          minuteur = setTimeout(nouvelleDonne, delai() * 2.5);
        } else if (donne.phase === "fin") terminerDonne();
      }

      function encherir(j, c) {
        donne = B.encherir(donne, j, c);
        bulles[j] = c === "passer" ? "Je passe" : c === "prendre" ? "Je prends !" : `${B.SYMBOLES[c]} !`;
        if (donne.phase === "jeu") {
          bulles = {};
          message(`${texteEnchere(j, c)} : l'atout est ${nomAtout(donne.atout)}. ${phrase(donne.parole, "commences", "commence")}.`, "ok");
        } else message(texteEnchere(j, c) + ".");
        avancer();
      }

      function jouer(j, carte) {
        conseil = null;
        donne = B.jouerCarte(donne, j, carte);
        const annonce = donne.derniereAnnonce ? ` — ${donne.derniereAnnonce === "belote" ? "Belote !" : "Rebelote !"}` : "";
        bulles[j] = donne.derniereAnnonce ? (donne.derniereAnnonce === "belote" ? "Belote !" : "Rebelote !") : "";
        if (!donne.pli.length) {
          // Pli complet : on le laisse visible un instant, avec son gagnant.
          pliAffiche = donne.plis.at(-1);
          message(`${phrase(j, "joues", "joue")} ${B.nomCarte(carte)}${annonce}. Pli pour ${pliAffiche.gagnant === "sud" ? "toi" : nomJoueur(pliAffiche.gagnant)} (${pliAffiche.points} point${pliAffiche.points > 1 ? "s" : ""}).`, B.equipe(pliAffiche.gagnant) === "NS" ? "ok" : "");
        } else message(`${phrase(j, "joues", "joue")} ${B.nomCarte(carte)}${annonce}.`);
        avancer();
      }

      function terminerDonne() {
        const r = donne.resultat;
        partie = B.ajouterDonne(partie, donne);
        // Événements comptés pour les badges de l'Académie (seulement pour ton équipe).
        services.compter?.({ contrats: r.preneur === "NS" && r.faite ? 1 : 0, belotes: r.belote === "NS" ? 1 : 0, capots: r.capot === "NS" ? 1 : 0 });
        const ligne = (libelle, ns, eo) => { const tr = document.createElement("tr"); for (const [k, v] of [["th", libelle], ["td", ns], ["td", eo]]) { const c = document.createElement(k); c.textContent = v; tr.appendChild(c); } return tr; };
        const entete = ligne("", "Nous", "Eux");
        sortie("bilan-table").replaceChildren(entete,
          ligne("Points des cartes", r.cartes.NS, r.cartes.EO),
          ligne("Dix de der", r.der === "NS" ? 10 : 0, r.der === "EO" ? 10 : 0),
          ligne("Belote-rebelote", r.belote === "NS" ? 20 : 0, r.belote === "EO" ? 20 : 0),
          ligne("Plis gagnés", r.plis.NS, r.plis.EO),
          ligne("Points marqués", r.marque.NS, r.marque.EO),
          ligne("Score de la partie", partie.scores.NS, partie.scores.EO));
        const preneur = r.preneur === "NS" ? "Ton équipe" : "L'équipe adverse";
        sortie("bilan-titre").textContent = r.capot ? `💥 Capot ${r.capot === "NS" ? "pour ton équipe" : "pour l'équipe adverse"} !` : r.faite ? `✅ ${preneur} a réussi son contrat` : `❌ ${preneur} est dedans`;
        let texte = r.capot ? "Les 8 plis pour la même équipe : 250 points !" : r.faite ? `${preneur} a pris à ${nomAtout(r.atout)} et a marqué plus que la défense.` : `${preneur} a pris à ${nomAtout(r.atout)} mais n'a pas fait plus que la défense : la défense marque 162 points.`;
        const bouton = q('[data-action="donne-suivante"]');
        if (partie.gagnant) {
          const gagne = partie.gagnant === "NS";
          texte += ` ${gagne ? "🏆 Victoire ! Ton équipe remporte la partie." : "L'équipe adverse remporte la partie. Revanche ?"}`;
          if (!partieComptee) {
            partieComptee = true;
            const gains = services.enregistrerPartie?.({ resultat: gagne ? "victoire" : "defaite", niveau });
            if (gains?.xp) texte += ` (+${gains.xp} XP à l'Académie)`;
          }
          bouton.textContent = "Nouvelle partie";
          bouton.onclick = nouvellePartie;
        } else { bouton.textContent = "Donne suivante"; bouton.onclick = nouvelleDonne; }
        sortie("bilan-texte").textContent = texte;
        q('[data-zone="bilan"]').hidden = false;
        message(sortie("bilan-titre").textContent, r.marque.NS >= r.marque.EO ? "ok" : "ko");
        afficher();
      }

      function afficher() {
        const d = donne;
        sortie("scores").replaceChildren(...[
          `Nous : ${partie.scores.NS}`, `Eux : ${partie.scores.EO}`, `Objectif : ${partie.objectif}`,
          d.atout ? `Atout : ${nomAtout(d.atout)} (pris par ${nomJoueur(d.preneur)})` : `Donneur : ${nomJoueur(d.donneur)}`
        ].map((t) => Object.assign(document.createElement("li"), { textContent: t })));
        for (const j of ["nord", "ouest", "est"]) {
          const n = d.mains[j].length, zone = q(`[data-cartes="${j}"]`);
          zone.replaceChildren(...Array.from({ length: n }, () => Object.assign(document.createElement("span"), { className: "dos" })));
          zone.setAttribute("aria-label", `${n} carte${n > 1 ? "s" : ""}`);
          zone.setAttribute("role", "img");
        }
        for (const j of B.JOUEURS) {
          q(`[data-bulle="${j}"]`).textContent = bulles[j] ?? "";
          const place = q(`.place[data-place="${j}"]`);
          if ((d.phase === "encheres" || d.phase === "jeu") && d.parole === j && !pliAffiche) place.dataset.actif = ""; else delete place.dataset.actif;
        }
        // Tapis : carte retournée pendant les enchères, sinon le pli en cours (ou le pli qui vient de se terminer).
        const tapis = q('[data-zone="tapis"]');
        tapis.replaceChildren();
        if (d.phase === "encheres") {
          const centre = Object.assign(document.createElement("div"), { className: "centre" });
          centre.append(elementCarte(d.retournee), Object.assign(document.createElement("div"), { textContent: d.tour === 1 ? "Carte retournée" : "2e tour : choisir l'atout" }));
          tapis.appendChild(centre);
        } else {
          const cartes = pliAffiche ? pliAffiche.cartes : d.pli;
          for (const { joueur, carte } of cartes) { const c = elementCarte(carte, { atout: d.atout }); c.dataset.place = joueur; tapis.appendChild(c); }
          if (pliAffiche) tapis.appendChild(Object.assign(document.createElement("div"), { className: "centre", textContent: `Pli pour ${pliAffiche.gagnant === "sud" ? "toi" : nomJoueur(pliAffiche.gagnant)}` }));
        }
        // Enchères de Sud
        const zoneEncheres = q('[data-zone="encheres"]');
        const aMoiEnchere = d.phase === "encheres" && d.parole === "sud";
        zoneEncheres.hidden = !aMoiEnchere;
        if (aMoiEnchere) {
          zoneEncheres.replaceChildren(...B.choixPossibles(d).map((c) => {
            const b = document.createElement("button");
            b.type = "button"; b.className = c === "passer" ? "secondaire" : "action"; b.dataset.enchere = c;
            b.textContent = c === "passer" ? "Je passe" : c === "prendre" ? `Je prends (${nomAtout(B.couleur(d.retournee))})` : `Atout ${nomAtout(c)}`;
            b.addEventListener("click", () => encherir("sud", c));
            return b;
          }));
        }
        // Main de Sud : seules les cartes autorisées sont actives, la règle est expliquée.
        const aMoiJouer = d.phase === "jeu" && d.parole === "sud" && !pliAffiche;
        const regle = aMoiJouer ? B.cartesJouables(d.mains.sud, d.pli, d.atout, "sud") : null;
        sortie("regle").textContent = regle ? B.REGLES[regle.regle] : d.phase === "encheres" && aMoiEnchere ? "À toi de parler : prends-tu, ou passes-tu ?" : "";
        q('[data-zone="main"]').replaceChildren(...B.trierMain(d.mains.sud, d.atout).map((c) => {
          const b = elementCarte(c, { bouton: true, atout: d.atout });
          b.disabled = !regle || !regle.cartes.includes(c);
          if (conseil === c) b.dataset.conseil = "";
          b.addEventListener("click", () => { if (!b.disabled) jouer("sud", c); });
          return b;
        }));
        q('[data-action="conseil"]').disabled = !(aMoiJouer || aMoiEnchere);
      }

      q('[data-action="conseil"]').addEventListener("click", () => {
        if (donne.phase === "encheres" && donne.parole === "sud") {
          const c = B.choisirEnchere(donne, "sud", { niveau: "normal" });
          message(`💡 À ta place, l'ordinateur ${c === "passer" ? "passerait" : c === "prendre" ? "prendrait" : `choisirait ${nomAtout(c)}`}.`);
          return;
        }
        if (donne.phase !== "jeu" || donne.parole !== "sud") return;
        conseil = B.choisirCarte(donne, "sud", { niveau: "normal" });
        afficher();
        q(`[data-zone="main"] [data-carte="${conseil}"]`)?.focus();
        message(`💡 Conseil : ${B.nomCarte(conseil)}.`);
      });
      q('[data-action="nouvelle-partie"]').addEventListener("click", nouvellePartie);
      for (const [nom, poser] of [["niveau", (v) => { niveau = v; }], ["objectif", (v) => { objectif = Number(v); }], ["vitesse", (v) => { vitesse = v; }]]) {
        for (const r of panneau.querySelectorAll(`input[name="${nom}"]`)) {
          r.checked = String({ niveau, objectif, vitesse }[nom]) === r.value;
          r.addEventListener("change", () => { poser(r.value); stockage.ecrire(nom, nom === "objectif" ? Number(r.value) : r.value); if (nom === "objectif") nouvellePartie(); });
        }
      }
      // La partie démarre dès l'ouverture de la page (onglet « Jouer » ouvert par défaut).
      nouvellePartie();
      Object.assign(jeu, { etat: () => ({ donne, partie, pliAffiche: !!pliAffiche }), jouer: (c) => jouer("sud", c), encherir: (c) => encherir("sud", c) });
    } });

  /* ---------- Onglet Académie : du débutant au pro (interface commune, gabarit/jeux/academie.js) ---------- */
  const PROGRESSION = ProgressionJeux.creer(JSON.parse(document.getElementById("parcours-belote").textContent));
  const stockageDisponible = (() => { try { localStorage.setItem("kermiclab:test", "1"); localStorage.removeItem("kermiclab:test"); return true; } catch { return false; } })();
  const academie = {};

  /** Pli figé d'un exercice : les cartes déjà posées, avec leur joueur. */
  function afficherPli(zone, pli, atout) {
    zone.replaceChildren(...pli.map(({ joueur, carte }) => {
      const f = document.createElement("figure");
      const legende = document.createElement("figcaption"); legende.textContent = nomJoueur(joueur);
      f.append(elementCarte(carte, { atout }), legende);
      return f;
    }));
    if (!pli.length) zone.appendChild(Object.assign(document.createElement("p"), { className: "doux", textContent: "Le pli est vide : c'est toi qui commences." }));
  }

  /** Exercice « pli » : choisir la carte à jouer. Une carte interdite est expliquée par la règle qui s'applique. */
  function adaptateurPli(outils) {
    let ex = null;
    const element = document.createElement("div");
    const infos = Object.assign(document.createElement("p"), { className: "infos" });
    const tapis = Object.assign(document.createElement("div"), { className: "pli-exercice" });
    const titreMain = Object.assign(document.createElement("p"), { className: "infos", textContent: "Ta main :" });
    const main = Object.assign(document.createElement("div"), { className: "main-joueur" });
    main.setAttribute("role", "group"); main.setAttribute("aria-label", "Ta main");
    element.append(infos, tapis, titreMain, main);
    function choisir(carte) {
      if (!ex || ex.fini) return;
      const { cartes, regle } = B.cartesJouables(ex.exo.main, ex.exo.pli, ex.exo.atout, "sud");
      if (!cartes.includes(carte)) { outils.erreur(`Interdit : ${B.REGLES[regle]}`); return; }
      const acceptees = ex.exo.accepte === "jouables" ? cartes : ex.exo.accepte;
      if (!acceptees.includes(carte)) { outils.erreur(ex.exo.pieges?.[carte]); return; }
      ex.fini = true;
      main.querySelector(`[data-carte="${carte}"]`).dataset.conseil = "";
      outils.reussir();
    }
    return {
      element,
      demarrer(exo) {
        ex = { exo, fini: false };
        infos.textContent = `Atout : ${nomAtout(exo.atout)}${exo.preneur ? ` · preneur : ${nomJoueur(exo.preneur)}` : ""}${exo.tombees?.length ? ` · déjà tombées : ${exo.tombees.map(B.texteCarte).join(" ")}` : ""}`;
        afficherPli(tapis, exo.pli, exo.atout);
        main.replaceChildren(...B.trierMain(exo.main, exo.atout).map((c) => {
          const b = elementCarte(c, { bouton: true, atout: exo.atout });
          b.addEventListener("click", () => choisir(c));
          return b;
        }));
      },
      indice() {
        if (!ex) return;
        const { cartes } = B.cartesJouables(ex.exo.main, ex.exo.pli, ex.exo.atout, "sud");
        const cible = (ex.exo.accepte === "jouables" ? cartes : ex.exo.accepte)[0];
        const b = main.querySelector(`[data-carte="${cible}"]`);
        if (b) { b.dataset.conseil = ""; b.focus(); }
      },
      arreter() { ex = null; }
    };
  }

  /** Exercice « enchère » : prendre, passer ou choisir l'atout au second tour. */
  function adaptateurEnchere(outils) {
    let ex = null;
    const element = document.createElement("div");
    const tapis = Object.assign(document.createElement("div"), { className: "pli-exercice" });
    const titreMain = Object.assign(document.createElement("p"), { className: "infos", textContent: "Ta main :" });
    const main = Object.assign(document.createElement("div"), { className: "main-joueur" });
    const boutons = Object.assign(document.createElement("div"), { className: "choix-boutons" });
    element.append(tapis, titreMain, main, boutons);
    return {
      element,
      demarrer(exo) {
        ex = { exo, fini: false };
        const f = document.createElement("figure");
        f.append(elementCarte(exo.retournee), Object.assign(document.createElement("figcaption"), { textContent: exo.tour === 1 ? "Carte retournée" : "Carte retournée (refusée au 1er tour)" }));
        tapis.replaceChildren(f);
        main.replaceChildren(...B.trierMain(exo.main).map((c) => elementCarte(c)));
        const choix = exo.tour === 1 ? ["prendre", "passer"] : [...B.COULEURS.filter((c) => c !== B.couleur(exo.retournee)), "passer"];
        boutons.replaceChildren(...choix.map((c) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "secondaire"; b.dataset.enchere = c;
          b.textContent = c === "passer" ? "Je passe" : c === "prendre" ? "Je prends" : `Atout ${nomAtout(c)}`;
          b.addEventListener("click", () => {
            if (!ex || ex.fini) return;
            if (!ex.exo.accepte.includes(c)) { outils.erreur(); return; }
            ex.fini = true; outils.reussir();
          });
          return b;
        }));
      },
      indice() { const b = boutons.querySelector(`[data-enchere="${ex?.exo.accepte[0]}"]`); if (b) b.focus(); },
      arreter() { ex = null; }
    };
  }

  enregistrerOnglet({ id: "academie", type: "parcours", titre: "Académie",
    rendu(panneau) {
      const vue = VueAcademie.monter({
        panneau, progression: PROGRESSION, stockage, stockageDisponible, ouvrirOnglet,
        embleme: (symbole) => Object.assign(document.createElement("span"), { textContent: symbole }),
        adaptateurs: { pli: adaptateurPli, enchere: adaptateurEnchere }
      });
      services.enregistrerPartie = vue.enregistrerPartie;
      services.compter = vue.compter;
      Object.assign(academie, { etat: vue.etat });
    } });

  /* ---------- Onglet mise en situation : le compteur de plis ---------- */
  enregistrerOnglet({ id: "mise-en-situation", type: "mise-en-situation", titre: "Le compteur",
    rendu(panneau) {
      panneau.appendChild(document.getElementById("tpl-mise-en-situation").content.cloneNode(true));
      const q = (s) => panneau.querySelector(s);
      const sortie = (n) => q(`[data-sortie="${n}"]`);
      let pli = null, atout = null, gagnant = null, choixGagnant = null, serie = 0;
      let record = Number(stockage.lire("record-compteur")) || 0;
      /** Un vrai pli : on fait jouer une donne entière par l'ordinateur et on en tire un pli au hasard. */
      function tirerPli() {
        for (;;) {
          let d = B.creerDonne({ donneur: B.JOUEURS[Math.floor(Math.random() * 4)] });
          while (d.phase === "encheres") d = B.encherir(d, d.parole, B.choisirEnchere(d, d.parole));
          if (d.phase !== "jeu") continue;
          while (d.phase === "jeu") d = B.jouerCarte(d, d.parole, B.choisirCarte(d, d.parole, { niveau: "facile" }));
          return { pli: d.plis[Math.floor(Math.random() * 8)], atout: d.atout };
        }
      }
      function charger() {
        ({ pli, atout } = tirerPli());
        gagnant = pli.gagnant; choixGagnant = null;
        sortie("atout").textContent = `Atout : ${nomAtout(atout)} · ${nomJoueur(pli.cartes[0].joueur)} a commencé le pli.`;
        afficherPli(q('[data-zone="pli"]'), pli.cartes, atout);
        q('[data-zone="gagnant"]').replaceChildren(...pli.cartes.map(({ joueur }) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "secondaire"; b.dataset.joueur = joueur; b.textContent = nomJoueur(joueur);
          b.setAttribute("aria-pressed", "false");
          b.addEventListener("click", () => { choixGagnant = joueur; for (const x of q('[data-zone="gagnant"]').children) x.setAttribute("aria-pressed", String(x === b)); });
          return b;
        }));
        q('[data-zone="points"]').value = "";
        sortie("retour").textContent = ""; sortie("retour").className = "message";
      }
      function valider() {
        const points = Number(q('[data-zone="points"]').value);
        if (!choixGagnant || q('[data-zone="points"]').value === "") { sortie("retour").textContent = "Choisis le gagnant et écris le nombre de points."; return; }
        const bonGagnant = choixGagnant === gagnant, bonsPoints = points === pli.points;
        const detail = pli.cartes.map(({ carte }) => `${B.texteCarte(carte)} = ${B.pointsCarte(carte, atout)}`).join(", ");
        if (bonGagnant && bonsPoints) {
          serie += 1;
          if (serie > record) { record = serie; stockage.ecrire("record-compteur", record); }
          sortie("retour").textContent = `Bravo ! ${nomJoueur(gagnant)} remporte le pli, qui vaut ${pli.points} points (${detail}).`;
          sortie("retour").className = "message ok";
        } else {
          serie = 0;
          sortie("retour").textContent = `${bonGagnant ? "Bon gagnant" : `Le pli est pour ${nomJoueur(gagnant)}`}, ${bonsPoints ? "bons points" : `il vaut ${pli.points} points`} : ${detail}.`;
          sortie("retour").className = "message ko";
        }
        sortie("serie").textContent = `Série : ${serie} · record : ${record}`;
      }
      q('[data-action="valider"]').addEventListener("click", valider);
      q('[data-zone="points"]').addEventListener("keydown", (e) => { if (e.key === "Enter") valider(); });
      q('[data-action="autre"]').addEventListener("click", charger);
      sortie("serie").textContent = `Série : 0 · record : ${record}`;
      charger();
      Object.assign(jeu, { compteur: () => ({ gagnant, points: pli.points }) });
    } });

  /* ---------- Onglet self-test (prévu phase 2, désactivé) ---------- */
  enregistrerOnglet({ id: "self-test", type: "self-test", titre: "Auto-évaluation", actif: false,
    questions: [], rendu() {} });

  /* ---------- Socle : construction des onglets ---------- */
  const liste = document.getElementById("onglets"), panneaux = document.getElementById("panneaux");
  const actifs = registre.filter((o) => o.actif);
  const boutons = actifs.map((o, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.id = `onglet-${o.id}`; b.textContent = o.titre;
    b.setAttribute("aria-controls", `panneau-${o.id}`); b.dataset.onglet = o.id;
    const p = document.createElement("section");
    p.setAttribute("role", "tabpanel"); p.id = `panneau-${o.id}`; p.setAttribute("aria-labelledby", b.id); p.tabIndex = 0;
    o.rendu(p); panneaux.appendChild(p); liste.appendChild(b);
    b.addEventListener("click", () => choisir(i));
    return b;
  });
  function choisir(i) {
    boutons.forEach((b, j) => {
      const sel = i === j; b.setAttribute("aria-selected", String(sel)); b.tabIndex = sel ? 0 : -1;
      document.getElementById(b.getAttribute("aria-controls")).hidden = !sel;
    });
    stockage.ecrire("onglet", actifs[i].id);
  }
  function ouvrirOnglet(id) { const i = actifs.findIndex((o) => o.id === id); if (i >= 0) { choisir(i); boutons[i].focus(); } }
  liste.addEventListener("keydown", (e) => {
    const i = boutons.indexOf(document.activeElement); if (i < 0) return;
    const n = e.key === "ArrowRight" ? (i + 1) % boutons.length : e.key === "ArrowLeft" ? (i - 1 + boutons.length) % boutons.length : -1;
    if (n >= 0) { choisir(n); boutons[n].focus(); e.preventDefault(); }
  });
  // Un jeu s'ouvre directement sur l'onglet « Jouer » (sauf si un autre onglet a été mémorisé).
  const memo = actifs.findIndex((o) => o.id === stockage.lire("onglet"));
  choisir(memo >= 0 ? memo : Math.max(0, actifs.findIndex((o) => o.id === "application")));

  document.getElementById("connexion").hidden = !CONFIG.connexionActive;
  window.kermiclab = { META, registre, CONFIG, belote: jeu, academie };
})();
</script>
</body>
</html>
