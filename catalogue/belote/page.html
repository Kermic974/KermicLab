<script id="trophees" data-inclure="gabarit/jeux/trophees.js">
// Pont local des pages autonomes : aucun réseau, et aucun accès au stockage du parent.
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && window.parent !== window) {
    window.parent.postMessage({ type: "kermiclab:chat:fermer" }, "*");
  }
});

const Trophees = (() => {
  function monter({ restaurer, resumer }) {
    if (window.parent === window) return () => {};
    const meta = JSON.parse(document.getElementById("kermiclab-meta").textContent);
    const module = meta.id;
    const originesAutorisees = Array.isArray(meta.allowedParentOrigins) ? meta.allowedParentOrigins : null;
    let origineParent = null;
    let pret = false;
    const publier = () => {
      if (pret) window.parent.postMessage({ type: "kermiclab:trophees:progres", module, ...resumer() }, origineParent);
    };
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent || e.data?.type !== "kermiclab:trophees:charger" || e.data.module !== module || pret) return;
      let origine;
      try { origine = new URL(e.origin); } catch { return; }
      if (!["https:", "http:"].includes(origine.protocol) || origine.origin !== e.origin ||
          (meta.parentOrigin && meta.parentOrigin !== e.origin) ||
          (originesAutorisees && !originesAutorisees.includes(e.origin))) return;
      // L'identité du parent et son origine viennent du message, même sans Referer.
      origineParent = e.origin;
      if (e.data.etat !== null) restaurer(e.data.etat);
      pret = true;
      publier();
    });
    // Seul l'identifiant du module est annoncé avant de connaître l'origine du parent.
    window.parent.postMessage({ type: "kermiclab:trophees:pret", module }, meta.parentOrigin || "*");
    return publier;
  }
  return Object.freeze({ monter });
})();
</script>

  <p>La belote se joue à <strong>quatre, deux contre deux</strong>, avec 32 cartes (du 7 à l'as). Ton partenaire est en face de toi. Le but : marquer le plus de points avec ton équipe, donne après donne, jusqu'à 501 (ou 1001) points.</p>

    <h2>Déroulement d'une donne</h2>
    <ol>
      <li><strong>Distribution</strong> : 5 cartes chacun, puis une carte est retournée au milieu.</li>
      <li><strong>Enchères</strong> : chacun à son tour dit « je prends » (la couleur de la carte retournée devient l'atout) ou « je passe ». Si tout le monde passe, un second tour permet de choisir une autre couleur. Si tout le monde passe encore, on redistribue.</li>
      <li>Le <strong>preneur</strong> reçoit la carte retournée et 2 cartes, les autres 3 : chacun a 8 cartes.</li>
      <li><strong>Les 8 plis</strong> : chacun pose une carte à son tour. La plus forte carte remporte le pli, et son joueur commence le pli suivant.</li>
    </ol>
  </div>
  <div class="carte">
    <h2>Les obligations</h2>
    <ul>
      <li><strong>Fournir</strong> : si tu as la couleur demandée, tu dois la jouer.</li>
      <li><strong>Couper</strong> : si tu ne l'as pas et que l'adversaire est maître, tu dois jouer atout (et <strong>surcouper</strong> s'il a déjà coupé et que tu peux).</li>
      <li><strong>Monter à l'atout</strong> : quand on joue atout, tu dois jouer plus fort que l'atout le plus fort du pli si tu peux.</li>
      <li><strong>Partenaire maître</strong> : si ton partenaire gagne le pli et que tu n'as pas la couleur, tu joues ce que tu veux.</li>
    </ul>
  </div>
  <div class="carte">
    <h2>Valeur des cartes</h2>
    <table>
      <thead><tr><th scope="col">Carte</th><th scope="col">À l'atout</th><th scope="col">Hors atout</th></tr></thead>
      <tbody>
        <tr><th scope="row">Valet</th><td>20 (la plus forte)</td><td>2</td></tr>
        <tr><th scope="row">9</th><td>14</td><td>0</td></tr>
        <tr><th scope="row">As</th><td>11</td><td>11 (la plus forte)</td></tr>
        <tr><th scope="row">10</th><td>10</td><td>10</td></tr>
        <tr><th scope="row">Roi</th><td>4</td><td>4</td></tr>
        <tr><th scope="row">Dame</th><td>3</td><td>3</td></tr>
        <tr><th scope="row">8 et 7</th><td>0</td><td>0</td></tr>
      </tbody>
    </table>
    <p>Ordre à l'atout : Valet, 9, As, 10, Roi, Dame, 8, 7. Hors atout : As, 10, Roi, Dame, Valet, 9, 8, 7.</p>
  </div>
  <div class="carte">
    <h2>Le décompte</h2>
    <p>Une donne vaut <strong>162 points</strong> : 152 en cartes et 10 pour le dernier pli (le <strong>dix de der</strong>). Le roi et la dame d'atout dans la même main font la <strong>belote-rebelote</strong> : 20 points de plus.</p>
    <p>L'équipe qui a pris doit marquer <strong>plus de points que l'autre</strong>. Sinon, elle est <strong>dedans</strong> : la défense marque 162 points. Une équipe qui gagne les 8 plis fait <strong>capot</strong> : 250 points. Sur cette page, en cas d'égalité, le preneur est dedans, et on joue sans annonces (tierce, cinquante…) hormis la belote.</p>
  </div>
  <div class="carte">
    <h2>Les commandes</h2>
    <p>Touche (ou clique) une carte de ta main pour la jouer : seules les cartes autorisées sont actives, et la règle qui s'applique est écrite au-dessus. Au clavier, <kbd>Tab</kbd> passe d'une carte à l'autre et <kbd>Entrée</kbd> la joue. Le bouton <strong>💡 Conseil</strong> montre la carte que l'ordinateur jouerait à ta place.</p>
  </div>
</template>

<script id="moteur-belote">
/* Moteur de la belote : cartes, donne, enchères, cartes jouables, plis, décompte, partie et ordinateur. Pur, sans DOM. */
const MoteurBelote = (() => {
  "use strict";
  // Une carte = rang + couleur : « VC » valet de cœur, « 10P » dix de pique. P pique, C cœur, K carreau, T trèfle.
  const COULEURS = Object.freeze(["P", "C", "K", "T"]);
  const SYMBOLES = Object.freeze({ P: "♠", C: "♥", K: "♦", T: "♣" });
  const NOMS_COULEURS = Object.freeze({ P: "pique", C: "cœur", K: "carreau", T: "trèfle" });
  const RANGS = Object.freeze(["7", "8", "9", "10", "V", "D", "R", "A"]);
  const NOMS_RANGS = Object.freeze({ 7: "7", 8: "8", 9: "9", 10: "10", V: "valet", D: "dame", R: "roi", A: "as" });
  const ORDRE_ATOUT = Object.freeze(["7", "8", "D", "R", "10", "A", "9", "V"]); // du plus faible au plus fort
  const ORDRE_NORMAL = Object.freeze(["7", "8", "9", "V", "D", "R", "10", "A"]);
  const POINTS_ATOUT = Object.freeze({ V: 20, 9: 14, A: 11, 10: 10, R: 4, D: 3, 8: 0, 7: 0 });
  const POINTS_NORMAL = Object.freeze({ A: 11, 10: 10, R: 4, D: 3, V: 2, 9: 0, 8: 0, 7: 0 });
  // Le jeu tourne dans le sens inverse des aiguilles d'une montre : Sud, Est, Nord, Ouest. Sud et Nord sont partenaires.
  const JOUEURS = Object.freeze(["sud", "est", "nord", "ouest"]);
  const NOMS_JOUEURS = Object.freeze({ sud: "Toi", est: "Est", nord: "Nord", ouest: "Ouest" });
  const EQUIPES = Object.freeze({ NS: "Nous (Sud et Nord)", EO: "Eux (Est et Ouest)" });

  const couleur = (c) => c.slice(-1);
  const rang = (c) => c.slice(0, -1);
  const estCarte = (c) => typeof c === "string" && /^(7|8|9|10|V|D|R|A)[PCKT]$/.test(c);
  const nomCarte = (c) => `${NOMS_RANGS[rang(c)]} de ${NOMS_COULEURS[couleur(c)]}`;
  const texteCarte = (c) => `${rang(c)}${SYMBOLES[couleur(c)]}`;
  const equipe = (j) => (j === "sud" || j === "nord" ? "NS" : "EO");
  const adverse = (e) => (e === "NS" ? "EO" : "NS");
  const partenaire = (j) => ({ sud: "nord", nord: "sud", est: "ouest", ouest: "est" })[j];
  const suivant = (j) => JOUEURS[(JOUEURS.indexOf(j) + 1) % 4];
  const copie = (x) => JSON.parse(JSON.stringify(x));

  /* ---------- Cartes ---------- */
  const paquet = () => COULEURS.flatMap((c) => RANGS.map((r) => r + c));
  function melanger(cartes, hasard = Math.random) {
    const t = cartes.slice();
    for (let i = t.length - 1; i > 0; i--) { const j = Math.min(i, Math.floor(hasard() * (i + 1))); [t[i], t[j]] = [t[j], t[i]]; }
    return t;
  }
  const pointsCarte = (c, atout) => (couleur(c) === atout ? POINTS_ATOUT : POINTS_NORMAL)[rang(c)];
  /** Force d'une carte dans un pli : un atout bat tout, sinon seule la couleur demandée compte. */
  function force(c, atout, demandee) {
    if (couleur(c) === atout) return 100 + ORDRE_ATOUT.indexOf(rang(c));
    return couleur(c) === demandee ? ORDRE_NORMAL.indexOf(rang(c)) : -1;
  }
  /** Indice, dans le pli, de la carte qui le remporte pour l'instant. */
  function gagnantPli(pli, atout) {
    const demandee = couleur(pli[0].carte);
    let meilleur = 0;
    pli.forEach((p, i) => { if (force(p.carte, atout, demandee) > force(pli[meilleur].carte, atout, demandee)) meilleur = i; });
    return meilleur;
  }
  const pointsPli = (pli, atout) => pli.reduce((s, p) => s + pointsCarte(p.carte, atout), 0);
  /** Trie une main pour l'affichage : par couleur, atout en premier, puis de la plus faible à la plus forte. */
  function trierMain(main, atout = null) {
    const ordreC = atout ? [atout, ...COULEURS.filter((c) => c !== atout)] : COULEURS;
    return main.slice().sort((a, b) => ordreC.indexOf(couleur(a)) - ordreC.indexOf(couleur(b))
      || (couleur(a) === atout ? ORDRE_ATOUT : ORDRE_NORMAL).indexOf(rang(a)) - (couleur(b) === atout ? ORDRE_ATOUT : ORDRE_NORMAL).indexOf(rang(b)));
  }

  /* ---------- Cartes jouables (règles officielles, sans annonces autres que la belote) ---------- */
  const REGLES = Object.freeze({
    entame: "Tu commences le pli : tu peux jouer la carte de ton choix.",
    fournir: "Tu dois fournir : jouer une carte de la couleur demandée.",
    monter: "On joue atout : tu dois fournir à l'atout et monter, c'est-à-dire jouer plus fort que l'atout le plus fort du pli.",
    "fournir-atout": "On joue atout : tu dois fournir à l'atout (tu ne peux pas monter, alors n'importe lequel de tes atouts).",
    couper: "Tu n'as pas la couleur demandée et l'adversaire est maître : tu dois couper (jouer atout).",
    surcouper: "L'adversaire a coupé : tu dois surcouper, c'est-à-dire jouer un atout plus fort que le sien.",
    "sous-couper": "L'adversaire a coupé plus fort que tes atouts : tu dois quand même jouer atout (sous-couper).",
    "partenaire-maitre": "Ton partenaire est maître du pli : tu n'es pas obligé de couper, joue la carte de ton choix.",
    defausse: "Tu n'as ni la couleur demandée ni atout : tu peux te défausser de n'importe quelle carte."
  });
  function cartesJouables(main, pli, atout, joueur) {
    if (!pli.length) return { cartes: main.slice(), regle: "entame" };
    const demandee = couleur(pli[0].carte);
    const meneur = pli[gagnantPli(pli, atout)];
    const forceMeneur = force(meneur.carte, atout, demandee);
    const memes = main.filter((c) => couleur(c) === demandee);
    if (demandee === atout && memes.length) {
      const plusFortes = memes.filter((c) => force(c, atout, demandee) > forceMeneur);
      return plusFortes.length ? { cartes: plusFortes, regle: "monter" } : { cartes: memes, regle: "fournir-atout" };
    }
    if (memes.length) return { cartes: memes, regle: "fournir" };
    if (meneur.joueur === partenaire(joueur)) return { cartes: main.slice(), regle: "partenaire-maitre" };
    const atouts = main.filter((c) => couleur(c) === atout);
    if (!atouts.length) return { cartes: main.slice(), regle: "defausse" };
    if (couleur(meneur.carte) === atout) {
      const plusForts = atouts.filter((c) => force(c, atout, demandee) > forceMeneur);
      return plusForts.length ? { cartes: plusForts, regle: "surcouper" } : { cartes: atouts, regle: "sous-couper" };
    }
    return { cartes: atouts, regle: "couper" };
  }

  /* ---------- Donne : distribution, enchères, plis ---------- */
  /** Distribue 3 puis 2 cartes à chacun, à partir du joueur qui suit le donneur, et retourne la carte suivante. */
  function creerDonne({ donneur = "ouest", hasard = Math.random, cartes = null } = {}) {
    const jeu = cartes ? cartes.slice() : melanger(paquet(), hasard);
    if (jeu.length !== 32 || new Set(jeu).size !== 32 || !jeu.every(estCarte)) throw new Error("paquet invalide");
    const mains = { sud: [], est: [], nord: [], ouest: [] };
    const ordre = [suivant(donneur), suivant(suivant(donneur)), suivant(suivant(suivant(donneur))), donneur];
    for (const n of [3, 2]) for (const j of ordre) mains[j].push(...jeu.splice(0, n));
    return {
      phase: "encheres", donneur, mains, retournee: jeu.shift(), reste: jeu, tour: 1, parole: ordre[0], passes: 0,
      annonces: [], atout: null, preneur: null, pli: [], plis: [], beloteJoueur: null, beloteJouees: 0, resultat: null
    };
  }
  const choixPossibles = (d) => (d.tour === 1 ? ["prendre", "passer"] : [...COULEURS.filter((c) => c !== couleur(d.retournee)), "passer"]);

  function encherir(donne, joueur, choix) {
    if (donne.phase !== "encheres" || donne.parole !== joueur) throw new Error("ce n'est pas ton tour d'enchérir");
    if (!choixPossibles(donne).includes(choix)) throw new Error(`enchère impossible : ${choix}`);
    const d = copie(donne);
    d.annonces.push({ joueur, tour: d.tour, choix });
    if (choix === "passer") {
      d.passes += 1;
      d.parole = suivant(joueur);
      if (d.passes === 4) {
        if (d.tour === 1) { d.tour = 2; d.passes = 0; d.parole = suivant(d.donneur); } else d.phase = "redonne";
      }
      return d;
    }
    d.atout = choix === "prendre" ? couleur(d.retournee) : choix;
    d.preneur = joueur;
    // Le preneur reçoit la carte retournée et 2 cartes, les autres 3 cartes, toujours à partir du joueur qui suit le donneur.
    d.mains[joueur].push(d.retournee, ...d.reste.splice(0, 2));
    let j = suivant(d.donneur);
    for (let k = 0; k < 4; k++, j = suivant(j)) if (j !== joueur) d.mains[j].push(...d.reste.splice(0, 3));
    d.retournee = null;
    d.beloteJoueur = JOUEURS.find((x) => d.mains[x].includes(`R${d.atout}`) && d.mains[x].includes(`D${d.atout}`)) ?? null;
    d.phase = "jeu";
    d.parole = suivant(d.donneur);
    return d;
  }

  function jouerCarte(donne, joueur, carte) {
    if (donne.phase !== "jeu" || donne.parole !== joueur) throw new Error("ce n'est pas ton tour de jouer");
    if (!donne.mains[joueur].includes(carte)) throw new Error(`carte absente : ${carte}`);
    if (!cartesJouables(donne.mains[joueur], donne.pli, donne.atout, joueur).cartes.includes(carte)) throw new Error(`carte interdite : ${carte}`);
    const d = copie(donne);
    d.mains[joueur] = d.mains[joueur].filter((c) => c !== carte);
    d.pli.push({ joueur, carte });
    // Belote (roi d'atout) puis rebelote (dame d'atout) : annoncées automatiquement par le joueur qui a les deux.
    let annonce = null;
    if (joueur === d.beloteJoueur && (carte === `R${d.atout}` || carte === `D${d.atout}`)) { d.beloteJouees += 1; annonce = d.beloteJouees === 1 ? "belote" : "rebelote"; }
    d.derniereAnnonce = annonce;
    if (d.pli.length < 4) { d.parole = suivant(joueur); return d; }
    const g = d.pli[gagnantPli(d.pli, d.atout)].joueur;
    d.plis.push({ cartes: d.pli, gagnant: g, points: pointsPli(d.pli, d.atout) });
    d.pli = [];
    d.parole = g;
    if (d.plis.length === 8) { d.phase = "fin"; d.resultat = resultat(d); }
    return d;
  }

  /**
   * Décompte d'une donne. 162 points par donne (152 en cartes + 10 de der). Le camp preneur doit marquer plus que la
   * défense (belote comprise) ; sinon il est « dedans » : la défense marque 162. Capot (tous les plis) : 250 points.
   * La belote (20) reste toujours au camp qui l'a eue. Égalité : le preneur est dedans (règle simplifiée de cette page).
   */
  function resultat(d) {
    const cartes = { NS: 0, EO: 0 }, plis = { NS: 0, EO: 0 };
    for (const p of d.plis) { cartes[equipe(p.gagnant)] += p.points; plis[equipe(p.gagnant)] += 1; }
    const der = equipe(d.plis[7].gagnant);
    const belote = d.beloteJoueur ? equipe(d.beloteJoueur) : null;
    const total = { NS: cartes.NS + (der === "NS" ? 10 : 0) + (belote === "NS" ? 20 : 0), EO: cartes.EO + (der === "EO" ? 10 : 0) + (belote === "EO" ? 20 : 0) };
    const preneur = equipe(d.preneur), defense = adverse(preneur);
    const capot = plis.NS === 8 ? "NS" : plis.EO === 8 ? "EO" : null;
    const faite = total[preneur] > total[defense];
    const marque = { NS: belote === "NS" ? 20 : 0, EO: belote === "EO" ? 20 : 0 };
    if (capot) marque[capot] += 250;
    else if (faite) { marque[preneur] = total[preneur]; marque[defense] = total[defense]; }
    else marque[defense] += 162;
    return { cartes, plis, der, belote, total, preneur, faite: capot ? capot === preneur : faite, capot, marque, atout: d.atout };
  }

  /* ---------- Partie ---------- */
  function creerPartie({ objectif = 501, donneur = "ouest" } = {}) {
    return { objectif, donneur, scores: { NS: 0, EO: 0 }, donnes: 0, gagnant: null };
  }
  /** Ajoute une donne terminée (ou une redonne quand tout le monde a passé) ; le donneur tourne. */
  function ajouterDonne(partie, donne) {
    const p = copie(partie);
    if (donne.phase === "fin") { p.scores.NS += donne.resultat.marque.NS; p.scores.EO += donne.resultat.marque.EO; p.donnes += 1; }
    else if (donne.phase !== "redonne") throw new Error("donne non terminée");
    p.donneur = suivant(p.donneur);
    if (p.scores.NS >= p.objectif || p.scores.EO >= p.objectif) p.gagnant = p.scores.NS === p.scores.EO ? null : p.scores.NS > p.scores.EO ? "NS" : "EO";
    return p;
  }

  /* ---------- Ordinateur ---------- */
  const VALEUR_ENCHERE_ATOUT = { V: 18, 9: 14, A: 10, 10: 8, R: 5, D: 5, 8: 3, 7: 3 };
  /** Force d'une main pour un atout donné (heuristique d'enchère). */
  function evaluerMain(main, atout) {
    let s = 0;
    const atouts = main.filter((c) => couleur(c) === atout);
    for (const c of atouts) s += VALEUR_ENCHERE_ATOUT[rang(c)];
    for (const c of main.filter((x) => couleur(x) !== atout)) {
      if (rang(c) === "A") s += 9;
      else if (rang(c) === "10") s += main.includes(`A${couleur(c)}`) ? 5 : 1;
    }
    if (atouts.length >= 4) s += 8;
    if (atouts.includes(`R${atout}`) && atouts.includes(`D${atout}`)) s += 6;
    return s;
  }
  const SEUIL = { 1: 34, 2: 38 };
  function choisirEnchere(d, joueur, { niveau = "normal", hasard = Math.random } = {}) {
    const main = [...d.mains[joueur], d.retournee];
    const bruit = niveau === "facile" ? (hasard() - 0.5) * 24 : 0;
    if (d.tour === 1) return evaluerMain(main, couleur(d.retournee)) + bruit >= SEUIL[1] ? "prendre" : "passer";
    const options = COULEURS.filter((c) => c !== couleur(d.retournee)).map((c) => ({ c, s: evaluerMain(main, c) + bruit })).sort((a, b) => b.s - a.s);
    return options[0].s >= SEUIL[2] ? options[0].c : "passer";
  }

  /** Cartes déjà vues (plis joués et pli en cours). */
  const vues = (d) => [...d.plis.flatMap((p) => p.cartes.map((x) => x.carte)), ...d.pli.map((x) => x.carte)];
  /** Une carte est maîtresse si aucune carte plus forte de sa couleur ne reste hors de la main du joueur. */
  function estMaitresse(d, joueur, c) {
    const ordre = couleur(c) === d.atout ? ORDRE_ATOUT : ORDRE_NORMAL, sorties = new Set([...vues(d), ...d.mains[joueur]]);
    return ordre.slice(ordre.indexOf(rang(c)) + 1).every((r) => sorties.has(r + couleur(c)));
  }
  const parPoints = (d) => (a, b) => pointsCarte(a, d.atout) - pointsCarte(b, d.atout) || force(a, d.atout, couleur(a)) - force(b, d.atout, couleur(b));
  const moinsChere = (d, cartes) => cartes.slice().sort((a, b) => (couleur(a) === d.atout) - (couleur(b) === d.atout) || parPoints(d)(a, b))[0];

  function choisirCarte(d, joueur, { niveau = "normal", hasard = Math.random } = {}) {
    const { cartes } = cartesJouables(d.mains[joueur], d.pli, d.atout, joueur);
    if (cartes.length === 1) return cartes[0];
    if (niveau === "facile" && hasard() < 0.45) return cartes[Math.floor(hasard() * cartes.length)];
    const atouts = cartes.filter((c) => couleur(c) === d.atout), autres = cartes.filter((c) => couleur(c) !== d.atout);
    if (!d.pli.length) {
      // Entame : le camp preneur fait tomber les atouts avec ses atouts maîtres ; sinon on encaisse ses cartes maîtresses.
      const atoutsDehors = 8 - [...vues(d), ...d.mains[joueur]].filter((c) => couleur(c) === d.atout).length;
      if (equipe(joueur) === equipe(d.preneur) && atoutsDehors > 0 && atouts.length) {
        const maitre = atouts.find((c) => estMaitresse(d, joueur, c));
        if (maitre) return maitre;
        if (joueur === d.preneur) return atouts.slice().sort(parPoints(d))[0];
      }
      const maitresses = autres.filter((c) => estMaitresse(d, joueur, c)).sort(parPoints(d)).reverse();
      if (maitresses.length) return maitresses[0];
      return moinsChere(d, autres.length ? autres : cartes);
    }
    const demandee = couleur(d.pli[0].carte), meneur = d.pli[gagnantPli(d.pli, d.atout)];
    const dernier = d.pli.length === 3;
    const gagnantes = cartes.filter((c) => force(c, d.atout, demandee) > force(meneur.carte, d.atout, demandee));
    if (meneur.joueur === partenaire(joueur)) {
      // Partenaire maître : on lui donne des points s'il est sûr de gagner, sinon on joue petit.
      const sur = dernier || (couleur(meneur.carte) !== d.atout && estMaitresse(d, joueur, meneur.carte) && d.pli.length === 2) || couleur(meneur.carte) === d.atout && estMaitresse(d, joueur, meneur.carte);
      if (sur && autres.length) return autres.slice().sort(parPoints(d)).reverse()[0];
      return moinsChere(d, cartes);
    }
    if (gagnantes.length) {
      const moinsForte = gagnantes.slice().sort((a, b) => force(a, d.atout, demandee) - force(b, d.atout, demandee))[0];
      if (dernier) return moinsForte;
      const maitre = gagnantes.find((c) => estMaitresse(d, joueur, c) && couleur(c) !== d.atout) ?? gagnantes.find((c) => couleur(c) === d.atout && estMaitresse(d, joueur, c));
      if (maitre) return maitre;
      if (couleur(moinsForte) === d.atout && pointsPli(d.pli, d.atout) >= 10) return moinsForte;
    }
    return moinsChere(d, cartes);
  }

  return Object.freeze({
    COULEURS, SYMBOLES, NOMS_COULEURS, RANGS, JOUEURS, NOMS_JOUEURS, EQUIPES, REGLES, POINTS_ATOUT, POINTS_NORMAL,
    couleur, rang, estCarte, nomCarte, texteCarte, equipe, adverse, partenaire, suivant, paquet, melanger, pointsCarte, force,
    gagnantPli, pointsPli, trierMain, cartesJouables, creerDonne, choixPossibles, encherir, jouerCarte, resultat,
    creerPartie, ajouterDonne, evaluerMain, choisirEnchere, choisirCarte, estMaitresse
  });
})();
</script>
<script id="progression-jeux" data-inclure="gabarit/jeux/progression.js">
/* Progression commune des jeux (ADR 0014, 0015) : XP, niveaux, grades, étoiles, badges, série, objectif du jour,
   révisions espacées, défi du jour, forces et conseil personnalisé. Pur, sans DOM : la date est passée en paramètre.
   Module partagé, recopié dans chaque page par `npm run build` : modifier ce fichier, jamais sa copie dans une page. */
const ProgressionJeux = (() => {
  "use strict";
  const XP = Object.freeze({ parfait: 20, reussi: 10, avecIndice: 5, revision: 5, revisionRatee: 1, lecon: 30, objectif: 20, defi: 15 });
  // Révision espacée (boîtes de Leitner) : une carte réussie passe dans la boîte suivante, revue de plus en plus tard.
  const INTERVALLES = Object.freeze([1, 2, 4, 8, 16]);
  const OBJECTIFS = Object.freeze([1, 3, 5]);
  const MAX_JOURS = 31;
  const JOUR = /^\d{4}-\d{2}-\d{2}$/;
  const RESULTATS = Object.freeze({ victoire: "victoires", nulle: "nulles", defaite: "defaites" });

  /* ---------- Dates (AAAA-MM-JJ, calendrier de l'utilisateur fourni par l'appelant) ---------- */
  function ajouterJours(jour, n) {
    const [a, m, j] = jour.split("-").map(Number);
    return new Date(Date.UTC(a, m - 1, j + n)).toISOString().slice(0, 10);
  }
  const estJour = (v) => typeof v === "string" && JOUR.test(v);
  const entier = (v, max = 1e9) => (Number.isInteger(v) && v >= 0 ? Math.min(v, max) : 0);
  const copie = (e) => JSON.parse(JSON.stringify(e));
  const exoId = (lecon, k) => `${lecon.id}/${k}`;
  const etoiles = ({ erreurs, indices }) => { const p = erreurs + 2 * indices; return p === 0 ? 3 : p <= 2 ? 2 : 1; };
  /* ---------- Boîtes de Leitner, partagées par les jeux et par les exercices des notions (issue #187) ---------- */
  /** Carte suivante : première réussite → boîte 1 ; réussite parfaite → boîte suivante ; sinon retour en boîte 1. */
  function planifierCarte(carte, parfait, jour) {
    const boite = !carte ? 1 : parfait ? Math.min(INTERVALLES.length, carte.boite + 1) : 1;
    return { boite, prochaine: ajouterJours(jour, INTERVALLES[boite - 1]) };
  }
  /** Identifiants des cartes dues à `jour`, de la plus en retard à la plus récente (puis la boîte la plus basse). */
  function cartesDues(cartes, jour) {
    return Object.entries(cartes)
      .filter(([, c]) => c.prochaine <= jour)
      .sort(([, a], [, b]) => a.prochaine.localeCompare(b.prochaine) || a.boite - b.boite)
      .map(([id]) => id);
  }
  /** Petit hachage déterministe : le même défi pour tout le monde le même jour, sans hasard ni réseau. */
  const hacher = (texte) => [...texte].reduce((h, c) => (Math.imul(h, 31) + c.charCodeAt(0)) >>> 0, 7);

  /** Crée l'API de progression d'un jeu à partir de son parcours (grades, leçons, thèmes, badges, niveaux de partie). */
  function creer(parcours) {
    const lecons = new Map(), exercices = new Map();
    parcours.grades.forEach((grade, gi) => grade.lecons.forEach((lecon) => {
      lecons.set(lecon.id, { lecon, grade, gi });
      lecon.exercices.forEach((exo, k) => exercices.set(exoId(lecon, k), { exo, lecon, grade, gi }));
    }));
    const EMBLEMES = Object.freeze(parcours.grades.map((g) => g.embleme));
    const NIVEAUX_PARTIE = parcours.parties?.niveaux ?? {};
    // Compteurs d'événements propres au jeu (capots, belotes…), déclarés par les badges de type « compteur ».
    const COMPTEURS = [...new Set((parcours.badges ?? []).filter((b) => b.condition.type === "compteur").map((b) => b.condition.nom))];
    const toutesLecons = parcours.grades.flatMap((g) => g.lecons);

    function etatInitial() {
      return {
        version: 1, xp: 0, lecons: {}, cartes: {}, themes: {}, serie: 0, serieMax: 0, dernierJour: null, jours: {},
        badges: [], objectif: 3, embleme: EMBLEMES[0], libre: false, revisions: 0, objectifsAtteints: 0, objectifsJours: [], defis: [],
        parties: Object.fromEntries(Object.keys(NIVEAUX_PARTIE).map((n) => [n, { victoires: 0, nulles: 0, defaites: 0, meilleur: null }])),
        compteurs: Object.fromEntries(COMPTEURS.map((n) => [n, 0]))
      };
    }

    /* ---------- Grades et niveaux ---------- */
    const gradeTermine = (e, grade) => grade.lecons.every((l) => e.lecons[l.id]);
    function gradesObtenus(e) {
      let n = 0;
      while (n < parcours.grades.length && gradeTermine(e, parcours.grades[n])) n += 1;
      return n;
    }
    function titre(e) {
      const n = gradesObtenus(e);
      return n === 0 ? "Débutant" : n === parcours.grades.length ? `${parcours.grades[n - 1].nom} : tu es un pro !` : parcours.grades[n - 1].nom;
    }
    function leconDebloquee(e, id) {
      const info = lecons.get(id);
      return !!info && (e.libre || info.gi === 0 || gradeTermine(e, parcours.grades[info.gi - 1]));
    }
    const emblemesDisponibles = (e) => EMBLEMES.slice(0, Math.max(1, gradesObtenus(e) + 1));

    /* ---------- Badges : communs à tous les jeux, puis propres au jeu (décrits dans le parcours) ---------- */
    const victoiresTotal = (e) => Object.values(e.parties).reduce((s, p) => s + p.victoires, 0);
    const lecDuTheme = (themes) => toutesLecons.filter((l) => themes.includes(l.theme));
    const COMMUNS = [
      { id: "premiers-pas", icone: "👣", nom: "Premiers pas", description: "Termine ta première leçon.", avance: (e) => [Object.keys(e.lecons).length, 1] },
      { id: "sans-faute", icone: "⭐", nom: "Sans faute", description: "Termine une leçon avec 3 étoiles.", avance: (e) => [Object.values(e.lecons).some((l) => l.etoiles === 3) ? 1 : 0, 1] },
      { id: "perfectionniste", icone: "🌟", nom: "Perfectionniste", description: "Obtiens 3 étoiles sur toutes les leçons d'un grade.",
        avance: (e) => [Math.max(...parcours.grades.map((g) => g.lecons.filter((l) => e.lecons[l.id]?.etoiles === 3).length / g.lecons.length)) >= 1 ? 1 : 0, 1] },
      { id: "pro", icone: "🏆", nom: "Du débutant au pro", description: `Obtiens les ${parcours.grades.length} grades.`, avance: (e) => [gradesObtenus(e), parcours.grades.length] },
      { id: "serie-3", icone: "🔥", nom: "Ça chauffe", description: "Entraîne-toi 3 jours de suite.", avance: (e) => [e.serieMax, 3] },
      { id: "serie-7", icone: "📅", nom: "Une semaine sans pause", description: "Entraîne-toi 7 jours de suite.", avance: (e) => [e.serieMax, 7] },
      { id: "regulier", icone: "🎯", nom: "Régulier", description: "Atteins 5 fois ton objectif du jour.", avance: (e) => [e.objectifsAtteints, 5] },
      { id: "memoire", icone: "🧠", nom: "Mémoire d'éléphant", description: "Fais 10 révisions.", avance: (e) => [e.revisions, 10] },
      { id: "bibliotheque", icone: "📚", nom: "Bibliothèque", description: "Maîtrise 10 stratégies (révisées plusieurs fois avec succès).",
        avance: (e) => [Object.values(e.cartes).filter((c) => c.boite >= 4).length, 10] },
      { id: "defis", icone: "⚡", nom: "Défis relevés", description: "Réussis 3 défis du jour.", avance: (e) => [e.defis.length, 3] }
    ];
    function versBadge({ id, icone, nom, description, condition: c }) {
      let avance;
      if (c.type === "themes") {
        avance = (e) => { const l = lecDuTheme(c.themes), faites = l.filter((x) => e.lecons[x.id]).length; return c.toutes === false ? [Math.min(1, faites), 1] : [faites, l.length]; };
      } else if (c.type === "victoires") {
        avance = (e) => [c.niveau ? e.parties[c.niveau]?.victoires ?? 0 : victoiresTotal(e), c.min];
      } else if (c.type === "compteur") {
        avance = (e) => [e.compteurs[c.nom] ?? 0, c.min];
      } else if (c.type === "record") {
        avance = (e) => { const m = e.parties[c.niveau]?.meilleur; return [m !== null && m !== undefined && m <= c.max ? 1 : 0, 1]; };
      } else throw new Error(`badge ${id} : condition « ${c.type} » inconnue`);
      return { id, icone, nom, description, avance };
    }
    const BADGES = [...COMMUNS, ...(parcours.badges ?? []).map(versBadge)];
    const ids = BADGES.map((b) => b.id);
    if (new Set(ids).size !== ids.length) throw new Error("badges en double");

    function badges(e) {
      return BADGES.map(({ avance, ...b }) => { const [actuel, cible] = avance(e); return { ...b, actuel: Math.min(actuel, cible), cible, obtenu: actuel >= cible }; });
    }

    /* ---------- Relecture d'un état stocké ---------- */
    const objet = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
    function normaliser(brut) {
      const base = etatInitial();
      if (!brut || typeof brut !== "object") return base;
      const e = { ...base, xp: entier(brut.xp), serie: entier(brut.serie), serieMax: entier(brut.serieMax), revisions: entier(brut.revisions),
        objectifsAtteints: entier(brut.objectifsAtteints), libre: brut.libre === true,
        objectif: OBJECTIFS.includes(brut.objectif) ? brut.objectif : base.objectif,
        embleme: EMBLEMES.includes(brut.embleme) ? brut.embleme : base.embleme,
        dernierJour: estJour(brut.dernierJour) ? brut.dernierJour : null };
      for (const [id, v] of Object.entries(objet(brut.lecons))) {
        if (lecons.has(id) && [1, 2, 3].includes(v?.etoiles)) e.lecons[id] = { etoiles: v.etoiles, jour: estJour(v.jour) ? v.jour : null };
      }
      for (const [id, v] of Object.entries(objet(brut.cartes))) {
        if (exercices.has(id) && Number.isInteger(v?.boite) && v.boite >= 1 && v.boite <= INTERVALLES.length && estJour(v.prochaine)) e.cartes[id] = { boite: v.boite, prochaine: v.prochaine };
      }
      for (const [t, v] of Object.entries(objet(brut.themes))) {
        if (parcours.themes[t]) { const essais = entier(v?.essais); e.themes[t] = { essais, premiers: Math.min(essais, entier(v?.premiers)) }; }
      }
      for (const [j, n] of Object.entries(objet(brut.jours))) if (estJour(j)) e.jours[j] = entier(n, 1000);
      e.badges = Array.isArray(brut.badges) ? [...new Set(brut.badges.filter((b) => ids.includes(b)))] : [];
      e.defis = Array.isArray(brut.defis) ? [...new Set(brut.defis.filter(estJour))].slice(-MAX_JOURS) : [];
      e.objectifsJours = Array.isArray(brut.objectifsJours) ? [...new Set(brut.objectifsJours.filter(estJour))].slice(-MAX_JOURS) : [];
      for (const n of Object.keys(NIVEAUX_PARTIE)) {
        const p = objet(objet(brut.parties)[n]);
        e.parties[n] = { victoires: entier(p.victoires), nulles: entier(p.nulles), defaites: entier(p.defaites), meilleur: Number.isInteger(p.meilleur) && p.meilleur >= 0 ? p.meilleur : null };
      }
      for (const n of COMPTEURS) e.compteurs[n] = entier(objet(brut.compteurs)[n]);
      return e;
    }

    /* ---------- Enregistrements : chaque fonction renvoie un nouvel état et ce qui a été gagné ---------- */
    function cloturer(e, avant, gains) {
      const obtenus = badges(e).filter((b) => b.obtenu).map((b) => b.id);
      gains.badges = obtenus.filter((id) => !avant.badges.includes(id)).map((id) => { const { avance, ...b } = BADGES.find((x) => x.id === id); return b; });
      e.badges = [...new Set([...avant.badges.filter((id) => ids.includes(id)), ...obtenus])];
      gains.niveauAvant = niveau(avant.xp).niveau;
      gains.niveauApres = niveau(e.xp).niveau;
      gains.gradesAvant = gradesObtenus(avant);
      gains.gradesApres = gradesObtenus(e);
      return { etat: e, gains };
    }
    /** Activité du jour : série de jours consécutifs, compteur du jour, bonus quand l'objectif est atteint. */
    function compterActivite(e, jour, gains) {
      if (e.dernierJour !== jour) {
        e.serie = e.dernierJour && ajouterJours(e.dernierJour, 1) === jour ? e.serie + 1 : 1;
        e.serieMax = Math.max(e.serieMax, e.serie);
        e.dernierJour = jour;
      }
      e.jours[jour] = (e.jours[jour] ?? 0) + 1;
      for (const j of Object.keys(e.jours).sort().slice(0, -MAX_JOURS)) delete e.jours[j];
      // Une seule récompense par date, même si le joueur change son objectif dans la journée.
      if (e.jours[jour] >= e.objectif && !e.objectifsJours.includes(jour)) {
        e.objectifsJours = [...e.objectifsJours, jour].slice(-MAX_JOURS);
        e.xp += XP.objectif; gains.xp += XP.objectif; gains.objectif = true; e.objectifsAtteints += 1;
      }
    }

    function enregistrerExercice(etat, { id, erreurs = 0, indice = false, jour, revision = false }) {
      const info = exercices.get(id);
      if (!info) throw new Error(`exercice inconnu : ${id}`);
      const e = copie(etat), gains = { xp: 0, objectif: false };
      const parfait = erreurs === 0 && !indice;
      const gain = revision ? (parfait ? XP.revision : XP.revisionRatee) : parfait ? XP.parfait : indice ? XP.avecIndice : XP.reussi;
      e.xp += gain; gains.xp += gain;
      const t = e.themes[info.lecon.theme] ?? { essais: 0, premiers: 0 };
      e.themes[info.lecon.theme] = { essais: t.essais + 1, premiers: t.premiers + (parfait ? 1 : 0) };
      e.cartes[id] = planifierCarte(e.cartes[id], parfait, jour);
      if (revision) e.revisions += 1;
      compterActivite(e, jour, gains);
      return cloturer(e, etat, gains);
    }

    function terminerLecon(etat, { id, etoiles: n, jour }) {
      if (!lecons.has(id)) throw new Error(`leçon inconnue : ${id}`);
      const e = copie(etat), gains = { xp: 0, objectif: false, premiereFois: !etat.lecons[id] };
      if (gains.premiereFois) { e.xp += XP.lecon; gains.xp += XP.lecon; }
      e.lecons[id] = { etoiles: Math.max(n, e.lecons[id]?.etoiles ?? 0), jour };
      return cloturer(e, etat, gains);
    }

    /** Partie terminée (contre l'ordinateur, ou partie de démineur). `temps` en secondes, pour les records. */
    function enregistrerPartie(etat, { resultat, niveau: n, jour, temps = null }) {
      const regle = NIVEAUX_PARTIE[n];
      if (!RESULTATS[resultat] || !regle || regle.xp[resultat] === undefined) throw new Error("partie invalide");
      const e = copie(etat), gains = { xp: 0, objectif: false, record: false };
      const gain = regle.xp[resultat];
      e.xp += gain; gains.xp += gain;
      const p = e.parties[n];
      p[RESULTATS[resultat]] += 1;
      if (resultat === "victoire" && Number.isInteger(temps) && temps >= 0 && (p.meilleur === null || temps < p.meilleur)) { p.meilleur = temps; gains.record = true; }
      compterActivite(e, jour, gains);
      return cloturer(e, etat, gains);
    }

    /** Événements de jeu (ex. un capot) : seulement les compteurs déclarés par les badges, sans XP ni activité. */
    function compter(etat, { compteurs = {} }) {
      const e = copie(etat), gains = { xp: 0, objectif: false };
      for (const [n, k] of Object.entries(compteurs)) if (COMPTEURS.includes(n) && Number.isInteger(k) && k > 0) e.compteurs[n] += k;
      return cloturer(e, etat, gains);
    }

    function enregistrerDefi(etat, { jour }) {
      const e = copie(etat), gains = { xp: 0, objectif: false };
      if (!e.defis.includes(jour)) { e.defis = [...e.defis, jour].slice(-MAX_JOURS); e.xp += XP.defi; gains.xp += XP.defi; }
      return cloturer(e, etat, gains);
    }

    function regler(etat, { objectif, embleme, libre }) {
      const e = copie(etat);
      if (OBJECTIFS.includes(objectif)) e.objectif = objectif;
      if (emblemesDisponibles(etat).includes(embleme)) e.embleme = embleme;
      if (typeof libre === "boolean") e.libre = libre;
      return e;
    }

    /* ---------- Lectures ---------- */
    const revisionsDues = (etat, jour) => cartesDues(etat.cartes, jour);
    function forces(etat) {
      return Object.entries(parcours.themes).map(([id, nom]) => {
        const t = etat.themes[id] ?? { essais: 0, premiers: 0 };
        return { id, nom, essais: t.essais, taux: t.essais >= 3 ? t.premiers / t.essais : null };
      });
    }
    /** Série encore valable aujourd'hui (elle est cassée si le dernier jour actif est avant-hier ou plus ancien). */
    const serieActuelle = (e, jour) => (e.dernierJour === jour || e.dernierJour === ajouterJours(jour, -1) ? e.serie : 0);
    /** Activité des `n` derniers jours, du plus ancien au plus récent. */
    const activite = (e, jour, n = 7) => Array.from({ length: n }, (_, k) => { const j = ajouterJours(jour, k - n + 1); return { jour: j, exercices: e.jours[j] ?? 0 }; });

    function defiDuJour(etat, jour) {
      // Liste commune, indépendante de la progression : vraiment le même défi pour tout le monde le même jour.
      const candidats = [...exercices.entries()].filter(([, x]) => x.exo.type !== "qcm").map(([id]) => id);
      if (!candidats.length) return null;
      return { id: candidats[hacher(jour) % candidats.length], fait: etat.defis.includes(jour) };
    }

    /** Conseil personnalisé : réviser, retravailler un point faible, avancer, se perfectionner, ou jouer. */
    function recommandation(etat, jour) {
      const dues = revisionsDues(etat, jour);
      const ouvertes = toutesLecons.filter((l) => leconDebloquee(etat, l.id));
      if (dues.length >= 3) return { type: "revision", nombre: dues.length, texte: `${dues.length} stratégies t'attendent pour une révision : c'est le meilleur moyen de les retenir pour toujours.` };
      const faibles = forces(etat).filter((f) => f.taux !== null && f.taux < 0.6).sort((a, b) => a.taux - b.taux);
      for (const f of faibles) {
        const lecon = ouvertes.filter((l) => l.theme === f.id).sort((a, b) => (etat.lecons[a.id]?.etoiles ?? 0) - (etat.lecons[b.id]?.etoiles ?? 0))[0];
        if (lecon && (etat.lecons[lecon.id]?.etoiles ?? 0) < 3) return { type: "faiblesse", lecon: lecon.id, theme: f.id, texte: `Ton point à travailler : ${f.nom.toLowerCase()} (${Math.round(f.taux * 100)} % réussi du premier coup). Refais « ${lecon.titre} ».` };
      }
      const suivante = ouvertes.find((l) => !etat.lecons[l.id]);
      if (suivante) return { type: "suite", lecon: suivante.id, texte: Object.keys(etat.lecons).length ? `Prochaine étape : « ${suivante.titre} ».` : `Bienvenue ! Commence par « ${suivante.titre} ».` };
      if (dues.length) return { type: "revision", nombre: dues.length, texte: `${dues.length} révision${dues.length > 1 ? "s" : ""} pour garder tes stratégies en tête.` };
      const aPerfectionner = ouvertes.find((l) => etat.lecons[l.id].etoiles < 3);
      if (aPerfectionner) return { type: "perfection", lecon: aPerfectionner.id, texte: `Vise les 3 étoiles sur « ${aPerfectionner.titre} ».` };
      if (gradesObtenus(etat) < parcours.grades.length) {
        const g = parcours.grades[gradesObtenus(etat)];
        return { type: "suite", lecon: g.lecons.find((l) => !etat.lecons[l.id])?.id ?? g.lecons[0].id, texte: `Termine le grade ${g.nom} pour progresser.` };
      }
      return { type: "jouer", texte: parcours.conseilFinal ?? "Tu as tout appris ! Mets tes stratégies en pratique en jouant." };
    }

    /** Règles de gain d'XP, pour les expliquer au joueur (transparence de la gamification). */
    function reglesXP() {
      const regles = [
        ["Exercice réussi du premier coup", XP.parfait], ["Exercice réussi après une erreur", XP.reussi], ["Exercice réussi avec un indice", XP.avecIndice],
        ["Leçon terminée (la première fois)", XP.lecon], ["Révision réussie du premier coup", XP.revision], ["Objectif du jour atteint", XP.objectif], ["Défi du jour réussi", XP.defi]
      ];
      for (const [, n] of Object.entries(NIVEAUX_PARTIE)) {
        for (const [r, xp] of Object.entries(n.xp)) regles.push([`Partie ${n.nom} : ${{ victoire: "victoire", nulle: "nulle", defaite: "défaite" }[r]}`, xp]);
      }
      return regles.map(([texte, xp]) => ({ texte, xp }));
    }

    return Object.freeze({
      parcours, EMBLEMES, BADGES: BADGES.map(({ avance, ...b }) => b), NIVEAUX_PARTIE, lecons, exercices,
      etatInitial, normaliser, niveau, gradesObtenus, titre, leconDebloquee, emblemesDisponibles, badges,
      enregistrerExercice, terminerLecon, enregistrerPartie, enregistrerDefi, compter, regler,
      revisionsDues, forces, serieActuelle, activite, defiDuJour, recommandation, reglesXP
    });
  }

  /** Niveau n atteint à 50 × n × (n − 1) XP : 0, 100, 300, 600, 1000… (chaque niveau demande un peu plus). */
  function niveau(xp) {
    let n = 1;
    while (50 * (n + 1) * n <= xp) n += 1;
    const debut = 50 * n * (n - 1), fin = 50 * (n + 1) * n;
    return { niveau: n, xpDansNiveau: xp - debut, xpPourNiveau: fin - debut };
  }

  return Object.freeze({ XP, INTERVALLES, OBJECTIFS, ajouterJours, exoId, etoiles, niveau, creer, planifierCarte, cartesDues });
})();
</script>
<script id="academie-jeux" data-inclure="gabarit/jeux/academie.js">
/* Interface commune de l'Académie des jeux (ADR 0014, 0015) : synthèse, parcours, séances d'exercices et page

   Module partagé, recopié dans chaque page par `npm run build` : modifier ce fichier, jamais sa copie dans une page.
   Contenu affiché uniquement par textContent et createElement (jamais innerHTML). */
const VueAcademie = (() => {
  "use strict";

  function el(balise, attributs = {}, ...enfants) {
    const n = document.createElement(balise);
    for (const [k, v] of Object.entries(attributs)) {

      if (k === "texte") n.textContent = v; else if (k === "classe") n.className = v; else n.setAttribute(k, v === true ? "" : v);
    }

    return n;
  }
  const etoilesTexte = (n) => `${"★".repeat(n)}${"☆".repeat(3 - n)}`;
  const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;
  const jourLocal = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const dateCourte = (jour) => `${jour.slice(8, 10)}/${jour.slice(5, 7)}`;
  const JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  const nomJour = (jour) => { const [a, m, j] = jour.split("-").map(Number); return JOURS[new Date(a, m - 1, j).getDay()]; };
  const formaterTemps = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  function barre(actuel, cible, libelle) {
    const b = el("div", { classe: "barre", role: "progressbar", "aria-label": libelle, "aria-valuemin": 0, "aria-valuemax": cible, "aria-valuenow": actuel }, el("span"));

   * - progression : API créée par ProgressionJeux.creer(parcours)

    z.dNiveau = el("div", { "data-sortie": "detail-niveau" }); z.dRegles = el("table", { classe: "regles-xp" });

    z.dRegularite = el("div", { "data-sortie": "regularite" }); z.dActivite = el("ol", { classe: "activite", "aria-label": "Activité des 7 derniers jours", "data-sortie": "activite" });
    z.dCarnet = el("ul", { classe: "carnet", "data-sortie": "carnet" });
    z.dForces = el("ul", { classe: "forces" }); z.dParties = el("ul", { classe: "parties", "data-sortie": "parties" });

    vues.detail.append(retourDetail, z.detailTitre,
      section("⬆️ Niveau et XP", z.dNiveau, el("details", {}, el("summary", { texte: "Comment gagner de l'XP ?" }), z.dRegles)),
      section("🎖️ Grades", el("p", { classe: "doux", texte: "Chaque grade obtenu ouvre le suivant et un nouvel emblème." }), z.dGrades),
      section("🏅 Badges", z.dBadges),
      section("🔥 Régularité", z.dRegularite, z.dActivite),
      section("📒 Carnet de stratégies", el("p", { classe: "doux", texte: "Chaque stratégie apprise revient en révision, de plus en plus espacée quand tu la réussis." }), z.dCarnet),
      section("📈 Points forts et points faibles", z.dForces, z.dParties),
      section("⚙️ Réglages", z.dReglages));

    // Séance
    z.fil = el("p", { classe: "doux fil", "data-sortie": "fil" });
    z.sTitre = el("h2", { tabindex: "-1", "data-sortie": "session-titre" });

    z.consigne = el("p", { classe: "consigne", "data-sortie": "consigne" });
    z.qcm = el("ul", { classe: "qcm", hidden: true });
    z.zoneJeu = el("div", { classe: "zone-exercice" });
    z.retour = el("p", { classe: "message", role: "status", "aria-live": "polite", "data-sortie": "retour" });

    z.suivant = el("button", { type: "button", classe: "action", "data-action": "suivant", hidden: true });
    z.exercice = el("div", { classe: "carte" }, z.progression, z.consigne, z.zoneJeu, z.qcm, z.retour, el("div", { classe: "boutons" }, z.indice, z.suivant));
    z.bTitre = el("h2", { tabindex: "-1", "data-sortie": "bilan-titre" }); z.bTexte = el("p", { "data-sortie": "bilan-texte" });
    z.bSuite = el("button", { type: "button", classe: "action", "data-action": "bilan-suite", hidden: true });
    const bRetour = el("button", { type: "button", classe: "secondaire", "data-action": "bilan-retour", texte: "Retour à l'Académie" });
    z.bilan = el("div", { classe: "carte bilan", hidden: true }, z.bTitre, z.bTexte, el("div", { classe: "boutons" }, z.bSuite, bRetour));

    vues.session.append(retourSession, z.fil, z.sTitre, z.sTexte, z.zoneRetenir, z.exercice, z.bilan);

    /* ---------- Gains ---------- */
    function appliquer({ etat: nouvel, gains }) {
      etat = nouvel; sauver();
      const morceaux = [];
      if (gains.xp) morceaux.push(`+${gains.xp} XP`);
      if (gains.record) morceaux.push("⏱️ Nouveau record");
      if (gains.objectif) morceaux.push("🎯 Objectif du jour atteint");
      if (gains.niveauApres > gains.niveauAvant) morceaux.push(`⬆️ Niveau ${gains.niveauApres} !`);
      if (gains.gradesApres > gains.gradesAvant) morceaux.push(`🎖️ Grade ${parcours.grades[gains.gradesApres - 1].nom} obtenu : nouvel emblème disponible`);

    function montrer(nom) {

      if (nom === "accueil") afficherAccueil();
      if (nom === "detail") afficherDetail();

      z.niveau.textContent = `Niveau ${niv.niveau} · ${etat.xp} XP · encore ${niv.xpPourNiveau - niv.xpDansNiveau} XP pour le niveau ${niv.niveau + 1}`;
      z.barre.replaceChildren(barre(niv.xpDansNiveau, niv.xpPourNiveau, "Progression vers le niveau suivant"));

      z.chips.replaceChildren(...[
        `🔥 ${pluriel(serie, "jour")} de suite`,
        `🎯 Aujourd'hui : ${Math.min(aujourdhui, etat.objectif)} / ${etat.objectif}${aujourdhui >= etat.objectif ? " ✓" : ""}`,

        `🏅 Badges : ${tous.filter((b) => b.obtenu).length} / ${tous.length}`

      const conseil = P.recommandation(etat, j);
      z.conseil.textContent = conseil.texte;
