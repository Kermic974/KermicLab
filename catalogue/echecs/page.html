<script id="academie-echecs">
/* Académie : progression, XP, grades, badges, série, objectif du jour, révisions espacées et conseils. Pur, sans DOM. */
const AcademieEchecs = (() => {
  "use strict";
  const XP = Object.freeze({ parfait: 20, reussi: 10, avecIndice: 5, revision: 5, revisionRatee: 1, lecon: 30, objectif: 20, defi: 15,
    victoire: Object.freeze({ facile: 50, moyen: 100 }), nulle: 20, defaite: 5 });
  // Révision espacée (boîtes de Leitner) : une carte réussie passe dans la boîte suivante, revue de plus en plus tard.
  const INTERVALLES = Object.freeze([1, 2, 4, 8, 16]);
  const OBJECTIFS = Object.freeze([1, 3, 5]);
  const EMBLEMES = Object.freeze(["p", "n", "b", "r", "q", "k"]);
  const MAX_JOURS = 31;
  const JOUR = /^\d{4}-\d{2}-\d{2}$/;

  /* ---------- Dates (AAAA-MM-JJ, calendrier de l'utilisateur fourni par l'appelant) ---------- */
  function ajouterJours(jour, n) {
    const [a, m, j] = jour.split("-").map(Number);
    return new Date(Date.UTC(a, m - 1, j + n)).toISOString().slice(0, 10);
  }

  /* ---------- Parcours ---------- */
  const exoId = (lecon, k) => `${lecon.id}/${k}`;
  function indexer(parcours) {
    const lecons = new Map(), exercices = new Map();
    parcours.grades.forEach((grade, gi) => grade.lecons.forEach((lecon) => {
      lecons.set(lecon.id, { lecon, grade, gi });
      lecon.exercices.forEach((exo, k) => exercices.set(exoId(lecon, k), { exo, lecon, grade, gi }));
    }));
    return { lecons, exercices };
  }

  function etatInitial() {
    return {
      version: 1, xp: 0, lecons: {}, cartes: {}, themes: {}, serie: 0, serieMax: 0, dernierJour: null, jours: {},
      badges: [], objectif: 3, embleme: "p", libre: false, revisions: 0, objectifsAtteints: 0, defis: [],
      parties: { facile: { victoires: 0, nulles: 0, defaites: 0 }, moyen: { victoires: 0, nulles: 0, defaites: 0 } }
    };
  }

  const entier = (v, max = 1e9) => (Number.isInteger(v) && v >= 0 ? Math.min(v, max) : 0);
  const estJour = (v) => typeof v === "string" && JOUR.test(v);

  /** Relit un état stocké en le validant champ par champ (stockage corrompu ou modifié à la main : valeurs par défaut). */
  function normaliser(brut, parcours) {
    const base = etatInitial();
    if (!brut || typeof brut !== "object") return base;
    const { lecons, exercices } = indexer(parcours);
    const objet = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
    const e = { ...base, xp: entier(brut.xp), serie: entier(brut.serie), serieMax: entier(brut.serieMax), revisions: entier(brut.revisions),
      objectifsAtteints: entier(brut.objectifsAtteints), libre: brut.libre === true,
      objectif: OBJECTIFS.includes(brut.objectif) ? brut.objectif : base.objectif,
      embleme: EMBLEMES.includes(brut.embleme) ? brut.embleme : base.embleme,
      dernierJour: estJour(brut.dernierJour) ? brut.dernierJour : null };
    for (const [id, v] of Object.entries(objet(brut.lecons))) {
      if (lecons.has(id) && [1, 2, 3].includes(v?.etoiles)) e.lecons[id] = { etoiles: v.etoiles, jour: estJour(v.jour) ? v.jour : null };
    }
    for (const [id, v] of Object.entries(objet(brut.cartes))) {
      if (exercices.has(id) && Number.isInteger(v?.boite) && v.boite >= 1 && v.boite <= INTERVALLES.length && estJour(v.prochaine)) e.cartes[id] = { boite: v.boite, prochaine: v.prochaine };
    }
    const themes = new Set(Object.keys(parcours.themes));
    for (const [t, v] of Object.entries(objet(brut.themes))) {
      if (themes.has(t)) { const essais = entier(v?.essais); e.themes[t] = { essais, premiers: Math.min(essais, entier(v?.premiers)) }; }
    }
    for (const [j, n] of Object.entries(objet(brut.jours))) if (estJour(j)) e.jours[j] = entier(n, 1000);
    e.badges = Array.isArray(brut.badges) ? [...new Set(brut.badges.filter((b) => BADGES.some((d) => d.id === b)))] : [];
    e.defis = Array.isArray(brut.defis) ? [...new Set(brut.defis.filter(estJour))].slice(-MAX_JOURS) : [];
    for (const niveau of Object.keys(base.parties)) {
      const p = objet(objet(brut.parties)[niveau]);
      e.parties[niveau] = { victoires: entier(p.victoires), nulles: entier(p.nulles), defaites: entier(p.defaites) };
    }
    return e;
  }

  const copie = (e) => JSON.parse(JSON.stringify(e));

  /* ---------- Niveaux et grades ---------- */
  /** Niveau n atteint à 50 × n × (n − 1) XP : 0, 100, 300, 600, 1000… (chaque niveau demande un peu plus). */
  function niveau(xp) {
    let n = 1;
    while (50 * (n + 1) * n <= xp) n += 1;
    const debut = 50 * n * (n - 1), fin = 50 * (n + 1) * n;
    return { niveau: n, xpDansNiveau: xp - debut, xpPourNiveau: fin - debut };
  }

  const gradeTermine = (e, grade) => grade.lecons.every((l) => e.lecons[l.id]);
  /** Nombre de grades obtenus, dans l'ordre (un grade compte quand toutes ses leçons sont faites). */
  function gradesObtenus(e, parcours) {
    let n = 0;
    while (n < parcours.grades.length && gradeTermine(e, parcours.grades[n])) n += 1;
    return n;
  }
  function titre(e, parcours) {
    const n = gradesObtenus(e, parcours);
    return n === 0 ? "Débutant" : n === parcours.grades.length ? `${parcours.grades[n - 1].nom} : tu es un pro !` : parcours.grades[n - 1].nom;
  }

  function leconDebloquee(e, parcours, leconId) {
    const info = indexer(parcours).lecons.get(leconId);
    if (!info) return false;
    return e.libre || info.gi === 0 || gradeTermine(e, parcours.grades[info.gi - 1]);
  }
  /** Emblèmes choisis par le joueur : un nouveau à chaque grade obtenu. */
  const emblemesDisponibles = (e, parcours) => EMBLEMES.slice(0, Math.max(1, gradesObtenus(e, parcours) + 1));

  /* ---------- Badges ---------- */
  const victoires = (e) => e.parties.facile.victoires + e.parties.moyen.victoires;
  const BADGES = [
    { id: "premiers-pas", icone: "👣", nom: "Premiers pas", description: "Termine ta première leçon.", obtenu: (e) => Object.keys(e.lecons).length >= 1 },
    { id: "sans-faute", icone: "⭐", nom: "Sans faute", description: "Termine une leçon avec 3 étoiles.", obtenu: (e) => Object.values(e.lecons).some((l) => l.etoiles === 3) },
    { id: "premier-mat", icone: "♚", nom: "Premier mat", description: "Termine une leçon de mats.", obtenu: (e, ctx) => Object.keys(e.lecons).some((id) => ctx.lecons.get(id)?.lecon.theme === "mats") },
    { id: "tacticien", icone: "🗡️", nom: "Tacticien", description: "Termine toutes les leçons de tactique.", obtenu: (e, ctx) => themeTermine(e, ctx, "tactique") },
    { id: "stratege", icone: "🧭", nom: "Stratège", description: "Termine les leçons d'ouverture et de milieu de partie.", obtenu: (e, ctx) => themeTermine(e, ctx, "ouverture") && themeTermine(e, ctx, "milieu") },
    { id: "finaliste", icone: "👑", nom: "As des finales", description: "Termine toutes les leçons de finales.", obtenu: (e, ctx) => themeTermine(e, ctx, "finales") },
    { id: "perfectionniste", icone: "🌟", nom: "Perfectionniste", description: "Obtiens 3 étoiles sur toutes les leçons d'un grade.", obtenu: (e, ctx) => ctx.parcours.grades.some((g) => g.lecons.every((l) => e.lecons[l.id]?.etoiles === 3)) },
    { id: "pro", icone: "🏆", nom: "Du débutant au pro", description: "Obtiens les six grades.", obtenu: (e, ctx) => gradesObtenus(e, ctx.parcours) === ctx.parcours.grades.length },
    { id: "serie-3", icone: "🔥", nom: "Ça chauffe", description: "Entraîne-toi 3 jours de suite.", obtenu: (e) => e.serieMax >= 3 },
    { id: "serie-7", icone: "📅", nom: "Une semaine sans pause", description: "Entraîne-toi 7 jours de suite.", obtenu: (e) => e.serieMax >= 7 },
    { id: "regulier", icone: "🎯", nom: "Régulier", description: "Atteins 5 fois ton objectif du jour.", obtenu: (e) => e.objectifsAtteints >= 5 },
    { id: "memoire", icone: "🧠", nom: "Mémoire d'éléphant", description: "Fais 10 révisions.", obtenu: (e) => e.revisions >= 10 },
    { id: "bibliotheque", icone: "📚", nom: "Bibliothèque", description: "Maîtrise 10 stratégies (révisées plusieurs fois avec succès).", obtenu: (e) => Object.values(e.cartes).filter((c) => c.boite >= 4).length >= 10 },
    { id: "defis", icone: "⚡", nom: "Défis relevés", description: "Réussis 3 défis du jour.", obtenu: (e) => e.defis.length >= 3 },
    { id: "robot-facile", icone: "🤖", nom: "Premier robot battu", description: "Bats l'ordinateur au niveau Facile.", obtenu: (e) => e.parties.facile.victoires >= 1 },
    { id: "robot-moyen", icone: "🦾", nom: "Robot moyen battu", description: "Bats l'ordinateur au niveau Moyen.", obtenu: (e) => e.parties.moyen.victoires >= 1 },
    { id: "champion", icone: "🥇", nom: "Champion", description: "Gagne 10 parties contre l'ordinateur.", obtenu: (e) => victoires(e) >= 10 }
  ];
  function themeTermine(e, ctx, theme) {
    const lecons = [...ctx.lecons.values()].filter((x) => x.lecon.theme === theme);
    return lecons.length > 0 && lecons.every((x) => e.lecons[x.lecon.id]);
  }
  function badges(e, parcours) {
    const ctx = { ...indexer(parcours), parcours };
    return BADGES.map(({ obtenu, ...b }) => ({ ...b, obtenu: obtenu(e, ctx) }));
  }

  /* ---------- Enregistrements (chaque fonction renvoie un nouvel état et ce qui a été gagné) ---------- */
  function cloturer(e, parcours, avant, gains) {
    const obtenus = badges(e, parcours).filter((b) => b.obtenu).map((b) => b.id);
    gains.badges = obtenus.filter((id) => !e.badges.includes(id)).map((id) => BADGES.find((b) => b.id === id));
    e.badges = obtenus;
    gains.niveauAvant = niveau(avant.xp).niveau;
    gains.niveauApres = niveau(e.xp).niveau;
    gains.gradesAvant = gradesObtenus(avant, parcours);
    gains.gradesApres = gradesObtenus(e, parcours);
    gains.badges = gains.badges.map(({ obtenu, ...b }) => b);
    return { etat: e, gains };
  }

  /** Activité du jour : série de jours consécutifs, compteur du jour, bonus quand l'objectif est atteint. */
  function compterActivite(e, jour, gains) {
    if (e.dernierJour !== jour) {
      e.serie = e.dernierJour && ajouterJours(e.dernierJour, 1) === jour ? e.serie + 1 : 1;
      e.serieMax = Math.max(e.serieMax, e.serie);
      e.dernierJour = jour;
    }
    e.jours[jour] = (e.jours[jour] ?? 0) + 1;
    for (const j of Object.keys(e.jours).sort().slice(0, -MAX_JOURS)) delete e.jours[j];
    if (e.jours[jour] === e.objectif) { e.xp += XP.objectif; gains.xp += XP.objectif; gains.objectif = true; e.objectifsAtteints += 1; }
  }

  /** Exercice réussi (après d'éventuelles erreurs). Toute nouvelle réussite programme sa prochaine révision. */
  function enregistrerExercice(etat, parcours, { id, erreurs = 0, indice = false, jour, revision = false }) {
    const info = indexer(parcours).exercices.get(id);
    if (!info) throw new Error(`exercice inconnu : ${id}`);
    const e = copie(etat), gains = { xp: 0, objectif: false };
    const parfait = erreurs === 0 && !indice;
    const gain = revision ? (parfait ? XP.revision : XP.revisionRatee) : parfait ? XP.parfait : indice ? XP.avecIndice : XP.reussi;
    e.xp += gain; gains.xp += gain;
    const t = e.themes[info.lecon.theme] ?? { essais: 0, premiers: 0 };
    e.themes[info.lecon.theme] = { essais: t.essais + 1, premiers: t.premiers + (parfait ? 1 : 0) };
    const carte = e.cartes[id];
    const boite = !carte ? 1 : parfait ? Math.min(INTERVALLES.length, carte.boite + 1) : 1;
    e.cartes[id] = { boite, prochaine: ajouterJours(jour, INTERVALLES[boite - 1]) };
    if (revision) e.revisions += 1;
    compterActivite(e, jour, gains);
    return cloturer(e, parcours, etat, gains);
  }

  /** Leçon terminée : on garde le meilleur nombre d'étoiles ; bonus la première fois. */
  function terminerLecon(etat, parcours, { id, etoiles, jour }) {
    if (!indexer(parcours).lecons.has(id)) throw new Error(`leçon inconnue : ${id}`);
    const e = copie(etat), gains = { xp: 0, objectif: false, premiereFois: !etat.lecons[id] };
    if (gains.premiereFois) { e.xp += XP.lecon; gains.xp += XP.lecon; }
    e.lecons[id] = { etoiles: Math.max(etoiles, e.lecons[id]?.etoiles ?? 0), jour };
    return cloturer(e, parcours, etat, gains);
  }

  /** Partie terminée contre l'ordinateur. */
  function enregistrerPartie(etat, parcours, { resultat, niveau: n, jour }) {
    if (!["victoire", "nulle", "defaite"].includes(resultat) || !etat.parties[n]) throw new Error("partie invalide");
    const e = copie(etat), gains = { xp: 0, objectif: false };
    const gain = resultat === "victoire" ? XP.victoire[n] : XP[resultat];
    e.xp += gain; gains.xp += gain;
    e.parties[n][{ victoire: "victoires", nulle: "nulles", defaite: "defaites" }[resultat]] += 1;
    compterActivite(e, jour, gains);
    return cloturer(e, parcours, etat, gains);
  }

  function enregistrerDefi(etat, parcours, { jour }) {
    const e = copie(etat), gains = { xp: 0, objectif: false };
    if (!e.defis.includes(jour)) { e.defis = [...e.defis, jour].slice(-MAX_JOURS); e.xp += XP.defi; gains.xp += XP.defi; }
    return cloturer(e, parcours, etat, gains);
  }

  function regler(etat, parcours, { objectif, embleme, libre }) {
    const e = copie(etat);
    if (OBJECTIFS.includes(objectif)) e.objectif = objectif;
    if (emblemesDisponibles(etat, parcours).includes(embleme)) e.embleme = embleme;
    if (typeof libre === "boolean") e.libre = libre;
    return e;
  }

  /* ---------- Lectures ---------- */
  /** Cartes à réviser aujourd'hui : les plus en retard d'abord, puis les moins bien sues. */
  function revisionsDues(etat, jour) {
    return Object.entries(etat.cartes)
      .filter(([, c]) => c.prochaine <= jour)
      .sort(([, a], [, b]) => a.prochaine.localeCompare(b.prochaine) || a.boite - b.boite)
      .map(([id]) => id);
  }

  /** Taux de réussite du premier coup par thème (null tant qu'il y a moins de 3 essais). */
  function forces(etat, parcours) {
    return Object.entries(parcours.themes).map(([id, nom]) => {
      const t = etat.themes[id] ?? { essais: 0, premiers: 0 };
      return { id, nom, essais: t.essais, taux: t.essais >= 3 ? t.premiers / t.essais : null };
    });
  }

  /** Petit hachage déterministe : le même défi pour tout le monde le même jour, sans hasard ni réseau. */
  const hacher = (texte) => [...texte].reduce((h, c) => (Math.imul(h, 31) + c.charCodeAt(0)) >>> 0, 7);
  function defiDuJour(etat, parcours, jour) {
    const { exercices } = indexer(parcours);
    const candidats = [...exercices.entries()].filter(([, x]) => x.exo.type === "coup" && leconDebloquee(etat, parcours, x.lecon.id)).map(([id]) => id);
    if (!candidats.length) return null;
    return { id: candidats[hacher(jour) % candidats.length], fait: etat.defis.includes(jour) };
  }

  /** Conseil personnalisé : réviser, retravailler un point faible, avancer, se perfectionner, ou jouer. */
  function recommandation(etat, parcours, jour) {
    const dues = revisionsDues(etat, jour);
    const ouvertes = parcours.grades.flatMap((g) => g.lecons).filter((l) => leconDebloquee(etat, parcours, l.id));
    if (dues.length >= 3) return { type: "revision", nombre: dues.length, texte: `${dues.length} stratégies t'attendent pour une révision : c'est le meilleur moyen de les retenir pour toujours.` };
    const faibles = forces(etat, parcours).filter((f) => f.taux !== null && f.taux < 0.6).sort((a, b) => a.taux - b.taux);
    for (const f of faibles) {
      const lecon = ouvertes.filter((l) => l.theme === f.id).sort((a, b) => (etat.lecons[a.id]?.etoiles ?? 0) - (etat.lecons[b.id]?.etoiles ?? 0))[0];
      if (lecon && (etat.lecons[lecon.id]?.etoiles ?? 0) < 3) return { type: "faiblesse", lecon: lecon.id, theme: f.id, texte: `Ton point à travailler : ${f.nom.toLowerCase()} (${Math.round(f.taux * 100)} % réussi du premier coup). Refais « ${lecon.titre} ».` };
    }
    const suivante = ouvertes.find((l) => !etat.lecons[l.id]);
    if (suivante) return { type: "suite", lecon: suivante.id, texte: Object.keys(etat.lecons).length ? `Prochaine étape : « ${suivante.titre} ».` : `Bienvenue ! Commence par « ${suivante.titre} ».` };
    if (dues.length) return { type: "revision", nombre: dues.length, texte: `${dues.length} révision${dues.length > 1 ? "s" : ""} pour garder tes stratégies en tête.` };
    const aPerfectionner = ouvertes.find((l) => etat.lecons[l.id].etoiles < 3);
    if (aPerfectionner) return { type: "perfection", lecon: aPerfectionner.id, texte: `Vise les 3 étoiles sur « ${aPerfectionner.titre} ».` };
    if (gradesObtenus(etat, parcours) < parcours.grades.length) {
      const g = parcours.grades[gradesObtenus(etat, parcours)];
      return { type: "suite", lecon: g.lecons.find((l) => !etat.lecons[l.id])?.id ?? g.lecons[0].id, texte: `Termine le grade ${g.nom} pour progresser.` };
    }
    return { type: "jouer", texte: "Tu as tout appris ! Mets tes stratégies en pratique contre l'ordinateur au niveau Moyen." };
  }

  /** Étoiles d'une leçon selon les erreurs et les indices utilisés. */
  const etoiles = ({ erreurs, indices }) => { const p = erreurs + 2 * indices; return p === 0 ? 3 : p <= 2 ? 2 : 1; };

  return Object.freeze({
    XP, INTERVALLES, OBJECTIFS, EMBLEMES, BADGES: BADGES.map(({ obtenu, ...b }) => b),
    ajouterJours, indexer, exoId, etatInitial, normaliser, niveau, gradesObtenus, titre, leconDebloquee, emblemesDisponibles,
    badges, enregistrerExercice, terminerLecon, enregistrerPartie, enregistrerDefi, regler, revisionsDues, forces, defiDuJour,
    recommandation, etoiles
  });
})();
</script>
<script>
(() => {
  "use strict";
  const META = JSON.parse(document.getElementById("kermiclab-meta").textContent);
  const ENIGMES = JSON.parse(document.getElementById("enigmes-echecs").textContent);
  const CONFIG = { connexionActive: false, stockage: "local" };
  const M = MoteurEchecs;

  /* ---------- Stockage abstrait : local (actif) / distant (stub) ---------- */
  const Stockage = {
    local: {
      lire(cle) { try { return JSON.parse(localStorage.getItem(`kermiclab:${META.id}:${cle}`)); } catch { return null; } },
      ecrire(cle, valeur) { try { localStorage.setItem(`kermiclab:${META.id}:${cle}`, JSON.stringify(valeur)); } catch { /* stockage indisponible */ } }
    },
    distant: {
      // Phase 4 : appellera le service web avec META.id et l'identifiant utilisateur.
      lire() { return null; },
      ecrire() { /* non activé dans le MVP */ }
    }
  };
  const stockage = Stockage[CONFIG.stockage];

  /* ---------- Registre des onglets ---------- */
  const registre = [];
  function enregistrerOnglet(def) { registre.push({ actif: true, ...def }); }

  /* ---------- Pièces ---------- */
  // Mêmes symboles pleins pour les deux camps (U+FE0E : jamais d'émoji) ; la couleur est donnée par le style et par le nom lu.
  const GLYPHES = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
  const COULEURS = { w: "Blancs", b: "Noirs" };
  function elementPiece(piece) {
    const span = document.createElement("span");
    span.className = `piece ${M.couleurDe(piece) === "w" ? "blanc" : "noir"}`;
    span.textContent = `${GLYPHES[M.typeDe(piece)]}︎`;
    return span;
  }
  const nomPiece = (piece) => `${M.NOMS[M.typeDe(piece)]} ${M.couleurDe(piece) === "w" ? "blanc" : "noir"}`;
  for (const s of document.querySelectorAll("[data-glyphe]")) { s.textContent = `${GLYPHES[s.dataset.glyphe]}︎`; s.classList.add("blanc"); }

  /* ---------- Promotion : boîte de dialogue partagée ---------- */
  const dialogue = document.getElementById("promotion");
  let repondrePromotion = null;
  function demanderPromotion() {
    return new Promise((resoudre) => {
      repondrePromotion = resoudre;
      dialogue.showModal();
      dialogue.querySelector("[data-promotion]").focus();
    });
  }
  function fermerPromotion(type) {
    const r = repondrePromotion; repondrePromotion = null;
    if (dialogue.open) dialogue.close();
    if (r) r(type || null);
  }
  dialogue.addEventListener("click", (e) => { const b = e.target.closest("[data-promotion]"); if (b) fermerPromotion(b.dataset.promotion); });
  dialogue.addEventListener("cancel", (e) => { e.preventDefault(); fermerPromotion(null); });

  /* ---------- Vue de l'échiquier : rendu et entrées (souris, tactile, clavier), sans règle du jeu ---------- */
  function creerVueEchiquier({ libelle, surCase, surEchap }) {
    const grille = document.createElement("div");
    grille.className = "echiquier";
    grille.setAttribute("role", "grid");
    grille.setAttribute("aria-label", libelle);
    let orientation = "w", boutons = [], courant = 0;
    // Case affichée (ligne, colonne) → case du moteur, selon le camp placé en bas.
    const indexDe = (l, c) => (orientation === "w" ? l * 8 + c : (7 - l) * 8 + (7 - c));

    function construire() {
      grille.replaceChildren(); boutons = new Array(64);
      for (let l = 0; l < 8; l++) {
        const rangee = document.createElement("div");
        rangee.className = "rangee"; rangee.setAttribute("role", "row");
        for (let c = 0; c < 8; c++) {
          const i = indexDe(l, c), b = document.createElement("button");
          b.type = "button"; b.setAttribute("role", "gridcell"); b.tabIndex = -1;
          b.className = `case ${((i >> 3) + (i & 7)) % 2 ? "foncee" : "claire"}`;
          b.dataset.index = i; b.dataset.case = M.nomCase(i); b.dataset.ligne = l; b.dataset.colonne = c;
          boutons[i] = b; rangee.appendChild(b);
        }
        grille.appendChild(rangee);
      }
      boutons[courant].tabIndex = 0;
    }

    function rendre(position, { selection = null, destinations = [], dernier = null } = {}) {
      const echec = M.enEchec(position) ? position.plateau.indexOf(position.trait === "w" ? "K" : "k") : -1;
      const cibles = new Map(destinations.map((c) => [c.vers, c]));
      boutons.forEach((b, i) => {
        const piece = position.plateau[i], l = Number(b.dataset.ligne), c = Number(b.dataset.colonne);
        const enfants = piece ? [elementPiece(piece)] : [];
        if (l === 7) enfants.push(Object.assign(document.createElement("span"), { className: "coord colonne", textContent: b.dataset.case[0] }));
        if (c === 0) enfants.push(Object.assign(document.createElement("span"), { className: "coord rang", textContent: b.dataset.case[1] }));
        for (const e of enfants) e.setAttribute("aria-hidden", "true"); // le bouton porte déjà la description complète
        b.replaceChildren(...enfants);
        const dest = cibles.get(i);
        const marques = { selection: i === selection, dernier: !!dernier && (i === dernier.de || i === dernier.vers), echec: i === echec };
        for (const [k, v] of Object.entries(marques)) { if (v) b.dataset[k] = ""; else delete b.dataset[k]; }
        if (dest) b.dataset.destination = dest.prise ? "prise" : "deplacement"; else delete b.dataset.destination;
        const details = [
          piece ? nomPiece(piece) : "vide",
          marques.selection && "sélectionnée",
          dest && (dest.prise ? `prise possible de ${nomPiece(dest.prise)}` : "destination possible"),
          marques.echec && "roi en échec",
          marques.dernier && "dernier coup"
        ].filter(Boolean);
        b.setAttribute("aria-label", `${b.dataset.case} : ${details.join(", ")}`);
      });
    }

    function focaliser(i) { boutons[courant].tabIndex = -1; courant = i; boutons[i].tabIndex = 0; boutons[i].focus(); }
    grille.addEventListener("click", (e) => {
      const b = e.target.closest("button.case");
      if (!b) return;
      const i = Number(b.dataset.index);
      boutons[courant].tabIndex = -1; courant = i; b.tabIndex = 0;
      surCase(i);
    });
    grille.addEventListener("keydown", (e) => {
      const b = e.target.closest?.("button.case");
      if (!b || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "Escape") { e.preventDefault(); surEchap(); return; }
      const l = Number(b.dataset.ligne), c = Number(b.dataset.colonne);
      const cible = { ArrowUp: [l - 1, c], ArrowDown: [l + 1, c], ArrowLeft: [l, c - 1], ArrowRight: [l, c + 1], Home: [l, 0], End: [l, 7] }[e.key];
      if (!cible) return;
      e.preventDefault();
      focaliser(indexDe(Math.max(0, Math.min(7, cible[0])), Math.max(0, Math.min(7, cible[1]))));
    });
    construire();
    return {
      element: grille, rendre,
      orienter(couleur) { if (couleur !== orientation) { orientation = couleur; construire(); } },
      get orientation() { return orientation; }
    };
  }

  /** Saisie d'un coup en deux touchers (pièce puis case), commune au jeu et aux énigmes. */
  function creerSaisie({ libelle, position, peutJouer, surCoup, rafraichir }) {
    let selection = null, destinations = [];
    const effacer = () => { selection = null; destinations = []; };
    async function surCase(i) {
      const p = position();
      if (!peutJouer()) { effacer(); rafraichir(); return; }
      const vers = destinations.filter((c) => c.vers === i);
      if (selection !== null && vers.length) {
        effacer();
        let coup = vers[0];
        if (vers.length > 1) {
          rafraichir();
          const type = await demanderPromotion();
          if (!type) { rafraichir(); return; }
          coup = vers.find((c) => M.typeDe(c.promotion) === type);
        }
        surCoup(coup);
        return;
      }
      const piece = p.plateau[i];
      if (piece && M.couleurDe(piece) === p.trait && i !== selection) { selection = i; destinations = M.coupsLegaux(p, i); }
      else effacer();
      rafraichir();
    }
    const vue = creerVueEchiquier({ libelle, surCase, surEchap: () => { effacer(); rafraichir(); } });
    /** Sélectionne une pièce comme si le joueur l'avait touchée (indice). */
    const selectionner = (i) => { selection = i; destinations = M.coupsLegaux(position(), i); };
    return { vue, effacer, selectionner, get selection() { return selection; }, get destinations() { return destinations; } };
  }

  /* ---------- Onglet explication ---------- */
  enregistrerOnglet({ id: "explication", type: "explication", titre: "Règles",
    rendu(panneau) { panneau.appendChild(document.getElementById("tpl-explication").content.cloneNode(true)); } });

  /* ---------- Onglet application : la partie ---------- */
  const RAISONS = {
    repetition: "la même position est revenue trois fois",
    "cinquante-coups": "50 coups sans prise ni mouvement de pion",
    materiel: "il ne reste pas assez de pièces pour faire mat"
  };
  const DEPART = { p: 8, n: 2, b: 2, r: 2, q: 1 };
  const jeu = {};
  // Services offerts par d'autres onglets (l'Académie enregistre les parties terminées contre l'ordinateur).
  const services = {};
  enregistrerOnglet({ id: "application", type: "application", titre: "Jouer",
    rendu(panneau) {
      panneau.appendChild(document.getElementById("tpl-application").content.cloneNode(true));
      const sortie = (n) => panneau.querySelector(`[data-sortie="${n}"]`);
      const bouton = (n) => panneau.querySelector(`[data-action="${n}"]`);
      const lire = (cle, valeurs, defaut) => { const v = stockage.lire(cle); return valeurs.includes(v) ? v : defaut; };
      let mode = lire("mode", ["ordinateur", "deux"], "ordinateur");
      let niveau = lire("niveau", Object.keys(M.NIVEAUX), "facile");
      let couleur = lire("couleur", ["w", "b"], "w");
      let positions = [], coups = [], notations = [], attente = null, partieComptee = false, gainPartie = "";
      const position = () => positions.at(-1);
      const tourOrdinateur = () => mode === "ordinateur" && position().trait !== couleur;

      const saisie = creerSaisie({
        libelle: "Échiquier",
        position,
        peutJouer: () => !M.statut(position()).fin && attente === null && !tourOrdinateur(),
        surCoup: jouerCoup,
        rafraichir: afficher
      });
      panneau.querySelector('[data-zone="plateau"]').replaceWith(saisie.vue.element);

      function jouerCoup(coup) {
        const p = position();
        notations.push(M.notation(p, coup));
        positions.push(M.jouer(p, coup));
        coups.push(coup);
        saisie.effacer();
        afficher();
        if (tourOrdinateur() && !M.statut(position()).fin) planifierOrdinateur();
      }

      function planifierOrdinateur() {
        attente = setTimeout(() => {
          attente = null;
          const coup = M.choisirCoup(position(), { niveau });
          if (coup) jouerCoup(coup);
        }, 400);
        afficher();
      }
      function arreterOrdinateur() { clearTimeout(attente); attente = null; }

      function nouvellePartie() {
        arreterOrdinateur();
        positions = [M.positionInitiale()]; coups = []; notations = []; partieComptee = false; gainPartie = "";
        saisie.effacer();
        saisie.vue.orienter(mode === "ordinateur" ? couleur : "w");
        afficher();
        if (tourOrdinateur()) planifierOrdinateur();
      }

      function annuler() {
        arreterOrdinateur();
        const retirer = () => { positions.pop(); coups.pop(); notations.pop(); };
        if (positions.length > 1) retirer();
        // Contre l'ordinateur, on revient jusqu'à un coup du joueur.
        while (mode === "ordinateur" && positions.length > 1 && tourOrdinateur()) retirer();
        saisie.effacer();
        afficher();
        if (tourOrdinateur()) planifierOrdinateur();
      }

      function texteStatut(s, p) {
        const contre = mode === "ordinateur";
        if (s.etat === "mat") {
          if (!contre) return { texte: `Échec et mat ! Les ${COULEURS[s.gagnant]} gagnent.`, etat: "mat" };
          return s.gagnant === couleur
            ? { texte: "Échec et mat : bravo, tu as gagné ! 🏆", etat: "victoire" }
            : { texte: "Échec et mat : l'ordinateur a gagné. Retente ta chance !", etat: "defaite" };
        }
        if (s.etat === "pat") return { texte: "Pat : le joueur au trait ne peut plus bouger sans mettre son roi en échec. Partie nulle.", etat: "nulle" };
        if (s.etat === "nulle") return { texte: `Partie nulle : ${RAISONS[s.raison]}.`, etat: "nulle" };
        const qui = contre ? (p.trait === couleur ? `À toi de jouer (${COULEURS[couleur]})` : "L'ordinateur réfléchit…") : `Au tour des ${COULEURS[p.trait]}`;
        return { texte: s.echec ? `${qui} — Échec au roi !` : qui, etat: s.echec ? "echec" : "en-cours" };
      }

      function afficherPrises() {
        const restants = { w: {}, b: {} };
        for (const piece of position().plateau) if (piece) { const c = M.couleurDe(piece), t = M.typeDe(piece); restants[c][t] = (restants[c][t] ?? 0) + 1; }
        // Pièces prises PAR une couleur = pièces adverses manquantes (une promotion peut en rajouter : jamais négatif).
        const prises = (par) => {
          const adv = par === "w" ? "b" : "w";
          return Object.entries(DEPART).flatMap(([t, n]) => Array(Math.max(0, n - (restants[adv][t] ?? 0))).fill(t));
        };
        const ecrire = (zone, par) => {
          const liste = prises(par), adv = par === "w" ? "b" : "w";
          zone.replaceChildren();
          zone.setAttribute("aria-label", `Pièces prises par les ${COULEURS[par]} : ${liste.length ? liste.map((t) => M.NOMS[t]).join(", ") : "aucune"}`);
          const legende = document.createElement("small"); legende.textContent = `Prises des ${COULEURS[par]} : ${liste.length ? "" : "aucune"}`;
          zone.append(legende, ...liste.map((t) => elementPiece(adv === "w" ? t.toUpperCase() : t)));
          for (const enfant of zone.children) enfant.setAttribute("aria-hidden", "true");
        };
        const bas = saisie.vue.orientation;
        ecrire(sortie("prises-bas"), bas);
        ecrire(sortie("prises-haut"), bas === "w" ? "b" : "w");
      }

      function afficherCoups() {
        const liste = sortie("coups");
        liste.replaceChildren();
        for (let k = 0; k < notations.length; k += 2) {
          const li = document.createElement("li");
          li.textContent = `${notations[k]}${notations[k + 1] ? `   ${notations[k + 1]}` : ""}`;
          liste.appendChild(li);
        }
        liste.scrollTop = liste.scrollHeight;
      }

      function afficher() {
        const p = position(), s = M.statut(p);
        saisie.vue.rendre(p, { selection: saisie.selection, destinations: saisie.destinations, dernier: coups.at(-1) ?? null });
        const { texte, etat } = texteStatut(s, p);
        // Une partie terminée contre l'ordinateur compte une seule fois pour l'Académie (même après « Annuler »).
        if (s.fin && mode === "ordinateur" && !partieComptee && services.enregistrerPartie) {
          partieComptee = true;
          const resultat = s.gagnant === couleur ? "victoire" : s.gagnant ? "defaite" : "nulle";
          const gains = services.enregistrerPartie({ resultat, niveau });
          gainPartie = gains?.xp ? ` (+${gains.xp} XP à l'Académie)` : "";
        }
        sortie("statut").textContent = s.fin ? texte + gainPartie : texte;
        sortie("statut").dataset.etat = etat;
        panneau.dataset.etat = s.etat;
        afficherCoups();
        afficherPrises();
        // Contre l'ordinateur, il faut au moins un coup du joueur à annuler.
        bouton("annuler").disabled = mode === "ordinateur" ? !coups.some((c) => M.couleurDe(c.piece) === couleur) : coups.length === 0;
        panneau.querySelector('[data-zone="niveau"]').hidden = mode !== "ordinateur";
        panneau.querySelector('[data-zone="couleur"]').hidden = mode !== "ordinateur";
        for (const [nom, valeur] of [["mode", mode], ["niveau", niveau], ["couleur", couleur]]) {
          for (const r of panneau.querySelectorAll(`input[name="${nom}"]`)) r.checked = r.value === valeur;
        }
      }

      for (const r of panneau.querySelectorAll('input[name="mode"]')) r.addEventListener("change", () => { mode = r.value; stockage.ecrire("mode", mode); nouvellePartie(); });
      for (const r of panneau.querySelectorAll('input[name="couleur"]')) r.addEventListener("change", () => { couleur = r.value; stockage.ecrire("couleur", couleur); nouvellePartie(); });
      for (const r of panneau.querySelectorAll('input[name="niveau"]')) r.addEventListener("change", () => { niveau = r.value; stockage.ecrire("niveau", niveau); afficher(); });
      bouton("nouvelle-partie").addEventListener("click", nouvellePartie);
      bouton("annuler").addEventListener("click", annuler);
      bouton("tourner").addEventListener("click", () => { saisie.effacer(); saisie.vue.orienter(saisie.vue.orientation === "w" ? "b" : "w"); afficher(); });

      nouvellePartie();
      Object.assign(jeu, {
        etat: () => ({ fen: M.versFEN(position()), coups: [...notations], statut: M.statut(position()), reflechit: attente !== null })
      });
    } });

  /* ---------- Onglet Académie : du débutant au pro ---------- */
  const PARCOURS = JSON.parse(document.getElementById("parcours-echecs").textContent);
  const A = AcademieEchecs;
  const jourLocal = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const stockageDisponible = (() => { try { localStorage.setItem("kermiclab:test", "1"); localStorage.removeItem("kermiclab:test"); return true; } catch { return false; } })();
  const uci = (c) => `${M.nomCase(c.de)}${M.nomCase(c.vers)}${c.promotion ? M.typeDe(c.promotion) : ""}`;
  const academie = {};
  enregistrerOnglet({ id: "academie", type: "parcours", titre: "Académie",
    rendu(panneau) {
      panneau.appendChild(document.getElementById("tpl-academie").content.cloneNode(true));
      const q = (s) => panneau.querySelector(s);
      const sortie = (n) => q(`[data-sortie="${n}"]`);
      const index = A.indexer(PARCOURS);
      let etat = A.normaliser(stockage.lire("academie"), PARCOURS);
      let session = null, ex = null;
      const el = (balise, attributs = {}, ...enfants) => {
        const n = document.createElement(balise);
        for (const [k, v] of Object.entries(attributs)) {
          if (k === "texte") n.textContent = v; else if (k === "classe") n.className = v; else if (v !== false && v !== null && v !== undefined) n.setAttribute(k, v === true ? "" : v);
        }
        n.append(...enfants.filter((x) => x !== null && x !== undefined && x !== false));
        return n;
      };
      const etoilesTexte = (n) => `${"★".repeat(n)}${"☆".repeat(3 - n)}`;
      q('[data-zone="stockage"]').hidden = stockageDisponible;

      /* --- Gains : XP, objectif, niveau, grade, badges --- */
      function appliquer({ etat: nouvel, gains }) {
        etat = nouvel; stockage.ecrire("academie", etat);
        const morceaux = [];
        if (gains.xp) morceaux.push(`+${gains.xp} XP`);
        if (gains.objectif) morceaux.push("🎯 Objectif du jour atteint");
        if (gains.niveauApres > gains.niveauAvant) morceaux.push(`⬆️ Niveau ${gains.niveauApres} !`);
        if (gains.gradesApres > gains.gradesAvant) morceaux.push(`🎖️ Grade ${PARCOURS.grades[gains.gradesApres - 1].nom} obtenu : nouvel emblème disponible`);
        for (const b of gains.badges) morceaux.push(`${b.icone} Badge « ${b.nom} »`);
        if (morceaux.length) sortie("toast").textContent = morceaux.join(" · ");
        return gains;
      }

      /* --- Accueil : profil, conseil, parcours, carnet, badges, forces --- */
      function afficherAccueil() {
        const jour = jourLocal(), niv = A.niveau(etat.xp), grades = A.gradesObtenus(etat, PARCOURS);
        const lecons = PARCOURS.grades.flatMap((g) => g.lecons);
        sortie("embleme").replaceChildren(elementPiece(etat.embleme.toUpperCase()));
        sortie("titre").textContent = A.titre(etat, PARCOURS);
        sortie("niveau").textContent = `Niveau ${niv.niveau} · ${etat.xp} XP`;
        const barre = sortie("barre-niveau");
        barre.setAttribute("aria-valuemax", niv.xpPourNiveau); barre.setAttribute("aria-valuenow", niv.xpDansNiveau);
        barre.setAttribute("aria-valuetext", `${niv.xpDansNiveau} XP sur ${niv.xpPourNiveau} pour le niveau ${niv.niveau + 1}`);
        barre.firstElementChild.style.width = `${Math.round((100 * niv.xpDansNiveau) / niv.xpPourNiveau)}%`;
        const aujourdhui = etat.jours[jour] ?? 0, serie = etat.dernierJour === jour || etat.dernierJour === A.ajouterJours(jour, -1) ? etat.serie : 0;
        const etoiles = Object.values(etat.lecons).reduce((s, l) => s + l.etoiles, 0);
        sortie("stats").replaceChildren(...[
          `🔥 Série : ${serie} jour${serie > 1 ? "s" : ""}`,
          `🎯 Aujourd'hui : ${Math.min(aujourdhui, etat.objectif)} / ${etat.objectif}${aujourdhui >= etat.objectif ? " ✓" : ""}`,
          `⭐ Étoiles : ${etoiles} / ${lecons.length * 3}`,
          `🎖️ Grades : ${grades} / ${PARCOURS.grades.length}`,
          `🏅 Badges : ${etat.badges.length} / ${A.BADGES.length}`
        ].map((t) => el("li", { texte: t })));
        // Réglages personnels
        for (const r of panneau.querySelectorAll('input[name="objectif"]')) r.checked = Number(r.value) === etat.objectif;
        const dispo = A.emblemesDisponibles(etat, PARCOURS);
        sortie("emblemes").replaceChildren(...A.EMBLEMES.map((t, i) => {
          const ouvert = dispo.includes(t);
          const input = el("input", { type: "radio", name: "embleme", value: t, disabled: !ouvert, checked: etat.embleme === t });
          input.addEventListener("change", () => { etat = A.regler(etat, PARCOURS, { embleme: t }); stockage.ecrire("academie", etat); afficherAccueil(); });
          return el("label", { classe: ouvert ? "" : "verrouille", title: ouvert ? M.NOMS[t] : `Grade ${PARCOURS.grades[i - 1]?.nom} à obtenir` },
            input, elementPiece(t.toUpperCase()), el("span", { classe: "visuellement-cache", texte: ouvert ? M.NOMS[t] : `${M.NOMS[t]}, verrouillé` }));
        }));
        q('input[name="libre"]').checked = etat.libre;
        // Conseil personnalisé
        const conseil = A.recommandation(etat, PARCOURS, jour);
        sortie("conseil").textContent = conseil.texte;
        const action = q('[data-action="conseil"]');
        action.textContent = { revision: "Réviser maintenant", jouer: "Jouer une partie" }[conseil.type] ?? "C'est parti !";
        action.onclick = () => (conseil.type === "revision" ? reviser() : conseil.type === "jouer" ? ouvrirOnglet("application") : ouvrirLecon(conseil.lecon));
        const dues = A.revisionsDues(etat, jour);
        const boutonRevision = q('[data-action="reviser"]');
        boutonRevision.textContent = `🧠 Révisions (${dues.length})`; boutonRevision.disabled = dues.length === 0;
        const defi = A.defiDuJour(etat, PARCOURS, jour);
        const boutonDefi = q('[data-action="defi"]');
        boutonDefi.textContent = defi?.fait ? "⚡ Défi du jour relevé ✓" : `⚡ Défi du jour (+${A.XP.defi} XP)`;
        boutonDefi.disabled = !defi || defi.fait;
        // Parcours
        sortie("parcours").replaceChildren(...PARCOURS.grades.map((g, gi) => {
          const faites = g.lecons.filter((l) => etat.lecons[l.id]).length;
          const ouvert = A.leconDebloquee(etat, PARCOURS, g.lecons[0].id);
          const etatGrade = faites === g.lecons.length ? "✓ obtenu" : ouvert ? `${faites} / ${g.lecons.length}` : `🔒 termine le grade ${PARCOURS.grades[gi - 1].nom}`;
          return el("li", { classe: `grade${ouvert ? "" : " verrouille"}`, "data-grade": g.id },
            el("div", { classe: "grade-entete" }, elementPiece(g.embleme.toUpperCase()),
              el("div", {}, el("h3", { texte: `${gi + 1}. ${g.nom}` }), el("p", { classe: "doux", texte: g.sousTitre })),
              el("span", { classe: "grade-etat", texte: etatGrade })),
            el("ul", { classe: "lecons" }, ...g.lecons.map((l) => {
              const fait = etat.lecons[l.id], libre = A.leconDebloquee(etat, PARCOURS, l.id);
              const b = el("button", { type: "button", classe: `lecon${fait ? " faite" : ""}`, "data-lecon": l.id, disabled: !libre,
                "aria-label": `${l.titre}, ${PARCOURS.themes[l.theme]}, ${fait ? `${fait.etoiles} étoile${fait.etoiles > 1 ? "s" : ""} sur 3` : libre ? "à faire" : "verrouillée"}` },
                el("span", { classe: "lecon-titre", texte: l.titre }), el("span", { classe: "lecon-theme", texte: PARCOURS.themes[l.theme] }),
                el("span", { classe: "lecon-etoiles", "aria-hidden": "true", texte: fait ? etoilesTexte(fait.etoiles) : libre ? "Nouveau" : "🔒" }));
              b.addEventListener("click", () => ouvrirLecon(l.id));
              return el("li", {}, b);
            })));
        }));
        // Carnet de stratégies : ce qui a été appris, et quand le revoir
        const apprises = lecons.filter((l) => etat.lecons[l.id]);
        sortie("titre-carnet").textContent = `📒 Ton carnet de stratégies (${apprises.length} / ${lecons.length})`;
        sortie("carnet").replaceChildren(...(apprises.length ? apprises.map((l) => {
          const cartes = l.exercices.map((_, k) => etat.cartes[A.exoId(l, k)]).filter(Boolean);
          const maitrise = cartes.length && cartes.every((c) => c.boite >= 4);
          const prochaine = cartes.map((c) => c.prochaine).sort()[0];
          const quand = maitrise ? "✓ maîtrisée" : prochaine <= jour ? "à réviser aujourd'hui" : `à revoir le ${prochaine.slice(8, 10)}/${prochaine.slice(5, 7)}`;
          return el("li", {}, el("strong", { texte: l.titre }), el("span", { classe: "doux", texte: ` · ${quand}` }), el("p", { texte: l.retenir }));
        }) : [el("li", { classe: "doux", texte: "Termine une leçon : sa stratégie s'ajoute ici, pour la relire et la réviser." })]));
        // Badges
        const tous = A.badges(etat, PARCOURS);
        sortie("titre-badges").textContent = `🏅 Tes badges (${tous.filter((b) => b.obtenu).length} / ${tous.length})`;
        sortie("badges").replaceChildren(...tous.map((b) => el("li", { classe: b.obtenu ? "obtenu" : "verrouille" },
          el("span", { classe: "badge-icone", "aria-hidden": "true", texte: b.obtenu ? b.icone : "🔒" }),
          el("strong", { texte: b.nom }), el("span", { classe: "doux", texte: `${b.obtenu ? "Gagné : " : "À gagner : "}${b.description}` }))));
        // Points forts et points faibles
        sortie("forces").replaceChildren(...A.forces(etat, PARCOURS).map((f) => el("li", {},
          el("span", { texte: f.nom }),
          f.taux === null
            ? el("span", { classe: "doux", texte: f.essais ? `${f.essais} essai${f.essais > 1 ? "s" : ""} : encore un peu de pratique` : "pas encore travaillé" })
            : el("span", { classe: "jauge", role: "img", "aria-label": `${Math.round(f.taux * 100)} % réussi du premier coup sur ${f.essais} essais` },
              el("span", { style: `width:${Math.round(f.taux * 100)}%` }), el("b", { texte: `${Math.round(f.taux * 100)} %` })))));
        const parties = etat.parties;
        sortie("parties").textContent = `Contre l'ordinateur : Facile ${parties.facile.victoires} victoire${parties.facile.victoires > 1 ? "s" : ""}, Moyen ${parties.moyen.victoires} victoire${parties.moyen.victoires > 1 ? "s" : ""}.`;
      }

      for (const r of panneau.querySelectorAll('input[name="objectif"]')) r.addEventListener("change", () => { etat = A.regler(etat, PARCOURS, { objectif: Number(r.value) }); stockage.ecrire("academie", etat); afficherAccueil(); });
      q('input[name="libre"]').addEventListener("change", (e) => { etat = A.regler(etat, PARCOURS, { libre: e.target.checked }); stockage.ecrire("academie", etat); afficherAccueil(); });
      q('[data-action="reviser"]').addEventListener("click", () => reviser());
      q('[data-action="defi"]').addEventListener("click", () => { const d = A.defiDuJour(etat, PARCOURS, jourLocal()); if (d && !d.fait) demarrerSession("defi", [d.id]); });
      q('[data-action="retour"]').addEventListener("click", () => montrer("accueil"));
      q('[data-action="bilan-retour"]').addEventListener("click", () => montrer("accueil"));

      function montrer(vue) {
        q('[data-vue="accueil"]').hidden = vue !== "accueil";
        q('[data-vue="session"]').hidden = vue !== "session";
        if (vue === "accueil") { session = null; ex = null; afficherAccueil(); }
        q(`[data-vue="${vue}"] h2, [data-vue="${vue}"] h3`)?.focus?.();
        panneau.scrollIntoView?.({ block: "start" });
      }

      /* --- Séance : une leçon, des révisions ou le défi du jour --- */
      const saisie = creerSaisie({
        libelle: "Échiquier de l'exercice",
        position: () => ex.position,
        peutJouer: () => !!ex && !ex.fini && !ex.attente,
        surCoup: jouerCoup,
        rafraichir: afficherPlateau
      });
      q('[data-zone="plateau"]').appendChild(saisie.vue.element);

      function ouvrirLecon(id) {
        const { lecon } = index.lecons.get(id);
        if (!A.leconDebloquee(etat, PARCOURS, id)) return;
        demarrerSession("lecon", lecon.exercices.map((_, k) => A.exoId(lecon, k)), lecon);
      }
      function reviser() {
        const dues = A.revisionsDues(etat, jourLocal()).slice(0, 8);
        if (dues.length) demarrerSession("revision", dues);
      }
      function demarrerSession(mode, file, lecon = null) {
        session = { mode, file, lecon, rang: 0, erreurs: 0, indices: 0 };
        const { grade } = lecon ? index.lecons.get(lecon.id) : {};
        sortie("fil").textContent = mode === "lecon" ? `Grade ${grade.nom} · ${PARCOURS.themes[lecon.theme]}` : mode === "defi" ? "Défi du jour" : "Révisions espacées";
        sortie("session-titre").textContent = mode === "lecon" ? lecon.titre : mode === "defi" ? "⚡ Le défi du jour" : "🧠 Tes révisions";
        sortie("session-texte").textContent = mode === "lecon" ? lecon.texte
          : mode === "defi" ? `Un exercice tiré du parcours, le même pour tout le monde aujourd'hui. Réussis-le pour gagner ${A.XP.defi} XP de plus !`
          : "Retrouve la bonne réponse sans aide. Chaque réussite repousse la prochaine révision : c'est comme ça qu'on retient pour toujours.";
        q('[data-zone="retenir"]').hidden = mode !== "lecon";
        sortie("retenir").textContent = lecon?.retenir ?? "";
        q('[data-zone="exercice"]').hidden = false;
        q('[data-zone="bilan"]').hidden = true;
        sortie("toast").textContent = "";
        montrer("session");
        demarrerExercice();
      }

      function demarrerExercice() {
        const id = session.file[session.rang], { exo, lecon } = index.exercices.get(id);
        ex = { id, exo, lecon, erreurs: 0, indice: false, etape: 0, fini: false, attente: false, position: null, dernier: null };
        sortie("progression").textContent = `${session.mode === "lecon" ? "Exercice" : lecon.titre + " ·"} ${session.rang + 1} / ${session.file.length}`;
        retour("", "");
        q('[data-action="suivant"]').hidden = true;
        q('[data-action="indice"]').hidden = false;
        q('[data-action="indice"]').disabled = false;
        const qcm = exo.type === "qcm";
        q('[data-zone="plateau"]').hidden = qcm;
        sortie("qcm").hidden = !qcm;
        if (qcm) {
          sortie("consigne").textContent = exo.question;
          q('[data-action="indice"]').textContent = "💡 Retirer une mauvaise réponse";
          sortie("qcm").replaceChildren(...exo.choix.map((texte, i) => {
            const b = el("button", { type: "button", classe: "choix-qcm", "data-choix": i, texte });
            b.addEventListener("click", () => repondreQcm(i));
            return el("li", {}, b);
          }));
        } else {
          sortie("consigne").textContent = `${exo.consigne} (${M.depuisFEN(exo.fen).trait === "w" ? "Tu as les Blancs" : "Tu as les Noirs"}.)`;
          q('[data-action="indice"]').textContent = "💡 Indice";
          ex.position = M.depuisFEN(exo.fen);
          saisie.effacer();
          saisie.vue.orienter(ex.position.trait);
          afficherPlateau();
        }
      }

      function afficherPlateau() {
        if (!ex?.position) return;
        saisie.vue.rendre(ex.position, { selection: saisie.selection, destinations: saisie.destinations, dernier: ex.dernier });
      }
      function retour(texte, classe) { sortie("retour").textContent = texte; sortie("retour").className = `message ${classe}`; }
      function erreur() {
        ex.erreurs += 1;
        retour(ex.erreurs >= 2 ? `Pas tout à fait. Indice : ${ex.exo.indice ?? "relis bien la question."}` : "Pas tout à fait : essaie encore !", "ko");
      }

      function repondreQcm(i) {
        if (ex.fini) return;
        const b = q(`[data-choix="${i}"]`);
        if (i !== ex.exo.bonne) { b.disabled = true; b.dataset.etat = "faux"; b.textContent = `✗ ${ex.exo.choix[i]}`; erreur(); return; }
        b.dataset.etat = "juste"; b.textContent = `✓ ${ex.exo.choix[i]}`;
        for (const autre of sortie("qcm").querySelectorAll("button")) autre.disabled = true;
        terminerExercice();
      }

      function etapeReussie(etape, suite, coup) {
        return etape.but === "mat" ? M.statut(suite).etat === "mat" : etape.accepte.includes(uci(coup));
      }
      function jouerCoup(coup) {
        const etape = ex.exo.etapes[ex.etape], suite = M.jouer(ex.position, coup);
        if (!etapeReussie(etape, suite, coup)) {
          saisie.effacer(); erreur();
          // Piège connu : une explication sur mesure plutôt qu'un simple « essaie encore ».
          const piege = ex.exo.pieges?.[uci(coup)];
          if (piege) retour(piege, "ko");
          afficherPlateau(); return;
        }
        ex.position = suite; ex.dernier = coup; ex.etape += 1;
        saisie.effacer();
        if (ex.etape >= ex.exo.etapes.length) { afficherPlateau(); terminerExercice(); return; }
        const reponse = typeof etape.reponse === "string" ? etape.reponse : etape.reponse?.[uci(coup)];
        afficherPlateau();
        if (!reponse) { retour("Bien ! Continue.", "ok"); return; }
        ex.attente = true;
        retour("Bien joué ! L'adversaire répond…", "ok");
        setTimeout(() => {
          if (!ex || ex.fini) return;
          const r = M.coupsLegaux(ex.position).find((c) => uci(c) === reponse);
          const texte = M.notation(ex.position, r);
          ex.position = M.jouer(ex.position, r); ex.dernier = r; ex.attente = false;
          retour(`L'adversaire a joué ${texte}. À toi de finir !`, "");
          afficherPlateau();
        }, 600);
      }

      q('[data-action="indice"]').addEventListener("click", () => {
        if (!ex || ex.fini) return;
        ex.indice = true;
        q('[data-action="indice"]').disabled = true;
        if (ex.exo.type === "qcm") {
          const faux = [...sortie("qcm").querySelectorAll("button:not(:disabled)")].find((b) => Number(b.dataset.choix) !== ex.exo.bonne);
          if (faux) { faux.disabled = true; faux.dataset.etat = "retire"; faux.textContent = `— ${faux.textContent}`; }
          retour("Une mauvaise réponse a été retirée.", "");
          return;
        }
        const etape = ex.exo.etapes[ex.etape];
        const coup = M.coupsLegaux(ex.position).find((c) => etapeReussie(etape, M.jouer(ex.position, c), c));
        retour(`Indice : ${ex.exo.indice}`, "");
        if (coup && !ex.attente) { saisie.selectionner(coup.de); afficherPlateau(); }
      });

      function terminerExercice() {
        ex.fini = true;
        const jour = jourLocal();
        session.erreurs += ex.erreurs; session.indices += ex.indice ? 1 : 0;
        appliquer(A.enregistrerExercice(etat, PARCOURS, { id: ex.id, erreurs: ex.erreurs, indice: ex.indice, jour, revision: session.mode === "revision" }));
        if (session.mode === "defi") appliquer(A.enregistrerDefi(etat, PARCOURS, { jour }));
        const rappel = session.mode !== "lecon" ? ` À retenir : ${ex.lecon.retenir}` : "";
        retour(`${ex.erreurs === 0 && !ex.indice ? "Parfait ! " : "Réussi ! "}${ex.exo.explication}${rappel}`, "ok");
        q('[data-action="indice"]').hidden = true;
        const fin = session.rang === session.file.length - 1;
        const suivant = q('[data-action="suivant"]');
        suivant.textContent = fin ? "Voir le bilan" : "Exercice suivant";
        suivant.hidden = false;
        suivant.focus();
      }
      q('[data-action="suivant"]').addEventListener("click", () => {
        if (session.rang < session.file.length - 1) { session.rang += 1; demarrerExercice(); return; }
        afficherBilan();
      });

      function afficherBilan() {
        q('[data-zone="exercice"]').hidden = true;
        q('[data-zone="bilan"]').hidden = false;
        const jour = jourLocal();
        let titreBilan, texte;
        if (session.mode === "lecon") {
          const n = A.etoiles(session);
          appliquer(A.terminerLecon(etat, PARCOURS, { id: session.lecon.id, etoiles: n, jour }));
          titreBilan = `${etoilesTexte(n)} Leçon terminée !`;
          texte = n === 3 ? "Sans faute : bravo !" : n === 2 ? "Très bien ! Refais-la plus tard pour viser les 3 étoiles." : "Leçon réussie. Refais-la pour gagner des étoiles.";
          texte += ` La stratégie « ${session.lecon.titre} » rejoint ton carnet : elle reviendra en révision demain.`;
        } else if (session.mode === "defi") {
          titreBilan = "⚡ Défi relevé !"; texte = "Reviens demain pour un nouveau défi.";
        } else {
          titreBilan = "🧠 Révisions terminées"; texte = `${session.file.length} stratégie${session.file.length > 1 ? "s" : ""} révisée${session.file.length > 1 ? "s" : ""}. Les bonnes réponses reviendront plus tard, les autres dès demain.`;
        }
        sortie("bilan-titre").textContent = titreBilan;
        sortie("bilan-texte").textContent = texte;
        const ordre = PARCOURS.grades.flatMap((g) => g.lecons);
        const prochaine = session.mode === "lecon" ? ordre.slice(ordre.findIndex((l) => l.id === session.lecon.id) + 1).find((l) => A.leconDebloquee(etat, PARCOURS, l.id) && !etat.lecons[l.id]) : null;
        const bouton = q('[data-action="bilan-suite"]');
        bouton.hidden = !prochaine;
        if (prochaine) { bouton.textContent = `Leçon suivante : ${prochaine.titre}`; bouton.onclick = () => ouvrirLecon(prochaine.id); }
        sortie("bilan-titre").focus();
      }

      services.enregistrerPartie = (partie) => { const g = appliquer(A.enregistrerPartie(etat, PARCOURS, { ...partie, jour: jourLocal() })); if (!session) afficherAccueil(); return g; };
      montrer("accueil");
      Object.assign(academie, { etat: () => etat });
    } });

  /* ---------- Onglet mise en situation : mats en un coup ---------- */
  enregistrerOnglet({ id: "mise-en-situation", type: "mise-en-situation", titre: "Énigmes",
    rendu(panneau) {
      panneau.appendChild(document.getElementById("tpl-mise-en-situation").content.cloneNode(true));
      const sortie = (n) => panneau.querySelector(`[data-sortie="${n}"]`);
      const suivante = panneau.querySelector('[data-action="suivante"]');
      let rang = 0, position = null, dernier = null, resolue = false;
      const saisie = creerSaisie({
        libelle: "Échiquier de l'énigme",
        position: () => position,
        peutJouer: () => !resolue,
        surCoup: essayer,
        rafraichir: afficher
      });
      panneau.querySelector('[data-zone="enigme"]').appendChild(saisie.vue.element);

      function afficher() { saisie.vue.rendre(position, { selection: saisie.selection, destinations: saisie.destinations, dernier }); }
      function retour(texte, classe) { sortie("retour").textContent = texte; sortie("retour").className = `message ${classe}`; }

      function charger(i) {
        rang = i; resolue = false; dernier = null;
        const e = ENIGMES[rang];
        position = M.depuisFEN(e.fen);
        saisie.effacer();
        saisie.vue.orienter(position.trait);
        sortie("titre").textContent = e.titre;
        sortie("progression").textContent = `Énigme ${rang + 1} / ${ENIGMES.length}`;
        retour("", "");
        suivante.hidden = true;
        afficher();
      }

      function essayer(coup) {
        const e = ENIGMES[rang], texte = M.notation(position, coup), suite = M.jouer(position, coup);
        if (M.statut(suite).etat !== "mat") { retour(`${texte} ne fait pas mat. ${e.indice}`, "ko"); afficher(); return; }
        position = suite; dernier = coup; resolue = true;
        afficher();
        const derniere = rang === ENIGMES.length - 1;
        retour(`${e.explication}${derniere ? " Tu as résolu toutes les énigmes : à toi de jouer dans l'onglet « Jouer » !" : ""}`, "ok");
        suivante.textContent = derniere ? "Recommencer les énigmes" : "Énigme suivante";
        suivante.hidden = false;
      }

      suivante.addEventListener("click", () => charger((rang + 1) % ENIGMES.length));
      charger(0);
    } });

  /* ---------- Onglet self-test (prévu phase 2, désactivé) ---------- */
  enregistrerOnglet({ id: "self-test", type: "self-test", titre: "Auto-évaluation", actif: false,
    questions: [], rendu() {} });

  /* ---------- Socle : construction des onglets ---------- */
  const liste = document.getElementById("onglets"), panneaux = document.getElementById("panneaux");
  const actifs = registre.filter((o) => o.actif);
  const boutons = actifs.map((o, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.id = `onglet-${o.id}`; b.textContent = o.titre;
    b.setAttribute("aria-controls", `panneau-${o.id}`); b.dataset.onglet = o.id;
    const p = document.createElement("section");
    p.setAttribute("role", "tabpanel"); p.id = `panneau-${o.id}`; p.setAttribute("aria-labelledby", b.id); p.tabIndex = 0;
    o.rendu(p); panneaux.appendChild(p); liste.appendChild(b);
    b.addEventListener("click", () => choisir(i));
    return b;
  });
  function choisir(i) {
    boutons.forEach((b, j) => {
      const sel = i === j; b.setAttribute("aria-selected", String(sel)); b.tabIndex = sel ? 0 : -1;
      document.getElementById(b.getAttribute("aria-controls")).hidden = !sel;
    });
    stockage.ecrire("onglet", actifs[i].id);
  }
  function ouvrirOnglet(id) { const i = actifs.findIndex((o) => o.id === id); if (i >= 0) { choisir(i); boutons[i].focus(); } }
  liste.addEventListener("keydown", (e) => {
    const i = boutons.indexOf(document.activeElement); if (i < 0) return;
    const n = e.key === "ArrowRight" ? (i + 1) % boutons.length : e.key === "ArrowLeft" ? (i - 1 + boutons.length) % boutons.length : -1;
    if (n >= 0) { choisir(n); boutons[n].focus(); e.preventDefault(); }
  });
  // Un jeu s'ouvre directement sur l'onglet « Jouer » (sauf si un autre onglet a été mémorisé), comme le Démineur.
  const memo = actifs.findIndex((o) => o.id === stockage.lire("onglet"));
  choisir(memo >= 0 ? memo : Math.max(0, actifs.findIndex((o) => o.id === "application")));

  document.getElementById("connexion").hidden = !CONFIG.connexionActive;
  window.kermiclab = { META, registre, CONFIG, echecs: jeu, academie };
})();
</script>
