name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, build, tests
    runs-on: ubuntu-latest
    env:
      CATALOGUE_TOKEN: ${{ secrets.CATALOGUE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Catalogue privé (dépôt maquettes-catalogue) : uniquement si le jeton en lecture seule est configuré.
      # Les PR de forks n'ont pas accès aux secrets : le build se fait alors avec la maquette d'exemple.
      - name: Récupérer le catalogue privé
        if: ${{ env.CATALOGUE_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CATALOGUE_REPO || 'kermic974/maquettes-catalogue' }}
          token: ${{ secrets.CATALOGUE_TOKEN }}
          path: catalogue-prive
      - run: npm run lint
      # Le déploiement est fait par Cloudflare Workers Builds (dépôt relié au Worker « trigolab »).
      - run: npm run build
      - run: npm run check:pages
      - name: Les sources du catalogue sont à jour (hashes CSP)
        run: git diff --exit-code -- catalogue/
      - run: npm test
      - name: Installer Chromium pour Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            worker/src/generated/
          retention-days: 7

  deploy-pages:
    name: Déployer l’application autonome
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Préparer le site autonome
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
