name: Revue de sécurité par IA

# Revue automatique de chaque PR par un agent IA, avant la validation humaine du CODEOWNER.
# Ne s'exécute pas sur les PR de forks (pas d'accès aux secrets) : la revue humaine s'applique alors seule.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  revue:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Clé API présente ?
        id: cle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "ok=$([ -n "$ANTHROPIC_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.cle.outputs.ok == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: steps.cle.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Fais une revue de sécurité de cette pull request selon AGENTS.md (section Sécurité) :
            secrets exposés, injections, scripts ou ressources externes dans les pages HTML, CSP,
            appels réseau hors liste blanche, collecte de données personnelles (public mineur),
            dépendances ajoutées. Publie un seul commentaire de synthèse en français, classé par gravité.
