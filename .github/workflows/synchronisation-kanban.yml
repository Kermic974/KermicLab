name: Synchronisation du Kanban

on:
  schedule:
    - cron: "20 1 * * 1"
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, assigned, unassigned, milestoned, demilestoned]

permissions:
  contents: write
  pull-requests: write
  # GET /repos/{owner}/{repo}/issues exige issues:read (en-tête X-Accepted-Github-Permissions).
  # Sans cette permission, GitHub répond 200 en ne renvoyant que les pull requests
  # (le jeton a pull-requests:write). Le générateur les exclut et le Kanban sort vide.
  issues: read

concurrency:
  group: synchronisation-kanban
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Générer la vue Kanban depuis les issues GitHub
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/synchroniser-kanban.mjs
      - name: Vérifier le document généré
        run: |
          git diff --check
          grep -q "AUTO-GENERATED" docs/pilotage-kanban.md
          grep -q "AUTO-GENERATED" docs/pilotage-kanban.html
      - name: Proposer la synchronisation
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ github.token }}
          branch: automatisation/synchronisation-kanban
          delete-branch: true
          add-paths: |
            docs/pilotage-kanban.md
            docs/pilotage-kanban.html
          commit-message: "docs: synchroniser la vue Kanban des issues"
          title: "docs: synchroniser le Kanban de pilotage"
          body: |
            Mise à jour automatique des vues Markdown et HTML depuis les issues et labels GitHub.

            - Source de vérité : issues du dépôt.
            - Lecture seule : aucune issue ni aucun Project n'est modifié.
            - Fusion humaine requise ; aucune fusion automatique.
