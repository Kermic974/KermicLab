name: Relecture pédagogique

# Grille de relecture des PR de notion (issue #202) : exigée seulement quand une notion change (contenu.json modifié,
# nouvelle notion, version de fiche augmentée). Relancée quand le corps de la PR est modifié, pour suivre les cases
# cochées par le relecteur. Le corps de la PR passe par une variable d'environnement, jamais dans le script lui-même.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  grille:
    name: Grille de relecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Vérifier la grille
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GRILLE_BASE: origin/${{ github.base_ref }}
        run: node scripts/verifier-grille-pr.mjs
