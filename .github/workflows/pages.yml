name: Validation de l'application autonome
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Groupe distinct de ci.yml : partager « ci-<ref> » faisait s'annuler les deux workflows.
  group: autonome-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: index.html à jour avec src/
        run: python3 scripts/build-standalone.py --check
      - name: Frontières entre agents
        run: python3 scripts/check_boundaries.py --agent auto --base origin/${{ github.base_ref || 'main' }}
      - name: Tests
        run: node --test "tests/**/*.test.js"
      - name: Structure du livrable
        run: python3 scripts/check_html.py
