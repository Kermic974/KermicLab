# Worker Kermiclab. Le binding AI est fourni par Cloudflare ; les secrets
# (LLM_SESSION_SECRET, ANTHROPIC_API_KEY, GITHUB_TOKEN) se définissent avec `wrangler secret put`
# ou via la CI — jamais ici.
name = "kermiclab-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

# Sauvegarde quotidienne des KPI D1 dans R2 (02:17 UTC = 06:17 à La Réunion).
[triggers]
crons = ["17 2 * * *"]

# Paramètres des modules : registre, défauts et bornes min–max dans worker/src/configuration.js (ADR 0019).
# Une valeur absente ou invalide reprend le défaut ; une valeur hors bornes est ramenée dans les bornes.
[vars]
# Général
LLM_ACTIF = "true"
SKILLS_ACTIFS = "tuteur,cadrage-idee,defi-express,constructeur-cahier"
TAILLE_MAX_MESSAGE = "500"     # 50 à 2000
LIMITE_PAR_MINUTE = "20"       # 1 à 120
# Tuteur et boîte à idées (ADR 0016)
MODELE_WORKERS_AI = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MODELE_CHAT = "claude-haiku-5-5"
LIMITE_TOKENS_SESSION = "1000" # 200 à 4000
MAX_TOKENS_APPEL = "500"       # 100 à 1000, jamais plus que LIMITE_TOKENS_SESSION
# Défi express (ADR 0018) : alias de modèle AI Gateway et générations IA par session de 24 h.
MODELE_DEFI = "custom/haiku"
DEFI_GENERATIONS_JOUR = "3"    # 0 à 10
MAX_TOKENS_DEFI = "1500"       # 500 à 3000
# Mes cahiers : alias de modèle AI Gateway, générations IA par session de 24 h et budget de sortie par génération.
MODELE_CAHIERS = "custom/sonnet-5-5"
CAHIERS_GENERATIONS_JOUR = "2" # 0 à 5
MAX_TOKENS_CAHIERS = "100000"  # 1000 à 128000
# Hors registre
GITHUB_REPO = "kermic974/trigoLab"
ORIGINES_AUTORISEES = "https://www.kermiclab.online,https://kermiclab.online,https://kermiclab.pages.dev,http://localhost:8788"
AUTH_CALLBACK_URL = "https://kermiclab.online/auth/callback"

[[d1_databases]]
binding = "DB"
database_name = "kermiclab-kpi"
database_id = "4b383c6e-8a00-4950-baf3-7951ac60c375"

# Stockage de fichiers (Cloudflare R2, privé). Organisation et règles : docs/decisions/0007-stockage-r2.md.
[[r2_buckets]]
binding = "DONNEES"
bucket_name = "kermiclab-bucket"
