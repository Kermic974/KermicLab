<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cercle trigonométrique Studio V5</title><style>
:root{--bg:#06111f;--panel:#0d2035;--line:#294866;--txt:#f4f8ff;--muted:#a8bad0;--cyan:#47ddff;--orange:#ffb55f;--green:#6de8af}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#0d2942,var(--bg) 45%);color:var(--txt);font:16px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1400px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:14px}h1{font-size:clamp(1.5rem,4vw,2.5rem);margin:.2rem 0}p{color:var(--muted)}.badge{padding:9px 13px;border:1px solid #39715d;border-radius:999px;color:#bbf8db;background:#103529;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(330px,.8fr);gap:14px}.card{background:linear-gradient(145deg,#0e2238,#081725);border:1px solid #23405c;border-radius:20px;box-shadow:0 18px 45px #0007}.stage{padding:8px}svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}.side{display:grid;gap:12px}.panel{padding:16px}.vals{display:grid;grid-template-columns:1fr 1fr;gap:8px}.val{background:#071522;border:1px solid #223d56;border-radius:13px;padding:10px;min-width:0}.val b{display:block;font-size:1.15rem;overflow-wrap:anywhere}.val small{color:var(--orange)}.wide{grid-column:1/-1}.controls{display:grid;gap:10px}.entry{display:grid;grid-template-columns:1fr 110px;gap:8px}input,button{font:inherit}input[type=number]{height:48px;background:#061522;color:var(--txt);border:1px solid #42617f;border-radius:11px;padding:0 12px}input[type=range]{width:100%;height:44px;accent-color:var(--cyan)}button{min-height:44px;border:1px solid #42617f;border-radius:11px;background:#12314f;color:var(--txt);font-weight:750;padding:8px;cursor:pointer}.primary{background:#0785ad;border-color:var(--cyan)}.steps,.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.quick button{font-size:.8rem;padding:5px}.quick button.on{background:var(--cyan);color:#03202a}.checks{display:grid;gap:8px;color:var(--muted)}label{display:flex;align-items:center;gap:8px}summary{cursor:pointer;font-weight:700}.diag{white-space:pre-wrap;color:#a9bdd1;background:#06121e;padding:10px;border-radius:10px}.axis{stroke:#7890aa;stroke-width:2}.ring{fill:#071725;stroke:var(--cyan);stroke-width:3}.tick{stroke:#7390aa}.radius{stroke:white;stroke-width:3}.proj{stroke:var(--orange);stroke-width:2;stroke-dasharray:8 6}.sector{fill:#47ddff22}.arc{fill:none;stroke:#a8efff;stroke-width:4}.point{fill:#fff;stroke:var(--cyan);stroke-width:5}.halo{fill:#47ddff33}.lab{fill:#d9e5f0;font-size:13px;font-weight:700;paint-order:stroke;stroke:#071522;stroke-width:5px}.ang{fill:white;font-size:22px;font-weight:900;paint-order:stroke;stroke:#071522;stroke-width:6px}.hit{fill:transparent;pointer-events:all}.hidden{opacity:0;visibility:hidden}.live{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:520px){.app{padding:8px}header{display:block}.badge{display:inline-block}.entry{grid-template-columns:1fr}.panel{padding:13px}.lab{font-size:11px}.steps{grid-template-columns:repeat(3,1fr)}}button:focus-visible,input:focus-visible,svg:focus-visible{outline:3px solid #ffe28b;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="app"><header><div><small>STUDIO V5 · AUTONOME</small><h1>Cercle trigonométrique interactif</h1><p>Déplacez le point, touchez le cercle ou saisissez un angle.</p></div><span class="badge" id="status">Initialisation…</span></header><div class="grid"><section class="card stage"><svg id="svg" viewBox="0 0 760 760" tabindex="0" role="slider" aria-label="Angle sur le cercle" aria-valuemin="0" aria-valuemax="360"><g aria-hidden="true"><line class="axis" x1="60" y1="380" x2="700" y2="380"/><line class="axis" x1="380" y1="700" x2="380" y2="60"/><circle class="ring" cx="380" cy="380" r="260"/><g id="ticks"></g><g id="labels"></g><path id="sector" class="sector"/><path id="arc" class="arc"/><g id="projs"><line id="px" class="proj"/><line id="py" class="proj"/></g><line id="ray" class="radius" x1="380" y1="380"/><circle cx="380" cy="380" r="5" fill="#ffb55f"/><text id="angleText" class="ang" text-anchor="middle"/><circle id="halo" class="halo" r="28"/><circle id="point" class="point" r="12"/></g><rect id="hit" class="hit" x="0" y="0" width="760" height="760"/></svg></section><aside class="side"><section class="card panel"><h2>Valeurs</h2><div class="vals"><div class="val"><span>Angle</span><b id="deg"></b><small id="quad"></small></div><div class="val"><span>Radians</span><b id="rad"></b><small id="radx"></small></div><div class="val"><span>cos θ = x</span><b id="cos"></b><small id="cosx"></small></div><div class="val"><span>sin θ = y</span><b id="sin"></b><small id="sinx"></small></div><div class="val"><span>tan θ</span><b id="tan"></b><small id="tanx"></small></div><div class="val"><span>Signes</span><b id="signs"></b><small id="ref"></small></div><div class="val wide"><span>Coordonnées P = (cos θ, sin θ)</span><b id="coords"></b><small id="coordsx"></small></div></div></section><section class="card panel"><h2>Contrôles</h2><div class="controls"><input id="range" type="range" min="0" max="360" step="0.1" value="45"><div class="entry"><input id="input" type="number" inputmode="decimal" step="0.1" value="45" aria-label="Angle en degrés"><button id="apply" class="primary">Appliquer</button></div><div class="steps"><button data-step="-15">−15°</button><button data-step="-5">−5°</button><button data-step="-1">−1°</button><button data-step="1">+1°</button><button data-step="5">+5°</button><button data-step="15">+15°</button></div><div class="checks"><label><input id="snap" type="checkbox" checked> Aimantation ±3°</label><label><input id="showProj" type="checkbox" checked> Projections x/y</label><label><input id="showLabels" type="checkbox" checked> Repères remarquables</label></div></div></section><section class="card panel"><h2>Angles remarquables</h2><div id="quick" class="quick"></div></section><section class="card panel"><h2>Ce que montre cet angle</h2><p id="explain"></p><details><summary>Diagnostic</summary><pre id="diag" class="diag"></pre></details></section></aside></div><div id="live" class="live" aria-live="polite"></div></main><script>
(function(){'use strict';var C=380,R=260,EPS=1e-10,state={angle:45,snap:true};var A=[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330];var X={0:['0','1','0','0'],30:['π/6','√3/2','1/2','√3/3'],45:['π/4','√2/2','√2/2','1'],60:['π/3','1/2','√3/2','√3'],90:['π/2','0','1','non définie'],120:['2π/3','−1/2','√3/2','−√3'],135:['3π/4','−√2/2','√2/2','−1'],150:['5π/6','−√3/2','1/2','−√3/3'],180:['π','−1','0','0'],210:['7π/6','−√3/2','−1/2','√3/3'],225:['5π/4','−√2/2','−√2/2','1'],240:['4π/3','−1/2','−√3/2','√3'],270:['3π/2','0','−1','non définie'],300:['5π/3','1/2','−√3/2','−√3'],315:['7π/4','√2/2','−√2/2','−1'],330:['11π/6','√3/2','−1/2','−√3/3'],360:['2π','1','0','0']};function $(x){return document.getElementById(x)}function norm(v){v=Number(String(v).replace(',','.'));return Number.isFinite(v)?((v%360)+360)%360:NaN}function clean(v){if(Math.abs(v)<EPS)return 0;if(Math.abs(v-1)<EPS)return 1;if(Math.abs(v+1)<EPS)return-1;return v}function fmt(v,n){if(v===null)return'non définie';var s=clean(v).toFixed(n||6).replace(/0+$/,'').replace(/\.$/,'');return(s==='-0'?'0':s).replace('.',',')}function calc(a){var n=norm(a),r=n*Math.PI/180,x=clean(Math.cos(r)),y=clean(Math.sin(r));return{n:n,r:r,x:x,y:y,t:Math.abs(x)<EPS?null:clean(y/x)}}function polar(a,r){var q=a*Math.PI/180;return{x:C+(r||R)*Math.cos(q),y:C-(r||R)*Math.sin(q)}}function dist(a,b){var d=Math.abs(norm(a)-norm(b));return Math.min(d,360-d)}function quadrant(a){a=norm(a);if(a===0)return'Axe +x';if(a===90)return'Axe +y';if(a===180)return'Axe −x';if(a===270)return'Axe −y';return'Quadrant '+(a<90?'I':a<180?'II':a<270?'III':'IV')}function path(a,r,close){r=r||88;if(a>=359.999)return(close?'M 380 380 L ':'M ')+(C+r)+' 380 A '+r+' '+r+' 0 1 0 '+(C-r)+' 380 A '+r+' '+r+' 0 1 0 '+(C+r)+' 380'+(close?' Z':'');var p=polar(a,r);return(close?'M 380 380 L ':'M ')+(C+r)+' 380 A '+r+' '+r+' 0 '+(a>180?1:0)+' 0 '+p.x+' '+p.y+(close?' Z':'')}function exact(a){if(a===360)return X[360];return X[norm(a)]||null}function setAngle(raw,keep,announce){var num=Number(String(raw).replace(',','.'));if(!Number.isFinite(num))return false;var c=calc(num),a=keep&&num!==0&&c.n===0?360:c.n;state.angle=a;c=calc(a);var p=polar(c.n),e=exact(a);$('point').setAttribute('cx',p.x);$('point').setAttribute('cy',p.y);$('halo').setAttribute('cx',p.x);$('halo').setAttribute('cy',p.y);$('ray').setAttribute('x2',p.x);$('ray').setAttribute('y2',p.y);$('px').setAttribute('x1',p.x);$('px').setAttribute('y1',p.y);$('px').setAttribute('x2',p.x);$('px').setAttribute('y2',C);$('py').setAttribute('x1',p.x);$('py').setAttribute('y1',p.y);$('py').setAttribute('x2',C);$('py').setAttribute('y2',p.y);$('arc').setAttribute('d',path(a));$('sector').setAttribute('d',path(a,88,true));var tp=polar(a===360?30:Math.max(18,a/2),112);$('angleText').setAttribute('x',tp.x);$('angleText').setAttribute('y',tp.y+7);$('angleText').textContent=fmt(a,1)+'°';$('deg').textContent=fmt(a,1)+'°';$('quad').textContent=quadrant(a);$('rad').textContent=fmt(a*Math.PI/180);$('radx').textContent=e?e[0]:'valeur approchée';$('cos').textContent=fmt(c.x);$('cosx').textContent=e?e[1]:'valeur approchée';$('sin').textContent=fmt(c.y);$('sinx').textContent=e?e[2]:'valeur approchée';$('tan').textContent=fmt(c.t);$('tanx').textContent=e?e[3]:(c.t===null?'cos θ = 0':'valeur approchée');$('coords').textContent='('+fmt(c.x)+' ; '+fmt(c.y)+')';$('coordsx').textContent=e?'('+e[1]+' ; '+e[2]+')':'coordonnées approchées';$('signs').textContent='cos '+(c.x<0?'−':c.x>0?'+':'0')+' · sin '+(c.y<0?'−':c.y>0?'+':'0')+' · tan '+(c.t===null?'∅':c.t<0?'−':c.t>0?'+':'0');var ref=Math.min(c.n%90,90-c.n%90);$('ref').textContent='Angle de référence : '+fmt(ref,1)+'°';$('range').value=a;$('input').value=Math.round(a*1000)/1000;$('svg').setAttribute('aria-valuenow',a);$('explain').textContent=quadrant(a)+' : P = (cos θ, sin θ). La projection horizontale donne le cosinus et la projection verticale donne le sinus.';Array.prototype.forEach.call($('quick').children,function(b){b.classList.toggle('on',dist(c.n,Number(b.dataset.a))<1e-7)});if(announce)$('live').textContent='Angle '+fmt(a,1)+' degrés, cosinus '+fmt(c.x)+', sinus '+fmt(c.y)+'.';return true}function build(){var ns='http://www.w3.org/2000/svg';for(var d=0;d<360;d+=15){var p1=polar(d,R+3),p2=polar(d,R+(A.indexOf(d)>=0?18:10)),l=document.createElementNS(ns,'line');l.setAttribute('class','tick');l.setAttribute('x1',p1.x);l.setAttribute('y1',p1.y);l.setAttribute('x2',p2.x);l.setAttribute('y2',p2.y);$('ticks').appendChild(l)}A.forEach(function(d){var p=polar(d,303),t=document.createElementNS(ns,'text');t.setAttribute('class','lab');t.setAttribute('x',p.x);t.setAttribute('y',p.y);t.setAttribute('text-anchor',Math.cos(d*Math.PI/180)>.2?'start':Math.cos(d*Math.PI/180)<-.2?'end':'middle');t.textContent=(d===0?'0° / 360°':d+'°');$('labels').appendChild(t);var b=document.createElement('button');b.textContent=d+'°';b.dataset.a=d;b.onclick=function(){setAngle(d,false,true)};$('quick').appendChild(b)})}function angleFrom(ev){var svg=$('svg'),r=svg.getBoundingClientRect(),sx=760/r.width,sy=760/r.height,x=(ev.clientX-r.left)*sx,y=(ev.clientY-r.top)*sy,a=norm(Math.atan2(C-y,x-C)*180/Math.PI);if(state.snap){var best=a,bd=99;A.forEach(function(v){var z=dist(a,v);if(z<bd){bd=z;best=v}});if(bd<=3)a=best}return a}function bind(){var hit=$('hit'),drag=false,pid=null;hit.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();drag=true;pid=e.pointerId;try{hit.setPointerCapture(pid)}catch(_){}setAngle(angleFrom(e))});hit.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==pid)return;e.preventDefault();setAngle(angleFrom(e))});function end(e){if(e.pointerId!==pid)return;e.preventDefault();setAngle(angleFrom(e),false,true);drag=false;pid=null}hit.addEventListener('pointerup',end);hit.addEventListener('pointercancel',function(){drag=false;pid=null});$('apply').onclick=function(){setAngle($('input').value,true,true)};$('input').addEventListener('keydown',function(e){if(e.key==='Enter')setAngle(this.value,true,true)});$('range').oninput=function(){setAngle(this.value,Number(this.value)===360)};Array.prototype.forEach.call(document.querySelectorAll('[data-step]'),function(b){b.onclick=function(){setAngle(state.angle+Number(b.dataset.step),false,true)}});$('snap').onchange=function(){state.snap=this.checked};$('showProj').onchange=function(){$('projs').classList.toggle('hidden',!this.checked)};$('showLabels').onchange=function(){$('labels').classList.toggle('hidden',!this.checked)};$('svg').addEventListener('keydown',function(e){var a=null,s=e.shiftKey?5:1;if(e.key==='ArrowLeft'||e.key==='ArrowDown')a=state.angle-s;if(e.key==='ArrowRight'||e.key==='ArrowUp')a=state.angle+s;if(e.key==='Home')a=0;if(e.key==='End')a=360;if(a!==null){e.preventDefault();setAngle(a,a===360,true)}})}function tests(){var fail=[],count=0;function ok(n,v){count++;if(!v)fail.push(n)}for(var d=0;d<360;d++){var p=polar(d),rec=norm(Math.atan2(C-p.y,p.x-C)*180/Math.PI);ok('angle '+d,dist(d,rec)<1e-8);ok('rayon '+d,Math.abs(Math.hypot(p.x-C,p.y-C)-R)<1e-8)}var c=calc(60);ok('60 cos',Math.abs(c.x-.5)<1e-10);ok('60 sin',Math.abs(c.y-Math.sqrt(3)/2)<1e-10);ok('60 tan',Math.abs(c.t-Math.sqrt(3))<1e-10);ok('90 tan',calc(90).t===null);ok('270 tan',calc(270).t===null);setAngle(60);ok('UI 60',$('deg').textContent==='60°'&&$('input').value==='60'&&$('range').value==='60'&&$('radx').textContent==='π/3');setAngle(45);return{count:count,fail:fail}}try{build();bind();setAngle(45);var t=tests();$('status').textContent=t.fail.length?'Tests à vérifier':'Application prête · '+t.count+' tests OK';$('diag').textContent=t.fail.length?t.fail.join('\n'):'Tous les autotests sont réussis.\nScénario 60° synchronisé.\nPointer Events : '+('PointerEvent'in window)}catch(e){$('status').textContent='Erreur de démarrage';$('diag').textContent=String(e.stack||e)}})();
</script></body></html>
